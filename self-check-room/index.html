<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>셀프체크룸 - EAIM 과학 수업</title>
<style>
  :root { --main-color:#22d3ee; --bg-dark:#07090c; --accent:#a855f7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg-dark); color:#fff; font-family:'Pretendard',-apple-system,sans-serif; min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  .topbar { position:sticky; top:0; z-index:40; background:rgba(7,9,12,0.92); backdrop-filter:blur(10px); border-bottom:1px solid #1a1e24; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .crumb { font-size:0.78em; color:#888; } .crumb b{ color:#ccc; font-weight:600; }
  .hub-link { font-size:0.72em; color:#aaa; padding:6px 12px; border:1px solid #2c313a; border-radius:8px; }
  .hub-link:hover { border-color:var(--accent); color:#fff; }

  .hero { padding:60px 20px 24px; text-align:center; max-width:700px; margin:0 auto; }
  .hero .eyebrow { font-size:0.74em; font-weight:800; letter-spacing:2px; color:var(--main-color); text-transform:uppercase; margin-bottom:10px; }
  .hero h1 { font-size:clamp(2em,5vw,2.8em); margin:0 0 14px; background:linear-gradient(100deg,#fff 25%,#67e8f9 55%,var(--accent) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p.lead { color:#aaa; font-size:0.96em; line-height:1.75; }

  .grade-wrap { max-width:700px; margin:50px auto 60px; padding:0 20px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:520px) { .grade-wrap { grid-template-columns:1fr; } }
  .g-card { background:#0d0f14; border:1.5px solid #1a1e24; border-radius:20px; padding:32px 24px; text-align:center; transition:all .25s; }
  .g-card:hover { border-color:var(--main-color); transform:translateY(-4px); }
  .g-card .g-icon { font-size:2.4em; margin-bottom:12px; }
  .g-card .g-title { font-size:1.15em; font-weight:900; margin-bottom:6px; }
  .g-card .g-desc { font-size:0.8em; color:#999; }

  footer { text-align:center; padding:10px 20px 50px; color:#555; font-size:0.75em; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="crumb"><b>🔍 셀프체크룸</b></div>
    <a class="hub-link" href="../index.html">← 처음으로</a>
  </div>

  <section class="hero">
    <div class="eyebrow">Self-Check Room</div>
    <h1>셀프체크룸</h1>
    <p class="lead">수업 페이지와는 별개의 공간이다. 한 단원을 다 본 뒤 여기 와서 짧게 확인하면, 내가 어떤 개념을 헷갈려하는지 스스로 바로 확인할 수 있다.</p>
  </section>

  <div class="grade-wrap">
    <a class="g-card" href="science1/index.html">
      <div class="g-icon">📗</div>
      <div class="g-title">과학1</div>
      <div class="g-desc">중등과학1 단원별 확인</div>
    </a>
    <a class="g-card" href="science2/index.html">
      <div class="g-icon">📘</div>
      <div class="g-title">과학2</div>
      <div class="g-desc">중등과학2 단원별 확인</div>
    </a>
  </div>

  <footer>EAIM 과학 수업 · 셀프체크룸</footer>
</body>
</html>
