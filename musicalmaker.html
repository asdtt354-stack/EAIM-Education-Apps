<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 뮤지컬 메이커 v2.5</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a0509; color: #FFF; margin: 0; padding: 0; overflow-x: hidden; }
        .stage-curtain { background: linear-gradient(to bottom, #9F1239, #881337); border-bottom: 4px solid #FCD34D; position: sticky; top: 0; z-index: 50; }
        .ticket-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: white; outline: none; border-radius: 0.5rem; width: 100%; padding: 0.8rem 1rem; font-size: 0.9rem; transition: 0.3s; }
        .ticket-input:focus { border-color: #FCD34D; background: rgba(255, 255, 255, 0.12); }
        .magic-btn { background: linear-gradient(45deg, #FCD34D, #F59E0B); color: #000; border-radius: 0.75rem; font-weight: 800; padding: 1rem; border: none; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(252, 211, 77, 0.3); }
        .ai-help-btn { background: rgba(252, 211, 77, 0.15); color: #FCD34D; border: 1px solid #FCD34D; border-radius: 0.5rem; font-size: 0.75rem; padding: 0.4rem 0.8rem; cursor: pointer; }
        .edit-area { background: rgba(0,0,0,0.4); color: #FDE68A; font-family: 'Gowun Batang', serif; line-height: 1.8; width: 100%; min-height: 500px; padding: 1.5rem; border: 1px dashed rgba(252, 211, 77, 0.3); border-radius: 0.5rem; outline: none; font-size: 1.1rem; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v25') || '');
            const [loading, setLoading] = useState(false);
            
            const [place, setPlace] = useState('');
            const [plots, setPlots] = useState({ ki: '', seung: '', jeon: '', gyeol: '' });
            const [title, setTitle] = useState('');
            const [cast, setCast] = useState('');
            const [results, setResults] = useState('');

            const callGeminiV25 = async (prompt) => {
                if (!apiKey) { alert("API 키를 입력해주세요."); return null; }
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (data.error) { alert("2.5 플래시 엔진 오류: " + data.error.message); return null; }
                    return data.candidates[0].content.parts[0].text;
                } catch (e) {
                    alert("네트워크 연동 실패."); return null;
                }
            };

            const getAIHelp = async () => {
                if (!plots.ki) return alert("줄거리 '기' 부분을 먼저 적어주세요.");
                setLoading(true);
                
                // AI에게 줄을 나누어 출력하라고 명확히 지시
                const prompt = `배경:${place}, 기:${plots.ki}, 승:${plots.seung}, 전:${plots.jeon}, 결:${plots.gyeol}. 
                이 내용을 바탕으로 뮤지컬 제목과 등장인물을 추천해줘.
                형식 중요: 
                첫 번째 줄에는 '뮤지컬 제목'만 써줘.
                두 번째 줄부터는 '등장인물 이름과 성격'을 자세히 써줘.`;
                
                const res = await callGeminiV25(prompt);
                if (res) {
                    const lines = res.split('\n').filter(line => line.trim() !== "");
                    const aiTitle = lines[0].replace(/제목:|제목 :|#/g, "").trim(); // 제목 정제
                    const aiCast = lines.slice(1).join('\n').trim(); // 나머지 인물
                    
                    setTitle(aiTitle);
                    setCast(aiCast);
                    alert("제미나이 2.5 플래시가 제목과 캐릭터를 분류하여 추천했습니다.");
                }
                setLoading(false);
            };

            const generateFinal = async () => {
                if (!title || !cast) return alert("제목과 등장인물을 입력해주세요.");
                setLoading(true);
                const prompt = `제목:${title}, 배경:${place}, 인물:${cast}, 스토리:${plots.ki}-${plots.seung}-${plots.jeon}-${plots.gyeol}. 초중등 학생용 전문 창작 뮤지컬 대본과 영어 이미지 프롬프트 3개, Suno AI용 음악 추천 3개를 정성껏 써줘.`;
                const res = await callGeminiV25(prompt);
                if (res) {
                    setResults(res);
                    setStep(1);
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen pb-10">
                    <div className="stage-curtain p-4 text-center shadow-xl">
                        <h1 className="text-2xl text-yellow-300 font-bold tracking-widest">EAIM MUSICAL MAKER v2.5</h1>
                        <p className="text-[10px] opacity-60 uppercase mt-1">Gemini 2.5 Flash Engine Active</p>
                    </div>

                    <div className="max-w-2xl mx-auto p-4">
                        {step === 0 ? (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="p-4 bg-white/5 rounded-xl border border-white/10 text-center">
                                    <label className="text-xs text-yellow-500 block mb-2 font-bold uppercase">v2.5 API Authentication</label>
                                    <input 
                                        type="password" 
                                        value={apiKey} 
                                        onChange={(e) => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key_v25', e.target.value);}} 
                                        className="ticket-input text-center" 
                                        placeholder="인증 키를 입력하세요" 
                                    />
                                </div>

                                <div className="space-y-3 bg-white/5 p-4 rounded-xl border border-white/5">
                                    <h2 className="text-yellow-400 font-bold"><i className="fas fa-map-marked-alt mr-2"></i>1. 장소 및 스토리 요약</h2>
                                    <input value={place} onChange={e => setPlace(e.target.value)} className="ticket-input mb-1" placeholder="공연 배경 장소" />
                                    <textarea value={plots.ki} onChange={e => setPlots({...plots, ki: e.target.value})} className="ticket-input h-14" placeholder="기: 이야기의 시작" />
                                    <textarea value={plots.seung} onChange={e => setPlots({...plots, seung: e.target.value})} className="ticket-input h-14" placeholder="승: 사건의 전개" />
                                    <textarea value={plots.jeon} onChange={e => setPlots({...plots, jeon: e.target.value})} className="ticket-input h-14" placeholder="전: 위기와 절정" />
                                    <textarea value={plots.gyeol} onChange={e => setPlots({...plots, gyeol: e.target.value})} className="ticket-input h-14" placeholder="결: 마무리와 교훈" />
                                </div>

                                <div className="space-y-3 bg-white/5 p-4 rounded-xl border border-yellow-500/20 shadow-inner">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-yellow-400 font-bold">2. 제목 및 캐릭터 설정</h2>
                                        <button onClick={getAIHelp} disabled={loading} className="ai-help-btn">AI v2.5 추천받기</button>
                                    </div>
                                    <input 
                                        value={title} 
                                        onChange={e => setTitle(e.target.value)} 
                                        className="ticket-input font-bold text-yellow-200" 
                                        placeholder="뮤지컬 제목 (추천 클릭 시 자동 입력)" 
                                    />
                                    <textarea 
                                        value={cast} 
                                        onChange={e => setCast(e.target.value)} 
                                        className="ticket-input h-24" 
                                        placeholder="등장인물 성격 (추천 클릭 시 자동 입력)" 
                                    />
                                </div>

                                <button onClick={generateFinal} disabled={loading} className="magic-btn text-lg">
                                    {loading ? <i className="fas fa-theater-masks fa-spin mr-2"></i> : <i className="fas fa-wand-sparkles mr-2"></i>}
                                    {loading ? "v2.5 대본 집필 중..." : "v2.5 엔진으로 대본 완성"}
                                </button>
                            </div>
                        ) : (
                            <div className="animate-fadeIn">
                                <h2 className="text-yellow-400 font-bold mb-4 flex justify-between items-center px-1">
                                    <span>완성된 v2.5 창작 대본</span>
                                    <button onClick={() => setStep(0)} className="text-xs text-gray-400 underline italic">다시 만들기</button>
                                </h2>
                                <textarea 
                                    className="edit-area shadow-2xl" 
                                    value={results} 
                                    onChange={e => setResults(e.target.value)} 
                                />
                                <div className="flex gap-2 mt-6">
                                    <button onClick={() => alert('대본이 임시 저장되었습니다.')} className="flex-1 py-4 bg-yellow-600 text-white rounded-lg font-bold shadow-lg">
                                        <i className="fas fa-save mr-2"></i>대본 저장하기
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
