<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 뮤지컬 메이커 v6.9</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a0509; color: #FFF; margin: 0; padding: 0; }
        .font-drama { font-family: 'Gowun Batang', serif; }
        .font-show { font-family: 'Black Han Sans', sans-serif; }
        .stage-curtain { background: linear-gradient(to bottom, #9F1239, #881337); border-bottom: 4px solid #FCD34D; position: sticky; top: 0; z-index: 50; }
        .ticket-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: white; transition: 0.3s; outline: none; border-radius: 0.5rem; width: 100%; padding: 0.8rem 1rem; font-size: 0.9rem; }
        .ticket-input:focus { border-color: #FCD34D; background: rgba(255, 255, 255, 0.12); }
        .plot-box { border-left: 3px solid #FCD34D; padding-left: 1rem; margin-bottom: 1rem; }
        .magic-btn { background: linear-gradient(45deg, #FCD34D, #F59E0B); color: #000; border-radius: 0.75rem; font-weight: 800; padding: 1rem; transition: 0.2s; cursor: pointer; border: none; }
        .tab-btn { padding: 1rem 0.5rem; flex: 1; font-weight: bold; font-size: 0.85rem; transition: 0.3s; border-bottom: 3px solid transparent; color: #94a3b8; cursor: pointer; text-align: center; }
        .tab-active { color: #FCD34D; border-bottom-color: #FCD34D; background: rgba(252, 211, 77, 0.1); }
        .edit-area { background: rgba(0,0,0,0.4); color: #FDE68A; font-family: 'Gowun Batang', serif; line-height: 1.8; width: 100%; min-height: 400px; padding: 1.5rem; border: 1px dashed rgba(252, 211, 77, 0.3); border-radius: 0.5rem; outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_musical') || '');
            const [loading, setLoading] = useState(false);
            
            // 입력 데이터
            const [title, setTitle] = useState('');
            const [place, setPlace] = useState('');
            const [cast, setCast] = useState('');
            const [plots, setPlots] = useState({
                ki: '', // 기: 시작
                seung: '', // 승: 전개
                jeon: '', // 전: 위기/절정
                gyeol: '' // 결: 결말
            });

            // 생성 결과 데이터 (수정 가능하도록 상태 관리)
            const [activeTab, setActiveTab] = useState('script');
            const [results, setResults] = useState({ script: '', images: '', music: '' });

            const handlePlotChange = (e, key) => {
                setPlots({...plots, [key]: e.target.value});
            };

            const callGemini = async (prompt) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (error) {
                    alert('API 호출 중 오류가 발생했습니다. 키를 확인해주세요.');
                    return '';
                }
            };

            const generateMusical = async () => {
                if (!apiKey) return alert('API 키를 먼저 입력해주세요.');
                setLoading(true);
                
                const baseContext = `
                    제목: ${title}
                    장소: ${place}
                    등장인물: ${cast}
                    줄거리 요약:
                    - 기: ${plots.ki}
                    - 승: ${plots.seung}
                    - 전: ${plots.jeon}
                    - 결: ${plots.gyeol}
                `;

                const scriptPrompt = `${baseContext}\n\n위 내용을 바탕으로 초등/중등 학생이 공연하기 좋은 뮤지컬 대본을 써줘. 대사와 지문(행동, 감정)을 명확히 구분해서 작성해줘.`;
                const imagePromptReq = "위 대본의 주요 장면을 위한 이미지 생성 프롬프트 3개를 영어로 작성해줘.";
                const musicPromptReq = "위 뮤지컬에 들어갈 넘버(노래) 3곡의 스타일과 분위기를 Suno AI 프롬프트 형식으로 추천해줘.";

                const scriptRes = await callGemini(scriptPrompt);
                const imageRes = await callGemini(scriptRes + "\n\n" + imagePromptReq);
                const musicRes = await callGemini(scriptRes + "\n\n" + musicPromptReq);

                setResults({ script: scriptRes, images: imageRes, music: musicRes });
                setLoading(false);
                setStep(1);
            };

            return (
                <div className="min-h-screen pb-10">
                    <div className="stage-curtain p-4 text-center shadow-xl">
                        <h1 className="font-show text-2xl text-yellow-300">EAIM MUSICAL MAKER</h1>
                        <p className="text-[10px] opacity-70 tracking-widest">EMOTION ART INTERACTIVE MUSICALIZATION</p>
                    </div>

                    <div className="max-w-2xl mx-auto p-4">
                        {step === 0 ? (
                            <div className="space-y-6">
                                <input type="password" value={apiKey} onChange={(e) => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key_musical', e.target.value);}} className="ticket-input text-center" placeholder="🔑 API KEY를 입력하세요" />

                                <div className="space-y-4 bg-white/5 p-4 rounded-2xl border border-white/10">
                                    <h2 className="font-bold text-yellow-400 border-b border-yellow-400/30 pb-2 mb-4"><i className="fas fa-edit mr-2"></i>기본 설정</h2>
                                    <input value={title} onChange={e => setTitle(e.target.value)} className="ticket-input" placeholder="뮤지컬 제목" />
                                    <input value={place} onChange={e => setPlace(e.target.value)} className="ticket-input" placeholder="배경 장소 (예: 2050년 우주 정거장)" />
                                    <input value={cast} onChange={e => setCast(e.target.value)} className="ticket-input" placeholder="등장인물 (예: 영희(용감함), 철수(겁쟁이))" />
                                </div>

                                <div className="space-y-3 bg-white/5 p-4 rounded-2xl border border-white/10">
                                    <h2 className="font-bold text-yellow-400 border-b border-yellow-400/30 pb-2 mb-4"><i className="fas fa-layer-group mr-2"></i>기승전결 스토리 라인</h2>
                                    <div className="plot-box">
                                        <label className="text-xs text-yellow-200 opacity-70">기 (시작: 평화로운 일상과 사건의 계기)</label>
                                        <textarea value={plots.ki} onChange={e => handlePlotChange(e, 'ki')} className="ticket-input mt-1 h-16" placeholder="이야기가 어떻게 시작되나요?" />
                                    </div>
                                    <div className="plot-box">
                                        <label className="text-xs text-yellow-200 opacity-70">승 (전개: 갈등의 시작과 모험)</label>
                                        <textarea value={plots.seung} onChange={e => handlePlotChange(e, 'seung')} className="ticket-input mt-1 h-16" placeholder="어떤 일들이 벌어지나요?" />
                                    </div>
                                    <div className="plot-box">
                                        <label className="text-xs text-yellow-200 opacity-70">전 (위기/절정: 가장 긴박한 순간)</label>
                                        <textarea value={plots.jeon} onChange={e => handlePlotChange(e, 'jeon')} className="ticket-input mt-1 h-16" placeholder="가장 큰 위기는 무엇인가요?" />
                                    </div>
                                    <div className="plot-box">
                                        <label className="text-xs text-yellow-200 opacity-70">결 (결말: 문제 해결과 교훈)</label>
                                        <textarea value={plots.gyeol} onChange={e => handlePlotChange(e, 'gyeol')} className="ticket-input mt-1 h-16" placeholder="어떻게 마무리되나요?" />
                                    </div>
                                </div>

                                <button onClick={generateMusical} disabled={loading} className="magic-btn w-full text-lg shadow-lg">
                                    {loading ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-wand-magic-sparkles mr-2"></i>}
                                    {loading ? "AI가 대본을 집필 중입니다..." : "창작 뮤지컬 완성하기"}
                                </button>
                            </div>
                        ) : (
                            <div className="animate-fadeIn">
                                <div className="flex mb-4 bg-white/5 rounded-t-lg border-b border-yellow-500/30">
                                    <div onClick={() => setActiveTab('script')} className={`tab-btn ${activeTab === 'script' ? 'tab-active' : ''}`}><i className="fas fa-scroll mr-1"></i>대본 편집</div>
                                    <div onClick={() => setActiveTab('images')} className={`tab-btn ${activeTab === 'images' ? 'tab-active' : ''}`}><i className="fas fa-image mr-1"></i>이미지</div>
                                    <div onClick={() => setActiveTab('music')} className={`tab-btn ${activeTab === 'music' ? 'tab-active' : ''}`}><i className="fas fa-music mr-1"></i>음악</div>
                                </div>

                                <div className="relative">
                                    <p className="text-[10px] text-yellow-500 mb-2 italic">* 대본 내용을 직접 클릭해서 수정할 수 있습니다.</p>
                                    {activeTab === 'script' && (
                                        <textarea 
                                            className="edit-area" 
                                            value={results.script} 
                                            onChange={(e) => setResults({...results, script: e.target.value})}
                                        />
                                    )}
                                    {activeTab === 'images' && (
                                        <textarea 
                                            className="edit-area" 
                                            value={results.images} 
                                            onChange={(e) => setResults({...results, images: e.target.value})}
                                        />
                                    )}
                                    {activeTab === 'music' && (
                                        <textarea 
                                            className="edit-area" 
                                            value={results.music} 
                                            onChange={(e) => setResults({...results, music: e.target.value})}
                                        />
                                    )}
                                </div>

                                <div className="flex gap-2 mt-6">
                                    <button onClick={() => setStep(0)} className="flex-1 border border-white/30 py-3 rounded-xl opacity-60 hover:opacity-100 transition">
                                        <i className="fas fa-arrow-left mr-2"></i>처음으로
                                    </button>
                                    <button onClick={() => alert('대본이 저장되었습니다! (브라우저 임시저장)')} className="flex-1 bg-yellow-600 text-white py-3 rounded-xl font-bold">
                                        <i className="fas fa-save mr-2"></i>저장하기
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
