<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 에임우주탐험대 - 선명한 8행성 v3.1</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #000; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* 레이아웃 구조 */
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        #canvas-container { flex: 1; background: #000; cursor: pointer; position: relative; }

        /* 헤더 영역 (겹침 방지) */
        #header-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100px; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 100; }
        #intro-text { pointer-events: none; text-align: center; flex-grow: 1; }
        .btn-home { background: rgba(0,212,255,0.2); color: white; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--main-color); pointer-events: auto; cursor: pointer; z-index: 110; transition: 0.3s; }
        .btn-home:hover { background: var(--main-color); color: black; }

        /* 이름표 최적화 (하드웨어 가속) */
        .planet-label { position: absolute; color: white; background: rgba(0,0,0,0.7); padding: 3px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; pointer-events: none; border: 1px solid var(--main-color); white-space: nowrap; will-change: transform; z-index: 90; }
        
        #side-panel { width: 320px; min-width: 320px; background: rgba(10,10,25,0.98); border-right: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 200; }
        #interaction-area { height: 35%; background: #080810; padding: 20px; border-top: 1px solid #222; overflow-y: auto; display: none; z-index: 200; }
        textarea { width: 100%; height: 60px; background: #161625; color: white; border: 1px solid #333; border-radius: 6px; padding: 10px; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="side-panel">
    <h2>🔭 탐사 설정</h2>
    <div id="obs-location" style="color:var(--accent); font-size:0.9em; margin: 10px 0;">📍 보현산 천문대</div>
    
    <div id="phase-control" style="display:none; border:1px solid #333; padding:15px; border-radius:8px;">
        <label>🌗 달 위상 조절</label>
        <input type="range" id="moon-slider" min="0" max="6.28" step="0.1" value="0" style="width:100%" oninput="changeMoonPhase(this.value)">
        <p id="phase-name" style="text-align:center; color:var(--main-color);">신월</p>
    </div>
    
    <div id="log-list" style="flex-grow:1; border-top:1px solid #333; margin-top:20px; overflow-y:auto;">
        <h3>📖 탐사 일지</h3>
        <div id="log-container"></div>
    </div>
</div>

<div id="main-view">
    <div id="header-ui">
        <div style="width: 100px;"></div> <div id="intro-text">
            <h1 style="color:var(--main-color); margin:0; font-size: 1.8em; text-shadow: 0 0 10px #00d4ff;">에임 우주 탐험대</h1>
            <p style="color:#aaa; font-size: 0.9em; margin: 5px 0;">행성을 클릭하여 정밀 관찰을 시작하세요!</p>
        </div>
        <button class="btn-home" onclick="location.reload()">☀️ 태양계 복귀</button>
    </div>

    <div id="canvas-container">
        <div id="label-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
    </div>

    <div id="interaction-area">
        <h3 id="target-title">관측 기록실</h3>
        <p id="question" style="font-size:0.9em; color:#aaa;"></p>
        <textarea id="student-answer" placeholder="관측한 특징과 위상 변화의 원리를 적어보세요..."></textarea>
        <div style="display:flex; gap:10px;">
            <button onclick="runGemini25()" style="background:var(--main-color); flex:1;">AI 분석</button>
            <button onclick="saveToLocal()" style="background:var(--accent); flex:1; color:white;">기록 저장</button>
        </div>
        <div id="ai-response" style="margin-top:10px; font-size:0.9em; line-height:1.6;"></div>
    </div>
</div>

<script>
    // --- [1] 데이터: NASA 텍스처 및 행성 고유 색상 세팅 ---
    const planetsData = {
        mercury: { name: "수성", dist: 25, size: 1.2, speed: 0.04, color: 0xaaaaaa, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg", obs: "라 실라 천문대" },
        venus: { name: "금성", dist: 38, size: 1.8, speed: 0.015, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg", obs: "마우나케아 천문대" },
        earth: { name: "지구", dist: 50, size: 2.0, speed: 0.01, color: 0x2233ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg", obs: "보현산 천문대" },
        mars: { name: "화성", dist: 65, size: 1.5, speed: 0.008, color: 0xff3300, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg", obs: "우티 전파 천문대" },
        jupiter: { name: "목성", dist: 90, size: 5.0, speed: 0.004, color: 0xffaa88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg", obs: "팔로마 천문대" },
        saturn: { name: "토성", dist: 120, size: 4.2, speed: 0.002, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png", obs: "사이딩 스프링 천문대" },
        uranus: { name: "천왕성", dist: 145, size: 2.6, speed: 0.0015, color: 0x88ddff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/uranus.jpg", obs: "유럽 남방 천문대" },
        neptune: { name: "해왕성", dist: 165, size: 2.5, speed: 0.001, color: 0x3355ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/neptune.jpg", obs: "파라날 천문대" },
        moon: { name: "달", size: 3.5, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg", obs: "보현산 천문대", color: 0xdddddd }
    };

    let isObserving = false, currentTarget = null;
    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const sun = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    // ★★★ 핵심: 조명 대폭 강화 (어두운 뒷면 문제 해결) ★★★
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // 0.5 -> 1.5로 상향
    scene.add(ambientLight);
    const moonLight = new THREE.DirectionalLight(0xffffff, 2.5); // 달 위상용 조명 추가
    moonLight.position.set(10, 0, 10);
    scene.add(moonLight);

    const meshes = {}, labels = {}, loader = new THREE.TextureLoader();

    Object.keys(planetsData).forEach(key => {
        if(key === 'moon') return; // 달은 관측 모드에서만 사용
        const p = planetsData[key];
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), new THREE.MeshStandardMaterial({ 
            map: loader.load(p.texture), 
            emissive: new THREE.Color(p.color), 
            emissiveIntensity: 0.4 
        }));
        m.userData = { id: key, name: p.name };
        meshes[key] = m;
        scene.add(m);

        const lbl = document.createElement('div');
        lbl.className = 'planet-label';
        lbl.innerText = p.name;
        document.getElementById('label-layer').appendChild(lbl);
        labels[key] = lbl;
    });

    const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(3.5, 64, 64), new THREE.MeshStandardMaterial({ map: loader.load(planetsData.moon.texture) }));
    moonMesh.visible = false;
    scene.add(moonMesh);

    camera.position.set(0, 180, 250);
    camera.lookAt(0, 0, 0);

    const vector = new THREE.Vector3();

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;
        
        Object.keys(meshes).forEach(key => {
            const p = planetsData[key], m = meshes[key], lbl = labels[key];
            if (!isObserving) {
                m.position.x = Math.cos(time * p.speed * 10) * p.dist;
                m.position.z = Math.sin(time * p.speed * 10) * p.dist;
                m.rotation.y += 0.01;
                m.visible = true;

                // 이름표 좌표 계산 및 transform 최적화
                vector.setFromObjectPosition(m).project(camera);
                const rect = container.getBoundingClientRect();
                const x = (vector.x * 0.5 + 0.5) * container.clientWidth;
                const y = (vector.y * -0.5 + 0.5) * container.clientHeight;
                
                lbl.style.display = 'block';
                lbl.style.transform = `translate(-50%, -50%) translate(${x}px, ${y-25}px)`;
            } else {
                lbl.style.display = 'none';
                if (key !== currentTarget) m.visible = false;
            }
        });
        renderer.render(scene, camera);
    }
    animate();

    container.onclick = (e) => {
        if(isObserving) return;
        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(meshes));
        if(intersects.length > 0) startObservation(intersects[0].object.userData.id);
        else if(Math.abs(mouse.x) < 0.1 && Math.abs(mouse.y) < 0.1) startObservation('moon');
    };

    function startObservation(id) {
        isObserving = true; currentTarget = id;
        document.getElementById('header-ui').style.display = 'none';
        document.getElementById('side-panel').style.display = 'flex';
        document.getElementById('interaction-area').style.display = 'block';
        
        if(id === 'moon') {
            moonMesh.visible = true;
            document.getElementById('phase-control').style.display = 'block';
            document.getElementById('target-title').innerText = "🌕 달 위상 변화 정밀 관측";
            document.getElementById('question').innerText = "슬라이더를 조절하며 달의 모양이 변하는 원리를 관찰하세요.";
        } else {
            meshes[id].position.set(0,0,0);
            document.getElementById('target-title').innerText = `${planetsData[id].name} 3D 정밀 탐사`;
            document.getElementById('question').innerText = `${planetsData[id].name}의 표면 특징은 무엇일까요?`;
        }
        camera.position.set(0, 0, 12);
        camera.lookAt(0, 0, 0);
    }

    // 달 위상 변화 함수
    function changeMoonPhase(val) {
        // Directional조명을 회전시켜 그림자 위치 변경
        moonLight.position.set(Math.cos(val)*10, 0, Math.sin(val)*10);
        const phases = ["신월", "초승달", "상현달", "보름달", "하현달", "그믐달"];
        document.getElementById('phase-name').innerText = phases[Math.floor((val / 6.28) * phases.length) % phases.length];
    }

    const API_KEY = "여기에_성공하셨던_API키";
    async function runGemini25() {
        const ans = document.getElementById('student-answer').value;
        const resp = document.getElementById('ai-response');
        if(!ans) return alert("내용을 입력해주세요.");
        resp.innerHTML = "📡 AI 가이드 분석 중...";
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생 답변 피드백해줘: ${ans}` }] }] })
            });
            const data = await res.json();
            resp.innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            saveToLocal();
        } catch(e) { resp.innerHTML = "연결 오류"; }
    }

    function saveToLocal() {
        const log = { target: planetsData[currentTarget].name, ans: document.getElementById('student-answer').value, time: new Date().toLocaleString() };
        let logs = JSON.parse(localStorage.getItem('eaim_v3.1_logs') || "[]");
        logs.unshift(log);
        localStorage.setItem('eaim_v3.1_logs', JSON.stringify(logs));
        displayLogs();
    }

    function displayLogs() {
        const logs = JSON.parse(localStorage.getItem('eaim_v3.1_logs') || "[]");
        document.getElementById('log-container').innerHTML = logs.map(l => `<div style="background:#1a1a2e; padding:8px; border-radius:5px; margin-bottom:8px; border-left:3px solid #00d4ff;"><small>${l.time}</small><br><b>
