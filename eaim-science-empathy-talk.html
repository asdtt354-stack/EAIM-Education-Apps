<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 생활 과학 공감 톡</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #334155; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-radius: 3rem; box-shadow: 0 20px 50px rgba(0,0,0,0.08); border: 2px solid white; width: 100%; max-width: 550px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; transition: 0.3s; }
        .eaim-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        textarea.eaim-input { text-align: left; resize: none; font-size: 0.95rem; line-height: 1.6; }
        .eaim-btn-main { background: #6366f1 !important; color: white !important; border-radius: 1.5rem; padding: 1.1rem; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; transform: none; box-shadow: none; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .loading-wrap, .no-teacher-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #64748b; }
        .ov { position: fixed; inset: 0; background: rgba(15,15,30,0.55); backdrop-filter: blur(6px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 18px; }
        .locked-notice { background: rgba(245,158,11,0.1); border: 1.5px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 14px; font-size: 0.82rem; color: #b45309; }
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: #3c4043; border: 1.5px solid #e2e8f0; border-radius: 12px; font-weight: 700; font-size: 0.95rem; padding: 14px; width: 100%; cursor: pointer; }
        .google-icon { width: 20px; height: 20px; flex-shrink: 0; }
        .teacher-chip { display: flex; align-items: center; gap: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; margin-bottom: 16px; text-align: left; }
        .teacher-avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #f1f5f9; border-radius: 10px; border: 1px solid #e2e8f0; text-align: left; }
        .toggle-track { width: 50px; height: 26px; border-radius: 13px; background: #cbd5e1; position: relative; cursor: pointer; transition: background 0.3s; flex-shrink: 0; }
        .toggle-track.on { background: #a5b4fc; border: 1px solid #6366f1; }
        .toggle-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: all 0.3s; }
        .toggle-track.on .toggle-thumb { left: 26px; }
        .invite-box { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; font-size: 0.7rem; color: #64748b; word-break: break-all; font-family: monospace; margin-top: 8px; text-align: left; }
        .invite-qr-box { background: #fff; border-radius: 10px; padding: 14px; display: inline-block; margin-top: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .invite-qr-caption { font-size: 0.62rem; color: #94a3b8; margin-top: 6px; letter-spacing: 0.05em; }
        .group-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.82rem; color: #475569; text-align: left; }
        .group-del { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 0.75rem; }
        .hub-link { font-size: 0.68rem; color: #94a3b8; text-decoration: none; padding: 4px 9px; border: 1px solid #e2e8f0; border-radius: 7px; }
    </style>
</head>
<body>

<div class="loading-wrap" id="loadingOverlay">✦ 불러오는 중...</div>

<div class="no-teacher-wrap" id="noTeacherOverlay" style="display:none">
  <div>
    <div style="font-size:1.6rem;margin-bottom:10px">🔗</div>
    <div style="font-size:.95rem;margin-bottom:8px">선생님께 받은 초대 링크로 접속해주세요</div>
    <div style="font-size:.75rem;color:#94a3b8">이 링크에는 우리 반 정보가 담겨 있어요</div>
  </div>
</div>

<div id="teacherGoogleOverlay" class="ov" style="display:none">
  <div class="eaim-card" style="text-align:center;margin:0">
    <div style="font-size:2.8rem;margin-bottom:10px">🔬</div>
    <h2 class="font-hand" style="font-size:1.6rem;color:#4338ca;margin-bottom:6px">생활 과학 공감 톡</h2>
    <p style="font-size:.85rem;color:#64748b;margin-bottom:20px">교사 로그인</p>
    <div id="googleLoginErr" style="font-size:.72rem;color:#dc2626;margin-bottom:8px"></div>
    <button class="google-btn" onclick="googleLogin()">
      <svg class="google-icon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 7.1 29.5 5 24 5 16.3 5 9.7 9.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.2-2 13.8-5.4l-6.4-5.4C29.3 34.9 26.8 35.8 24 35.8c-5.3 0-9.8-3.4-11.4-8.1l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.8l6.4 5.4C40.6 36.4 44 30.8 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      구글 계정으로 로그인
    </button>
    <a href="index.html" style="display:block;margin-top:16px;font-size:.7rem;color:#94a3b8;text-decoration:none">← 허브로 돌아가기</a>
  </div>
</div>

<div id="studentLoginOverlay" class="ov" style="display:none">
  <div class="eaim-card" style="text-align:center;margin:0">
    <div style="font-size:2.8rem;margin-bottom:10px">🔬</div>
    <h2 class="font-hand" style="font-size:1.6rem;color:#4338ca;margin-bottom:6px">생활 과학 공감 톡</h2>
    <p style="font-size:.85rem;color:#64748b;margin-bottom:20px">과학을 배우고, 주인공의 마음을 느껴봐요.</p>
    <div class="locked-notice" id="lockedNotice" style="display:none">🔒 선생님이 아직 수업을 열지 않았어요</div>
    <input type="text" id="sni" placeholder="이름 입력" class="eaim-input" style="margin-bottom:12px" onkeydown="if(event.key==='Enter')sN()">
    <select id="sclass" class="eaim-input" style="margin-bottom:16px;text-align:left">
      <option value="">반/모둠 선택</option>
    </select>
    <button onclick="sN()" id="sNBtn" class="eaim-btn-main">🚀 탐험 시작!</button>
  </div>
</div>

<div id="teacherPanel" class="ov" style="display:none">
  <div class="eaim-card" style="text-align:left;margin:0">
    <div class="font-hand" style="font-size:1.3rem;font-weight:700;margin-bottom:18px;text-align:center;color:#4338ca">🔬 교사 대시보드</div>
    <div class="teacher-chip">
      <img class="teacher-avatar" src="" id="dashAvatar" onerror="this.style.display='none'">
      <div style="font-size:.8rem" id="dashProfile"></div>
    </div>
    <div style="margin-bottom:16px">
      <div class="toggle-row"><div><div style="font-weight:700;font-size:.92rem" id="classStatusLabel">수업 종료</div>
        <div style="font-size:.7rem;color:#64748b;margin-top:2px" id="classStatusSub">학생 접속이 차단됩니다</div></div>
        <div class="toggle-track" id="classToggle" onclick="toggleClass()"><div class="toggle-thumb"></div></div>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <label style="font-size:.78rem;font-weight:700;color:#475569;display:block;margin-bottom:6px">학생 초대 링크</label>
      <div class="invite-box" id="inviteUrlBox"></div>
      <button style="margin-top:8px;padding:7px 14px;font-size:.78rem;border-radius:9px;background:#f1f5f9;border:1.5px solid #e2e8f0;cursor:pointer" onclick="copyInvite()">🔗 링크 복사</button>
      <div style="text-align:center"><div class="invite-qr-box" id="inviteQr"></div>
        <div class="invite-qr-caption">📱 학생들이 이 QR을 스캔하면 바로 접속돼요</div></div>
    </div>
    <div style="margin-bottom:16px">
      <label style="font-size:.78rem;font-weight:700;color:#475569;display:block;margin-bottom:6px">🏷️ 반/모둠 이름 관리</label>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <input type="text" id="newGroupName" class="eaim-input" placeholder="예: 3반 과학반" style="margin-bottom:0;flex:1;font-size:.85rem;padding:10px">
        <button style="padding:0 16px;border-radius:10px;background:#6366f1;color:#fff;border:none;cursor:pointer;font-weight:700;font-size:.85rem" onclick="addGroupUI()">추가</button>
      </div>
      <div id="groupList"></div>
    </div>
    <div style="margin-bottom:16px">
      <label style="font-size:.78rem;font-weight:700;color:#475569;display:block;margin-bottom:6px">🔑 Gemini API 키</label>
      <input type="text" id="apiKeyInput" class="eaim-input" placeholder="AIzaSy..." style="font-size:.85rem;padding:10px" oninput="saveApiKeyDash(this.value)">
    </div>
    <button style="width:100%;padding:12px;border-radius:12px;background:#f1f5f9;border:1.5px solid #e2e8f0;cursor:pointer;font-weight:700" onclick="teacherLogout()">로그아웃</button>
  </div>
</div>

<div id="root" class="w-full flex justify-center p-4" style="display:none"></div>

<script>
    // ══════════════════════════
    // 🔥 Firebase — teachers/{uid}/... 구조 (국어 놀이터와 같은 프로젝트)
    // ══════════════════════════
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBalg0f5x0ydfHxn_nzgZ1pAELvJw6PzoY",
      authDomain: "eaim-classroom.firebaseapp.com",
      projectId: "eaim-classroom",
      storageBucket: "eaim-classroom.firebasestorage.app",
      messagingSenderId: "294479576192",
      appId: "1:294479576192:web:c60e994e319dbd2f11ba65"
    };
    let db=null, auth=null, firebaseReady=false;
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db=firebase.firestore(); auth=firebase.auth(); firebaseReady=true;
    }catch(e){ console.error('Firebase 초기화 실패', e); firebaseReady=false; }

    const teacherDocRef  = (uid) => db.collection('teachers').doc(uid);
    const settingsDocRef = (uid) => teacherDocRef(uid).collection('meta').doc('settings');
    const groupsColRef   = (uid) => teacherDocRef(uid).collection('groups');
    const studentsColRef = (uid) => teacherDocRef(uid).collection('students');
    const missionLogsCol = (uid) => teacherDocRef(uid).collection('scienceMissions');

    let currentUser=null, teacherUid=null, isStudentMode=false;
    let stuName='', stuClass='';
    let settings = { apiKey:'', classOn:false };
    let groups=[];
    let unsubSettings=null, unsubGroups=null;

    function subscribeSettings(uid, cb){
      if(unsubSettings) unsubSettings();
      unsubSettings = settingsDocRef(uid).onSnapshot(snap=>{
        settings = snap.exists ? snap.data() : {apiKey:'', classOn:false};
        window.settings = settings;
        cb && cb();
      }, err=>{ console.warn('설정 동기화 오류', err); cb && cb(); });
    }
    function setSettings(uid, fields){
      settings = {...settings, ...fields};
      window.settings = settings;
      settingsDocRef(uid).set(fields,{merge:true}).catch(e=>alert('저장 실패: '+e.message));
    }
    async function addGroup(name){
      try{ await groupsColRef(teacherUid).add({name, createdAt: firebase.firestore.FieldValue.serverTimestamp()}); }
      catch(e){ alert('저장 실패: '+e.message); }
    }
    async function deleteGroupFn(id){
      try{ await groupsColRef(teacherUid).doc(id).delete(); }
      catch(e){ alert('삭제 실패: '+e.message); }
    }
    function subscribeGroups(uid){
      if(unsubGroups) unsubGroups();
      unsubGroups = groupsColRef(uid).orderBy('createdAt','asc').onSnapshot(snap=>{
        groups = snap.docs.map(d=>({id:d.id, name:d.data().name}));
        if(isStudentMode) populateClassSelect();
        else renderGroupListDash();
      }, err=>console.warn('그룹 동기화 오류', err));
    }
    function populateClassSelect(){
      const sel=document.getElementById('sclass'); if(!sel) return;
      sel.innerHTML='<option value="">반/모둠 선택</option>';
      if(!groups.length){
        const opt=document.createElement('option'); opt.disabled=true; opt.textContent='(선생님이 아직 반/모둠을 만들지 않았어요)';
        sel.appendChild(opt);
      } else {
        groups.forEach(g=>{ const opt=document.createElement('option'); opt.value=g.name; opt.textContent=g.name; sel.appendChild(opt); });
      }
    }
    function renderGroupListDash(){
      const el=document.getElementById('groupList'); if(!el) return;
      el.innerHTML = groups.length ? groups.map(g=>`
        <div class="group-item"><span>${g.name}</span><button class="group-del" onclick="deleteGroupUI('${g.id}')">삭제</button></div>
      `).join('') : '<p style="font-size:.8rem;color:#94a3b8">아직 만든 반/모둠이 없어요</p>';
    }
    async function addGroupUI(){
      const input=document.getElementById('newGroupName');
      const name=input.value.trim();
      if(!name){ alert('반/모둠 이름을 입력하세요!'); return; }
      await addGroup(name); input.value='';
    }
    async function deleteGroupUI(id){
      if(!confirm('이 반/모둠을 삭제할까요?')) return;
      await deleteGroupFn(id);
    }

    function hideAllOverlays(){
      ['loadingOverlay','noTeacherOverlay','teacherGoogleOverlay','studentLoginOverlay'].forEach(id=>{
        const el=document.getElementById(id); if(el) el.style.display='none';
      });
      document.getElementById('teacherPanel').style.display='none';
      document.getElementById('root').style.display='none';
    }
    function renderNoTeacherLink(){ hideAllOverlays(); document.getElementById('noTeacherOverlay').style.display='flex'; }
    function renderTeacherGoogleGate(err){
      hideAllOverlays();
      document.getElementById('teacherGoogleOverlay').style.display='flex';
      document.getElementById('googleLoginErr').textContent = err||'';
    }
    function renderStudentLoginGate(){
      hideAllOverlays();
      document.getElementById('studentLoginOverlay').style.display='flex';
      document.getElementById('lockedNotice').style.display = settings.classOn? 'none':'block';
      document.getElementById('sNBtn').disabled = !settings.classOn;
      populateClassSelect();
    }
    function enterStudentApp(){
      hideAllOverlays();
      document.getElementById('root').style.display='flex';
      window.EAIM_MOUNT_REACT && window.EAIM_MOUNT_REACT();
    }
    function enterTeacherDashboard(){
      hideAllOverlays();
      document.getElementById('teacherPanel').style.display='flex';
      document.getElementById('dashAvatar').src = currentUser?.photoURL||'';
      document.getElementById('dashProfile').textContent = (currentUser?.displayName||'')+' · '+(currentUser?.email||'');
      document.getElementById('apiKeyInput').value = settings.apiKey||'';
      renderClassToggle();
      const inviteUrl = `${location.origin}${location.pathname}?role=student&teacher=${teacherUid}`;
      document.getElementById('inviteUrlBox').textContent = inviteUrl;
      generateInviteQR(inviteUrl);
      subscribeGroups(teacherUid);
    }
    function renderClassToggle(){
      const lbl=document.getElementById('classStatusLabel'), sub=document.getElementById('classStatusSub'), tg=document.getElementById('classToggle');
      if(!lbl) return;
      lbl.textContent = settings.classOn?'수업 진행 중':'수업 종료';
      sub.textContent = settings.classOn?'학생들이 접속할 수 있어요':'학생 접속이 차단됩니다';
      tg.classList.toggle('on', !!settings.classOn);
    }
    function toggleClass(){ setSettings(teacherUid, {classOn: !settings.classOn}); renderClassToggle(); }
    function saveApiKeyDash(v){ setSettings(teacherUid, {apiKey:v}); }
    function copyInvite(){
      const url = `${location.origin}${location.pathname}?role=student&teacher=${teacherUid}`;
      navigator.clipboard.writeText(url).then(()=>alert('✅ 초대 링크 복사됨!'));
    }
    function generateInviteQR(url){
      const el=document.getElementById('inviteQr'); if(!el) return;
      el.innerHTML='';
      if(typeof QRCode==='undefined'){ el.textContent='QR 로딩 실패'; return; }
      new QRCode(el, { text:url, width:140, height:140, colorDark:'#4338ca', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
    }
    function googleLogin(){
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(e=>{ document.getElementById('googleLoginErr').textContent='로그인 실패: '+e.message; });
    }
    function teacherLogout(){
      if(unsubSettings){unsubSettings();unsubSettings=null;}
      if(unsubGroups){unsubGroups();unsubGroups=null;}
      auth.signOut(); teacherUid=null;
      renderTeacherGoogleGate();
    }
    function studentLogout(){
      if(unsubSettings){unsubSettings();unsubSettings=null;}
      stuName=''; stuClass='';
      renderStudentLoginGate();
    }
    function sN(){
      const n=document.getElementById('sni').value.trim();
      const c=document.getElementById('sclass').value;
      if(!settings.classOn){alert('선생님이 아직 수업을 열지 않았어요');return;}
      if(!n){alert('이름을 입력해주세요!');return;}
      if(!c){alert('반/모둠을 선택해주세요!');return;}
      stuName=n; stuClass=c;
      enterStudentApp();
    }

    async function logMissionToFirestore(unit, quizAnswer, scienceReason, characterEmpathy, feedback){
      if(!teacherUid || !stuName) return;
      try{
        await missionLogsCol(teacherUid).add({
          name: stuName, group: stuClass||'',
          unit, quizAnswer, scienceReason, characterEmpathy, feedback,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await studentsColRef(teacherUid).doc(stuName.trim()).set({
          name: stuName, group: stuClass||'',
          lastUnit: unit,
          missionCount: firebase.firestore.FieldValue.increment(1),
          updatedAt: new Date().toLocaleString('ko-KR')
        }, {merge:true});
      }catch(e){ console.warn('미션 기록 저장 실패', e); }
    }

    // ══════════════════════════
    // 진입점
    // ══════════════════════════
    (function(){
        const params=new URLSearchParams(window.location.search);
        const role=params.get('role');
        const teacherParam=params.get('teacher');

        if(!firebaseReady){
            document.getElementById('loadingOverlay').textContent='⚠️ Firebase 설정이 필요해요';
            return;
        }

        if(role==='student'){
            isStudentMode=true;
            if(!teacherParam){ renderNoTeacherLink(); return; }
            teacherUid=teacherParam;
            subscribeSettings(teacherUid, ()=>{ renderStudentLoginGate(); });
            subscribeGroups(teacherUid);
            return;
        }

        auth.onAuthStateChanged(user=>{
            currentUser=user;
            if(user){
                teacherUid=user.uid;
                subscribeSettings(teacherUid, ()=>{ enterTeacherDashboard(); });
            } else {
                renderTeacherGoogleGate();
            }
        });
    })();
</script>

<script type="text/babel">
    const { useState, useEffect } = React;

    const ScienceEAIMApp = () => {
        const [step, setStep] = useState(1);
        const [isAnalyzing, setIsAnalyzing] = useState(false);

        const [scienceUnit, setScienceUnit] = useState('');
        const [dailyScenario, setDailyScenario] = useState('');
        const [quizAnswer, setQuizAnswer] = useState('');
        const [scienceReason, setScienceReason] = useState('');
        const [characterEmpathy, setCharacterEmpathy] = useState('');
        const [feedbackReport, setFeedbackReport] = useState('');

        const callGemini = async (prompt) => {
            const cleanKey = (window.settings && window.settings.apiKey || '').trim();
            if(!cleanKey) throw new Error('NO_KEY');
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
            const response = await fetch(url, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.6, maxOutputTokens: 8192 }
                })
            });
            const data = await response.json();
            if(data.error) throw new Error(data.error.message);
            return data.candidates[0].content.parts[0].text;
        };

        const generateMission = async () => {
            if (!scienceUnit) return alert('과학 단원을 입력해주세요!');
            if (!(window.settings && window.settings.apiKey)) {
                return alert('선생님이 아직 API 키를 설정하지 않았어요. 선생님께 문의해주세요.');
            }
            setIsAnalyzing(true);
            setDailyScenario('이야기 속 주인공의 마음으로 들어가는 중... 💭');

            const prompt = `중학교 과학 교사로서, '${scienceUnit}' 원리가 담긴 일상 이야기를 지어줘.
            [필수 조건]
            1. 주인공이 과학적 문제 때문에 겪는 '당황함, 속상함, 설렘' 등의 감정 묘사를 아주 구체적으로 포함해줘.
            2. 이야기를 읽는 학생이 주인공의 감정에 깊이 공감할 수 있는 3~4문장의 스토리를 써줘.
            3. 이 상황을 해결할 과학 퀴즈(4지선다)를 마지막에 내줘.

            형식:
            [주인공의 하루 이야기]
            (내용)
            [도전! 과학 미션]
            (1, 2, 3, 4번 보기)`;

            try {
                const text = await callGemini(prompt);
                setDailyScenario(text);
                setStep(2);
            } catch (e) { alert('연결 오류: ' + e.message); setDailyScenario(''); }
            finally { setIsAnalyzing(false); }
        };

        const solveMission = async () => {
            if (!quizAnswer || !scienceReason || !characterEmpathy) return alert('모든 내용을 적어주세요!');
            setIsAnalyzing(true); setStep(3);

            const prompt = `학생의 답변 보고서입니다:
            1. 퀴즈 정답 번호: ${quizAnswer}
            2. 내가 생각한 과학적 원리: ${scienceReason}
            3. 주인공의 마음을 엿보고 느낀 점: ${characterEmpathy}

            중학교 선생님으로서 따뜻한 피드백을 써줘.
            특히 학생이 주인공의 마음에 공감하며 적은 내용에 대해 '네 마음이 정말 따뜻하구나'라는 식의 정서적 지지와 격려를 듬뿍 담아줘.
            형식: [과학 교사의 조언] / [마음 선생님의 편지]`;

            try {
                const text = await callGemini(prompt);
                setFeedbackReport(text);
                if(window.logMissionToFirestore){
                    window.logMissionToFirestore(scienceUnit, quizAnswer, scienceReason, characterEmpathy, text);
                }
            } catch (e) { setFeedbackReport('피드백 전송 실패: ' + e.message); }
            finally { setIsAnalyzing(false); }
        };

        return (
            <div className="eaim-card">
                <header className="flex justify-between items-center border-b border-indigo-100 pb-3 mb-6">
                    <span className="font-bold text-indigo-600 font-hand text-xl uppercase tracking-tighter">EAIM 2.5 PRO ENGINE</span>
                    <button onClick={() => window.studentLogout && window.studentLogout()} className="text-[10px] text-slate-400 border border-slate-200 px-2 py-1 rounded">나가기</button>
                </header>

                {step === 1 && (
                    <div className="space-y-6 animate-fadeIn">
                        <div className="text-center space-y-2">
                            <h2 className="text-2xl font-hand text-slate-800">어떤 원리를 탐험할까요?</h2>
                            <p className="text-xs text-slate-500 italic">교과서 단원명을 입력해 보세요.</p>
                        </div>
                        <input type="text" value={scienceUnit} onChange={e => setScienceUnit(e.target.value)} className="eaim-input border-indigo-200" placeholder="예: 소리의 전달, 식물의 구조" />
                        <button onClick={generateMission} disabled={isAnalyzing} className="eaim-btn-main">{isAnalyzing ? "마음의 문을 여는 중..." : "탐험 시작하기 ✨"}</button>
                    </div>
                )}

                {step === 2 && (
                    <div className="space-y-6 animate-fadeIn">
                        <div className="bg-white p-7 rounded-3xl border-2 border-indigo-200 font-hand text-xl leading-relaxed shadow-sm whitespace-pre-wrap">{dailyScenario}</div>

                        <div className="space-y-6 bg-indigo-50/50 p-6 rounded-[2.5rem] border border-indigo-100 shadow-inner">
                            <h3 className="font-bold text-indigo-700 text-lg border-b border-indigo-200 pb-2">📝 나의 탐험 일지</h3>

                            <div className="space-y-2">
                                <label className="text-sm font-black text-indigo-500 ml-1">1. 과학 미션 정답 번호</label>
                                <input type="number" value={quizAnswer} onChange={e => setQuizAnswer(e.target.value)} className="eaim-input text-center font-black text-indigo-700 w-full" placeholder="1~4번 중 하나" min="1" max="4" />
                            </div>

                            <div className="space-y-2">
                                <label className="text-sm font-black text-indigo-500 ml-1">2. 왜 그렇게 생각했나요? (과학 원리)</label>
                                <textarea value={scienceReason} onChange={e => setScienceReason(e.target.value)} className="eaim-input w-full h-24" placeholder="교과서 지식을 활용해 적어보세요."></textarea>
                            </div>

                            <div className="space-y-2">
                                <label className="text-sm font-black text-rose-500 ml-1">3. 주인공의 마음을 엿보고 느낀 점</label>
                                <textarea value={characterEmpathy} onChange={e => setCharacterEmpathy(e.target.value)} className="eaim-input w-full h-28 border-rose-100 focus:border-rose-400 placeholder:text-rose-200" placeholder="이야기 속 주인공이 어떤 기분이었을지, 그 마음을 본 너의 느낌은 어떠니?"></textarea>
                            </div>
                        </div>

                        <button onClick={solveMission} disabled={!quizAnswer || !scienceReason || !characterEmpathy || isAnalyzing} className="eaim-btn-main shadow-2xl">{isAnalyzing ? "선생님이 일지를 분석 중..." : "탐험 보고서 제출하기 📝"}</button>
                    </div>
                )}

                {step === 3 && (
                    <div className="space-y-6 animate-fadeIn">
                        <div className="bg-white p-8 rounded-[3rem] border-2 border-indigo-200 whitespace-pre-wrap font-hand text-2xl leading-relaxed shadow-xl border-t-[12px] border-t-indigo-500">{feedbackReport}</div>
                        <button onClick={() => { setStep(1); setScienceUnit(''); setDailyScenario(''); setQuizAnswer(''); setScienceReason(''); setCharacterEmpathy(''); setFeedbackReport(''); }} className="eaim-btn-main bg-indigo-500">새로운 탐험 떠나기 🚀</button>
                    </div>
                )}
            </div>
        );
    };

    window.EAIM_MOUNT_REACT = function(){
        if(window._eaimReactMounted) return;
        window._eaimReactMounted = true;
        window.settings = settings;
        window.logMissionToFirestore = logMissionToFirestore;
        window.studentLogout = studentLogout;
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScienceEAIMApp />);
    };
</script>
</body>
</html>
