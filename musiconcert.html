<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 앙상블 스튜디오 V2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(39, 39, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(82, 82, 91, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const EnsembleApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [songTitle, setSongTitle] = useState('선물 - 멜로망스');
            const [parsedData, setParsedData] = useState({
                intro: '', originalChord: '', drum: '', bass: '', guitar: '', harmKey: '', melKey: ''
            });

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key', apiKey);
                setStep(1);
            };

            const extractSection = (text, sectionName) => {
                const regex = new RegExp(`\\[${sectionName}\\](.*?)(?=\\[|$)`, 's');
                const match = text.match(regex);
                return match ? match[1].trim() : '데이터를 불러올 수 없습니다.';
            };

            const analyzeSong = async () => {
                if(!songTitle) return alert("곡 제목을 입력해주세요.");
                setIsAnalyzing(true);
                
                const prompt = `당신은 천재적인 음악 편곡가입니다.
                곡: ${songTitle}
                핵심 화성을 분석하여 아래 5파트로 압축 편곡하세요. 모든 코드명 뒤에는 반드시 한글 계이름을 괄호안에 적어주세요. (예: C(도), Am(라), G5(솔+레))

                [곡 소개] 합주에 어울리는 이유 1문장
                [원곡 코드] 하이라이트 원곡 코드 진행
                [드럼] 기본 리듬 (예: 8비트 고고)
                [베이스] 오직 근음(Root)과 한글 계이름
                [통기타] 파워코드(근음+5음)와 한글 계이름
                [화성 건반] 근음+3음과 한글 계이름
                [멜로디 건반] 시작 계이름과 연주 팁`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    
                    setParsedData({
                        intro: extractSection(text, '곡 소개'),
                        originalChord: extractSection(text, '원곡 코드'),
                        drum: extractSection(text, '드럼'),
                        bass: extractSection(text, '베이스'),
                        guitar: extractSection(text, '통기타'),
                        harmKey: extractSection(text, '화성 건반'),
                        melKey: extractSection(text, '멜로디 건반')
                    });
                    setStep(2);
                } catch (e) { alert('분석 오류가 발생했습니다.'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-zinc-900 shadow-2xl flex flex-col relative overflow-hidden">
                    <header className="bg-zinc-950 p-4 flex justify-between items-center shadow-lg border-b border-zinc-800 z-10">
                        <h1 className="text-xl font-title tracking-wider text-zinc-100 italic">EAIM ENSEMBLE</h1>
                        {step > 0 && <button onClick={() => setStep(0)} className="text-xs bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-md">설정</button>}
                    </header>

                    <main className="flex-grow p-5 overflow-y-auto pb-24 relative z-0">
                        {step === 0 && (
                            <div className="space-y-4 py-10">
                                <h2 className="text-2xl font-bold text-cyan-400 font-title">🔌 앰프 전원 연결</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-zinc-800 border border-zinc-700 p-4 rounded-xl text-white outline-none" />
                                <button onClick={saveApiKey} className="w-full bg-cyan-600 text-white p-4 rounded-xl font-bold hover:bg-cyan-500">스튜디오 입장</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="text-center mt-10">
                                    <h2 className="text-3xl font-title text-cyan-400">1시간의 기적</h2>
                                    <p className="text-zinc-400 text-sm mt-2">화성 압축 로직으로 누구나 밴드 부원이 됩니다.</p>
                                </div>
                                <input type="text" value={songTitle} onChange={e => setSongTitle(e.target.value)} className="w-full bg-zinc-800 border-2 border-zinc-700 p-4 rounded-2xl text-white text-xl text-center mt-10" />
                                <button onClick={analyzeSong} className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white p-5 rounded-2xl font-bold shadow-lg hover:scale-105 transition-transform flex justify-center items-center gap-2">
                                    {isAnalyzing ? <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div> : <span className="text-lg">AI 합주 악보 만들기 🪄</span>}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-5 animate-fade-in pb-10">
                                <div className="text-center bg-zinc-800/50 p-6 rounded-3xl border border-zinc-700">
                                    <h2 className="text-2xl font-bold text-white mb-2">{songTitle}</h2>
                                    <p className="text-sm text-cyan-300 font-medium italic">"{parsedData.intro}"</p>
                                </div>

                                <div className="space-y-3 mt-6">
                                    <PartCard icon="🥁" title="드럼" color="amber" content={parsedData.drum} />
                                    <PartCard icon="🎸" title="베이스 (근음)" color="blue" content={parsedData.bass} isCode />
                                    <PartCard icon="🎸" title="통기타 (파워코드)" color="orange" content={parsedData.guitar} isCode />
                                    <PartCard icon="🎹" title="화성 건반 (색깔)" color="pink" content={parsedData.harmKey} isCode />
                                    <PartCard icon="🎹" title="멜로디 건반" color="emerald" content={parsedData.melKey} />
                                </div>

                                <button onClick={() => setStep(1)} className="w-full bg-zinc-800 text-zinc-400 p-4 rounded-xl font-bold mt-8">다른 곡 찾기</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const PartCard = ({ icon, title, color, content, isCode }) => (
            <div className={`glass-panel p-4 rounded-2xl border-l-4 border-l-${color}-500 shadow-lg`}>
                <div className="flex items-center gap-2 mb-2">
                    <span className="text-xl">{icon}</span>
                    <span className={`font-bold text-${color}-400`}>{title}</span>
                </div>
                <div className={`ml-8 ${isCode ? 'bg-zinc-800/80 p-3 rounded-lg border border-zinc-700 font-mono text-cyan-100 text-lg leading-relaxed' : 'text-zinc-200'}`}>
                    {content}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnsembleApp />);
    </script>
</body>
</html>
