<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 4-BAND PERFECT SYNC v10.7</title>
    <script src="[https://unpkg.com/react@18/umd/react.production.min.js](https://unpkg.com/react@18/umd/react.production.min.js)"></script>
    <script src="[https://unpkg.com/react-dom@18/umd/react-dom.production.min.js](https://unpkg.com/react-dom@18/umd/react-dom.production.min.js)"></script>
    <script src="[https://unpkg.com/@babel/standalone/babel.min.js](https://unpkg.com/@babel/standalone/babel.min.js)"></script>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)" rel="stylesheet">
    <link href="[https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap](https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap)" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .station-card { background: rgba(30, 41, 59, 0.5); border: 2px solid #1e293b; border-radius: 1.25rem; padding: 1rem; transition: 0.3s; position: relative; overflow: hidden; }
        .active-station { border-color: #f43f5e; box-shadow: 0 0 25px rgba(244, 63, 94, 0.15); }
        .flash-active { animation: flash-pulse 0.4s ease-out; }
        @keyframes flash-pulse {
            0% { background-color: rgba(255, 255, 255, 0.2); transform: scale(1.02); }
            100% { background-color: rgba(30, 41, 59, 0.5); transform: scale(1); }
        }
        .power-bubble { width: 58px; height: 58px; border-radius: 1.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .note-1 { background-color: #f43f5e; color: white; border: 2px solid #fb7185; }
        .note-5 { background-color: #3b82f6; color: white; border: 2px solid #60a5fa; }
        .youtube-container { width: 100%; aspect-ratio: 16/9; border-radius: 1.5rem; overflow: hidden; background: #000; border: 2px solid #334155; position: relative; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f43f5e; }
        input:checked + .slider:before { transform: translateX(20px); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [currentTime, setCurrentTime] = useState(0);
            const [timeline, setTimeline] = useState([]);
            const [effectEnabled, setEffectEnabled] = useState(true);
            const [isFlash, setIsFlash] = useState(false);
            const playerRef = useRef(null);
            const lastTimeRef = useRef(-1);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_ensemble');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            // 데이터 갱신 및 시각 효과 로직
            useEffect(() => {
                let interval;
                if (step === 3) {
                    interval = setInterval(() => {
                        if (playerRef.current && playerRef.current.getCurrentTime) {
                            const now = playerRef.current.getCurrentTime();
                            setCurrentTime(now);

                            const currentIdx = timeline.findIndex((item, index) => {
                                const nextItem = timeline[index + 1];
                                return now >= item.time && (!nextItem || now < nextItem.time);
                            });

                            if (currentIdx !== lastTimeRef.current && currentIdx !== -1) {
                                if (effectEnabled) {
                                    setIsFlash(true);
                                    setTimeout(() => setIsFlash(false), 400);
                                }
                                lastTimeRef.current = currentIdx;
                            }
                        }
                    }, 100);
                }
                return () => clearInterval(interval);
            }, [step, timeline, effectEnabled]);

            const extractVideoId = (url) => {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : url;
            };

            // ⚡ 철벽 파싱 로직 적용
            const parseRobustJSON = (text) => {
                try {
                    const match = text.match(/\[[\s\S]*\]/); // 대괄호로 감싸진 배열 데이터만 추출
                    if (match) return JSON.parse(match[0]);
                    return JSON.parse(text);
                } catch (e) {
                    console.error("JSON Parsing failed", text);
                    return null;
                }
            };

            const initYouTubePlayer = (videoId) => {
                const createPlayer = () => {
                    playerRef.current = new window.YT.Player('player', {
                        height: '100%', width: '100%', videoId: videoId,
                        events: { 'onReady': () => setStep(3) }
                    });
                };
                if (window.YT && window.YT.Player) createPlayer();
                else {
                    window.onYouTubeIframeAPIReady = createPlayer;
                    const tag = document.createElement('script');
                    tag.src = "[https://www.youtube.com/iframe_api](https://www.youtube.com/iframe_api)";
                    document.body.appendChild(tag);
                }
            };

            const handleAnalyze = async () => {
                if (!searchQuery) return alert("유튜브 주소를 입력하세요!");
                setStep(2);
                const videoId = extractVideoId(searchQuery);
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey.trim()}`;
                    
                    const response = await fetch(url, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ 
                                parts: [{ 
                                    text: `음악 '${searchQuery}'을 분석해서 전체 곡에 대해 5초 간격의 데이터를 순수한 JSON 배열로 출력해. 부연 설명이나 마크다운 기호 없이 오직 JSON만 출력해야 해.
                                    응답 예시: [{"time":0, "chord":"C5", "wind":"도", "guitar":["도","솔"], "key":["도","미","솔"], "perc":"🥁쿵 👏팍"}]` 
                                }] 
                            }],
                            generationConfig: {
                                temperature: 0.1,
                                maxOutputTokens: 8192,
                                responseMimeType: "application/json" 
                            }
                        })
                    });
                    
                    const data = await response.json();
                    const rawText = data.candidates[0].content.parts[0].text;
                    const parsedData = parseRobustJSON(rawText);
                    
                    if (parsedData) {
                        setTimeline(parsedData);
                        initYouTubePlayer(videoId);
                    } else {
                        throw new Error("Invalid Data Format");
                    }
                } catch (e) {
                    console.error(e);
                    alert("분석 시간이 너무 길거나 형식이 맞지 않습니다. 기본 패턴으로 시작합니다.");
                    setTimeline([{time:0, chord:"C5", wind:"도", guitar:["도","솔"], key:["도","미","솔"], perc:"🥁쿵 👏팍"}]);
                    initYouTubePlayer(videoId);
                }
            };

            const currentData = timeline.find((item, index) => {
                const nextItem = timeline[index + 1];
                return currentTime >= item.time && (!nextItem || currentTime < nextItem.time);
            }) || { chord: '-', wind: '-', guitar:['-','-'], key:['-','-','-'], perc: '-' };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col relative shadow-2xl overflow-hidden">
                    {step === 0 && (
                        <div className="flex-grow flex flex-col justify-center p-10 text-center space-y-6">
                            <h2 className="text-2xl font-bold text-rose-500 font-title uppercase">EAIM Sync PRO 2.5</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-center text-white" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_ensemble', apiKey.trim()); setStep(1); }} className="w-full bg-rose-600 p-4 rounded-xl font-bold">시스템 연결</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="flex-grow flex flex-col justify-center p-8 text-center animate-fadeIn space-y-8">
                            <div className="text-6xl">🎹🥁🎸</div>
                            <h2 className="text-2xl font-bold font-title text-indigo-300 uppercase">앙상블 분석기 2.5</h2>
                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-slate-800 p-5 rounded-2xl text-white text-center font-bold" placeholder="유튜브 주소 붙여넣기" />
                            <button onClick={handleAnalyze} className="w-full bg-indigo-600 p-5 rounded-2xl font-bold text-xl shadow-xl">분석 시작 🔍</button>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="flex-grow flex flex-col justify-center items-center space-y-4">
                            <div className="w-14 h-14 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                            <p className="text-indigo-400 font-bold animate-pulse font-title uppercase">2.5 PRO AI Engine Analyzing...</p>
                            <p className="text-[10px] text-slate-500">곡의 길이에 따라 최대 30초가 소요될 수 있습니다.</p>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="flex-grow flex flex-col animate-fadeIn">
                            <header className="p-4 flex justify-between items-center font-title text-indigo-400">
                                <span className="text-lg">EAIM PERFECT SYNC</span>
                                <button onClick={() => window.location.reload()} className="text-[10px] text-slate-500 underline uppercase">Reset</button>
                            </header>

                            <div className="px-4 mb-3">
                                <div className="youtube-container shadow-2xl">
                                    <div id="player"></div>
                                </div>
                            </div>

                            <div className="flex-grow flex flex-col px-4 pb-4 space-y-2 overflow-y-auto">
                                <div className={`station-card flex items-center justify-between border-amber-500/30 ${isFlash ? 'flash-active' : ''}`}>
                                    <div className="flex flex-col"><span className="text-[9px] font-bold text-amber-500 uppercase">Percussion</span><span className="text-lg font-black text-amber-200">{currentData.perc}</span></div>
                                    <div className="text-3xl pr-2">{currentTime % 1 < 0.3 ? '🥁' : currentTime % 1 > 0.5 && currentTime % 1 < 0.8 ? '👏' : '⚪'}</div>
                                </div>

                                <div className={`station-card active-station flex items-center justify-between ${isFlash ? 'flash-active' : ''}`}>
                                    <div className="flex flex-col"><span className="text-[9px] font-bold text-rose-400 uppercase">Guitar (EAIM 4)</span><span className="text-2xl font-black text-white">{currentData.chord}</span></div>
                                    <div className="flex gap-2">
                                        <div className="power-bubble note-1"><span className="text-[8px] opacity-70">ROOT</span>{currentData.guitar[0]}</div>
                                        <div className="power-bubble note-5"><span className="text-[8px] opacity-70">5TH</span>{currentData.guitar[1]}</div>
                                    </div>
                                </div>

                                <div className={`station-card flex items-center justify-between py-4 ${isFlash ? 'flash-active' : ''}`}>
                                    <span className="text-[9px] font-bold text-indigo-400 uppercase tracking-widest">Wind Team</span>
                                    <div className="text-3xl font-black text-indigo-300 px-4 bg-indigo-900/20 rounded-lg">{currentData.wind}</div>
                                </div>

                                <div className={`station-card flex items-center justify-between py-4 ${isFlash ? 'flash-active' : ''}`}>
                                    <span className="text-[9px] font-bold text-pink-400 uppercase tracking-widest">Piano Team</span>
                                    <div className="flex gap-2">
                                        {Array.isArray(currentData.key) ? currentData.key.map((n, i) => (
                                            <span key={i} className="text-sm font-bold text-pink-200 bg-pink-900/40 px-3 py-1.5 rounded-lg border border-pink-500/20">{n}</span>
                                        )) : <span className="text-sm font-bold text-pink-200">-</span>}
                                    </div>
                                </div>
                            </div>

                            <div className="p-3 bg-slate-900 border-t border-white/5 flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <label className="switch">
                                        <input type="checkbox" checked={effectEnabled} onChange={e => setEffectEnabled(e.target.checked)} />
                                        <span className="slider"></span>
                                    </label>
                                    <span className="text-[10px] text-slate-400 font-bold uppercase">Pulse: {effectEnabled ? 'ON' : 'OFF'}</span>
                                </div>
                                <span className="text-[10px] text-indigo-400 font-bold bg-indigo-900/40 px-3 py-1 rounded-full uppercase">Sync: {Math.floor(currentTime)}s</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
