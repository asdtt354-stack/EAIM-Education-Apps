<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 앙상블 V3.0 - 감정 합주</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #09090b; color: #f4f4f5; margin: 0; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(39, 39, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(82, 82, 91, 0.5); }
        .active-chord { border-color: #22d3ee; background: rgba(34, 211, 238, 0.2); transform: scale(1.02); box-shadow: 0 0 20px rgba(34, 211, 238, 0.2); }
        .emotion-btn { transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1); }
        .emotion-btn:hover { transform: translateY(-5px); border-color: #22d3ee; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const EnsembleApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [emotion, setEmotion] = useState('');
            const [recommendations, setRecommendations] = useState([]);
            const [selectedSong, setSelectedSong] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [chords, setChords] = useState([]);
            const [currentTime, setCurrentTime] = useState(0);
            const playerRef = useRef(null);
            const timerRef = useRef(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            // 1. 감정에 따른 곡 추천 로직
            const getRecommendations = async () => {
                if (!emotion) return alert("현재 기분을 입력해주세요!");
                setIsAnalyzing(true);
                const prompt = `사용자의 기분: "${emotion}"
                이 감정에 어울리는 합주하기 좋은 대중음악(K-POP 또는 팝송) 3곡을 추천하세요.
                반드시 다음 JSON 형식으로만 답하세요: [{"title": "곡제목 - 아티스트", "reason": "추천이유", "url": "유튜브검색키워드"}]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const jsonMatch = data.candidates[0].content.parts[0].text.match(/\[[\s\S]*\]/);
                    setRecommendations(JSON.parse(jsonMatch[0]));
                    setStep(1.5); // 추천 리스트 단계
                } catch (e) { alert("추천 실패"); }
                finally { setIsAnalyzing(false); }
            };

            // 2. 선택된 곡의 유튜브 링크 찾기 (간소화를 위해 검색 UI 제공)
            const analyzeSelectedSong = async (song) => {
                setSelectedSong(song);
                setIsAnalyzing(true);
                // 실제 구현에선 YouTube API 검색을 쓰거나, 검색 키워드로 분석 요청
                const prompt = `곡명: ${song.title}
                이 곡을 4마디 단위로 분석하여 '다이어트 코드' 리스트를 만드세요.
                반드시 JSON 배열 형식으로만 답하세요: [{"time": 초, "chord": "코드", "scale": "계이름", "tip": "운지"}]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const jsonMatch = data.candidates[0].content.parts[0].text.match(/\[[\s\S]*\]/);
                    setChords(JSON.parse(jsonMatch[0]));
                    setStep(2);
                    // 데모용: 실제 유튜브 검색 로직 대신 키워드 활용 (실제 앱에선 곡별 URL 매칭 필요)
                    setTimeout(() => initYouTube("kY3Lp-D_oas"), 100); 
                } catch (e) { alert("분석 실패"); }
                finally { setIsAnalyzing(false); }
            };

            const initYouTube = (videoId) => {
                if (!window.YT) return;
                playerRef.current = new window.YT.Player('yt-player', {
                    videoId: videoId,
                    events: {
                        'onStateChange': (event) => {
                            if (event.data === window.YT.PlayerState.PLAYING) {
                                timerRef.current = setInterval(() => {
                                    setCurrentTime(playerRef.current.getCurrentTime());
                                }, 100);
                            } else { clearInterval(timerRef.current); }
                        }
                    }
                });
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-zinc-900 flex flex-col shadow-2xl overflow-hidden">
                    <header className="p-4 bg-zinc-950 border-b border-zinc-800 flex justify-between items-center">
                        <h1 className="font-title text-cyan-400 italic">EAIM SEL ENSEMBLE</h1>
                        {step > 0 && <button onClick={() => location.reload()} className="text-[10px] text-zinc-500">RESET</button>}
                    </header>

                    <main className="p-4 flex-grow">
                        {step === 0 && (
                            <div className="py-10 space-y-4">
                                <h2 className="text-xl font-bold">🔑 스튜디오 인증</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full p-4 bg-zinc-800 rounded-xl outline-none border border-zinc-700 focus:border-cyan-500" />
                                <button onClick={() => {localStorage.setItem('gemini_api_key', apiKey); setStep(1);}} className="w-full bg-cyan-600 p-4 rounded-xl font-bold">입장하기</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="py-10 space-y-6">
                                <div className="text-center">
                                    <h2 className="text-2xl font-title mb-2">오늘 기분이 어떠신가요?</h2>
                                    <p className="text-zinc-500 text-sm">기분에 맞춰 AI가 합주곡을 골라줍니다.</p>
                                </div>
                                <textarea value={emotion} onChange={e => setEmotion(e.target.value)} placeholder="예: 구름 위를 걷는 것처럼 행복해!" className="w-full h-32 p-4 bg-zinc-800 rounded-2xl border-2 border-zinc-700 focus:border-cyan-500 outline-none resize-none" />
                                <button onClick={getRecommendations} disabled={isAnalyzing} className="w-full bg-cyan-600 p-5 rounded-2xl font-bold text-lg">
                                    {isAnalyzing ? "감정 분석 중..." : "감정 합주곡 찾기 🎵"}
                                </button>
                            </div>
                        )}

                        {step === 1.5 && (
                            <div className="py-6 space-y-4">
                                <h2 className="text-lg font-bold text-cyan-400">당신을 위한 추천 곡</h2>
                                {recommendations.map((song, i) => (
                                    <div key={i} onClick={() => analyzeSelectedSong(song)} className="glass-panel p-4 rounded-2xl cursor-pointer emotion-btn">
                                        <div className="font-bold text-lg">{song.title}</div>
                                        <div className="text-xs text-zinc-400 mt-1">{song.reason}</div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-4">
                                <div id="yt-player" className="w-full aspect-video rounded-2xl border border-zinc-700 overflow-hidden bg-black"></div>
                                <div className="space-y-3">
                                    {chords.map((item, idx) => {
                                        const isActive = currentTime >= item.time && (chords[idx+1] ? currentTime < chords[idx+1].time : true);
                                        return (
                                            <div key={idx} className={`glass-panel p-4 rounded-xl transition-all duration-300 flex items-center justify-between ${isActive ? 'active-chord' : 'opacity-30'}`}>
                                                <div>
                                                    <div className="text-2xl font-black">{item.chord}</div>
                                                    <div className="text-cyan-400 text-xs font-bold">{item.scale}</div>
                                                </div>
                                                <div className="text-right">
                                                    <span className="bg-zinc-700 px-3 py-1 rounded-full text-[10px] text-zinc-200">{item.tip}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnsembleApp />);
    </script>
</body>
</html>
