<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 국어 감정 시인 & 편지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 플랫폼 대문과 통일된 배경 스타일 */
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .font-hand { font-family: 'Gaegu', cursive; }
        
        /* 유리 질감의 카드 스타일 */
        .eaim-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .eaim-input {
            background: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            border-radius: 1rem !important;
        }
        .eaim-input::placeholder { color: rgba(255, 255, 255, 0.5); }

        /* 버튼 스타일 */
        .eaim-btn-white {
            background: white !important;
            color: #667eea !important;
            transition: all 0.3s;
        }
        .eaim-btn-white:hover { transform: scale(1.02); background: rgba(255,255,255,0.9) !important; }

        @media print {
            body { background: white !important; color: black !important; }
            .eaim-card { background: white !important; color: black !important; border: 1px solid #ccc !important; }
            .print-hidden { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full max-w-xl"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const KoreanEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [finalResult, setFinalResult] = useState('');
            const [searchQuery, setSearchQuery] = useState('신미나 싱고');
            const [readingPoem, setReadingPoem] = useState('');
            const [emotionWord, setEmotionWord] = useState('');
            const [emotionColor, setEmotionColor] = useState('');
            const [situation, setSituation] = useState('');
            const [bodyPart, setBodyPart] = useState('');
            const [bodySensation, setBodySensation] = useState('');
            const [appearance, setAppearance] = useState('');
            const [relationship, setRelationship] = useState('');
            const [emotionName, setEmotionName] = useState('');
            const [friendName, setFriendName] = useState('');
            const [friendPoem, setFriendPoem] = useState('');
            const [draftLetter, setDraftLetter] = useState('');

            const words = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '억울한', '편안한', '신나는', '부끄러운', '포근한'];
            const colors = [
                { name: '빨강', code: '#EF4444' }, { name: '주황', code: '#F97316' }, { name: '노랑', code: '#FBBF24' },
                { name: '초록', code: '#34D399' }, { name: '파랑', code: '#3B82F6' }, { name: '보라', code: '#8B5CF6' },
                { name: '회색', code: '#9CA3AF' }, { name: '검정', code: '#1F2937' }
            ];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key', apiKey);
                setStep(1);
            };

            const fetchPoem = async () => {
                if (!apiKey) return alert('API 키가 없습니다.');
                setIsAnalyzing(true);
                const prompt = `당신은 국어 교사입니다. '${searchQuery}'에 해당하는 시의 제목, 작가, 본문만 출력해주세요. 정확한 시를 못 찾으면 주제에 맞는 시를 한 편 추천해주세요.`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setReadingPoem(data.candidates[0].content.parts[0].text);
                } catch (e) { setReadingPoem('시를 불러오지 못했습니다.'); } finally { setIsAnalyzing(false); }
            };

            const generatePoem = async () => {
                setIsAnalyzing(true); setStep(6);
                const prompt = `당신은 문학 교사입니다. 학생의 데이터로 시를 작성해주세요. 감정: ${emotionColor}색의 '${emotionWord}' / 상황: ${situation} / 신체: ${bodyPart}에서 ${bodySensation} 느낌 / 모습: ${appearance} / 관계: ${relationship} / 이름: ${emotionName} [가이드라인] 1연: 상황과 이름, 2연: 감정의 특징, 3연: 감정과 나의 관계. 끝에 영문 1줄씩 추가: 'Suno Prompt: (장르/악기)', 'Image Prompt: (삽화 묘사)'`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setFinalResult(data.candidates[0].content.parts[0].text);
                } catch (e) { setFinalResult('오류 발생'); } finally { setIsAnalyzing(false); }
            };

            const generateLetter = async () => {
                if(!friendPoem) return alert('친구의 시를 입력해주세요.');
                setIsAnalyzing(true);
                const prompt = `당신은 따뜻한 보조 교사입니다. 친구(${friendName})의 시를 분석하여 초등학생/중학생 말투로 공감 편지 초안을 작성해주세요. [공감 듣기 3단계 포함] 시: ${friendPoem}`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setDraftLetter(data.candidates[0].content.parts[0].text);
                } catch (e) { setDraftLetter('오류 발생'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="p-6 flex flex-col items-center">
                    <header className="w-full flex justify-between items-center mb-8 print-hidden">
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">📖</span>
                            <h1 className="text-xl font-bold">EAIM 나만의 감정 시</h1>
                        </div>
                        {step > 0 && <button onClick={() => setStep(0)} className="text-xs bg-white/20 px-3 py-1 rounded-full border border-white/10">설정</button>}
                    </header>

                    <main className="w-full eaim-card p-8 mb-10">
                        {step === 0 && (
                            <div className="space-y-6">
                                <h2 className="text-xl font-bold text-center">⚙️ Gemini API 설정</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full eaim-input p-3 text-center" />
                                <button onClick={saveApiKey} className="w-full eaim-btn-white p-4 rounded-2xl font-bold shadow-lg">저장하고 시작하기</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-hand">1. 오늘의 시 읽기 📖</h2>
                                <div className="flex gap-2">
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="flex-grow eaim-input p-3" />
                                    <button onClick={fetchPoem} className="eaim-btn-white px-4 rounded-xl font-bold">검색</button>
                                </div>
                                <div className="bg-white/10 rounded-2xl p-4 min-h-[200px]">
                                    {isAnalyzing ? <div className="text-center pt-10 font-hand">찾는 중...</div> : 
                                    <textarea value={readingPoem} onChange={e => setReadingPoem(e.target.value)} className="w-full h-64 bg-transparent outline-none font-hand text-lg leading-loose resize-none text-white" placeholder="시가 나타납니다."></textarea>}
                                </div>
                                <button onClick={() => setStep(2)} disabled={!readingPoem} className="w-full eaim-btn-white p-4 rounded-2xl font-bold shadow-lg">이 시로 수업 시작 👉</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-8 text-center">
                                <h2 className="text-2xl font-hand">2. 감정 색깔과 단어</h2>
                                <div className="flex justify-center gap-3 overflow-x-auto pb-4">{colors.map(c => <button key={c.name} onClick={() => setEmotionColor(c.name)} className={`w-10 h-10 flex-shrink-0 rounded-full border-4 ${emotionColor === c.name ? 'border-white scale-110 shadow-lg' : 'border-transparent opacity-60'}`} style={{backgroundColor: c.code}}></button>)}</div>
                                <div className="flex flex-wrap justify-center gap-2">{words.map(w => <button key={w} onClick={() => setEmotionWord(w)} className={`px-4 py-2 rounded-full font-hand text-lg border ${emotionWord === w ? 'bg-white text-indigo-700' : 'bg-white/10 text-white'}`}>{w}</button>)}</div>
                                <button onClick={() => setStep(3)} disabled={!emotionColor || !emotionWord} className="w-full eaim-btn-white p-4 rounded-2xl font-bold shadow-lg mt-4">다음 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-hand">3. 감정 관찰</h2>
                                <textarea value={situation} onChange={e => setSituation(e.target.value)} className="w-full eaim-input p-3 font-hand text-lg" placeholder="① 언제 느꼈나요?"></textarea>
                                <div className="flex gap-2 items-center">
                                    <select value={bodyPart} onChange={e => setBodyPart(e.target.value)} className="eaim-input p-2 font-hand text-lg bg-indigo-900/40"><option value="">부위</option><option value="머리">머리</option><option value="가슴">가슴</option><option value="배">배</option><option value="손발">손발</option></select>
                                    <input value={bodySensation} onChange={e => setBodySensation(e.target.value)} className="flex-grow eaim-input p-2 font-hand text-lg" placeholder="② 어떤 느낌?" />
                                </div>
                                <textarea value={appearance} onChange={e => setAppearance(e.target.value)} className="w-full eaim-input p-3 font-hand text-lg" placeholder="③ 모양, 소리, 냄새 등"></textarea>
                                <button onClick={() => setStep(4)} className="w-full eaim-btn-white p-4 rounded-2xl font-bold shadow-lg">다음 👉</button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6 text-center">
                                <h2 className="text-2xl font-hand">4. 감정 이름 짓기</h2>
                                <textarea value={relationship} onChange={e => setRelationship(e.target.value)} className="w-full eaim-input p-3 font-hand text-lg" placeholder="④ 이 감정과 나는 어떤 사이?"></textarea>
                                <input type="text" value={emotionName} onChange={e => setEmotionName(e.target.value)} className="w-full eaim-input p-4 font-hand text-2xl text-center" placeholder="⑤ 새 이름 (예: 싱고)" />
                                <button onClick={generatePoem} disabled={!emotionName} className="w-full bg-indigo-400 text-white p-4 rounded-2xl font-bold shadow-lg flex justify-center items-center gap-2"><span>AI 시인에게 맡기기</span> ✨</button>
                            </div>
                        )}

                        {step === 6 && (
                            <div className="space-y-6 text-center">
                                <h2 className="text-2xl font-hand">📖 완성된 나의 감정 시</h2>
                                <div className="bg-white/10 p-8 rounded-3xl min-h-[300px] text-left">
                                    {isAnalyzing ? <div className="text-center pt-10 font-hand">시를 짓는 중...</div> : <div className="whitespace-pre-wrap font-hand text-xl leading-relaxed">{finalResult}</div>}
                                </div>
                                {!isAnalyzing && (
                                    <div className="flex flex-col gap-3 print-hidden">
                                        <div className="flex gap-2">
                                            <button onClick={() => navigator.clipboard.writeText(finalResult).then(() => alert("복사됨"))} className="flex-1 bg-white/20 p-3 rounded-xl font-bold">복사</button>
                                            <button onClick={() => window.print()} className="flex-1 bg-white/20 p-3 rounded-xl font-bold">인쇄</button>
                                        </div>
                                        <button onClick={() => setStep(7)} className="w-full bg-pink-400 text-white p-4 rounded-2xl font-bold shadow-lg">💌 공감 편지 쓰기</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {step === 7 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-hand text-center">💌 친구에게 공감 편지</h2>
                                <input type="text" value={friendName} onChange={e => setFriendName(e.target.value)} className="w-full eaim-input p-3 font-hand text-lg" placeholder="친구 이름" />
                                <textarea value={friendPoem} onChange={e => setFriendPoem(e.target.value)} className="w-full eaim-input p-3 font-hand text-lg h-32" placeholder="친구의 시 붙여넣기"></textarea>
                                <button onClick={generateLetter} className="w-full eaim-btn-white p-4 rounded-2xl font-bold shadow-lg">AI 편지 도우미 ✍️</button>
                                {draftLetter && <div className="bg-white/10 p-6 rounded-3xl mt-4 whitespace-pre-wrap font-hand text-lg leading-relaxed">{draftLetter}</div>}
                                <button onClick={() => setStep(6)} className="w-full text-sm opacity-50">내 시로 돌아가기</button>
                            </div>
                        )}
                    </main>
                    <footer className="text-white/30 text-xs text-center mb-10">© 2026 EAIM Studio - Designed by Park Seong-ae</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KoreanEAIMApp />);
    </script>
</body>
</html>
