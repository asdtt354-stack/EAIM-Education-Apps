<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동지방 - EAIM 과학 수업</title>
<style>
  :root { --main-color:#22d3ee; --bg-dark:#07090c; --accent:#a855f7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg-dark); color:#fff; font-family:'Pretendard',-apple-system,sans-serif; min-height:100vh; }
  a { color:inherit; text-decoration:none; }
  .topbar { position:sticky; top:0; z-index:40; background:rgba(7,9,12,0.92); backdrop-filter:blur(10px); border-bottom:1px solid #1a1e24; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .crumb { font-size:0.78em; color:#888; } .crumb b{ color:#ccc; font-weight:600; }
  .hub-link { font-size:0.72em; color:#aaa; padding:6px 12px; border:1px solid #2c313a; border-radius:8px; }
  .hub-link:hover { border-color:var(--accent); color:#fff; }

  .hero { padding:56px 20px 20px; text-align:center; max-width:700px; margin:0 auto; }
  .hero .eyebrow { font-size:0.74em; font-weight:800; letter-spacing:2px; color:var(--main-color); text-transform:uppercase; margin-bottom:10px; }
  .hero h1 { font-size:clamp(1.9em,4.5vw,2.6em); margin:0 0 14px; background:linear-gradient(100deg,#fff 25%,#67e8f9 55%,var(--accent) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p.lead { color:#aaa; font-size:0.96em; line-height:1.75; }

  .about-card { max-width:620px; margin:26px auto 0; padding:0 20px; }
  .about-inner { background:rgba(34,211,238,0.07); border:1px solid rgba(34,211,238,0.25); border-radius:16px; padding:18px 22px; }
  .about-inner .a-title { font-size:0.85em; font-weight:800; color:var(--main-color); margin-bottom:8px; }
  .about-inner ul { margin:0; padding-left:18px; font-size:0.84em; color:#ccc; line-height:1.85; }

  .unit-wrap { max-width:820px; margin:44px auto 60px; padding:0 20px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (max-width:640px) { .unit-wrap { grid-template-columns:1fr; } }
  .ucard { display:flex; align-items:center; gap:14px; background:#0d0f14; border:1.5px solid #1a1e24; border-radius:16px; padding:16px 18px; transition:all .2s; }
  .ucard.ready:hover { border-color:var(--main-color); transform:translateY(-2px); }
  .ucard.pending { opacity:0.45; }
  .ucard .u-icon { font-size:1.6em; flex-shrink:0; width:42px; height:42px; display:flex; align-items:center; justify-content:center; background:#161a20; border-radius:12px; }
  .ucard .u-body { flex:1; min-width:0; }
  .ucard .u-title { font-size:0.94em; font-weight:800; color:#fff; margin-bottom:3px; }
  .ucard .u-desc { font-size:0.76em; color:#999; }
  .ucard .u-badge { font-size:0.66em; font-weight:800; padding:3px 8px; border-radius:6px; flex-shrink:0; white-space:nowrap; }
  .ucard.ready .u-badge { color:#22d3ee; background:rgba(34,211,238,0.14); }
  .ucard.pending .u-badge { color:#888; background:#161a20; }

  .ucard .u-links { display:flex; gap:6px; flex-shrink:0; }
  .ucard .u-links a { font-size:0.7em; font-weight:800; padding:6px 10px; border-radius:7px; text-align:center; }
  .ucard .u-links a.digital { color:#22d3ee; background:rgba(34,211,238,0.14); }
  .ucard .u-links a.paper { color:#fbbf24; background:rgba(251,191,36,0.14); }

  footer { text-align:center; padding:10px 20px 50px; color:#555; font-size:0.75em; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="crumb"><b>🧪 활동지방</b></div>
    <a class="hub-link" href="../index.html">← 처음으로</a>
  </div>

  <section class="hero">
    <div class="eyebrow">Activity Room</div>
    <h1>활동지방</h1>
    <p class="lead">수업 페이지와는 별개의 공간이다. 한 단원을 다 본 뒤 여기 와서 짧게 확인하면, 내가 어떤 개념을 헷갈려하는지 스스로 바로 확인할 수 있다.</p>
  </section>

  <div class="about-card">
    <div class="about-inner">
      <div class="a-title">📌 활동지방은 이렇게 다릅니다</div>
      <ul>
        <li>수업 페이지의 퀴즈와는 별개로, <b>단원 전체를 아우르는 짧은 확인 문제</b>로 구성된다.</li>
        <li>풀고 나면 <b>어느 개념 영역이 약한지</b> 바로 요약해서 보여준다.</li>
        <li>결과를 그 자리에서 <b>인쇄(PDF 저장)</b>할 수 있어 선생님께 제출하거나 참고 자료로 쓸 수 있다.</li>
      </ul>
    </div>
  </div>

  <div class="unit-wrap" id="unitWrap"></div>

  <footer>EAIM 과학 수업 · 활동지방</footer>

<script>
const UNITS = [
  { icon:'Ⅰ', title:'과학과 인류의 지속가능한 삶', desc:'준비중', digital:null, paper:null },
  { icon:'Ⅱ', title:'생물의 구성과 다양성', desc:'7개 소단원 · 문제은행 28문항', digital:'unit2-check.html', paper:'unit2-worksheet.html' },
  { icon:'Ⅲ', title:'열', desc:'준비중', digital:null, paper:null },
  { icon:'Ⅳ', title:'물질의 상태 변화', desc:'준비중', digital:null, paper:null },
  { icon:'Ⅴ', title:'힘의 작용', desc:'준비중', digital:null, paper:null },
  { icon:'Ⅵ', title:'기체의 성질', desc:'준비중', digital:null, paper:null },
  { icon:'Ⅶ', title:'태양계', desc:'준비중', digital:null, paper:null },
];
function render(){
  document.getElementById('unitWrap').innerHTML = UNITS.map(u => {
    const ready = !!u.digital;
    const links = ready
      ? `<div class="u-links"><a class="digital" href="${u.digital}">📱 디지털</a><a class="paper" href="${u.paper}">🖨️ 인쇄용</a></div>`
      : `<span class="u-badge">준비중</span>`;
    const inner = `<div class="u-icon">${u.icon}</div><div class="u-body"><div class="u-title">${u.title}</div><div class="u-desc">${u.desc}</div></div>${links}`;
    return `<div class="ucard ${ready?'ready':'pending'}">${inner}</div>`;
  }).join('');
}
render();
</script>
</body>
</html>
