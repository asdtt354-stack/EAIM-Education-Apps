<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 에임우주탐험대 v4.3 - 3D 입체 마스터</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #000; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        #canvas-container { flex: 1; background: radial-gradient(circle, #0a0a25 0%, #000 100%); cursor: pointer; position: relative; }
        #header-ui { position: absolute; top: 0; left: 0; width: 100%; padding: 25px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 100; }
        .btn-home { background: rgba(0,212,255,0.3); color: white; padding: 10px 25px; border-radius: 20px; border: 1px solid var(--main-color); pointer-events: auto; cursor: pointer; z-index: 110; transition: 0.3s; }
        #side-panel { width: 380px; min-width: 380px; background: rgba(10,10,25,0.98); border-left: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 200; overflow-y: auto; }
        .obs-info-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid var(--accent); font-size: 0.9em; }
        textarea { width: 100%; height: 100px; background: #161625; color: white; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .btn-analyze { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: var(--main-color); color: #000; }
        #ai-response { margin-top: 15px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; font-size: 0.95em; line-height: 1.7; border: 1px dashed #444; }
    </style>
</head>
<body>

<div id="main-view">
    <div id="header-ui">
        <div style="width: 150px;"></div>
        <div style="text-align: center; pointer-events: none;">
            <h1 style="color:var(--main-color); margin:0; font-size: 2.5em; text-shadow: 0 0 15px #00d4ff;">에임 우주 탐험대</h1>
            <p id="sub-msg" style="color:#aaa; margin-top: 5px; font-size: 1.1em;">입체감 넘치는 3D 행성을 클릭하여 정밀 관찰하세요!</p>
        </div>
        <button class="btn-home" onclick="location.reload()">☀️ 태양계 복귀</button>
    </div>
    <div id="canvas-container"></div>
</div>

<div id="side-panel">
    <h2 style="color:var(--main-color); margin-top: 0;">🔭 실시간 관측 로그</h2>
    <div class="obs-info-box" id="observatory-data"></div>
    <textarea id="student-answer" placeholder="행성의 입체적인 표면 특징을 기록하세요..."></textarea>
    <button class="btn-analyze" onclick="callGemini25Flash()">AI 가이드 분석 (Engine 2.5)</button>
    <div id="ai-response"></div>
</div>

<script>
    const API_KEY = "발급받으신_API_키를_넣으세요"; 
    let isObserving = false, currentTarget = null;

    const planetsData = {
        mercury: { name: "수성", dist: 150, size: 10, speed: 0.04, color: 0xaaaaaa, obs: "라 실라 천문대", texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg" },
        venus: { name: "금성", dist: 220, size: 15, speed: 0.015, color: 0xffcc33, obs: "마우나케아 천문대", texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg" },
        earth: { name: "지구", dist: 320, size: 18, speed: 0.01, color: 0x2233ff, obs: "보현산 천문대", texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg" },
        mars: { name: "화성", dist: 420, size: 14, speed: 0.008, color: 0xff4400, obs: "우티 전파 천문대", texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg" },
        jupiter: { name: "목성", dist: 600, size: 45, speed: 0.004, color: 0xffaa88, obs: "팔로마 천문대", texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg" },
        saturn: { name: "토성", dist: 800, size: 38, speed: 0.002, color: 0xffdd88, obs: "사이딩 스프링 천문대", texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png" }
    };

    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // ★ 조명 재설정 (입체감 복구 포인트) ★
    // 전체 밝기는 유지하되, 측면 조명을 추가하여 행성의 '그림자'와 '질감'이 살아나게 했습니다.
    scene.add(new THREE.AmbientLight(0xffffff, 1.2)); // 기본 밝기 낮춤
    const mainLight = new THREE.PointLight(0xffffff, 2.5, 5000); // 중앙 태양 빛
    scene.add(mainLight);
    
    // 입체감을 위한 보조광 (대각선 위에서 비춤)
    const sideLight = new THREE.DirectionalLight(0xffffff, 1.0);
    sideLight.position.set(50, 100, 50);
    scene.add(sideLight);

    const sun = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    const meshes = {}, loader = new THREE.TextureLoader();
    Object.keys(planetsData).forEach(key => {
        const p = planetsData[key];
        const mat = new THREE.MeshStandardMaterial({ 
            map: loader.load(p.texture), 
            emissive: new THREE.Color(p.color), 
            emissiveIntensity: 0.3 // 발광을 낮춰서 조명에 의한 3D 질감이 보이게 함
        });
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), mat);
        m.userData = { id: key, name: p.name };
        meshes[key] = m;
        scene.add(m);

        // 궤도 라인
        const orbitGeom = new THREE.RingGeometry(p.dist - 1, p.dist + 1, 256);
        const orbitMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const orbit = new THREE.Mesh(orbitGeom, orbitMat);
        orbit.rotation.x = Math.PI/2;
        scene.add(orbit);
    });

    camera.position.set(0, 1500, 2500);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;
        if (!isObserving) {
            Object.keys(meshes).forEach(key => {
                const p = planetsData[key], m = meshes[key];
                // ★ 공전 속도 광속 상향 (50 -> 100) ★
                m.position.x = Math.cos(time * p.speed * 100) * p.dist;
                m.position.z = Math.sin(time * p.speed * 100) * p.dist;
                m.rotation.y += 0.05; // 자전도 시원하게
            });
        } else {
            meshes[currentTarget].rotation.y += 0.005;
        }
        renderer.render(scene, camera);
    }
    animate();

    container.onclick = (e) => {
        if(isObserving) return;
        const mouse = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(meshes));
        if(intersects.length > 0) startObservation(intersects[0].object.userData.id);
    };

    function startObservation(id) {
        isObserving = true; currentTarget = id;
        const p = planetsData[id];
        document.getElementById('header-ui').style.display = 'none';
        document.getElementById('side-panel').style.display = 'flex';
        document.getElementById('observatory-data').innerHTML = `<strong>📍 관측 지점:</strong> ${p.obs}<br><strong>🔭 관측 대상:</strong> ${p.name} (NASA 3D Engine)`;
        
        meshes[id].position.set(0,0,0);
        
        // ★ 카메라 줌 보정 포인트 ★
        // 행성이 커진 만큼 카메라를 p.size의 5배 거리로 떨어뜨려 전체가 보이게 함
        camera.position.set(0, p.size * 1.5, p.size * 4); 
        camera.lookAt(0, 0, 0);
    }

    async function callGemini25Flash() {
        const ans = document.getElementById('student-answer').value;
        if(!ans) return alert("내용을 입력하세요!");
        document.getElementById('ai-response').innerHTML = "📡 Engine 2.5 Flash가 분석 데이터를 수신 중입니다...";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생의 관측 답변 "${ans}"에 대해 칭찬하고 보완할 점을 말해줘.` }] }] }) });
            const data = await res.json();
            document.getElementById('ai-response').innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
        } catch(e) { document.getElementById('ai-response').innerHTML = "❌ 엔진 연동 오류"; }
    }
</script>
</body>
</html>
