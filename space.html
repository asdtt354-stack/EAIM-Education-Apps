<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM 에임우주탐험대 - v2.5</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #020205; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #side-panel { width: 320px; min-width: 320px; background: #0a0a15; border-right: 1px solid #333; display: none; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        #canvas-container { flex-grow: 1; background: radial-gradient(circle, #101025 0%, #000 100%); cursor: crosshair; }
        #interaction-area { height: 35%; background: #080810; padding: 20px; border-top: 1px solid #222; overflow-y: auto; display: none; }

        .btn-home { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white; border: 1px solid #555; padding: 10px 20px; border-radius: 20px; cursor: pointer; z-index: 100; transition: 0.3s; }
        .btn-home:hover { background: var(--main-color); color: black; }
        
        #intro-overlay { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 5; }
        #intro-overlay h1 { font-size: 2.5em; margin: 0; color: var(--main-color); text-shadow: 0 0 15px var(--main-color); }
        
        /* 행성 라벨 */
        .planet-label { position: absolute; background: rgba(0,0,0,0.7); color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <h1>에임 우주 탐험대</h1>
    <p style="color: #888;">탐사할 행성을 터치하거나 클릭하세요</p>
</div>

<button class="btn-home" onclick="location.reload()">☀️ 태양계 복귀</button>

<div id="side-panel">
    <h2 id="side-title" style="color:var(--main-color);">🔭 탐사 설정</h2>
    <div id="obs-info" style="font-size: 0.85em; color: #2ecc71; margin-bottom: 20px;"></div>
    
    <div id="log-list" style="flex-grow:1; border-top:1px solid #333; padding-top:15px; overflow-y:auto;">
        <h3 style="font-size: 1em;">📖 나의 탐사 기록</h3>
        <div id="log-container"></div>
    </div>
</div>

<div id="main-view">
    <div id="canvas-container"></div>
    <div id="interaction-area">
        <h3 id="target-title">관측 기록실</h3>
        <p id="question" style="font-size:0.9em; color:#aaa; margin-bottom: 15px;"></p>
        <textarea id="student-answer" style="width:100%; height:80px; background:#161625; color:white; border:1px solid #333; padding:10px; border-radius:8px;"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="runGemini25()" style="flex:1; padding:12px; background:var(--main-color); border:none; border-radius:6px; font-weight:bold;">AI 분석</button>
            <button onclick="saveToLocal()" style="flex:1; padding:12px; background:#2ecc71; border:none; border-radius:6px; font-weight:bold; color:white;">기록 저장</button>
            <button id="img-save-btn" onclick="exportImage()" style="flex:0.5; display:none; background:#f39c12; border:none; border-radius:6px; font-weight:bold;">📷 사진</button>
        </div>
        <div id="ai-response" style="margin-top:15px; line-height:1.6; font-size:0.95em;"></div>
    </div>
</div>

<script>
    const planets = {
        mercury: { name: "수성", dist: 20, size: 1.0, speed: 0.04, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg", obs: "라 실라 천문대" },
        venus: { name: "금성", dist: 30, size: 1.8, speed: 0.015, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg", obs: "마우나케아 천문대" },
        earth: { name: "지구", dist: 45, size: 2.0, speed: 0.01, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg", obs: "보현산 천문대" },
        mars: { name: "화성", dist: 60, size: 1.5, speed: 0.008, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg", obs: "우티 전파 천문대" },
        jupiter: { name: "목성", dist: 90, size: 5.0, speed: 0.004, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg", obs: "팔로마 천문대" },
        saturn: { name: "토성", dist: 125, size: 4.2, speed: 0.002, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png", obs: "사이딩 스프링 천문대" },
        moon: { name: "달", size: 0.5, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg", obs: "보현산 천문대" }
    };

    let isObserving = false;
    let currentTarget = null;

    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // 태양 (크게 배치)
    const sun = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
    scene.add(sun);

    const light = new THREE.PointLight(0xffffff, 2, 500);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x333333));

    const planetMeshes = {};
    const loader = new THREE.TextureLoader();

    Object.keys(planets).forEach(key => {
        if(key === 'moon') return;
        const p = planets[key];
        const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(p.size, 32, 32),
            new THREE.MeshStandardMaterial({ map: loader.load(p.texture) })
        );
        mesh.userData = { id: key, name: p.name };
        planetMeshes[key] = mesh;
        scene.add(mesh);
    });

    // 초기 카메라 위치 (전체가 잘 보이도록 45도 각도)
    camera.position.set(0, 100, 180);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;

        if (!isObserving) {
            Object.keys(planetMeshes).forEach(key => {
                const p = planets[key];
                const mesh = planetMeshes[key];
                mesh.position.x = Math.cos(time * p.speed * 10) * p.dist;
                mesh.position.z = Math.sin(time * p.speed * 10) * p.dist;
                mesh.rotation.y += 0.01;
            });
        } else {
            planetMeshes[currentTarget].rotation.y += 0.005;
        }
        renderer.render(scene, camera);
    }
    animate();

    // 클릭 이벤트
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    container.onclick = (e) => {
        if(isObserving) return;
        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(planetMeshes));
        
        if(intersects.length > 0) {
            startObservation(intersects[0].object.userData.id);
        }
    };

    function startObservation(id) {
        isObserving = true;
        currentTarget = id;
        const p = planets[id];

        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('side-panel').style.display = 'flex';
        document.getElementById('interaction-area').style.display = 'block';
        
        // 행성을 화면 중앙으로 가져오고 크게 확대
        Object.values(planetMeshes).forEach(m => m.visible = false);
        planetMeshes[id].visible = true;
        planetMeshes[id].position.set(0, 0, 0);
        
        camera.position.set(0, 0, p.size * 3);
        camera.lookAt(0, 0, 0);

        document.getElementById('obs-info').innerText = `📍 실시간 관측지: ${p.obs}`;
        document.getElementById('target-title').innerText = `${p.name} 정밀 관측`;
        document.getElementById('question').innerText = `Q: ${p.name}의 외형적 특징을 교과서 내용을 바탕으로 설명해볼까요?`;
        
        if(id === 'earth') { // 지구가 선택되면 달 버튼 활성화 같은 추가 로직 가능
            document.getElementById('img-save-btn').style.display = 'block';
        }
    }

    function exportImage() {
        const link = document.createElement('a');
        link.download = `EAIM_Space_${planets[currentTarget].name}.png`;
        link.href = renderer.domElement.toDataURL();
        link.click();
    }

    // Gemini API (2.5 버전 환경용)
    const API_KEY = "여기에_성공하셨던_API_키를_넣으세요"; 
    async function runGemini25() {
        const ans = document.getElementById('student-answer').value;
        const resp = document.getElementById('ai-response');
        if(!ans) return alert("답변을 먼저 적어주세요.");
        resp.innerHTML = "🛰️ 에임 AI가 관측 데이터를 분석 중입니다...";
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생의 관측 답변에 대해 친절하게 피드백해줘: ${ans}` }] }] })
            });
            const data = await res.json();
            resp.innerHTML = `✨ <b>AI 피드백:</b><br>${data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>')}`;
        } catch(e) { resp.innerHTML = "API 연결을 확인해주세요."; }
    }

    function saveToLocal() {
        const log = { target: planets[currentTarget].name, ans: document.getElementById('student-answer').value, time: new Date().toLocaleString() };
        let logs = JSON.parse(localStorage.getItem('eaim_logs_final') || "[]");
        logs.unshift(log);
        localStorage.setItem('eaim_logs_final', JSON.stringify(logs));
        displayLogs();
        alert("관측 일지에 저장되었습니다!");
    }

    function displayLogs() {
        const container = document.getElementById('log-container');
        const logs = JSON.parse(localStorage.getItem('eaim_logs_final') || "[]");
        container.innerHTML = logs.map(l => `<div style="background:#1a1a2e; padding:10px; border-radius:6px; margin-bottom:10px; border-left:3px solid #00d4ff;"><small>${l.time}</small><br><b>${l.target} 탐사</b><br>${l.ans.substring(0,30)}...</div>`).join('');
    }

    window.onload = displayLogs;
</script>

</body>
</html>
