<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 일상 과학 탐험대</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #334155; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 3rem; box-shadow: 0 20px 50px rgba(0,0,0,0.08); border: 2px solid white; width: 100%; max-width: 550px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; transition: 0.3s; }
        .eaim-input:focus { border-color: #818cf8; outline: none; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }
        textarea.eaim-input { text-align: left; resize: none; }
        .eaim-btn-main { background: #6366f1 !important; color: white !important; border-radius: 1.5rem; padding: 1.1rem; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        .eaim-btn-main:hover:not(:disabled) { background: #4f46e5 !important; transform: scale(1.02); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body { background: white; color: black; display: block; }
            .print-hidden { display: none !important; }
            .eaim-card { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; max-width: none; }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ScienceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [scienceUnit, setScienceUnit] = useState('');
            const [emotionKeyword, setEmotionKeyword] = useState('');
            
            const [dailyScenario, setDailyScenario] = useState('');
            
            const [quizAnswer, setQuizAnswer] = useState('');
            const [quizReason, setQuizReason] = useState('');
            const [scienceHint, setScienceHint] = useState('');
            const [isLoadingHint, setIsLoadingHint] = useState(false);
            
            const [feedbackReport, setFeedbackReport] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_sci_v2');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            // ⚡ 속도 최적화 및 튼튼한 에러 방어 코드가 적용된 API 호출 함수
            const callGemini = async (prompt, customConfig = {}) => {
                const cleanKey = apiKey.trim();
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                temperature: customConfig.temperature ?? 0.4, 
                                topK: customConfig.topK ?? 20,
                                maxOutputTokens: customConfig.maxTokens ?? 2000
                            }
                        })
                    });
                    
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || '연결 오류가 발생했습니다.');

                    // 💡 안전장치: AI가 안전 문제로 차단하거나 빈 응답을 줄 때 앱이 뻗지 않도록 방어
                    const candidate = data.candidates?.[0];
                    if (!candidate) throw new Error('AI가 응답을 생성하지 못했습니다. 키워드를 살짝 바꿔보세요.');
                    if (candidate.finishReason === 'SAFETY') throw new Error('안전 필터에 의해 이야기가 차단되었습니다. 다른 단어로 시도해주세요.');
                    
                    const text = candidate.content?.parts?.[0]?.text;
                    if (!text) throw new Error('응답 텍스트를 읽을 수 없습니다.');

                    return text;
                } catch (error) {
                    console.error("API 호출 에러:", error);
                    throw error;
                }
            };

            const generateScenario = async () => {
                if (!apiKey) return alert('API 키를 확인해주세요.');
                if (!scienceUnit || !emotionKeyword) return alert('과학 단원과 감정 키워드를 모두 입력해주세요.');
                
                setIsAnalyzing(true);
                setDailyScenario('일상 속 이야기를 구상 중입니다... 💭');
                setFeedbackReport(''); setQuizAnswer(''); setQuizReason(''); setScienceHint('');
                
                // 💡 디렉터님의 제안을 완벽히 반영한 4단계 스토리텔링 프롬프트
                const prompt = `당신은 중학교 과학 선생님입니다. 학생이 입력한 과학 단원 '${scienceUnit}'과 감정 '${emotionKeyword}'을 연결하여 일상 속 에피소드를 만들어주세요.
                
                다음 4가지 순서와 형식을 엄격하게 지켜서 작성해주세요:
                
                [일어난 상황]
                (중학생이 일상에서 흔히 겪을 법한 문제 상황을 실감나게 2~3문장으로 묘사)
                
                [왜 그런 상황이 일어났을까?]
                (이 상황 속에 숨겨진 과학적 원리를 호기심 있게 발견하는 과정 2문장)
                
                [주인공의 마음]
                (이때 주인공이 느끼는 '${emotionKeyword}' 감정을 깊이 있게 묘사 2문장)
                
                [문제 해결 퀴즈]
                (이 상황을 과학적으로 해결하거나 이해하기 위한 4지 선다형 퀴즈. 1, 2, 3, 4번 보기 포함)
                
                안내말이나 부연 설명 없이 위 괄호[ ] 제목 형식을 그대로 유지하며 바로 출력해주세요.`;

                try {
                    const text = await callGemini(prompt, { temperature: 0.6 });
                    setDailyScenario(text);
                    setStep(2);
                } catch (e) { 
                    alert(`이야기 생성 실패: ${e.message}`); 
                    setStep(1); 
                } 
                finally { setIsAnalyzing(false); }
            };

            const getHint = async () => {
                setIsLoadingHint(true);
                const prompt = `선생님으로서 다음 상황에 숨겨진 '${scienceUnit}' 원리에 대한 힌트를 딱 1문장으로만 다정하게 주세요. 정답을 직접 말하지는 마세요: ${dailyScenario}`;
                try {
                    const text = await callGemini(prompt, { temperature: 0.2, maxTokens: 150 });
                    setScienceHint(text);
                } catch (e) { setScienceHint('앗, 힌트를 불러오는 데 실패했어요. 잠시 후 다시 눌러보세요.'); }
                finally { setIsLoadingHint(false); }
            };

            const solveQuiz = async () => {
                if (!quizAnswer || !quizReason) return alert('퀴즈 정답과 그렇게 생각한 이유를 모두 적어주세요!');
                setIsAnalyzing(true); setStep(3);
                
                const prompt = `학생이 방금 전의 퀴즈 정답으로 '${quizAnswer}'번을 선택했고, 그 이유와 자신의 마음을 '${quizReason}'라고 적었습니다.
                
                다음 두 가지를 포함하여 따뜻하고 다정한 중학교 선생님의 말투로 피드백을 작성해주세요.
                1. [과학의 시선]: 학생이 고른 정답이 맞는지 알려주고, '${scienceUnit}'의 과학적 원리를 일상과 연결해 쉽게 설명해주세요.
                2. [마음의 시선]: 학생이 적은 이유를 바탕으로 '${emotionKeyword}' 감정에 깊이 공감해주고, 마음을 다독이는 사회정서학습(SEL)적 위로와 응원을 남겨주세요.`;
                
                try {
                    const text = await callGemini(prompt, { temperature: 0.5 });
                    setFeedbackReport(text);
                } catch (e) { setFeedbackReport('피드백 작성 중 오류가 발생했습니다.'); } 
                finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="text-center space-y-6 animate-fadeIn">
                            <h2 className="font-bold text-2xl font-hand text-indigo-700">EAIM 일상 과학 탐험대</h2>
                            <p className="text-sm text-slate-500">과학으로 일상의 문제를 풀고, 마음을 나눠요.</p>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="eaim-input" placeholder="발급받은 API 키 입력" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_sci_v2', apiKey.trim()); setStep(1); }} className="eaim-btn-main shadow-lg">수업 준비 완료 🚀</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div className="space-y-6">
                            <header className="flex justify-between items-center mb-6 print-hidden border-b border-indigo-100 pb-3">
                                <span className="font-bold text-indigo-600 font-hand text-xl">EAIM 일상 과학 탐험대 🔬</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key_sci_v2'); setStep(0); window.location.reload(); }} className="text-xs text-slate-400 underline">키 재설정</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-6 animate-fadeIn print-hidden">
                                    <div className="text-center">
                                        <h2 className="text-2xl font-hand text-slate-800 mb-2">일상 속 과학과 마음 발견 🔍</h2>
                                        <p className="text-sm text-slate-500">오늘 배울 과학 원리와, 나누고 싶은 감정을 적어주세요.</p>
                                    </div>
                                    <input type="text" value={scienceUnit} onChange={e => setScienceUnit(e.target.value)} className="eaim-input" placeholder="과학 단원 (예: 기체의 압력)" />
                                    <input type="text" value={emotionKeyword} onChange={e => setEmotionKeyword(e.target.value)} className="eaim-input" placeholder="감정 키워드 (예: 속상함, 고마움)" />
                                    <button onClick={generateScenario} disabled={isAnalyzing} className="eaim-btn-main">{isAnalyzing ? "이야기 구상 중..." : "일상 퀴즈 만들기 ✨"}</button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 animate-fadeIn print-hidden">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">어떤 일이 일어났을까요? 🧐</h2>
                                    
                                    {/* 일상 이야기 및 퀴즈 출력 영역 */}
                                    <div className="bg-white p-6 rounded-3xl border-2 border-indigo-200 font-hand text-lg leading-relaxed shadow-sm whitespace-pre-wrap">
                                        {dailyScenario}
                                    </div>

                                    <div className="space-y-4 bg-indigo-50/50 p-5 rounded-3xl border border-indigo-100">
                                        <div className="flex justify-between items-center ml-1">
                                            <h3 className="font-bold text-indigo-600">나의 생각 적어보기</h3>
                                            {!scienceHint && <button onClick={getHint} disabled={isLoadingHint} className="text-xs bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full font-bold shadow hover:bg-yellow-300 transition-colors">💡 선생님 찬스</button>}
                                        </div>
                                        
                                        {scienceHint && <div className="bg-yellow-50 p-3 rounded-2xl border border-yellow-200 text-sm font-hand text-yellow-800 animate-fadeIn">👩‍🏫 선생님: {scienceHint}</div>}
                                        
                                        <div className="flex gap-2">
                                            <input type="number" value={quizAnswer} onChange={e => setQuizAnswer(e.target.value)} className="eaim-input w-24 text-center font-bold text-indigo-700" placeholder="정답 번호" min="1" max="4" />
                                            <textarea value={quizReason} onChange={e => setQuizReason(e.target.value)} className="eaim-input flex-1 h-20 text-sm" placeholder="왜 그렇게 생각했나요? 이때 주인공의 마음은 어땠을지 함께 적어보세요."></textarea>
                                        </div>
                                    </div>
                                    
                                    <button onClick={solveQuiz} disabled={!quizAnswer || !quizReason || isAnalyzing} className="eaim-btn-main mt-6">{isAnalyzing ? "선생님이 피드백을 적는 중..." : "선생님께 제출하기 📝"}</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6 animate-fadeIn print-area">
                                    <h2 className="text-3xl font-hand text-center text-indigo-600">선생님의 다정한 피드백 💌</h2>
                                    
                                    <div className="bg-white p-8 rounded-3xl border-2 border-indigo-200 whitespace-pre-wrap font-hand text-xl leading-relaxed shadow-sm">
                                        {isAnalyzing ? "피드백을 작성하고 있습니다..." : feedbackReport}
                                    </div>
                                    
                                    <div className="flex gap-3 print-hidden">
                                        <button onClick={() => window.print()} className="flex-1 eaim-btn-main bg-slate-400 hover:bg-slate-500 text-sm">🖨️ 인쇄 / 저장</button>
                                        <button onClick={() => { setStep(1); setFeedbackReport(''); setQuizAnswer(''); setQuizReason(''); setScienceHint(''); setDailyScenario(''); }} className="flex-[2] eaim-btn-main bg-indigo-500 hover:bg-indigo-600 text-sm">새로운 이야기 탐험하기 🚀</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScienceEAIMApp />);
    </script>
</body>
</html>
