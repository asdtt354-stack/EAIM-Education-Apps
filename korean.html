<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 감정 시인 Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .font-serif { font-family: 'Gowun Batang', serif; }
        .eaim-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(15px); border-radius: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.1); border: 1px solid white; width: 100%; max-width: 600px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 1px solid #d1d5db; border-radius: 1rem; padding: 1rem; background: white !important; outline: none; transition: 0.3s; }
        .eaim-btn-main { background: #be185d !important; color: white !important; border-radius: 1rem; padding: 1.1rem; font-weight: bold; width: 100%; transition: 0.3s; border: none; cursor: pointer; }
        .eaim-btn-main:hover { background: #9d174d !important; transform: translateY(-2px); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media print { .no-print { display: none !important; } .eaim-card { box-shadow: none !important; border: 1px solid #eee !important; width: 100% !important; max-width: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            // 데이터 설정
            const emotionWords = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '신나는', '포근한'];
            const colorPalette = [
                {name:'빨강', code:'#EF4444'}, {name:'주황', code:'#F97316'}, {name:'노랑', code:'#FBBF24'}, 
                {name:'초록', code:'#34D399'}, {name:'파랑', code:'#3B82F6'}, {name:'보라', code:'#8B5CF6'},
                {name:'분홍', code:'#F472B6'}, {name:'검정', code:'#1F2937'}, {name:'하양', code:'#F9FAFB'}
            ];

            // 상태 관리
            const [searchQuery, setSearchQuery] = useState('윤동주 서시');
            const [foundPoem, setFoundPoem] = useState('');
            const [poemImpression, setPoemImpression] = useState('');
            const [myEmotion, setMyEmotion] = useState('');
            const [myColor, setMyColor] = useState('');
            const [mySituation, setMySituation] = useState('');
            const [myBody, setMyBody] = useState('');
            const [newEmotionName, setNewEmotionName] = useState('');
            const [finalPoem, setFinalPoem] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_kor_pro');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const handleSearchPoem = async () => {
                setIsAnalyzing(true);
                try {
                    const text = await callGemini(`'${searchQuery}' 시의 전문을 정확하게 찾아주세요. 제목과 시인 이름을 포함해 정중하게 보여주세요.`);
                    setFoundPoem(text);
                    setStep(2);
                } catch (e) { alert('시를 찾지 못했습니다.'); } finally { setIsAnalyzing(false); }
            };

            const handleCreatePoem = async () => {
                if(!myEmotion || !myColor || !newEmotionName) return alert('감정과 색깔, 새 이름을 모두 정해주세요!');
                setIsAnalyzing(true);
                setStep(5);
                try {
                    const poemText = await callGemini(`학생이 읽은 시의 느낌('${poemImpression}')과 학생의 감정(단어:${myEmotion}, 색깔:${myColor}, 상황:${mySituation}, 신체:${myBody})을 융합한 시를 지어줘. 감정의 새 이름 '${newEmotionName}'을 제목이나 마지막에 꼭 넣어줘.`);
                    setFinalPoem(poemText);
                    const feedbackText = await callGemini(`위 시를 쓴 학생에게 SEL 교사로서 따뜻한 응원의 편지를 3문장 써줘. '${myEmotion}'을 느낀 학생의 마음을 다정하게 보듬어줘.`);
                    setTeacherFeedback(feedbackText);
                } catch (e) { alert('오류 발생'); setStep(4); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="space-y-6 text-center animate-fadeIn">
                            <h2 className="text-2xl font-bold text-pink-800">EAIM 감정 시인 스튜디오</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="eaim-input text-center" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_kor_pro', apiKey.trim()); setStep(1); }} className="eaim-btn-main shadow-lg">작가실 입장</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div className="space-y-6">
                            <header className="flex justify-between items-center border-b pb-3 no-print font-hand">
                                <span className="font-bold text-pink-700 text-xl">감정 시인 Pro 📖</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key_kor_pro'); window.location.reload(); }} className="text-[10px] text-gray-400 underline">RESET</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="text-center"><h2 className="text-xl font-bold">1. 영감 얻기</h2><p className="text-sm text-gray-500">마음을 열어줄 시를 검색해보세요.</p></div>
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="eaim-input" placeholder="시인이나 시 제목" />
                                    <button onClick={handleSearchPoem} disabled={isAnalyzing} className="eaim-btn-main">{isAnalyzing ? "시를 찾는 중..." : "시 불러오기 ✨"}</button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="bg-stone-50 p-6 rounded-2xl border border-stone-200 shadow-inner max-h-60 overflow-y-auto">
                                        <pre className="font-serif text-sm leading-loose whitespace-pre-wrap">{foundPoem}</pre>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="font-bold text-pink-800 text-sm ml-1">💬 이 시를 읽고 어떤 느낌이 들었나요?</label>
                                        <textarea value={poemImpression} onChange={e => setPoemImpression(e.target.value)} className="eaim-input h-20 text-sm" placeholder="시를 읽은 뒤 떠오르는 느낌을 적어보세요."></textarea>
                                    </div>
                                    <button onClick={() => setStep(3)} disabled={!poemImpression} className="eaim-btn-main">내 감정 분석하기 👉</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-5 animate-fadeIn">
                                    <div className="text-center"><h2 className="text-xl font-bold">2. 내 마음 해부하기</h2></div>
                                    
                                    {/* 감정 단어 클릭 선택 */}
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold text-gray-400 ml-1">지금 내 감정은?</label>
                                        <div className="flex flex-wrap gap-2">
                                            {emotionWords.map(w => (
                                                <button key={w} onClick={() => setMyEmotion(w)} className={`px-3 py-1.5 rounded-full text-xs transition-all ${myEmotion === w ? 'bg-pink-600 text-white shadow-md scale-105' : 'bg-white border border-gray-200 text-gray-500'}`}>{w}</button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 감정 색깔 클릭 선택 */}
                                    <div className="space-y-2">
                                        <label className="text-xs font-bold text-gray-400 ml-1">이 감정의 색깔은?</label>
                                        <div className="flex flex-wrap gap-3">
                                            {colorPalette.map(c => (
                                                <button key={c.name} onClick={() => setMyColor(c.name)} style={{backgroundColor: c.code}} className={`w-8 h-8 rounded-full border-2 transition-all ${myColor === c.name ? 'ring-4 ring-pink-200 border-pink-600 scale-110' : 'border-white shadow-sm'}`} title={c.name}></button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <input type="text" value={mySituation} onChange={e => setMySituation(e.target.value)} className="eaim-input text-xs" placeholder="언제 이런 기분이 드나요? (예: 시험을 망쳤을 때)" />
                                        <input type="text" value={myBody} onChange={e => setMyBody(e.target.value)} className="eaim-input text-xs" placeholder="그때 내 몸은 어때요? (예: 어깨가 무거워요)" />
                                        <input type="text" value={newEmotionName} onChange={e => setNewEmotionName(e.target.value)} className="eaim-input font-bold border-pink-300 text-sm" placeholder="✨ 이 감정에게 지어줄 새로운 이름" />
                                    </div>
                                    
                                    <button onClick={handleCreatePoem} className="eaim-btn-main bg-gradient-to-r from-pink-700 to-rose-700">시 완성하고 답장 받기 🪄</button>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-6 animate-fadeIn pb-10">
                                    {isAnalyzing ? (
                                        <div className="text-center py-20">
                                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-700 mx-auto mb-4"></div>
                                            <p className="text-pink-700 font-hand text-xl italic">당신의 마음을 시로 엮고 있습니다...</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-6">
                                            <div className="bg-white p-8 rounded-[2rem] border-2 border-pink-100 shadow-sm text-center">
                                                <h3 className="text-pink-800 font-hand text-2xl mb-6">나의 감정 시</h3>
                                                <pre className="font-serif text-lg leading-loose whitespace-pre-wrap">{finalPoem}</pre>
                                            </div>
                                            <div className="bg-pink-50 p-6 rounded-3xl border-l-8 border-pink-400 relative">
                                                <div className="absolute -top-3 left-6 bg-pink-400 text-white px-3 py-0.5 rounded-full text-[10px] font-bold">👩‍🏫 선생님의 마음 편지</div>
                                                <div className="font-hand text-lg text-pink-900 leading-relaxed mt-2 whitespace-pre-wrap">{teacherFeedback}</div>
                                            </div>
                                            <div className="flex gap-2 no-print">
                                                <button onClick={() => window.print()} className="flex-1 bg-stone-800 text-white p-4 rounded-xl font-bold">🖨️ 인쇄하기</button>
                                                <button onClick={() => setStep(1)} className="flex-1 bg-pink-100 text-pink-700 p-4 rounded-xl font-bold border border-pink-200">다시 쓰기</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
