<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 앙상블</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(39, 39, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(82, 82, 91, 0.5); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const EnsembleApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [songTitle, setSongTitle] = useState('선물 - 멜로망스');
            const [parsedData, setParsedData] = useState({
                intro: '', originalChord: '', drum: '', bass: '', guitar: '', harmKey: '', melKey: ''
            });

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_ensemble');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key_ensemble', apiKey.trim());
                setStep(1);
            };

            const extractSection = (text, sectionName) => {
                const regex = new RegExp(`\\[${sectionName}\\](.*?)(?=\\[|$)`, 's');
                const match = text.match(regex);
                return match ? match[1].trim() : '데이터 분석 실패';
            };

            const analyzeSong = async () => {
                if(!songTitle) return alert("곡 제목을 입력해주세요.");
                setIsAnalyzing(true);
                
                const prompt = `당신은 천재적인 음악 편곡가입니다.
                곡: ${songTitle}
                핵심 화성을 분석하여 아래 5파트로 '화성 압축 편곡'을 수행하세요. 모든 코드명 뒤에는 반드시 한글 계이름을 괄호안에 적어주세요. (예: C(도), Am(라), G5(솔+레))

                [곡 소개] 이 곡이 학급 합주(앙상블)에 어울리는 감성적 이유 1문장
                [원곡 코드] 하이라이트 부분의 실제 원곡 코드 진행
                [드럼] 연주하기 쉬운 기본 리듬 가이드 (예: 8비트 고고, 셔플 등)
                [베이스] 오직 근음(Root)과 한글 계이름 (초보자용)
                [통기타] 파워코드(근음+5음) 조합과 한글 계이름
                [화성 건반] 코드의 성격을 결정하는 핵심 2음(근음+3음)과 한글 계이름
                [멜로디 건반] 시작 계이름과 학생들을 위한 연주 꿀팁`;

                try {
                    const cleanKey = apiKey.trim();
                    // 💡 최신 2.0 엔진 + v1beta 통신망 적용 완료
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cleanKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                    const text = data.candidates[0].content.parts[0].text;
                    
                    setParsedData({
                        intro: extractSection(text, '곡 소개'),
                        originalChord: extractSection(text, '원곡 코드'),
                        drum: extractSection(text, '드럼'),
                        bass: extractSection(text, '베이스'),
                        guitar: extractSection(text, '통기타'),
                        harmKey: extractSection(text, '화성 건반'),
                        melKey: extractSection(text, '멜로디 건반')
                    });
                    setStep(2);
                } catch (e) { alert('분석 중 오류가 발생했습니다: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-zinc-900 shadow-2xl flex flex-col relative overflow-hidden">
                    <header className="bg-zinc-950 p-4 flex justify-between items-center shadow-lg border-b border-zinc-800 z-10">
                        <h1 className="text-xl font-title tracking-wider text-zinc-100 italic">EAIM 앙상블</h1>
                        {step > 0 && (
                            <button onClick={() => { localStorage.removeItem('gemini_api_key_ensemble'); setStep(0); window.location.reload(); }} className="text-xs bg-zinc-800 text-zinc-400 px-3 py-1.5 rounded-md underline">키 재설정</button>
                        )}
                    </header>

                    <main className="flex-grow p-5 overflow-y-auto pb-24 relative z-0">
                        {step === 0 && (
                            <div className="space-y-6 py-10 animate-fadeIn">
                                <h2 className="text-2xl font-bold text-cyan-400 font-title text-center">🔌 앰프 전원 연결</h2>
                                <p className="text-zinc-400 text-sm text-center">지능형 화성 분석을 위해 API 키를 연결해주세요.</p>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-zinc-800 border border-zinc-700 p-4 rounded-xl text-white outline-none focus:border-cyan-500 transition-all text-center" />
                                <button onClick={saveApiKey} className="w-full bg-cyan-600 text-white p-4 rounded-xl font-bold hover:bg-cyan-500 transition-colors shadow-lg">스튜디오 입장</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="text-center mt-10">
                                    <h2 className="text-3xl font-title text-cyan-400">화성 압축 연주</h2>
                                    <p className="text-zinc-400 text-sm mt-2">1시간 만에 원곡과 합주하는 기적</p>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs text-zinc-500 ml-1">오늘 합주할 곡 제목</label>
                                    <input type="text" value={songTitle} onChange={e => setSongTitle(e.target.value)} className="w-full bg-zinc-800 border-2 border-zinc-700 p-4 rounded-2xl text-white text-xl text-center outline-none focus:border-cyan-500 transition-all" />
                                </div>
                                <button onClick={analyzeSong} disabled={isAnalyzing} className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white p-5 rounded-2xl font-bold shadow-lg hover:scale-105 transition-transform flex justify-center items-center gap-2">
                                    {isAnalyzing ? <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div> : <span className="text-lg">AI 화성 분석 시작 🪄</span>}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-5 animate-fadeIn pb-10">
                                <div className="text-center bg-zinc-800/50 p-6 rounded-3xl border border-zinc-700 shadow-inner">
                                    <h2 className="text-2xl font-bold text-white mb-2">{songTitle}</h2>
                                    <p className="text-sm text-cyan-300 font-medium italic">"{parsedData.intro}"</p>
                                </div>

                                <div className="space-y-4 mt-6">
                                    <PartCard icon="🥁" title="드럼 리듬" color="amber" content={parsedData.drum} />
                                    <PartCard icon="🎸" title="베이스 (근음)" color="blue" content={parsedData.bass} isCode />
                                    <PartCard icon="🎸" title="통기타 (파워코드)" color="orange" content={parsedData.guitar} isCode />
                                    <PartCard icon="🎹" title="화성 건반 (핵심음)" color="pink" content={parsedData.harmKey} isCode />
                                    <PartCard icon="🎹" title="멜로디 연주 팁" color="emerald" content={parsedData.melKey} />
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => window.print()} className="flex-1 bg-zinc-700 text-white p-4 rounded-xl font-bold">🖨️ 악보 인쇄</button>
                                    <button onClick={() => setStep(1)} className="flex-1 bg-zinc-800 text-zinc-400 p-4 rounded-xl font-bold">다른 곡 분석</button>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="p-4 text-center text-[10px] text-zinc-600 border-t border-zinc-800 bg-zinc-950">
                        &copy; 2026 EAIM Studio. Powered by Gemini 2.0 Flash
                    </footer>
                </div>
            );
        };

        const PartCard = ({ icon, title, color, content, isCode }) => {
            // 테일윈드 동적 클래스 할당을 위한 맵핑
            const colorMap = {
                amber: 'border-l-amber-500 text-amber-400',
                blue: 'border-l-blue-500 text-blue-400',
                orange: 'border-l-orange-500 text-orange-400',
                pink: 'border-l-pink-500 text-pink-400',
                emerald: 'border-l-emerald-500 text-emerald-400'
            };

            return (
                <div className={`glass-panel p-4 rounded-2xl border-l-4 ${colorMap[color]} shadow-lg animate-fadeIn`}>
                    <div className="flex items-center gap-2 mb-2">
                        <span className="text-xl">{icon}</span>
                        <span className="font-bold">{title}</span>
                    </div>
                    <div className={`ml-8 ${isCode ? 'bg-zinc-800/80 p-3 rounded-lg border border-zinc-700 font-mono text-cyan-100 text-lg leading-relaxed' : 'text-zinc-200 text-sm'}`}>
                        {content}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnsembleApp />);
    </script>
</body>
</html>
