<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 앙상블 v2.5 - 실시간 화성압축코드 (파트별)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #050505; color: white; margin: 0; }
        
        .harmonic-chord-card { 
            background: linear-gradient(145deg, #121212, #000000); 
            border: 2px solid #222; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        
        .active-chord { 
            border-color: #00d4ff !important; 
            background: rgba(0, 212, 255, 0.1) !important; 
            transform: scale(1.03); 
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.4);
            z-index: 10;
        }

        /* 각 파트별 뱃지 컬러 */
        .part-badge-keyboard { background: #3b82f6; color: white; } /* 파랑 */
        .part-badge-guitar { background: #eab308; color: black; }  /* 노랑 */
        .part-badge-bass { background: #ef4444; color: white; }    /* 빨강 */
        .part-badge-drum { background: #22c55e; color: black; }    /* 초록 */

        .gradient-text { background: linear-gradient(90deg, #00d4ff, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .color-dot { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; transition: 0.3s; border: 3px solid transparent; }
        .color-dot.active { border-color: white; transform: scale(1.2); box-shadow: 0 0 20px currentColor; }
        .emotion-chip { padding: 10px 20px; border-radius: 30px; background: #1a1a1a; border: 2px solid #333; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .emotion-chip.active { background: #00d4ff; color: black; border-color: #00d4ff; }
        .yt-input { background: rgba(255,255,255,0.07); border: 2px solid #444; color: white; border-radius: 15px; width: 100%; padding: 15px; font-size: 1.1rem; outline: none; }
        .yt-change-box { background: rgba(255,255,255,0.05); border: 1px dashed #666; padding: 20px; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v25') || '');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [recommendations, setRecommendations] = useState([]);
            
            const [selectedSong, setSelectedSong] = useState(null);
            const [chords, setChords] = useState([]);
            const [currentTime, setCurrentTime] = useState(0);
            const playerRef = useRef(null);
            const timerRef = useRef(null);

            const [selectedEmotion, setSelectedEmotion] = useState('');
            const [selectedColor, setSelectedColor] = useState({ name: '', code: '' });
            const [youtubeUrl, setYoutubeUrl] = useState('');
            const [manualUrl, setManualUrl] = useState('');

            const emotionWords = ['신나는', '평온한', '설레는', '우울한', '웅장한', '몽환적인', '차분한', '파워풀한', '따뜻한'];
            const colorPalette = [
                { name: '열정의 빨강', code: '#ef4444' }, { name: '활기찬 주황', code: '#f97316' },
                { name: '행복한 노랑', code: '#eab308' }, { name: '편안한 초록', code: '#22c55e' },
                { name: '신비로운 파랑', code: '#3b82f6' }, { name: '깊은 보라', code: '#a855f7' },
                { name: '순수한 하양', code: '#ffffff' }, { name: '고독한 검정', code: '#18181b' }
            ];

            const saveApiKey = () => {
                if (!apiKey) return alert("API 키를 입력하세요!");
                localStorage.setItem('gemini_api_key_v25', apiKey);
                setStep(1);
            };

            const extractVideoId = (url) => {
                const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[7].length === 11) ? match[7] : null;
            };

            const callGemini25 = async (prompt) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt + "\n순수한 JSON 배열 형식으로만 답하세요." }] }] })
                    });
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (e) {
                    alert("v2.5 엔진 연결 실패!");
                    return null;
                }
            };

            const processAnalysis = async () => {
                setIsAnalyzing(true);
                let prompt = youtubeUrl.trim() 
                    ? `유튜브 링크 "${youtubeUrl}"의 곡을 분석하여 합주 가이드를 작성해줘.`
                    : `상태 "${selectedEmotion}", 색상 "${selectedColor.name}"에 어울리는 K-POP 3곡 추천.`;
                prompt += ` JSON 형식: [{"title": "곡명-가수", "reason": "추천이유"}]`;

                const result = await callGemini25(prompt);
                if (result) {
                    try {
                        const json = JSON.parse(result.match(/\[.*\]/s)[0]);
                        setRecommendations(json);
                        setStep(2);
                    } catch (e) { alert("데이터 해석 오류"); }
                }
                setIsAnalyzing(false);
            };

            // ★ 프롬프트 대폭 수정: 파트별 연주 지시 명확화 ★
            const analyzeChords = async (song) => {
                setSelectedSong(song);
                setIsAnalyzing(true);
                
                const prompt = `
                곡명: ${song.title}. 이 곡을 초보 학생 밴드가 원곡(AR)에 맞춰 합주할 수 있도록 4마디 단위의 '화성압축코드'로 분석하세요.
                중요: 단순히 코드만 주지 말고, [건반, 기타, 베이스, 드럼] 각 악기별로 무엇을 연주해야 하는지 아주 짧고 명확하게 적어주세요.
                
                반드시 다음 JSON 배열 구조를 지키세요:
                [
                  {
                    "time": 초(number),
                    "chord": "메인 화성압축코드 (예: G)",
                    "scale": "메인 계이름 (예: 솔-시-레)",
                    "keyboard": "건반 연주 팁 (예: 오른손 4분음표 화음 연주)",
                    "guitar": "기타 연주 팁 (예: 다운 스트로크만 반복)",
                    "bass": "베이스 연주 팁 (예: 근음 '솔'만 8분음표로)",
                    "drum": "드럼 비트 팁 (예: 8비트 기본 리듬)"
                  }
                ]
                (time은 노래 시작 후 해당 파트가 나오는 시점)
                `;

                const result = await callGemini25(prompt);
                if (result) {
                    try {
                        const json = JSON.parse(result.match(/\[.*\]/s)[0]);
                        setChords(json);
                        setStep(3);
                        const startId = youtubeUrl.trim() ? extractVideoId(youtubeUrl) : 'kY3Lp-D_oas';
                        setTimeout(() => initYouTube(startId), 500);
                    } catch (e) { alert("파트별 코드 분석 실패. 다시 시도해주세요."); }
                }
                setIsAnalyzing(false);
            };

            const initYouTube = (videoId) => {
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    document.body.appendChild(tag);
                    window.onYouTubeIframeAPIReady = () => createPlayer(videoId);
                } else { createPlayer(videoId); }
            };

            const createPlayer = (videoId) => {
                if (playerRef.current) {
                    playerRef.current.loadVideoById(videoId);
                    return;
                }
                playerRef.current = new window.YT.Player('yt-player', {
                    height: '450', width: '100%', videoId: videoId,
                    events: {
                        'onStateChange': (e) => {
                            if (e.data === 1) {
                                timerRef.current = setInterval(() => {
                                    setCurrentTime(playerRef.current.getCurrentTime());
                                }, 500);
                            } else { clearInterval(timerRef.current); }
                        }
                    }
                });
            };

            const changeVideo = () => {
                const vId = extractVideoId(manualUrl);
                if (!vId) return alert("올바른 유튜브 링크를 넣어주세요.");
                createPlayer(vId);
                alert("영상이 교체되었습니다!");
            };

            return (
                <div className="min-h-screen flex flex-col items-center p-6 pb-20">
                    {/* Step 0 & 1 & 2 코드는 기존과 완벽히 동일 (생략 처리 없이 렌더링) */}
                    {step === 0 && (
                        <div className="mt-20 max-w-md w-full bg-zinc-900 p-10 rounded-3xl border border-zinc-800 text-center">
                            <h1 className="text-3xl font-black mb-4 gradient-text italic">EAIM ENSEMBLE</h1>
                            <p className="text-zinc-500 mb-8 font-bold">GEMINI 2.5 FLASH ENGINE</p>
                            <input type="password" className="w-full p-5 bg-black border border-zinc-700 rounded-2xl mb-6 text-white text-center text-xl" placeholder="API KEY" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
                            <button onClick={saveApiKey} className="w-full py-5 bg-sky-500 rounded-2xl font-black text-xl hover:bg-sky-400 transition shadow-lg shadow-sky-900/20">시스템 접속</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="max-w-2xl w-full animate-fadeIn mt-10 space-y-10">
                            <div className="text-center">
                                <h2 className="text-4xl font-black mb-3">마음 <span className="gradient-text">컬러링 & 합주</span></h2>
                                <p className="text-zinc-400 text-lg">감정을 선택하거나 유튜브 링크를 넣어주세요.</p>
                            </div>
                            <div className="space-y-10 bg-zinc-900/50 p-10 rounded-[2.5rem] border border-zinc-800 text-center shadow-2xl">
                                <div className="flex flex-wrap justify-center gap-3">
                                    {emotionWords.map(word => (
                                        <button key={word} onClick={() => setSelectedEmotion(word)} className={`emotion-chip text-lg ${selectedEmotion === word ? 'active' : 'text-zinc-400'}`}>{word}</button>
                                    ))}
                                </div>
                                <div className="flex justify-center gap-5">
                                    {colorPalette.map(color => (
                                        <div key={color.name} onClick={() => setSelectedColor(color)} className={`color-dot ${selectedColor.name === color.name ? 'active' : ''}`} style={{ backgroundColor: color.code }} />
                                    ))}
                                </div>
                                <div className="pt-6 border-t border-zinc-800">
                                    <input type="text" className="yt-input" placeholder="직접 분석할 유튜브 URL (선택사항)" value={youtubeUrl} onChange={(e) => setYoutubeUrl(e.target.value)} />
                                </div>
                                <button onClick={processAnalysis} disabled={isAnalyzing} className="w-full py-6 bg-white text-black rounded-2xl font-black text-2xl hover:scale-105 transition-all shadow-xl">
                                    {isAnalyzing ? 'v2.5 플래시가 음악 탐색 중...' : '합주 가이드 생성 시작'}
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="w-full max-w-6xl animate-fadeIn mt-10">
                            <h2 className="text-center text-4xl font-black mb-12">에임 <span className="gradient-text">합주 가이드</span></h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {recommendations.map((song, i) => (
                                    <div key={i} className="harmonic-chord-card p-10 rounded-[2.5rem] text-left border-zinc-800 group hover:border-sky-500 transition-all flex flex-col justify-between h-full">
                                        <div>
                                            <div className="text-sky-400 font-black text-xl mb-4 tracking-widest">ANALYSIS 0{i+1}</div>
                                            <div className="text-3xl font-black mb-6 group-hover:text-sky-300 transition-colors leading-tight">{song.title}</div>
                                            <p className="text-zinc-400 text-lg leading-relaxed mb-10">{song.reason}</p>
                                        </div>
                                        <button onClick={() => analyzeChords(song)} className="w-full py-5 bg-sky-600 text-white rounded-2xl font-black text-xl hover:bg-sky-500 transition-all shadow-lg">
                                            화성압축코드 악보보기
                                        </button>
                                    </div>
                                ))}
                            </div>
                            <div className="text-center mt-16"><button onClick={()=>setStep(1)} className="text-zinc-500 text-lg underline underline-offset-8">다른 기분으로 검색하기</button></div>
                        </div>
                    )}

                    {/* ★ Step 3: 실시간 화성압축코드 합주실 (파트별 레이아웃 대폭 수정) ★ */}
                    {step === 3 && (
                        <div className="w-full max-w-6xl animate-fadeIn mt-6 space-y-8">
                            <div className="flex justify-between items-center bg-zinc-900/50 p-6 rounded-2xl border border-zinc-800">
                                <h2 className="text-3xl font-black gradient-text italic">{selectedSong?.title}</h2>
                                <button onClick={() => {clearInterval(timerRef.current); setStep(2);}} className="text-zinc-400 hover:text-white text-xl font-bold">닫기 [X]</button>
                            </div>

                            <div id="yt-player" className="rounded-[2rem] overflow-hidden shadow-2xl bg-black aspect-video border-4 border-zinc-800"></div>

                            <div className="yt-change-box space-y-4">
                                <p className="text-sm text-zinc-400 font-black uppercase tracking-widest flex items-center gap-2"><i className="fas fa-video"></i> 영상 교체 시스템</p>
                                <div className="flex gap-3">
                                    <input type="text" className="flex-1 bg-black/80 border-2 border-zinc-700 rounded-xl p-4 text-base outline-none focus:border-red-500 transition" placeholder="새로운 유튜브 링크(URL)를 붙여넣으세요" value={manualUrl} onChange={(e) => setManualUrl(e.target.value)} />
                                    <button onClick={changeVideo} className="bg-red-600 px-8 py-4 rounded-xl font-black hover:bg-red-500 transition shadow-lg">교체</button>
                                </div>
                            </div>

                            {/* 화성압축코드 그리드: 각 악기 파트별로 명확하게 표시 */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-12">
                                {chords.map((item, idx) => {
                                    const isActive = currentTime >= item.time && (chords[idx+1] ? currentTime < chords[idx+1].time : true);
                                    return (
                                        <div key={idx} className={`p-8 rounded-[2rem] harmonic-chord-card transition-all duration-500 border-4 ${isActive ? 'active-chord' : 'opacity-40 border-transparent scale-95'}`}>
                                            <div className="flex justify-between items-end mb-4 border-b border-zinc-800 pb-4">
                                                <div className={`text-6xl font-black ${isActive ? 'text-white' : 'text-zinc-500'}`}>{item.chord}</div>
                                                <div className="text-xl text-sky-400 font-black uppercase">{item.scale}</div>
                                            </div>
                                            
                                            {/* 악기 파트별 리스트 */}
                                            <div className="space-y-3">
                                                <div className="flex items-start gap-3">
                                                    <span className="part-badge-keyboard text-xs font-black px-2 py-1 rounded min-w-[50px] text-center">건반</span>
                                                    <span className="text-sm text-zinc-300 leading-tight">{item.keyboard || '기본 화음 연주'}</span>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <span className="part-badge-guitar text-xs font-black px-2 py-1 rounded min-w-[50px] text-center">기타</span>
                                                    <span className="text-sm text-zinc-300 leading-tight">{item.guitar || '다운 스트로크'}</span>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <span className="part-badge-bass text-xs font-black px-2 py-1 rounded min-w-[50px] text-center">베이스</span>
                                                    <span className="text-sm text-zinc-300 leading-tight">{item.bass || '근음 8비트'}</span>
                                                </div>
                                                <div className="flex items-start gap-3">
                                                    <span className="part-badge-drum text-xs font-black px-2 py-1 rounded min-w-[50px] text-center">드럼</span>
                                                    <span className="text-sm text-zinc-300 leading-tight">{item.drum || '기본 8비트 리듬'}</span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
