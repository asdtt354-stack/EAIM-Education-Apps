<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 에임우주탐험대 - v2.8</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #000; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #side-panel { width: 320px; min-width: 320px; background: rgba(10,10,25,0.98); border-right: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 20; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        #canvas-container { flex-grow: 1; background: #000; cursor: pointer; }
        #interaction-area { height: 40%; background: #080810; padding: 20px; border-top: 1px solid #222; overflow-y: auto; display: none; z-index: 20; }
        .btn-home { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white; padding: 10px 20px; border-radius: 20px; border: 1px solid #555; z-index: 100; cursor: pointer; }
        
        /* 이름표 스타일 */
        .planet-label { position: absolute; color: var(--main-color); font-size: 13px; font-weight: bold; pointer-events: none; text-shadow: 1px 1px 2px black; }
        
        input[type=range] { width: 100%; margin: 15px 0; }
        textarea { width: 100%; height: 70px; background: #161625; color: white; border: 1px solid #333; border-radius: 6px; padding: 10px; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="intro-ui" style="position:absolute; top:30px; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; z-index:10;">
    <h1 style="color:var(--main-color); text-shadow: 0 0 15px #00d4ff; margin:0;">에임 우주 탐험대</h1>
    <p style="color:#aaa;">행성을 클릭하여 정밀 관측과 위상 변화를 체험하세요!</p>
</div>

<button class="btn-home" onclick="location.reload()">☀️ 태양계 전체보기</button>

<div id="label-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>

<div id="side-panel">
    <h2>🔭 탐사 설정</h2>
    <div id="obs-location" style="color:var(--accent); font-size:0.9em; margin: 10px 0;">📍 보현산 천문대 연결됨</div>
    
    <div id="phase-control" style="display:none; border:1px solid #333; padding:15px; border-radius:8px; margin-top:10px;">
        <label>🌗 달의 위상 조절</label>
        <input type="range" id="moon-slider" min="0" max="6.28" step="0.1" value="0" oninput="changeMoonPhase(this.value)">
        <p id="phase-name" style="font-size:0.8em; color:var(--main-color); text-align:center;">신월 (New Moon)</p>
    </div>

    <div id="log-list" style="flex-grow:1; border-top:1px solid #333; padding-top:15px; overflow-y:auto; margin-top:20px;">
        <h3>📖 탐사 일지</h3>
        <div id="log-container"></div>
    </div>
</div>

<div id="main-view">
    <div id="canvas-container"></div>
    <div id="interaction-area">
        <h3 id="target-title">관측 기록실</h3>
        <p id="question" style="font-size:0.9em; color:#aaa; margin-bottom:10px;"></p>
        <textarea id="student-answer" placeholder="관측한 특징과 위상 변화의 원리를 적어보세요..."></textarea>
        <div style="display:flex; gap:10px;">
            <button onclick="runGemini25()" style="background:var(--main-color); color:#000;">AI 피드백 받기</button>
            <button onclick="saveToLocal()" style="background:var(--accent); color:#fff;">일지 저장</button>
        </div>
        <div id="ai-response" style="margin-top:10px; font-size:0.9em; line-height:1.6;"></div>
    </div>
</div>

<script>
    const planetsData = {
        mercury: { name: "수성", dist: 20, size: 1.0, speed: 0.04, color: 0xaaaaaa, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg" },
        venus: { name: "금성", dist: 32, size: 1.6, speed: 0.015, color: 0xffcc33, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg" },
        earth: { name: "지구", dist: 48, size: 1.8, speed: 0.01, color: 0x2233ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg" },
        mars: { name: "화성", dist: 62, size: 1.3, speed: 0.008, color: 0xff3300, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg" },
        jupiter: { name: "목성", dist: 88, size: 4.5, speed: 0.004, color: 0xffaa88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg" },
        saturn: { name: "토성", dist: 115, size: 3.8, speed: 0.002, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png" },
        moon: { name: "달", size: 3.0, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/moon_1024.jpg", color: 0xdddddd }
    };

    let isObserving = false, currentTarget = null;
    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const sun = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    // 공전용 조명 (Ambient) + 달 위상용 조명 (Directional)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const moonLight = new THREE.DirectionalLight(0xffffff, 2.0);
    moonLight.position.set(10, 0, 10);
    scene.add(moonLight);

    const meshes = {}, labels = {}, loader = new THREE.TextureLoader();

    Object.keys(planetsData).forEach(key => {
        if(key === 'moon') return;
        const p = planetsData[key];
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), new THREE.MeshStandardMaterial({ map: loader.load(p.texture), emissive: p.color, emissiveIntensity: 0.3 }));
        m.userData = { id: key, name: p.name };
        meshes[key] = m;
        scene.add(m);

        const lbl = document.createElement('div');
        lbl.className = 'planet-label';
        lbl.innerText = p.name;
        document.getElementById('label-layer').appendChild(lbl);
        labels[key] = lbl;
    });

    // 달 전용 객체
    const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(3.0, 64, 64), new THREE.MeshStandardMaterial({ map: loader.load(planetsData.moon.texture) }));
    moonMesh.visible = false;
    scene.add(moonMesh);

    camera.position.set(0, 150, 220);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;
        if (!isObserving) {
            Object.keys(meshes).forEach(key => {
                const p = planetsData[key], m = meshes[key], lbl = labels[key];
                m.position.x = Math.cos(time * p.speed * 10) * p.dist;
                m.position.z = Math.sin(time * p.speed * 10) * p.dist;
                m.rotation.y += 0.01;
                const pos = m.position.clone().project(camera);
                lbl.style.left = `${(pos.x * 0.5 + 0.5) * container.clientWidth}px`;
                lbl.style.top = `${(pos.y * -0.5 + 0.5) * container.clientHeight - 20}px`;
            });
        }
        renderer.render(scene, camera);
    }
    animate();

    container.onclick = (e) => {
        if(isObserving) return;
        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(((e.clientX - rect.left) / container.clientWidth) * 2 - 1, -((e.clientY - rect.top) / container.clientHeight) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(meshes));
        if(intersects.length > 0) startObservation(intersects[0].object.userData.id);
        else if(Math.abs(mouse.x) < 0.1 && Math.abs(mouse.y) < 0.1) startObservation('moon'); // 중앙 클릭 시 달(예시)
    };

    function startObservation(id) {
        isObserving = true; currentTarget = id;
        document.getElementById('intro-ui').style.display = 'none';
        document.getElementById('side-panel').style.display = 'flex';
        document.getElementById('interaction-area').style.display = 'block';
        Object.values(meshes).forEach(m => m.visible = false);
        Object.values(labels).forEach(l => l.style.display = 'none');
        
        const p = planetsData[id];
        if(id === 'moon') {
            moonMesh.visible = true;
            document.getElementById('phase-control').style.display = 'block';
            document.getElementById('target-title').innerText = "🌕 달 위상 변화 정밀 관측";
            document.getElementById('question').innerText = "슬라이더를 움직여 달의 모양을 바꿔보세요. 상현달이 보일 때 태양의 위치는 어디일까요?";
        } else {
            meshes[id].visible = true;
            meshes[id].position.set(0,0,0);
            document.getElementById('target-title').innerText = `${p.name} 3D 정밀 탐사`;
            document.getElementById('question').innerText = `${p.name}의 표면 특징을 관찰하고 배운 내용을 적어보세요.`;
        }
        camera.position.set(0, 0, 10);
        camera.lookAt(0, 0, 0);
    }

    function changeMoonPhase(val) {
        // 조명 위치를 옮겨 위상 변화 시뮬레이션
        moonLight.position.set(Math.cos(val)*10, 0, Math.sin(val)*10);
        const phases = ["신월", "초승달", "상현달", "보름달", "하현달", "그믐달"];
        const idx = Math.floor((val / 6.28) * phases.length);
        document.getElementById('phase-name').innerText = phases[idx % phases.length];
    }

    const API_KEY = "여기에_성공하셨던_API키";
    async function runGemini25() {
        const ans = document.getElementById('student-answer').value;
        const resp = document.getElementById('ai-response');
        if(!ans) return alert("답변을 입력하세요.");
        resp.innerHTML = "📡 AI 가이드 분석 중...";
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생의 답변 "${ans}"에 대해 달의 위상이나 행성 특징을 포함하여 친절하게 피드백해줘.` }] }] })
            });
            const data = await res.json();
            resp.innerHTML = `<b>AI 피드백:</b><br>${data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>')}`;
        } catch(e) { resp.innerHTML = "연결 오류"; }
    }

    function saveToLocal() {
        const log = { target: planetsData[currentTarget].name, ans: document.getElementById('student-answer').value, time: new Date().toLocaleString() };
        let logs = JSON.parse(localStorage.getItem('eaim_v2.8_logs') || "[]");
        logs.unshift(log);
        localStorage.setItem('eaim_v2.8_logs', JSON.stringify(logs));
        displayLogs();
        alert("탐사 일지가 저장되었습니다!");
    }

    function displayLogs() {
        const logs = JSON.parse(localStorage.getItem('eaim_v2.8_logs') || "[]");
        document.getElementById('log-container').innerHTML = logs.map(l => `<div style="background:#1a1a2e; padding:8px; border-radius:5px; margin-bottom:8px; border-left:3px solid #00d4ff;"><small>${l.time}</small><br><b>${l.target}</b>: ${l.ans.substring(0,25)}...</div>`).join('');
    }
    window.onload = displayLogs;
</script>
</body>
</html>
