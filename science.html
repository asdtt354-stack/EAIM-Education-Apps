<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM CSI 과학 탐정대</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            /* 과학 느낌의 부드러운 민트~블루 파스텔 배경 */
            background: linear-gradient(135deg, #dcfce7 0%, #e0f2fe 100%); 
            min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #334155; 
        }
        .font-hand { font-family: 'Gaegu', cursive; }
        
        /* EAIM 플랫폼 공통 카드 스타일 */
        .eaim-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); 
            border-radius: 3rem; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
            border: 2px solid white; 
            width: 100%; max-width: 550px; 
            padding: 2.5rem; margin: 2rem 0; 
        }
        
        /* 공통 입력창 스타일 */
        .eaim-input { 
            width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; 
            padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; 
        }
        textarea.eaim-input { text-align: left; resize: none; }
        
        /* 메인 버튼 (민트색) */
        .eaim-btn-main { 
            background: #14b8a6 !important; color: white !important; 
            border-radius: 1.5rem; padding: 1.1rem; font-weight: bold; width: 100%; 
            transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; 
        }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        .eaim-btn-main:hover:not(:disabled) { background: #0d9488 !important; transform: scale(1.02); }

        /* 인쇄 전용 스타일 */
        @media print {
            body { background: white; color: black; display: block; }
            .print-hidden { display: none !important; }
            .eaim-card { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; max-width: none; }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ScienceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [scienceUnit, setScienceUnit] = useState('상태 변화');
            const [emotionKeyword, setEmotionKeyword] = useState('미안함');
            const [caseStory, setCaseStory] = useState('');

            const [scienceClue, setScienceClue] = useState('');
            const [emotionClue, setEmotionClue] = useState('');
            const [finalReport, setFinalReport] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_sci');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            // 💡 띄어쓰기 에러 완벽 방지
            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${cleanKey}`;
                const response = await fetch(url, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const generateCase = async () => {
                if (!apiKey) return alert('API 키를 확인해주세요.');
                setIsAnalyzing(true);
                const prompt = `당신은 중학교 과학 교사이자 추리소설 작가입니다. 중학교 과학의 '${scienceUnit}' 단원과 사람의 '${emotionKeyword}'이라는 감정을 융합하여, 중학생들이 학교에서 겪을 법한 미스터리 사건을 만들어주세요.
                조건 1: 아주 쉽고, 흥미진진하게 3~4문장으로 짧게 작성할 것. (중학교 남학생 타겟)
                조건 2: 범인이 나쁜 짓을 한 것이 아니라, 오해나 서툰 감정 표현 때문이라는 여지를 남길 것.
                조건 3: 절대 너무 어려운 과학 용어를 남발하지 말 것.`;

                try {
                    const text = await callGemini(prompt);
                    setCaseStory(text);
                    setStep(2);
                } catch (e) { alert(`사건 생성 실패: ${e.message}`); } 
                finally { setIsAnalyzing(false); }
            };

            const solveCase = async () => {
                setIsAnalyzing(true); setStep(4);
                const prompt = `당신은 CSI 과학 탐정대의 대장(수석 프로파일러)입니다. 학생 탐정이 사건('${caseStory}')에 대해 다음과 같이 추리했습니다.
                1. 과학적 추론: ${scienceClue}
                2. 정서적 추론(마음): ${emotionClue}

                이 단서들을 바탕으로 다음 3가지를 포함하여 '최종 사건 해결 보고서'를 아주 훈훈하고 따뜻한 중학생 말투로 작성해주세요.
                - 🔍 과학적 진실: (과학 단원의 원리를 쉽게 설명)
                - 💓 숨겨진 마음: (범인의 행동 뒤에 숨겨진 감정 공감)
                - 🤝 화해의 미션: (친구와 어떻게 다시 잘 지낼 수 있을지 구체적인 행동 제안)`;

                try {
                    const text = await callGemini(prompt);
                    setFinalReport(text);
                } catch (e) { setFinalReport('보고서 작성 중 오류가 발생했습니다.'); } 
                finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="text-center space-y-6">
                            <h2 className="font-bold text-2xl font-hand text-slate-700">EAIM CSI 탐정대 설정</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="eaim-input" placeholder="발급받은 API 키를 입력하세요" />
                            <button onClick={() => { 
                                localStorage.setItem('gemini_api_key_sci', apiKey.trim()); 
                                setStep(1); 
                            }} className="eaim-btn-main shadow-lg">시스템 가동 🚀</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div className="space-y-6">
                            <header className="flex justify-between items-center mb-6 print-hidden">
                                <span className="font-bold text-teal-600 font-hand text-xl">EAIM 과학 🕵️‍♂️</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key_sci'); setStep(0); window.location.reload(); }} className="text-xs text-slate-400 underline">키 재설정</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <div className="text-center">
                                        <h2 className="text-2xl font-hand text-slate-800 mb-2">1. 사건 파일 생성 📂</h2>
                                        <p className="text-sm text-slate-500">오늘 배울 과학 원리와 친구의 마음을 골라주세요.</p>
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <label className="text-sm font-bold text-slate-500 ml-2">🔬 과학 단원 (원리)</label>
                                        <input type="text" value={scienceUnit} onChange={e => setScienceUnit(e.target.value)} className="eaim-input" placeholder="예: 보일의 법칙, 상태 변화" />
                                    </div>

                                    <div className="space-y-2">
                                        <label className="text-sm font-bold text-slate-500 ml-2">💓 숨겨진 마음 (정서)</label>
                                        <input type="text" value={emotionKeyword} onChange={e => setEmotionKeyword(e.target.value)} className="eaim-input" placeholder="예: 미안함, 돕고싶음, 부끄러움" />
                                    </div>

                                    <button onClick={generateCase} disabled={isAnalyzing} className="eaim-btn-main mt-4">
                                        {isAnalyzing ? "사건 구성 중..." : "AI 사건 만들기 ✨"}
                                    </button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">2. 현장 출동 🚨</h2>
                                    <div className="bg-white/70 p-6 rounded-3xl border-2 border-teal-200">
                                        <p className="text-lg leading-relaxed font-hand text-slate-700 whitespace-pre-wrap">{caseStory}</p>
                                    </div>

                                    <div className="space-y-3 mt-6">
                                        <h3 className="text-lg font-bold text-teal-600 ml-2">🔍 1차 수사: 과학적 단서</h3>
                                        <textarea value={scienceClue} onChange={e => setScienceClue(e.target.value)} className="eaim-input h-28" placeholder="어떤 과학 원리가 숨어있을까? 간단하게 적어봐!"></textarea>
                                    </div>

                                    <button onClick={() => setStep(3)} disabled={!scienceClue} className="eaim-btn-main bg-teal-500 mt-2">다음 수사로 이동 👉</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <div className="bg-white/50 p-4 rounded-2xl border border-teal-100 text-sm text-slate-500 mb-2">
                                        <span className="font-bold text-teal-600">사건 요약: </span>{caseStory.substring(0, 40)}...
                                    </div>

                                    <div className="space-y-3">
                                        <h3 className="text-lg font-bold text-pink-500 ml-2">💓 2차 수사: 마음 프로파일링</h3>
                                        <textarea value={emotionClue} onChange={e => setEmotionClue(e.target.value)} className="eaim-input h-28" placeholder="범인은 왜 이런 행동을 했을까? 친구의 마음을 상상해봐!"></textarea>
                                    </div>

                                    <button onClick={solveCase} disabled={!emotionClue || isAnalyzing} className="eaim-btn-main mt-6">
                                        최종 보고서 요청하기 📝
                                    </button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-6 animate-fade-in print-area">
                                    <h2 className="text-3xl font-hand text-center text-teal-600">✨ CSI 최종 보고서</h2>
                                    
                                    <div className="bg-white/70 p-8 rounded-3xl border-2 border-teal-200 min-h-[350px]">
                                        {isAnalyzing ? (
                                            <div className="text-center text-teal-600 font-bold font-hand text-xl mt-20">대장이 과학과 마음을 융합하는 중... 🔍</div>
                                        ) : (
                                            <div className="whitespace-pre-wrap text-slate-700 text-lg leading-relaxed font-hand">
                                                {finalReport}
                                            </div>
                                        )}
                                    </div>

                                    {!isAnalyzing && (
                                        <div className="flex gap-3 print-hidden">
                                            <button onClick={() => window.print()} className="flex-1 eaim-btn-main bg-slate-400">🖨️ 인쇄하기</button>
                                            <button onClick={() => { setStep(1); setFinalReport(''); setScienceClue(''); setEmotionClue(''); }} className="flex-1 eaim-btn-main bg-teal-500">새 사건 맡기 🕵️</button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScienceEAIMApp />);
    </script>
</body>
</html>
