<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM AI Education Platform</title>
    <style>
        /* 배경 및 기본 폰트 설정 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3); /* 이미지의 보라색 그라데이션 재현 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        /* 헤더 섹션 */
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        /* 6개 카드 그리드 시스템 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3열 구성 */
            gap: 20px;
            width: 90%;
            max-width: 1000px;
        }

        /* 개별 카드 디자인 */
        .card {
            background: rgba(255, 255, 255, 0.15); /* 반투명 유리 효과 */
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, background 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.25);
        }

        /* 아이콘 크기 및 스타일 */
        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* 하단 카피라이트 */
        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* 모바일 대응 (반응형) */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌟 EAIM AI Education Platform</h1>
        <p>예술 융합 사회정서학습(SEL)을 위한 교과별 AI 도구 모음</p>
    </header>

    <div class="grid-container">
        <a href="#" class="card">
            <span class="icon">📖</span>
            <span class="title">EAIM 감정 시인</span>
            <span class="subtitle">내 마음을 읊는 시간</span>
        </a>

        <a href="#" class="card">
            <span class="icon">🕵️‍♂️</span>
            <span class="title">EAIM 과학 탐정대</span>
            <span class="subtitle">이성과 감성의 추리</span>
        </a>

        <a href="#" class="card">
            <span class="icon">🚀</span>
            <span class="title">EAIM 우주 탐험대</span>
            <span class="subtitle">3D 우주 관찰 일지</span>
        </a>

        <a href="#" class="card">
            <span class="icon">🎭</span>
            <span class="title">EAIM 뮤지컬 메이커</span>
            <span class="subtitle">창작 뮤지컬 시나리오</span>
        </a>

        <a href="#" class="card">
            <span class="icon">🎸</span>
            <span class="title">EAIM 앙상블</span>
            <span class="subtitle">화성압축 연주</span>
        </a>

        <a href="#" class="card">
            <span class="icon">🏀</span>
            <span class="title">EAIM 비트 & 볼</span>
            <span class="subtitle">다 함께 바디 퍼커션</span>
        </a>
    </div>

    <footer>
        © 2026 EAIM Studio. Designed by Director Park Seong-ae.
    </footer>

</body>
</html>
