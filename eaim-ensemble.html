<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 4-BAND PERFECT SYNC v10.1</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .station-card { background: rgba(30, 41, 59, 0.5); border: 2px solid #1e293b; border-radius: 1.25rem; padding: 1rem; transition: 0.3s; }
        .active-station { border-color: #f43f5e; box-shadow: 0 0 25px rgba(244, 63, 94, 0.15); }
        .power-bubble { width: 58px; height: 58px; border-radius: 1.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .note-1 { background-color: #f43f5e; color: white; border: 2px solid #fb7185; }
        .note-5 { background-color: #3b82f6; color: white; border: 2px solid #60a5fa; }
        .youtube-container { width: 100%; aspect-ratio: 16/9; border-radius: 1.5rem; overflow: hidden; background: #000; border: 2px solid #334155; position: relative; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .beat-icon { font-size: 2.2rem; transition: 0.1s ease-out; opacity: 0.3; transform: scale(0.9); }
        .beat-active { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 10px #fbbf24); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [currentTime, setCurrentTime] = useState(0);
            const [timeline, setTimeline] = useState([]);
            const playerRef = useRef(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_ensemble');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            // 실시간 시간 업데이트 루프
            useEffect(() => {
                let interval;
                if (step === 3) {
                    interval = setInterval(() => {
                        if (playerRef.current && playerRef.current.getCurrentTime) {
                            setCurrentTime(playerRef.current.getCurrentTime());
                        }
                    }, 100);
                }
                return () => clearInterval(interval);
            }, [step]);

            // 유튜브 ID 추출 유틸리티
            const extractVideoId = (url) => {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : url;
            };

            const initYouTubePlayer = (videoId) => {
                const createPlayer = () => {
                    playerRef.current = new window.YT.Player('player', {
                        height: '100%', width: '100%',
                        videoId: videoId,
                        events: {
                            'onReady': () => setStep(3),
                            'onError': () => { alert("유튜브 영상을 불러올 수 없습니다."); setStep(1); }
                        }
                    });
                };

                if (window.YT && window.YT.Player) {
                    createPlayer();
                } else {
                    window.onYouTubeIframeAPIReady = createPlayer;
                    if (!document.getElementById('youtube-api-script')) {
                        const tag = document.createElement('script');
                        tag.id = 'youtube-api-script';
                        tag.src = "https://www.youtube.com/iframe_api";
                        document.body.appendChild(tag);
                    }
                }
            };

            const handleAnalyze = async () => {
                if (!searchQuery) return alert("유튜브 주소나 곡명을 입력하세요!");
                setStep(2);
                
                const videoId = extractVideoId(searchQuery);
                const prompt = `곡 '${searchQuery}'을 분석해 4초 간격 JSON으로 출력해. perc 항목에는 🥁, 👏 아이콘과 '쿵', '팍' 구음을 섞어줘. 형식: [{"time":0, "chord":"C5", "wind":"도", "guitar":["도","솔"], "key":["도","미","솔"], "perc":"🥁(쿵) 👏(팍)"}]`;

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const match = data.candidates[0].content.parts[0].text.match(/\[.*\]/s);
                    setTimeline(JSON.parse(match[0]));
                    
                    // 화성 분석 성공 후 플레이어 초기화
                    initYouTubePlayer(videoId);
                } catch (e) {
                    console.error(e);
                    // 분석 실패 시 기본 데이터로 연주 화면 강제 진입
                    setTimeline([{time:0, chord:"C5", wind:"도", guitar:["도","솔"], key:["도","미","솔"], perc:"🥁(쿵) 👏(팍)"}]);
                    initYouTubePlayer(videoId);
                }
            };

            const currentData = timeline.find((item, index) => {
                const nextItem = timeline[index + 1];
                return currentTime >= item.time && (!nextItem || currentTime < nextItem.time);
            }) || { chord: '-', wind: '-', guitar:['-','-'], key:['-','-','-'], perc: '-' };

            const isKick = (currentTime % 1 < 0.3);
            const isSnare = (currentTime % 1 > 0.5 && currentTime % 1 < 0.8);

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col relative shadow-2xl overflow-hidden">
                    {step === 0 && (
                        <div className="flex-grow flex flex-col justify-center p-10 text-center space-y-6">
                            <div className="text-7xl">🚀</div>
                            <h2 className="text-2xl font-bold text-indigo-400 font-title uppercase">EAIM 4-Band Sync</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-center text-white" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_ensemble', apiKey.trim()); setStep(1); }} className="w-full bg-indigo-600 p-4 rounded-xl font-bold">시스템 연결</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="flex-grow flex flex-col justify-center p-8 space-y-10 text-center animate-fadeIn">
                            <div className="space-y-4">
                                <div className="text-6xl">🥁 🎹 🎺 🎸</div>
                                <h2 className="text-2xl font-bold font-title text-indigo-300">화성 압축 앙상블</h2>
                                <p className="text-slate-500 text-sm">유튜브를 분석하여 악기별 악보를 생성합니다.</p>
                            </div>
                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-slate-800 p-5 rounded-2xl text-white text-center font-bold" placeholder="유튜브 주소를 넣어주세요" />
                            <button onClick={handleAnalyze} className="w-full bg-indigo-600 p-5 rounded-2xl font-bold text-xl shadow-xl">분석 및 합주 시작 🔍</button>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="flex-grow flex flex-col justify-center items-center space-y-4">
                            <div className="w-14 h-14 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                            <p className="text-indigo-400 font-bold animate-pulse font-title">AI SYNCHRONIZING...</p>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="flex-grow flex flex-col animate-fadeIn">
                            <header className="p-4 flex justify-between items-center font-title text-indigo-400">
                                <span className="text-lg">EAIM LIVE ORCHESTRA</span>
                                <button onClick={() => window.location.reload()} className="text-[10px] text-slate-500 underline uppercase">Reset</button>
                            </header>

                            <div className="px-4 mb-3">
                                <div className="youtube-container shadow-2xl">
                                    <div id="player"></div>
                                </div>
                            </div>

                            <div className="flex-grow flex flex-col px-4 pb-4 space-y-2 overflow-y-auto">
                                <div className="station-card flex items-center justify-between border-amber-500/30 bg-amber-950/10">
                                    <div className="flex flex-col"><span className="text-[9px] font-bold text-amber-500 uppercase">Percussion</span><span className="text-[11px] font-black text-amber-200">{currentData.perc}</span></div>
                                    <div className="flex gap-6 pr-2">
                                        <div className={`beat-icon ${isKick ? 'beat-active' : ''}`}>🥁</div>
                                        <div className={`beat-icon ${isSnare ? 'beat-active' : ''}`}>👏</div>
                                    </div>
                                </div>

                                <div className="station-card active-station flex items-center justify-between">
                                    <div className="flex flex-col"><span className="text-[9px] font-bold text-rose-400 uppercase">Guitar</span><span className="text-2xl font-black text-white">{currentData.chord}</span></div>
                                    <div className="flex gap-2">
                                        <div className="power-bubble note-1"><span className="text-[8px] opacity-70">근음</span>{currentData.guitar[0]}</div>
                                        <div className="power-bubble note-5"><span className="text-[8px] opacity-70">5도</span>{currentData.guitar[1]}</div>
                                    </div>
                                </div>

                                <div className="station-card flex items-center justify-between py-4">
                                    <span className="text-[9px] font-bold text-indigo-400 uppercase">Wind</span>
                                    <div className="text-3xl font-black text-indigo-300 px-4 bg-indigo-900/20 rounded-lg">{currentData.wind}</div>
                                </div>

                                <div className="station-card flex items-center justify-between py-4">
                                    <span className="text-[9px] font-bold text-pink-400 uppercase">Piano</span>
                                    <div className="flex gap-2">
                                        {currentData.key.map((n, i) => (
                                            <span key={i} className="text-sm font-bold text-pink-200 bg-pink-900/40 px-3 py-1.5 rounded-lg">{n}</span>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="p-3 bg-slate-900 border-t border-white/5 flex justify-between items-center">
                                <div className="flex items-center gap-2"><div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div><span className="text-[10px] text-slate-500 font-bold">READY TO PLAY</span></div>
                                <span className="text-[10px] text-indigo-400 font-bold bg-indigo-900/40 px-3 py-1 rounded-full">TIME: {Math.floor(currentTime)}s</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
