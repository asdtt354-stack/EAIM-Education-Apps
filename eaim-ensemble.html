<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 앙상블 V2.5 - 실시간 합주</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #09090b; color: #f4f4f5; margin: 0; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(39, 39, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(82, 82, 91, 0.5); }
        .active-chord { border-color: #22d3ee; background: rgba(34, 211, 238, 0.1); transform: scale(1.02); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const EnsembleApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [ytUrl, setYtUrl] = useState('https://www.youtube.com/watch?v=kY3Lp-D_oas'); // 예시: 선물
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [chords, setChords] = useState([]); // 분석된 다이어트 코드 리스트
            const [currentTime, setCurrentTime] = useState(0);
            const playerRef = useRef(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
                
                // YouTube API 로드
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            }, []);

            const extractVideoId = (url) => {
                const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[7].length === 11) ? match[7] : null;
            };

            const analyzeSong = async () => {
                setIsAnalyzing(true);
                // 에임 화성 압축 로직 프롬프트 (다이어트 코드 최적화)
                const prompt = `당신은 초보자를 위한 에임기타 편곡가입니다. 
                유튜브 링크: ${ytUrl} 
                이 곡의 진행을 4마디 단위로 분석하여 초보자가 연주하기 쉬운 '다이어트 코드(3화음/파워코드)'와 '한글 계이름' 리스트를 JSON 형식으로만 출력하세요. 
                결과 형식: [{"time": 시작초, "chord": "코드명", "scale": "계이름", "tip": "운지법"}]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    const cleanJson = text.replace(/```json|```/g, '');
                    setChords(JSON.parse(cleanJson));
                    
                    initYouTube();
                    setStep(2);
                } catch (e) { alert('분석 실패. JSON 형식을 확인해주세요.'); } finally { setIsAnalyzing(false); }
            };

            const initYouTube = () => {
                const videoId = extractVideoId(ytUrl);
                if (!window.YT) return;
                playerRef.current = new window.YT.Player('yt-player', {
                    videoId: videoId,
                    events: {
                        'onStateChange': (event) => {
                            if (event.data === window.YT.PlayerState.PLAYING) {
                                setInterval(() => {
                                    setCurrentTime(playerRef.current.getCurrentTime());
                                }, 500);
                            }
                        }
                    }
                });
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-zinc-900 flex flex-col shadow-2xl overflow-hidden">
                    <header className="p-4 bg-zinc-950 border-b border-zinc-800 flex justify-between items-center sticky top-0 z-50">
                        <h1 className="font-title text-cyan-400 italic">EAIM 2.5 VERSION</h1>
                        {step > 0 && <button onClick={() => location.reload()} className="text-xs text-zinc-500">Reset</button>}
                    </header>

                    <main className="flex-grow p-4">
                        {step === 0 && (
                            <div className="py-10 space-y-4">
                                <h2 className="text-xl font-bold">🔑 스튜디오 인증</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full p-4 bg-zinc-800 rounded-xl" />
                                <button onClick={() => {localStorage.setItem('gemini_api_key', apiKey); setStep(1);}} className="w-full bg-cyan-600 p-4 rounded-xl font-bold">입장</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="py-6 space-y-6">
                                <div className="text-center">
                                    <h2 className="text-2xl font-title">유튜브 화성 압축</h2>
                                    <p className="text-zinc-400 text-sm">링크를 입력하면 다이어트 코드로 변환합니다.</p>
                                </div>
                                <input type="text" value={ytUrl} onChange={e => setYtUrl(e.target.value)} className="w-full p-4 bg-zinc-800 border-2 border-zinc-700 rounded-xl text-sm" />
                                <button onClick={analyzeSong} className="w-full bg-cyan-600 p-5 rounded-2xl font-bold flex justify-center">
                                    {isAnalyzing ? "AI 분석 중..." : "다이어트 코드 추출 🪄"}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-4">
                                {/* 고정형 유튜브 플레이어 */}
                                <div id="yt-player" className="w-full aspect-video rounded-2xl overflow-hidden border border-zinc-700 shadow-2xl"></div>
                                
                                <div className="flex justify-between items-center px-2">
                                    <span className="text-xs text-cyan-400 font-bold">EAIM DIET CHORD LOGIC</span>
                                    <span className="text-xs text-zinc-500">Speed: 1.0x</span>
                                </div>

                                {/* 실시간 연주 가이드 */}
                                <div className="space-y-3">
                                    {chords.map((item, idx) => {
                                        const isActive = currentTime >= item.time && (chords[idx+1] ? currentTime < chords[idx+1].time : true);
                                        return (
                                            <div key={idx} className={`glass-panel p-4 rounded-xl transition-all duration-300 flex items-center justify-between ${isActive ? 'active-chord' : 'opacity-40 scale-95'}`}>
                                                <div className="flex flex-col">
                                                    <span className="text-2xl font-black text-white">{item.chord}</span>
                                                    <span className="text-cyan-400 font-bold text-sm">{item.scale}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[10px] text-zinc-500 block mb-1">에임기타 운지</span>
                                                    <span className="bg-zinc-700 px-3 py-1 rounded-full text-xs text-zinc-200">{item.tip}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnsembleApp />);
    </script>
</body>
</html>
