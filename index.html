<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 과학 놀이터</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(160deg, #1e1b4b 0%, #4338ca 45%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 6vh;
            color: white;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 60% 45% at 15% 15%, rgba(167,139,250,0.35) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 90% 25%, rgba(129,140,248,0.3) 0%, transparent 60%),
                radial-gradient(ellipse 55% 45% at 50% 95%, rgba(196,181,253,0.2) 0%, transparent 60%);
        }

        .float-emoji {
            position: fixed; font-size: 3.5rem; opacity: 0.14;
            pointer-events: none; z-index: 0;
            animation: floatY ease-in-out infinite;
        }
        @keyframes floatY {
            0%,100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-16px) rotate(4deg); }
        }

        header { margin-bottom: 30px; padding: 0 20px; position: relative; z-index: 5; }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 99px; padding: 6px 18px;
            font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
            margin-bottom: 16px; backdrop-filter: blur(8px);
        }
        .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #c4b5fd; }

        header h1 {
            font-size: 2.1rem;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 900;
            letter-spacing: -0.02em;
        }
        header h1 .accent {
            background: linear-gradient(120deg, #c4b5fd, #93c5fd);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 0.92rem;
            opacity: 0.82;
            margin: 0 0 18px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .eaim-chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
        .eaim-chip {
            padding: 5px 14px; border-radius: 99px; font-size: 0.68rem; font-weight: 800;
            border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08);
        }

        .section-wrap { width: 92%; max-width: 850px; margin-bottom: 8px; position: relative; z-index: 5; }

        .flex-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding-bottom: 10px;
        }

        .card {
            flex: 0 0 calc(33.333% - 10px);
            max-width: calc(33.333% - 10px);
            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        .card:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        .card.science-card {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.24);
        }

        .icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .title {
            font-size: 0.95rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            word-break: keep-all;
        }
        .subtitle {
            font-size: 0.75rem;
            opacity: 0.8;
            line-height: 1.2;
            font-weight: 400;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .card {
                flex: 0 0 calc(50% - 8px);
                max-width: calc(50% - 8px);
                padding: 15px 5px;
            }
            header h1 { font-size: 1.7rem; }
            header p { font-size: 0.85rem; }
        }

        @media (max-width: 380px) {
            .title { font-size: 0.85rem; }
            .icon { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="float-emoji" style="top:8%;left:6%;animation-duration:7s">🧪</div>
    <div class="float-emoji" style="top:65%;right:8%;animation-duration:9s;animation-delay:2s">🌌</div>
    <div class="float-emoji" style="top:82%;left:10%;animation-duration:8s;animation-delay:1s">🔭</div>

    <header>
        <div class="hero-badge"><span class="dot"></span>EAIM · 과학 놀이터</div>
        <h1>🔬 EAIM <span class="accent">과학 놀이터</span></h1>
        <p>감정과 이야기로 배우는<br>과학 교과 AI 도구 모음</p>
        <div class="eaim-chips">
            <span class="eaim-chip">💛 Emotion</span>
            <span class="eaim-chip">🌿 Artscape</span>
            <span class="eaim-chip">💙 Interactive</span>
            <span class="eaim-chip">💜 Musicalization</span>
        </div>
    </header>

    <div class="section-wrap">
        <div class="flex-container">
            <a href="science.html" class="card science-card">
                <span class="icon">🕵️‍♂️</span>
                <span class="title">EAIM 생활 과학 공감 톡</span>
                <span class="subtitle">이성과 감성의 추리</span>
            </a>

            <a href="space.html" class="card science-card">
                <span class="icon">🌌</span>
                <span class="title">EAIM 태양계 오디세이</span>
                <span class="subtitle">3D 관측 + AI 미션</span>
            </a>

            <a href="observatory.html" class="card science-card">
                <span class="icon">🔭</span>
                <span class="title">EAIM 천문대 관측소</span>
                <span class="subtitle">NASA 정밀 관측 일지</span>
            </a>
        </div>
    </div>

    <footer>
        © 2026 EAIM Studio.
    </footer>

</body>
</html>
