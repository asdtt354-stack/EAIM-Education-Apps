<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 감정 시인 Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .font-serif { font-family: 'Gowun Batang', serif; }
        .eaim-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-radius: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 1px solid white; width: 100%; max-width: 600px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 1px solid #d1d5db; border-radius: 1rem; padding: 1rem; background: white !important; outline: none; transition: 0.3s; }
        .eaim-input:focus { border-color: #9d174d; ring: 2px ring-pink-100; }
        .eaim-btn-main { background: #be185d !important; color: white !important; border-radius: 1rem; padding: 1.1rem; font-weight: bold; width: 100%; transition: 0.3s; border: none; cursor: pointer; }
        .eaim-btn-main:hover { background: #9d174d !important; transform: translateY(-2px); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media print { .no-print { display: none !important; } .eaim-card { box-shadow: none !important; border: 1px solid #eee !important; width: 100% !important; max-width: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            // 1단계: 시 찾기
            const [searchQuery, setSearchQuery] = useState('윤동주 서시');
            const [foundPoem, setFoundPoem] = useState('');
            
            // 2단계: 시 감상 분석 (신규!)
            const [poemImpression, setPoemImpression] = useState('');
            
            // 3단계: 내 감정 입력
            const [myEmotion, setMyEmotion] = useState('');
            const [myColor, setMyColor] = useState('');
            const [mySituation, setMySituation] = useState('');
            const [myBody, setMyBody] = useState('');
            const [newEmotionName, setNewEmotionName] = useState('');
            
            // 4단계: 결과
            const [finalPoem, setFinalPoem] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_kor_pro');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                // 💡 디렉터님 환경 전용 2.5-flash 엔진 고정
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            // [함수] 시 검색
            const handleSearchPoem = async () => {
                setIsAnalyzing(true);
                try {
                    const text = await callGemini(`'${searchQuery}' 시의 전문을 정확하게 찾아주세요. 제목과 시인 이름을 포함해 정중하게 보여주세요.`);
                    setFoundPoem(text);
                    setStep(2);
                } catch (e) { alert('시를 찾지 못했습니다: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            // [함수] 시 창작 및 교사 피드백 생성
            const handleCreatePoem = async () => {
                setIsAnalyzing(true);
                setStep(5);
                try {
                    // 시 창작 프롬프트
                    const poemPrompt = `당신은 아이들의 마음을 어루만지는 시인입니다. 
                    학생이 읽은 시에 대한 느낌('${poemImpression}')과 학생의 현재 감정상태(단어: ${myEmotion}, 색깔: ${myColor}, 상황: ${mySituation}, 신체반응: ${myBody})를 융합하여 한 편의 아름다운 감정 시를 지어주세요. 
                    마지막에 지어준 감정의 이름인 '${newEmotionName}'이 상징적으로 드러나야 합니다.`;
                    const poemText = await callGemini(poemPrompt);
                    setFinalPoem(poemText);

                    // 교사 피드백 프롬프트
                    const feedbackPrompt = `당신은 사회정서학습(SEL) 전문 교사입니다. 위 시를 쓴 학생에게 따뜻한 피드백을 주세요. 
                    학생이 시를 통해 자신의 마음을 용기 있게 들여다본 점을 칭찬하고, '${myEmotion}'이라는 감정을 어떻게 소중히 다루면 좋을지 다정한 중학교 선생님 말투로 3~4문장 써주세요.`;
                    const feedbackText = await callGemini(feedbackPrompt);
                    setTeacherFeedback(feedbackText);
                } catch (e) { alert('오류 발생: ' + e.message); setStep(4); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="space-y-6 text-center animate-fadeIn">
                            <h2 className="text-2xl font-bold text-pink-800">EAIM 감정 시인 스튜디오</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="eaim-input text-center" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_kor_pro', apiKey.trim()); setStep(1); }} className="eaim-btn-main shadow-lg">입장하기</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div className="space-y-6">
                            <header className="flex justify-between items-center border-b pb-3 no-print">
                                <span className="font-bold text-pink-700 font-hand text-xl">감정 시인 Pro 📖</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key_kor_pro'); window.location.reload(); }} className="text-[10px] text-gray-400 underline">RESET</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="text-center">
                                        <h2 className="text-xl font-bold">1. 영감 얻기</h2>
                                        <p className="text-sm text-gray-500 mt-1">오늘의 마음을 열어줄 시를 검색해보세요.</p>
                                    </div>
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="eaim-input" placeholder="시인이나 시 제목 입력" />
                                    <button onClick={handleSearchPoem} disabled={isAnalyzing} className="eaim-btn-main">
                                        {isAnalyzing ? "시를 찾는 중..." : "시 불러오기 ✨"}
                                    </button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="bg-stone-50 p-6 rounded-2xl border border-stone-200 shadow-inner max-h-60 overflow-y-auto">
                                        <pre className="font-serif text-sm leading-loose whitespace-pre-wrap text-stone-700">{foundPoem}</pre>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="font-bold text-pink-800 ml-1">💬 이 시를 읽고 어떤 느낌이 들었나요?</label>
                                        <textarea value={poemImpression} onChange={e => setPoemImpression(e.target.value)} className="eaim-input h-24" placeholder="예: 슬프지만 따뜻한 위로를 받은 것 같아요."></textarea>
                                    </div>
                                    <button onClick={() => setStep(3)} disabled={!poemImpression} className="eaim-btn-main">내 감정 들여다보기 👉</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="text-center">
                                        <h2 className="text-xl font-bold">2. 내 마음 해부하기</h2>
                                        <p className="text-xs text-gray-400">지금 이 순간, 내 안의 소리에 집중해봐요.</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="text" value={myEmotion} onChange={e => setMyEmotion(e.target.value)} className="eaim-input text-sm" placeholder="지금 내 감정 (예: 설렘)" />
                                        <input type="text" value={myColor} onChange={e => setMyColor(e.target.value)} className="eaim-input text-sm" placeholder="감정의 색깔 (예: 연보라)" />
                                    </div>
                                    <input type="text" value={mySituation} onChange={e => setMySituation(e.target.value)} className="eaim-input text-sm" placeholder="언제 이런 기분이 드나요?" />
                                    <input type="text" value={myBody} onChange={e => setMyBody(e.target.value)} className="eaim-input text-sm" placeholder="몸의 반응 (예: 손끝이 간질거려요)" />
                                    <input type="text" value={newEmotionName} onChange={e => setNewEmotionName(e.target.value)} className="eaim-input font-bold border-pink-300" placeholder="✨ 이 감정에게 줄 새로운 이름" />
                                    <button onClick={handleCreatePoem} className="eaim-btn-main bg-gradient-to-r from-pink-700 to-rose-700">AI와 함께 시 완성하기 🪄</button>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-6 animate-fadeIn">
                                    {isAnalyzing ? (
                                        <div className="text-center py-20">
                                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-700 mx-auto mb-4"></div>
                                            <p className="text-pink-700 font-hand text-xl">당신의 마음을 시로 엮고,<br/>선생님이 정성껏 읽고 계십니다...</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-8">
                                            {/* 학생의 감정 시 영역 */}
                                            <div className="bg-white p-8 rounded-[2rem] border-2 border-pink-100 shadow-sm">
                                                <h3 className="text-center text-pink-800 font-hand text-2xl mb-6">나의 감정 시</h3>
                                                <pre className="font-serif text-lg leading-loose text-center whitespace-pre-wrap text-stone-800">{finalPoem}</pre>
                                            </div>

                                            {/* 선생님의 피드백 영역 (신규!) */}
                                            <div className="bg-pink-50 p-6 rounded-3xl border-l-8 border-pink-400 relative">
                                                <div className="absolute -top-4 left-6 bg-pink-400 text-white px-3 py-1 rounded-full text-xs font-bold">👩‍🏫 선생님의 마음 편지</div>
                                                <div className="font-hand text-lg text-pink-900 leading-relaxed mt-2 whitespace-pre-wrap">
                                                    {teacherFeedback}
                                                </div>
                                            </div>

                                            <div className="flex gap-2 no-print">
                                                <button onClick={() => window.print()} className="flex-1 bg-stone-800 text-white p-4 rounded-xl font-bold">🖨️ 시첩 인쇄하기</button>
                                                <button onClick={() => setStep(1)} className="flex-1 bg-pink-100 text-pink-700 p-4 rounded-xl font-bold border border-pink-200">새 시 쓰기</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
