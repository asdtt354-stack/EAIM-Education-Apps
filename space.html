<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 우주 탐험대 Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; }
        .font-serif { font-family: 'Gowun Dodum', serif; }
        
        .solar-system { 
            position: relative; width: 100%; height: 420px; 
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1);
        }
        .sun { width: 30px; height: 30px; background: #facc15; border-radius: 50%; box-shadow: 0 0 50px #facc15; z-index: 50; }
        
        /* 궤도 레이어: pointer-events none으로 설정하여 하위 클릭 방해 금지 */
        .orbit { 
            position: absolute; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 50%; pointer-events: none; 
        }
        .planet-wrap { 
            position: absolute; width: 100%; height: 100%; 
            animation: rotate linear infinite; pointer-events: none;
        }
        
        /* 💡 행성 본체: 여기서만 클릭(auto) 허용 */
        .planet { 
            position: absolute; border-radius: 50%; top: 0; left: 50%; transform: translate(-50%, -50%); 
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.6); 
            cursor: pointer; transition: 0.3s; pointer-events: auto; z-index: 60;
        }
        .planet:hover { filter: brightness(1.3); scale: 1.2; }
        .planet-label { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 8px; color: #94a3b8; white-space: nowrap; font-weight: bold; }

        /* 💡 줌인 효과 강화: 행성이 웅장하게 나타남 */
        .zoom-container { animation: zoomIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .big-planet { 
            width: 220px; height: 220px; border-radius: 50%; 
            margin: 0 auto; box-shadow: inset -15px -15px 40px rgba(0,0,0,0.8), 0 0 60px rgba(255,255,255,0.15);
            animation: big-spin linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes big-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        
        .log-card { background: #1e293b; border-radius: 1.5rem; border: 1px solid #334155; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(1); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v6') || '');
            const [selectedPlanet, setSelectedPlanet] = useState(null);
            const [logs, setLogs] = useState(JSON.parse(localStorage.getItem('eaim_space_logs_v6') || '[]'));
            const [currentLog, setCurrentLog] = useState({ science: '', emotion: '' });
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const planets = [
                { id: 1, name: '수성', size: 10, orbit: 75, period: 8, rot: 5, color: '#94a3b8', fact: '태양과 가장 가깝지만 얼음이 존재하기도 해요.', msg: '작은 고추가 맵다! 나의 숨겨진 힘을 믿어요.' },
                { id: 2, name: '금성', size: 16, orbit: 110, period: 15, rot: -20, color: '#fb923c', fact: '가장 뜨거운 행성으로, 해가 서쪽에서 떠요.', msg: '남들과 반대로 가도 괜찮아요. 나만의 길이니까요.' },
                { id: 3, name: '지구', size: 18, orbit: 150, period: 25, rot: 10, color: '#3b82f6', fact: '생명이 숨 쉬는 우주의 푸른 보석입니다.', msg: '우리는 모두 연결되어 있어요. 따뜻하게 안아줄게요.' },
                { id: 4, name: '화성', size: 14, orbit: 195, period: 35, rot: 12, color: '#ef4444', fact: '붉은 흙과 거대한 화산이 있는 신비의 별이에요.', msg: '용기를 내어 도전하세요. 열정은 붉게 타오릅니다.' },
                { id: 5, name: '목성', size: 34, orbit: 260, period: 60, rot: 4, color: '#d97706', fact: '지구보다 1,300배나 큰 태양계의 왕입니다.', msg: '거대한 포용력으로 모든 것을 감싸 안아주세요.' },
                { id: 6, name: '토성', size: 28, orbit: 330, period: 90, rot: 5, color: '#fde047', fact: '아름다운 고리는 수많은 얼음 조각으로 되어있죠.', msg: '나를 빛나게 하는 나만의 특별한 고리를 찾아요.' },
                { id: 7, name: '명왕성', size: 8, orbit: 390, period: 150, rot: 25, color: '#64748b', fact: '아주 멀고 춥지만 하트 모양의 지형이 발견됐어요.', msg: '멀리 있어도 마음만은 하트! 우리는 가족입니다.' }
            ];

            const callGemini = async (prompt) => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const handleSaveLog = async () => {
                setIsAnalyzing(true);
                try {
                    const prompt = `${selectedPlanet.name} 관찰 일지 피드백을 3문장 써줘. [발견:${currentLog.science}, 감정:${currentLog.emotion}]`;
                    const feedback = await callGemini(prompt);
                    const newLog = { ...currentLog, feedback, planet: selectedPlanet.name, date: new Date().toLocaleDateString(), id: Date.now() };
                    const updated = [newLog, ...logs];
                    setLogs(updated);
                    localStorage.setItem('eaim_space_logs_v6', JSON.stringify(updated));
                    setSelectedPlanet(null);
                    setStep(3);
                } catch (e) { alert('API Key를 확인해주세요.'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col p-6 shadow-2xl relative">
                    {!apiKey && (
                        <div className="absolute inset-0 bg-slate-900 z-[100] flex flex-col justify-center p-10 text-center">
                            <h2 className="text-xl font-bold text-indigo-400 mb-4">망원경 시스템 연결</h2>
                            <input type="password" onBlur={e => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key_v6', e.target.value);}} placeholder="API Key 입력" className="bg-slate-800 p-4 rounded-xl text-white outline-none" />
                        </div>
                    )}

                    <header className="flex justify-between items-center mb-6 z-10">
                        <h1 className="text-xl font-black text-indigo-400 font-serif">EAIM SPACE CENTER</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setStep(3)} className="text-[10px] bg-slate-800 px-3 py-1 rounded-full">나의 기록</button>
                            <button onClick={() => { setSelectedPlanet(null); setStep(1); }} className="text-[10px] bg-indigo-900 px-3 py-1 rounded-full">관측실</button>
                        </div>
                    </header>

                    {step === 1 && (
                        <div className="space-y-6 animate-fadeIn">
                            {!selectedPlanet ? (
                                <>
                                    <div className="text-center">
                                        <h2 className="text-xl font-bold text-indigo-200">태양계 탐사 중</h2>
                                        <p className="text-[10px] text-slate-500 mt-1 uppercase">탐험하고 싶은 행성을 직접 터치하세요</p>
                                    </div>
                                    <div className="solar-system shadow-2xl">
                                        <div className="sun"></div>
                                        {planets.map(p => (
                                            <div key={p.id} className="orbit" style={{ width: p.orbit, height: p.orbit, top: '50%', left: '50%', transform: 'translate(-50%, -50%)' }}>
                                                <div className="planet-wrap" style={{ animationDuration: `${p.period}s` }}>
                                                    <div 
                                                        className="planet" 
                                                        style={{ width: p.size, height: p.size, backgroundColor: p.color }} 
                                                        onClick={() => setSelectedPlanet(p)}
                                                    >
                                                        <span className="planet-label">{p.name}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-center text-[10px] text-slate-600 font-bold italic">※ 안쪽 행성(수성, 금성)도 이제 클릭이 가능합니다.</p>
                                </>
                            ) : (
                                <div className="zoom-container space-y-6 text-center">
                                    <h2 className="text-3xl font-black text-white">{selectedPlanet.name} 근접 촬영</h2>
                                    
                                    {/* 💡 줌인: 행성이 거대하게 돌아감 */}
                                    <div className="py-10">
                                        <div className="big-planet" style={{ 
                                            backgroundColor: selectedPlanet.color,
                                            animationDuration: `${Math.abs(selectedPlanet.rot)}s`,
                                            animationDirection: selectedPlanet.rot < 0 ? 'reverse' : 'normal'
                                        }}></div>
                                    </div>

                                    <div className="bg-indigo-900/30 p-6 rounded-3xl border border-indigo-500/30 text-left">
                                        <p className="text-xs text-indigo-400 font-bold mb-1 uppercase tracking-tighter">Planet Data</p>
                                        <p className="text-sm mb-4">{selectedPlanet.fact}</p>
                                        <p className="text-xs text-pink-400 font-bold mb-1 uppercase tracking-tighter">SEL Message</p>
                                        <p className="text-sm font-serif italic text-indigo-100">"{selectedPlanet.msg}"</p>
                                    </div>

                                    <div className="flex gap-3">
                                        <button onClick={() => setStep(2)} className="flex-1 bg-indigo-600 p-4 rounded-2xl font-bold">기록하기 ✍️</button>
                                        <button onClick={() => setSelectedPlanet(null)} className="bg-slate-800 p-4 rounded-2xl font-bold">뒤로가기</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-4 animate-fadeIn">
                            <h2 className="text-xl font-bold text-center text-pink-400">{selectedPlanet.name} 탐사 일지</h2>
                            <textarea value={currentLog.science} onChange={e => setCurrentLog({...currentLog, science: e.target.value})} className="w-full bg-slate-900 p-4 rounded-2xl h-24 text-sm" placeholder="무엇을 관찰했나요?"></textarea>
                            <textarea value={currentLog.emotion} onChange={e => setCurrentLog({...currentLog, emotion: e.target.value})} className="w-full bg-slate-900 p-4 rounded-2xl h-24 text-sm" placeholder="어떤 마음이 드나요?"></textarea>
                            <button onClick={handleSaveLog} disabled={isAnalyzing} className="w-full bg-indigo-600 p-5 rounded-2xl font-bold shadow-xl">
                                {isAnalyzing ? "전송 중..." : "일지 저장 및 전송 🛸"}
                            </button>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="space-y-6 animate-fadeIn pb-10">
                            <h2 className="text-2xl font-bold text-center text-indigo-300">나의 우주 기록장</h2>
                            <div className="space-y-4">
                                {logs.length === 0 ? <p className="text-center py-20 text-slate-600 italic">아직 기록이 없습니다.</p> : 
                                 logs.map(log => (
                                    <div key={log.id} className="log-card p-5 space-y-3">
                                        <div className="flex justify-between items-center border-b border-white/5 pb-2 text-[10px] font-bold text-indigo-400">
                                            <span>{log.date} | {log.planet} 탐사</span>
                                            <button onClick={() => setLogs(logs.filter(l => l.id !== log.id))} className="text-red-500">삭제</button>
                                        </div>
                                        <p className="text-xs text-slate-200">🔍 {log.science}</p>
                                        <p className="text-xs text-slate-400 italic font-serif">✨ {log.emotion}</p>
                                        <div className="bg-indigo-950/40 p-4 rounded-xl text-[11px] text-indigo-200 border-l-4 border-indigo-500 font-serif leading-relaxed">{log.feedback}</div>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => setStep(1)} className="w-full bg-slate-800 p-4 rounded-xl font-bold mt-4">관측실로 돌아가기</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
