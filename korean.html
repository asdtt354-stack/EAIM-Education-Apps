<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 국어 감성 시인 & 편지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center; /* 가로 중앙 정렬 */
            align-items: flex-start; /* 상단부터 시작 */
            color: #444;
        }
        .font-hand { font-family: 'Gaegu', cursive; }
        
        /* 중앙 집중형 카드 스타일 */
        .eaim-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border: 2px solid white;
            width: 100%;
        }

        .eaim-input {
            background: white !important;
            border: 2px solid #e2e8f0 !important;
            border-radius: 1.2rem !important;
            color: #333 !important;
        }

        .eaim-btn-main {
            background: #5f7adb !important;
            color: white !important;
            border-radius: 1.5rem !important;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; transform: none !important; }
        .eaim-btn-main:hover:not(:disabled) { transform: scale(1.03); shadow: 0 10px 20px rgba(0,0,0,0.1); }

        @media print {
            body { background: white !important; color: black !important; }
            .print-hidden { display: none !important; }
            .eaim-card { border: 1px solid #ccc !important; box-shadow: none !important; background: white !important; }
        }
    </style>
</head>
<body>
