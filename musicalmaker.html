<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 뮤지컬 메이커 v2.5</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a0509; color: #FFF; margin: 0; padding: 0; overflow-x: hidden; }
        .stage-curtain { background: linear-gradient(to bottom, #9F1239, #881337); border-bottom: 4px solid #FCD34D; position: sticky; top: 0; z-index: 50; }
        .ticket-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: white; outline: none; border-radius: 0.5rem; width: 100%; padding: 0.8rem 1rem; font-size: 0.9rem; transition: 0.3s; }
        .ticket-input:focus { border-color: #FCD34D; background: rgba(255, 255, 255, 0.12); }
        .magic-btn { background: linear-gradient(45deg, #FCD34D, #F59E0B); color: #000; border-radius: 0.75rem; font-weight: 800; padding: 1rem; border: none; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(252, 211, 77, 0.3); }
        .magic-btn:active { transform: scale(0.98); }
        .ai-help-btn { background: rgba(252, 211, 77, 0.15); color: #FCD34D; border: 1px solid #FCD34D; border-radius: 0.5rem; font-size: 0.75rem; padding: 0.4rem 0.8rem; cursor: pointer; }
        .edit-area { background: rgba(0,0,0,0.4); color: #FDE68A; font-family: 'Gowun Batang', serif; line-height: 1.8; width: 100%; min-height: 500px; padding: 1.5rem; border: 1px dashed rgba(252, 211, 77, 0.3); border-radius: 0.5rem; outline: none; font-size: 1.1rem; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .step-indicator { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .step-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); }
        .step-dot.active { background: #FCD34D; box-shadow: 0 0 10px #FCD34D; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v25') || '');
            const [loading, setLoading] = useState(false);
            
            const [place, setPlace] = useState('');
            const [plots, setPlots] = useState({ ki: '', seung: '', jeon: '', gyeol: '' });
            const [title, setTitle] = useState('');
            const [castList, setCastList] = useState([{ name: '', trait: '' }]);
            const [results, setResults] = useState('');

            const addCastMember = () => setCastList([...castList, { name: '', trait: '' }]);
            const removeCastMember = (index) => {
                const newList = castList.filter((_, i) => i !== index);
                setCastList(newList.length ? newList : [{ name: '', trait: '' }]);
            };

            // ★ 박성애 대표님의 절대 공식: 제미나이 2.5 플래시 엔진 연동 ★
            const callGeminiV25 = async (prompt) => {
                if (!apiKey) { alert("API 키를 입력해주세요."); return null; }
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (data.error) { alert("v2.5 엔진 오류: " + data.error.message); return null; }
                    return data.candidates[0].content.parts[0].text;
                } catch (e) { alert("v2.5 연동 실패. 인터넷을 확인해주세요."); return null; }
            };

            const getAIHelp = async () => {
                if (!plots.ki) return alert("줄거리 '기' 부분을 먼저 적어주세요.");
                setLoading(true);
                const prompt = `배경:${place}, 기:${plots.ki}, 승:${plots.seung}, 전:${plots.jeon}, 결:${plots.gyeol}. 이 내용을 바탕으로 뮤지컬 '제목'과 '등장인물 성격'을 추천해줘. 형식: 1줄 제목, 그다음줄부터 캐릭터이름:성격`;
                const res = await callGeminiV25(prompt);
                if (res) {
                    const lines = res.split('\n').filter(l => l.trim() !== "");
                    setTitle(lines[0].replace(/제목:|#/g, "").trim());
                    const newCast = lines.slice(1).map(line => {
                        const [name, trait] = line.split(':');
                        return { name: (name || '').trim(), trait: (trait || '').trim() };
                    });
                    setCastList(newCast);
                }
                setLoading(false);
            };

            const generateFinal = async () => {
                if (!title) return alert("제목을 입력해주세요.");
                setLoading(true);
                const castString = castList.map(c => `${c.name}(${c.trait})`).join(', ');
                
                const prompt = `
                제목: ${title}
                배경: ${place}
                캐릭터: ${castString}
                줄거리: ${plots.ki}-${plots.seung}-${plots.jeon}-${plots.gyeol}

                위 내용을 바탕으로 초중등 학생용 뮤지컬 대본을 써줘. 
                [작성 가이드]
                1. 시작은 모든 출연진의 '오프닝 코러스' 넘버로 시작할 것.
                2. 마지막은 모든 배우의 '커튼콜' 넘버를 반드시 포함할 것.
                3. 신별 영문 배경 이미지 프롬프트와 Suno AI 음악 프롬프트를 포함할 것.
                `;

                const res = await callGeminiV25(prompt);
                if (res) { setResults(res); setStep(2); }
                setLoading(false);
            };

            // ★ 대본 파일 다운로드 함수 ★
            const downloadScript = () => {
                if (!results) return;
                const element = document.createElement("a");
                const file = new Blob([results], {type: 'text/plain'});
                element.href = URL.createObjectURL(file);
                element.download = `${title || 'EAIM_뮤지컬대본'}.txt`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };

            return (
                <div className="min-h-screen pb-10">
                    <div className="stage-curtain p-4 text-center">
                        <h1 className="text-2xl text-yellow-300 font-bold tracking-widest uppercase font-black">EAIM Musical Maker v2.5</h1>
                        <p className="text-[10px] opacity-60">GEMINI 2.5 FLASH ENGINE ACTIVE</p>
                    </div>

                    <div className="max-w-2xl mx-auto p-4 space-y-6">
                        <div className="step-indicator">
                            <div className={`step-dot ${step === 0 ? 'active' : ''}`}></div>
                            <div className={`step-dot ${step === 1 ? 'active' : ''}`}></div>
                            <div className={`step-dot ${step === 2 ? 'active' : ''}`}></div>
                        </div>

                        {step === 0 && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="p-4 bg-white/5 rounded-xl border border-white/10">
                                    <label className="text-xs text-yellow-500 block mb-2 font-bold uppercase tracking-widest text-center">v2.5 API Key Lock</label>
                                    <input type="password" value={apiKey} onChange={(e) => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key_v25', e.target.value);}} className="ticket-input text-center" placeholder="API 키를 입력하세요" />
                                </div>
                                <div className="space-y-3 bg-white/5 p-4 rounded-xl border border-white/5">
                                    <h2 className="text-yellow-400 font-bold">1단계: 스토리 기승전결</h2>
                                    <input value={place} onChange={e => setPlace(e.target.value)} className="ticket-input mb-1" placeholder="배경 장소" />
                                    <textarea value={plots.ki} onChange={e => setPlots({...plots, ki: e.target.value})} className="ticket-input h-14" placeholder="기: 발단" />
                                    <textarea value={plots.seung} onChange={e => setPlots({...plots, seung: e.target.value})} className="ticket-input h-14" placeholder="승: 전개" />
                                    <textarea value={plots.jeon} onChange={e => setPlots({...plots, jeon: e.target.value})} className="ticket-input h-14" placeholder="전: 위기" />
                                    <textarea value={plots.gyeol} onChange={e => setPlots({...plots, gyeol: e.target.value})} className="ticket-input h-14" placeholder="결: 해결" />
                                    <button onClick={() => setStep(1)} className="w-full mt-4 py-3 bg-white/10 rounded-xl font-bold hover:bg-white/20 transition text-yellow-300">캐릭터 설정으로 가기 👉</button>
                                </div>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-4 bg-white/5 p-4 rounded-xl border border-yellow-500/20 animate-fadeIn">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-yellow-400 font-bold">2단계: 제목 및 캐릭터</h2>
                                    <button onClick={getAIHelp} disabled={loading} className="ai-help-btn">AI 자동추천</button>
                                </div>
                                <input value={title} onChange={e => setTitle(e.target.value)} className="ticket-input font-bold text-yellow-200" placeholder="뮤지컬 제목" />
                                <div className="space-y-2">
                                    {castList.map((member, index) => (
                                        <div key={index} className="flex gap-2">
                                            <input value={member.name} onChange={e => {const newList = [...castList]; newList[index].name = e.target.value; setCastList(newList);}} className="ticket-input w-1/3" placeholder="배역" />
                                            <input value={member.trait} onChange={e => {const newList = [...castList]; newList[index].trait = e.target.value; setCastList(newList);}} className="ticket-input flex-1" placeholder="성격/특징" />
                                            <button onClick={() => removeCastMember(index)} className="px-3 text-red-400">×</button>
                                        </div>
                                    ))}
                                    <button onClick={addCastMember} className="w-full py-2 text-xs border border-dashed border-white/20 rounded-lg text-gray-400">+ 인물 추가</button>
                                </div>
                                <div className="flex gap-2 mt-6">
                                    <button onClick={() => setStep(0)} className="flex-1 py-4 bg-white/5 rounded-xl font-bold">👈 이전 단계</button>
                                    <button onClick={generateFinal} disabled={loading} className="flex-[2] magic-btn text-lg">
                                        {loading ? "대본 집필 중..." : "최종 대본 생성"}
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="animate-fadeIn space-y-4">
                                <h2 className="text-yellow-400 font-bold flex justify-between items-center">
                                    <span>3단계: 완성된 v2.5 대본</span>
                                    <button onClick={() => setStep(1)} className="text-xs text-gray-400 underline italic">👈 돌아가서 수정하기</button>
                                </h2>
                                <textarea className="edit-area shadow-2xl" value={results} onChange={e => setResults(e.target.value)} />
                                <div className="grid grid-cols-2 gap-3 mt-4">
                                    <button onClick={() => {navigator.clipboard.writeText(results); alert('대본이 클립보드에 복사되었습니다.');}} className="py-4 bg-white/10 border border-white/20 rounded-xl font-bold hover:bg-white/20 transition flex flex-col items-center gap-1">
                                        <i className="fas fa-copy"></i><span className="text-xs">대본 복사</span>
                                    </button>
                                    <button onClick={downloadScript} className="py-4 bg-yellow-600 rounded-xl font-bold hover:bg-yellow-500 transition shadow-lg flex flex-col items-center gap-1">
                                        <i className="fas fa-download"></i><span className="text-xs">파일로 저장 (.txt)</span>
                                    </button>
                                </div>
                                <button onClick={() => {if(confirm('모든 내용이 초기화됩니다.')) setStep(0);}} className="w-full py-3 text-[10px] text-gray-600 uppercase tracking-widest">Restart System</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
