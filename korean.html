<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>에임(EAIM) 국어 감정 시인 & 편지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F8FAFC; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 인쇄 전용 스타일 */
        @media print {
            body { background-color: white; }
            .print-hidden { display: none !important; }
            .print-area { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .print-title { font-size: 24pt; margin-bottom: 20px; }
            .print-text { font-size: 16pt; line-height: 2; color: black; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const KoreanEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [finalResult, setFinalResult] = useState('');

            // 시 검색 상태
            const [searchQuery, setSearchQuery] = useState('신미나 싱고');
            const [readingPoem, setReadingPoem] = useState('');

            // 학생 입력 상태
            const [emotionWord, setEmotionWord] = useState('');
            const [emotionColor, setEmotionColor] = useState('');
            const [situation, setSituation] = useState('');
            const [bodyPart, setBodyPart] = useState('');
            const [bodySensation, setBodySensation] = useState('');
            const [appearance, setAppearance] = useState('');
            const [relationship, setRelationship] = useState('');
            const [emotionName, setEmotionName] = useState('');

            // 상호작용: 친구에게 편지 쓰기 상태
            const [friendName, setFriendName] = useState('');
            const [friendPoem, setFriendPoem] = useState('');
            const [draftLetter, setDraftLetter] = useState('');

            const words = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '억울한', '편안한', '신나는', '부끄러운', '포근한'];
            const colors = [
                { name: '빨강', code: '#EF4444' }, { name: '주황', code: '#F97316' }, { name: '노랑', code: '#FBBF24' },
                { name: '초록', code: '#34D399' }, { name: '파랑', code: '#3B82F6' }, { name: '보라', code: '#8B5CF6' },
                { name: '회색', code: '#9CA3AF' }, { name: '검정', code: '#1F2937' }
            ];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key', apiKey);
                setStep(1);
            };

            const fetchPoem = async () => {
                if (!apiKey) return alert('API 키가 없습니다.');
                setIsAnalyzing(true);
                const prompt = `당신은 국어 교사입니다. '${searchQuery}'에 해당하는 시의 제목, 작가, 본문만 출력해주세요. 정확한 시를 못 찾으면 주제에 맞는 시를 한 편 추천해주세요.`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setReadingPoem(data.candidates[0].content.parts[0].text);
                } catch (e) {
                    setReadingPoem('시를 불러오지 못했습니다.');
                } finally { setIsAnalyzing(false); }
            };

            const generatePoem = async () => {
                setIsAnalyzing(true); setStep(6);
                const prompt = `당신은 문학 교사입니다. 학생의 데이터로 시를 작성해주세요.
                감정: ${emotionColor}색의 '${emotionWord}' / 상황: ${situation} / 신체: ${bodyPart}에서 ${bodySensation} 느낌 / 모습: ${appearance} / 관계: ${relationship} / 이름: ${emotionName}
                [가이드라인] 1연: 상황과 이름, 2연: 감정의 특징, 3연: 감정과 나의 관계.
                끝에 영문 1줄씩 추가: 'Suno Prompt: (장르/악기)', 'Image Prompt: (삽화 묘사)'`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setFinalResult(data.candidates[0].content.parts[0].text);
                } catch (e) { setFinalResult('오류 발생'); } finally { setIsAnalyzing(false); }
            };

            // 4. 친구 시에 편지 쓰기 (Interactive 기능)
            const generateLetter = async () => {
                if(!friendPoem) return alert('친구의 시를 입력해주세요.');
                setIsAnalyzing(true);
                
                const prompt = `당신은 학생들의 공감을 돕는 따뜻한 보조 교사입니다. 한 학생이 친구(${friendName})의 시를 읽고 공감 편지를 쓰려고 합니다. 
                아래 [친구의 시]를 분석하여 초등학생/중학생 말투(다정한 반말)로 편지 초안을 작성해주세요.
                
                [친구의 시]
                ${friendPoem}

                [작성 가이드라인: 공감 듣기 3단계 필수 포함]
                1. 첫 인사 ("안녕, ${friendName}아!")
                2. 인상 깊은 구절 인용 ("너의 시에서 ~라는 구절을 보았어.")
                3. 감정 알아주기 ("그때 네 마음이 ~했을 것 같아.")
                4. 진짜 바람 짐작하기 ("네가 진짜 원하는 건 ~가 아닐까 하는 생각이 들었어.")
                5. 시의 표현 칭찬 및 따뜻한 마무리
                `;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setDraftLetter(data.candidates[0].content.parts[0].text);
                } catch (e) { setDraftLetter('편지 작성 중 오류가 발생했습니다.'); } finally { setIsAnalyzing(false); }
            };

            const printContent = () => window.print();
            const copyText = (text) => navigator.clipboard.writeText(text).then(() => alert("복사되었습니다!"));

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col relative print-area overflow-hidden">
                    <header className="bg-indigo-600 p-4 text-white flex justify-between items-center shadow-md print-hidden">
                        <h1 className="text-lg font-bold">EAIM 나만의 감정 시 & 공감</h1>
                        {step > 0 && <button onClick={() => setStep(0)} className="text-xs bg-indigo-800 px-2 py-1 rounded">설정</button>}
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto pb-24 print-area">
                        {step === 0 && (
                            <div className="space-y-4 py-10 print-hidden">
                                <h2 className="text-xl font-bold">⚙️ Gemini API 설정</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full border p-3 rounded-lg" />
                                <button onClick={saveApiKey} className="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold">저장하고 시작하기</button>
                            </div>
                        )}

                        {/* Step 1~4는 동일하게 유지 (코드 길이 상 축약 없이 전체 동작) */}
                        {step === 1 && (
                            <div className="space-y-4 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-hand text-indigo-700">1. 오늘의 시 읽기 📖</h2>
                                <div className="flex gap-2">
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="flex-grow border border-indigo-200 p-3 rounded-xl" placeholder="검색어 입력" />
                                    <button onClick={fetchPoem} className="bg-indigo-600 text-white px-4 rounded-xl font-bold">AI 검색</button>
                                </div>
                                <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 min-h-[200px]">
                                    {isAnalyzing ? <div className="text-indigo-500 font-hand text-center pt-10">찾는 중...</div> : 
                                    <textarea value={readingPoem} onChange={e => setReadingPoem(e.target.value)} className="w-full h-64 bg-transparent outline-none font-hand text-lg leading-loose resize-none" placeholder="시가 나타납니다."></textarea>}
                                </div>
                                <button onClick={() => setStep(2)} disabled={!readingPoem} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">이 시로 수업 시작 👉</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-hand text-indigo-700">2. 감정 색깔과 단어</h2>
                                <div className="flex gap-2 overflow-x-auto pb-2">{colors.map(c => <button key={c.name} onClick={() => setEmotionColor(c.name)} className={`w-12 h-12 flex-shrink-0 rounded-full border-4 ${emotionColor === c.name ? 'border-indigo-600 scale-110' : 'border-transparent'}`} style={{backgroundColor: c.code}}></button>)}</div>
                                <div className="flex flex-wrap gap-2">{words.map(w => <button key={w} onClick={() => setEmotionWord(w)} className={`px-4 py-2 rounded-full font-hand border ${emotionWord === w ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600'}`}>{w}</button>)}</div>
                                <button onClick={() => setStep(3)} disabled={!emotionColor || !emotionWord} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold mt-4">다음 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-4 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-hand text-indigo-700">3. 감정 관찰</h2>
                                <textarea value={situation} onChange={e => setSituation(e.target.value)} className="w-full border p-3 rounded-xl font-hand" placeholder="① 언제 느꼈나요?"></textarea>
                                <div className="flex gap-2 items-center bg-indigo-50 p-2 rounded-xl border">
                                    <select value={bodyPart} onChange={e => setBodyPart(e.target.value)} className="p-2 rounded bg-white font-hand border"><option value="">부위선택</option><option value="머리">머리</option><option value="가슴">가슴</option><option value="배">배</option><option value="손발">손발</option></select>
                                    <textarea value={bodySensation} onChange={e => setBodySensation(e.target.value)} className="w-full border p-2 rounded font-hand" placeholder="② 어떤 느낌?"></textarea>
                                </div>
                                <textarea value={appearance} onChange={e => setAppearance(e.target.value)} className="w-full border p-3 rounded-xl font-hand" placeholder="③ 모양, 소리, 냄새 등"></textarea>
                                <button onClick={() => setStep(4)} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">다음 👉</button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-4 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-hand text-indigo-700">4. 감정 이름 짓기</h2>
                                <textarea value={relationship} onChange={e => setRelationship(e.target.value)} className="w-full border p-3 rounded-xl font-hand" placeholder="④ 이 감정과 나는 어떤 사이?"></textarea>
                                <input type="text" value={emotionName} onChange={e => setEmotionName(e.target.value)} className="w-full border p-4 rounded-xl font-hand text-2xl text-center" placeholder="⑤ 새 이름 (예: 싱고)" />
                                <button onClick={generatePoem} disabled={!emotionName} className="w-full bg-purple-600 text-white p-4 rounded-xl font-bold flex justify-center items-center gap-2"><span>AI 시인에게 맡기기</span> <span>✨</span></button>
                            </div>
                        )}

                        {step === 6 && (
                            <div className="space-y-6 animate-fade-in print-area">
                                <h2 className="text-2xl font-bold font-hand text-center text-gray-800 print-title print-hidden">📖 완성된 나의 감정 시</h2>
                                <div className="bg-indigo-50 p-6 rounded-3xl border-2 border-indigo-100 min-h-[300px] print-area print-text">
                                    {isAnalyzing ? <div className="text-center pt-10 font-hand">시를 짓는 중...</div> : <div className="whitespace-pre-wrap font-hand text-lg">{finalResult}</div>}
                                </div>
                                {!isAnalyzing && (
                                    <div className="flex flex-col gap-3 print-hidden">
                                        <div className="flex gap-2">
                                            <button onClick={() => copyText(finalResult)} className="flex-1 bg-yellow-400 text-yellow-900 p-3 rounded-xl font-bold">📋 시 복사</button>
                                            <button onClick={printContent} className="flex-1 bg-blue-500 text-white p-3 rounded-xl font-bold">🖨️ 인쇄</button>
                                        </div>
                                        <button onClick={() => setStep(7)} className="w-full bg-pink-500 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-pink-600 flex justify-center items-center gap-2">
                                            <span>💌 친구 시에 공감 편지 쓰기</span>
                                        </button>
                                        <button onClick={() => { setStep(1); setFinalResult(''); }} className="w-full bg-gray-200 text-gray-700 p-3 rounded-xl font-bold">새로운 감정 만나기</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Step 7: 상호작용 (친구에게 편지 쓰기) */}
                        {step === 7 && (
                            <div className="space-y-6 animate-fade-in print-area">
                                <h2 className="text-2xl font-hand text-pink-600 print-title">💌 친구에게 공감 편지 쓰기</h2>
                                <p className="text-sm text-gray-600 font-bold print-hidden">친구의 시를 읽고, 공감의 마음을 담아 편지를 전해보세요.</p>
                                
                                <div className="space-y-3 print-hidden">
                                    <input type="text" value={friendName} onChange={e => setFriendName(e.target.value)} className="w-full border-2 border-pink-200 p-3 rounded-xl font-hand text-lg focus:border-pink-400" placeholder="친구의 이름" />
                                    <textarea value={friendPoem} onChange={e => setFriendPoem(e.target.value)} className="w-full border-2 border-pink-200 p-4 rounded-xl font-hand text-lg h-32 focus:border-pink-400" placeholder="여기에 친구가 쓴 시를 붙여넣어 주세요."></textarea>
                                    <button onClick={generateLetter} disabled={!friendPoem || !friendName} className="w-full bg-pink-500 text-white p-4 rounded-xl font-bold shadow-lg disabled:opacity-50">AI 공감 도우미와 함께 쓰기 ✍️</button>
                                </div>

                                {/* 생성된 편지 영역 */}
                                {(isAnalyzing || draftLetter) && (
                                    <div className="bg-pink-50 p-6 rounded-3xl border-2 border-pink-200 min-h-[250px] print-area print-text mt-4">
                                        {isAnalyzing ? (
                                            <div className="flex flex-col items-center justify-center h-40">
                                                <div className="animate-spin rounded-full h-8 w-8 border-b-4 border-pink-500"></div>
                                                <p className="mt-4 text-pink-600 font-hand font-bold">다정한 편지 초안을 작성 중...</p>
                                            </div>
                                        ) : (
                                            <textarea value={draftLetter} onChange={e => setDraftLetter(e.target.value)} className="w-full h-64 bg-transparent outline-none font-hand text-lg leading-loose resize-none" placeholder="수정 가능한 편지 내용입니다."></textarea>
                                        )}
                                    </div>
                                )}

                                {draftLetter && !isAnalyzing && (
                                    <div className="flex gap-2 print-hidden">
                                        <button onClick={() => copyText(draftLetter)} className="flex-1 bg-yellow-400 text-yellow-900 p-3 rounded-xl font-bold">📋 편지 복사</button>
                                        <button onClick={printContent} className="flex-1 bg-blue-500 text-white p-3 rounded-xl font-bold">🖨️ 편지 인쇄</button>
                                    </div>
                                )}
                                <button onClick={() => setStep(6)} className="w-full bg-gray-200 text-gray-700 p-3 rounded-xl font-bold mt-4 print-hidden">내 시로 돌아가기</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KoreanEAIMApp />);
    </script>
</body>
</html>
