<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM POWER-CHORD ENSEMBLE</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .station-card { background: rgba(30, 41, 59, 0.4); border: 2px solid #1e293b; border-radius: 1.5rem; padding: 1.2rem; transition: 0.3s; }
        .active-station { border-color: #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.2); background: rgba(244, 63, 94, 0.05); }
        
        /* 💡 파워코드 전용 듀얼 버블 */
        .power-bubble { width: 55px; height: 55px; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .note-1 { background-color: #f43f5e; color: white; } /* 근음 */
        .note-5 { background-color: #3b82f6; color: white; } /* 5음 */

        .youtube-box { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; border-radius: 1.5rem; overflow: hidden; background: #000; border: 2px solid #334155; }
        .youtube-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [videoUrl, setVideoUrl] = useState('');
            const [currentTime, setCurrentTime] = useState(0);
            const [timeline, setTimeline] = useState([]);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_ensemble');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const handleAnalyze = async () => {
                if (!searchQuery) return alert("곡 제목을 입력하세요!");
                setStep(2);
                
                const prompt = `곡 '${searchQuery}'을 분석하여 [부는악기/기타/건반]용 JSON을 만드세요.
                1. 기타는 '파워코드(근음+5음)' 구성음만 추출하세요.
                [{"time":0, "chord":"C5", "wind":"도", "guitar":["도","솔"], "key":["도","미","솔"], "drum":"쿵 팍"} , ...] 형식만 출력.`;

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const jsonStr = data.candidates[0].content.parts[0].text.match(/\[.*\]/s)[0];
                    setTimeline(JSON.parse(jsonStr));
                    setVideoUrl(`https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(searchQuery + " 가사")}`);
                    setStep(3);
                } catch (e) {
                    setTimeline([{time:0, chord:"C5", wind:"도", guitar:["도","솔"], key:["도","미","솔"], drum:"쿵 팍"}]);
                    setStep(3);
                }
            };

            const currentData = timeline.find((item, index) => {
                const nextItem = timeline[index + 1];
                return currentTime >= item.time && (!nextItem || currentTime < nextItem.time);
            }) || { chord: '-', wind: '-', guitar:['-','-'], key:['-','-','-'], drum: '-' };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col p-5">
                    {step === 0 && (
                        <div className="flex-grow flex flex-col justify-center text-center">
                            <h2 className="text-2xl font-bold text-rose-500 mb-6 font-title tracking-widest uppercase">Power Chord Engine</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center mb-4" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_ensemble', apiKey.trim()); setStep(1); }} className="bg-rose-600 p-4 rounded-xl font-bold">합주 시스템 가동</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="flex-grow flex flex-col justify-center space-y-8 animate-fadeIn">
                            <div className="text-center">
                                <div className="text-6xl mb-4">🎸</div>
                                <h2 className="text-2xl font-bold font-title">EAIM 퀵 밴드</h2>
                                <p className="text-slate-500 text-sm mt-2 font-bold">파워코드로 원곡 정복하기</p>
                            </div>
                            <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-slate-800 p-5 rounded-2xl text-white text-center font-bold text-xl" placeholder="곡 제목을 적어주세요" />
                            <button onClick={handleAnalyze} className="w-full bg-rose-600 p-5 rounded-2xl font-bold text-lg shadow-xl">분석 시작 🔍</button>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="flex-grow flex flex-col animate-fadeIn space-y-3">
                            <header className="flex justify-between items-center font-title text-rose-500">
                                <span className="text-xl">{currentData.chord}</span>
                                <button onClick={() => window.location.reload()} className="text-[10px] text-slate-500 underline">EXIT</button>
                            </header>

                            <div className="youtube-box">
                                <iframe src={videoUrl} frameBorder="0" allowFullScreen></iframe>
                            </div>

                            <div className="grid grid-cols-1 gap-2">
                                {/* 1. 기타 파워코드 스테이션 (집중 강화!) */}
                                <div className="station-card active-station flex items-center justify-between">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-bold text-rose-500 uppercase">Guitar (파워코드)</span>
                                        <span className="text-[9px] text-slate-500 italic">검지와 약지로 짚으세요!</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="power-bubble note-1 animate-pulse"><span className="text-[8px] opacity-70">근음</span>{currentData.guitar[0]}</div>
                                        <div className="power-bubble note-5"><span className="text-[8px] opacity-70">5음</span>{currentData.guitar[1]}</div>
                                    </div>
                                </div>

                                {/* 2. 부는 악기 스테이션 */}
                                <div className="station-card flex items-center justify-between py-2">
                                    <span className="text-[10px] font-bold text-indigo-400 uppercase">Wind (근음)</span>
                                    <div className="text-xl font-black text-indigo-400 border-2 border-indigo-900 px-4 py-1 rounded-full">{currentData.wind}</div>
                                </div>

                                {/* 3. 건반 스테이션 */}
                                <div className="station-card flex items-center justify-between py-2">
                                    <span className="text-
