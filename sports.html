<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM 농구 리듬 로그 (AI 관찰기록)</title>
    <style>
        :root { --primary: #e67e22; --secondary: #2c3e50; --bg: #f8f9fa; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--secondary); line-height: 1.6; padding: 20px; max-width: 600px; margin: auto; }
        h1 { text-align: center; color: var(--secondary); font-size: 1.5rem; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .api-section { background: #fff3e0; border: 1px solid #ffe0b2; }
        button { background-color: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; font-weight: bold; margin-top: 25px; transition: 0.3s; }
        button:hover { background-color: #d35400; }
        #resultArea { display: none; margin-top: 20px; animation: fadeIn 0.5s; }
        .result-content { background: #e8f5e9; border-left: 5px solid #4caf50; padding: 15px; white-space: pre-wrap; font-size: 0.95rem; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <h1>🏀 EAIM 농구 리듬 로그</h1>

    <div class="card api-section">
        <label>🔑 Gemini API KEY</label>
        <input type="password" id="apiKey" placeholder="여기에 API 키를 입력하세요">
    </div>

    <div class="card">
        <label>👤 학생 이름 (16명 남학생)</label>
        <select id="studentName">
            <script>
                for(let i=1; i<=16; i++) {
                    document.write(`<option value="학생 ${i}">학생 ${i}</option>`);
                }
            </script>
        </select>

        <label>😊 1. Emotion (오늘의 기분)</label>
        <select id="mood">
            <option>매우 활기참</option>
            <option>평온함</option>
            <option>조금 지침</option>
            <option>집중력이 필요한 상태</option>
        </select>

        <label>💬 3. Interactive (연습 소감)</label>
        <textarea id="reflection" rows="3" placeholder="오늘 드리블이나 슛 연습 중 어떤 느낌이 들었나요?"></textarea>

        <label>🎵 4. Musicalization (드리블 BPM)</label>
        <input type="number" id="bpm" value="120" min="60" max="200">
        <small style="color: #666;">* BPM에 따라 나중에 '다이어트 코드'가 매칭됩니다.</small>
    </div>

    <button onclick="askGemini()">AI 관찰기록 및 분석 생성</button>

    <div id="resultArea" class="card">
        <strong>📋 제미나이 AI 분석 리포트</strong>
        <p class="result-content" id="reportContent"></p>
        <button onclick="copyToClipboard()" style="background: #34495e; margin-top: 10px; font-size: 0.9rem; padding: 8px;">관찰평 복사하기</button>
    </div>

    <script>
        async function askGemini() {
            const apiKey = document.getElementById('apiKey').value;
            const name = document.getElementById('studentName').value;
            const mood = document.getElementById('mood').value;
            const reflection = document.getElementById('reflection').value;
            const bpm = document.getElementById('bpm').value;

            if(!apiKey) {
                alert("제미나이 API 키를 입력해주세요!");
                return;
            }

            const reportBox = document.getElementById('resultArea');
            const reportContent = document.getElementById('reportContent');
            
            reportBox.style.display = "block";
            reportContent.innerText = "제미나이가 데이터를 분석 중입니다. 잠시만 기다려주세요...";

            // AI에게 전달할 프롬프트 (EAIM 교육 철학 반영)
            const prompt = `
                당신은 EAIM(Emotion, Artscape, Interactive, Musicalization) 교육 전문가이자 35년 경력의 음악/체육 융합 교육자입니다.
                다음 데이터를 기반으로 교사가 생기부에 바로 적을 수 있을 정도로 전문적인 '학생 관찰기록'을 작성해주세요.

                학생 정보: ${name}
                정서 상태(Emotion): ${mood}
                연습 소감(Interactive): ${reflection}
                드리블 리듬(Musicalization): ${bpm} BPM

                작성 가이드라인:
                1. 학생의 정서적 안정과 리듬 감각의 연결성을 칭찬할 것.
                2. '지능형 리듬 분석'을 통해 성취를 이루었다는 관점을 포함할 것.
                3. 따뜻하면서도 교육적인 전문 용어를 사용할 것.
                4. 마지막에는 이 학생에게 어울리는 '음악적 화음(예: C Major의 밝음)'을 하나 추천해줄 것.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    reportContent.innerText = aiText;
                } else {
                    throw new Error("응답 형식 오류");
                }
            } catch (error) {
                reportContent.innerText = "오류가 발생했습니다: " + error.message + "\nAPI 키가 정확한지 확인해 보세요.";
            }
        }

        function copyToClipboard() {
            const content = document.getElementById('reportContent').innerText;
            navigator.clipboard.writeText(content);
            alert("관찰평이 복사되었습니다. 교사 수첩이나 엑셀에 붙여넣으세요!");
        }
    </script>
</body>
</html>
