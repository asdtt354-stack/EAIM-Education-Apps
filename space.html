<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM Space & Constellation Center</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; }
        .font-serif { font-family: 'Gowun Dodum', serif; }
        
        /* 🚀 태양계 + 별자리 엔진 */
        .solar-system { 
            position: relative; width: 100%; height: 400px; 
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; border-radius: 2.5rem; border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* 💡 별자리 레이어 (날짜에 따라 배경 변화) */
        .constellation-bg {
            position: absolute; inset: 0; opacity: 0.4;
            background-size: cover; background-position: center;
            transition: 1.5s ease-in-out; pointer-events: none;
        }

        .sun { width: 32px; height: 32px; background: #facc15; border-radius: 50%; box-shadow: 0 0 50px #facc15; z-index: 50; }
        .orbit { position: absolute; border: 1px solid rgba(255,255,255,0.06); border-radius: 50%; pointer-events: none; }
        .rev-track { position: absolute; width: 100%; height: 100%; animation: revolve linear infinite; }
        .planet { 
            position: absolute; border-radius: 50%; top: 0; left: 50%; transform: translate(-50%, -50%); 
            box-shadow: inset -4px -4px 6px rgba(0,0,0,0.7); cursor: pointer; pointer-events: auto; z-index: 60;
            animation: self-spin linear infinite;
        }

        .zoomed-planet {
            width: 190px; height: 190px; border-radius: 50%; margin: 0 auto;
            position: relative; box-shadow: inset -30px -30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255,255,255,0.1);
            animation: self-spin linear infinite;
        }

        @keyframes revolve { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes self-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .animate-fadeIn { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .const-badge { background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.3); padding: 4px 12px; border-radius: 99px; font-size: 10px; color: #a5b4fc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v11') || '');
            const [obsDate, setObsDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedPlanet, setSelectedPlanet] = useState(null);
            const [briefing, setBriefing] = useState({ temp: '', atmos: '', aiMsg: '', constellation: '' });
            const [isLoading, setIsLoading] = useState(false);

            const planets = [
                { id: 1, name: '수성', size: 8, orbit: 75, revTime: 8, rotTime: 5, color: '#94a3b8' },
                { id: 2, name: '금성', size: 12, orbit: 110, revTime: 18, rotTime: -20, color: '#fb923c' },
                { id: 3, name: '지구', size: 14, orbit: 155, revTime: 28, rotTime: 2, color: '#3b82f6' },
                { id: 4, name: '달', size: 8, orbit: 155, revTime: 28, rotTime: 5, color: '#fefce8', isMoon: true },
                { id: 5, name: '화성', size: 10, orbit: 200, revTime: 45, rotTime: 3, color: '#ef4444' },
                { id: 6, name: '목성', size: 28, orbit: 260, revTime: 80, rotTime: 1, color: '#d97706' },
                { id: 7, name: '토성', size: 24, orbit: 320, revTime: 120, rotTime: 1.2, color: '#fde047' },
                { id: 8, name: '명왕성', size: 6, orbit: 380, revTime: 180, rotTime: 6, color: '#64748b' }
            ];

            // 💡 날짜별 계절 별자리 데이터
            const getSeasonConst = () => {
                const month = new Date(obsDate).getMonth() + 1;
                if ([3, 4, 5].includes(month)) return { name: "봄 (사자자리, 처녀자리)", icon: "🦁" };
                if ([6, 7, 8].includes(month)) return { name: "여름 (백조자리, 거문고자리)", icon: "🦢" };
                if ([9, 10, 11].includes(month)) return { name: "가을 (페가수스자리, 안드로메다)", icon: "🐎" };
                return { name: "겨울 (오리온자리, 큰개자리)", icon: "🏹" };
            };

            const callGemini = async (prompt) => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const getBriefing = async (planet) => {
                setIsLoading(true);
                setSelectedPlanet(planet);
                setStep(3);
                
                const season = getSeasonConst();
                const prompt = `${obsDate} 기준, ${planet.name}의 실시간 상태를 브리핑해줘. 
                현재 배경에는 ${season.name}가 떠있어. 
                1. 평균 온도 / 2. 대기 상태 / 3. 행성과 별자리를 엮은 감동적인 SEL 메시지
                JSON 형식 {"temp": "", "atmos": "", "msg": ""}로만 출력해줘.`;

                try {
                    const res = await callGemini(prompt);
                    const json = JSON.parse(res.match(/\{.*\}/s)[0]);
                    setBriefing({ ...json, constellation: season.name, aiMsg: json.msg });
                } catch (e) {
                    setBriefing({ temp: "분석 중", atmos: "안정적", aiMsg: "우주가 당신을 환영합니다.", constellation: season.name });
                } finally { setIsLoading(false); }
            };

            const getStartPos = (period) => {
                const diff = Math.floor((new Date(obsDate) - new Date('2026-01-01')) / 86400000);
                return { animationDelay: `-${( (diff * (360/period)) % 360 / 360 ) * period}s` };
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#020617] flex flex-col relative shadow-2xl">
                    {step === 0 && (
                        <div className="absolute inset-0 bg-slate-900 z-[100] flex flex-col justify-center p-10 text-center animate-fadeIn">
                            <div className="text-7xl mb-6">🛰️</div>
                            <h2 className="text-2xl font-bold text-indigo-400 mb-6 font-serif uppercase tracking-widest">EAIM Integrated Observatory</h2>
                            <input type="password" onKeyDown={e => e.key === 'Enter' && setStep(1)} onChange={e => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key_v11', e.target.value);}} placeholder="Gemini API Key" className="w-full bg-slate-800 p-5 rounded-2xl text-white text-center outline-none border border-slate-700" />
                            <button onClick={() => setStep(1)} className="mt-4 bg-indigo-600 p-5 rounded-2xl font-bold text-lg">시스템 동기화</button>
                        </div>
                    )}

                    <header className="p-6 flex justify-between items-center border-b border-white/5">
                        <h1 className="text-xl font-black text-indigo-400 font-serif tracking-tighter uppercase">EAIM Space Control</h1>
                        {step > 1 && <button onClick={() => setStep(2)} className="text-[10px] bg-slate-800 px-3 py-1 rounded-full border border-white/10">메인 관측실</button>}
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto pb-20">
                        {step === 1 && (
                            <div className="flex flex-col items-center justify-center py-20 space-y-10 animate-fadeIn">
                                <div className="text-center">
                                    <h2 className="text-4xl font-black mb-2 font-serif">Astro Station</h2>
                                    <p className="text-slate-500 text-sm">행성과 별자리의 데이터를 통합합니다.</p>
                                </div>
                                <button onClick={() => setStep(2)} className="w-64 h-64 rounded-full bg-gradient-to-br from-indigo-700 to-rose-900 flex items-center justify-center text-2xl font-black shadow-2xl border-8 border-white/5">
                                    관측 시작
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="flex flex-col gap-2">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Observing Period</label>
                                    <input type="date" value={obsDate} onChange={e => setObsDate(e.target.value)} className="w-full bg-slate-900 p-4 rounded-2xl text-white text-center border border-indigo-500/20 font-black" />
                                </div>
                                
                                <div className="solar-system shadow-2xl relative">
                                    {/* 💡 별자리 배경 (계절별로 텍스트 변화 시뮬레이션) */}
                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                        <span className="text-[60px] opacity-10">{getSeasonConst().icon}</span>
                                    </div>
                                    
                                    <div className="sun"></div>
                                    {planets.map(p => (
                                        <div key={p.id} className="orbit" style={{ width: p.orbit, height: p.orbit, top: '50%', left: '50%', transform: 'translate(-50%, -50%)' }}>
                                            <div className="rev-track" style={{ animationDuration: `${p.revTime}s`, ...getStartPos(p.revTime) }}>
                                                <div className="planet" style={{ 
                                                    width: p.size, height: p.size, backgroundColor: p.color,
                                                    animationDuration: `${Math.abs(p.rotTime)}s`
                                                }} onClick={() => getBriefing(p)}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="text-center">
                                    <span className="const-badge">현재 밤하늘: {getSeasonConst().name}</span>
                                </div>
                            </div>
                        )}

                        {step === 3 && selectedPlanet && (
                            <div className="space-y-6 animate-fadeIn pb-10">
                                <div className="text-center">
                                    <h2 className="text-4xl font-black text-white">{selectedPlanet.name}</h2>
                                    <p className="text-indigo-400 text-[10px] font-bold mt-2">COSMOS ARCHIVE: {obsDate}</p>
                                </div>

                                <div className="relative py-4">
                                    <div className="zoomed-planet shadow-2xl" style={{ backgroundColor: selectedPlanet.color }}></div>
                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
                                        <div className="w-[260px] h-[260px] border-2 border-dashed border-indigo-500 rounded-full animate-spin" style={{ animationDuration: '20s' }}></div>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-slate-900/80 p-5 rounded-3xl border border-white/5 shadow-inner">
                                            <span className="text-[9px] text-indigo-400 font-bold uppercase">Temperature</span>
                                            <div className="text-xl font-black text-white mt-1">{isLoading ? "..." : briefing.temp}</div>
                                        </div>
                                        <div className="bg-slate-900/80 p-5 rounded-3xl border border-white/5 shadow-inner">
                                            <span className="text-[9px] text-indigo-400 font-bold uppercase">Background</span>
                                            <div className="text-[11px] font-bold text-white mt-1 leading-tight">{briefing.constellation}</div>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-gradient-to-br from-indigo-900/40 to-slate-900/40 p-6 rounded-[2.5rem] border border-indigo-500/20 shadow-2xl relative overflow-hidden">
                                        <div className="flex items-center gap-2 mb-3 relative z-10">
                                            <div className="w-2 h-2 bg-rose-500 rounded-full animate-pulse"></div>
                                            <h3 className="text-[10px] font-bold text-rose-400 uppercase tracking-widest">AI Emotional Briefing</h3>
                                        </div>
                                        {isLoading ? (
                                            <div className="h-24 flex items-center justify-center"><div className="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>
                                        ) : (
                                            <p className="text-[13px] leading-relaxed text-indigo-50 font-serif italic relative z-10">"{briefing.aiMsg}"</p>
                                        )}
                                        <div className="absolute -bottom-4 -right-4 text-7xl opacity-5 grayscale">{getSeasonConst().icon}</div>
                                    </div>
                                </div>

                                <button onClick={() => setStep(2)} className="w-full bg-slate-800 p-5 rounded-3xl font-bold text-slate-400 border border-slate-700 mt-4">다시 전체 관측실로</button>
                            </div>
                        )}
                    </main>

                    <footer className="mt-auto p-4 text-center border-t border-white/5 bg-black/20">
                        <p className="text-[8px] text-slate-700 font-bold uppercase tracking-[0.3em]">&copy; 2026 EAIM STUDIO | PLANET & STAR ENGINE v8.0</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
