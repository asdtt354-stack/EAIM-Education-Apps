<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 과학 탐정대</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #dcfce7 0%, #e0f2fe 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #334155; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 3rem; box-shadow: 0 20px 50px rgba(0,0,0,0.08); border: 2px solid white; width: 100%; max-width: 550px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; }
        textarea.eaim-input { text-align: left; resize: none; }
        .eaim-btn-main { background: #14b8a6 !important; color: white !important; border-radius: 1.5rem; padding: 1.1rem; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        .eaim-btn-main:hover:not(:disabled) { background: #0d9488 !important; transform: scale(1.02); }
        @media print {
            body { background: white; color: black; display: block; }
            .print-hidden { display: none !important; }
            .eaim-card { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; max-width: none; }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ScienceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [scienceUnit, setScienceUnit] = useState('상태 변화');
            const [emotionKeyword, setEmotionKeyword] = useState('미안함');
            const [caseStory, setCaseStory] = useState('');

            const [scienceClue, setScienceClue] = useState('');
            const [scienceHint, setScienceHint] = useState('');
            const [isLoadingHint, setIsLoadingHint] = useState(false);
            
            const [emotionClue, setEmotionClue] = useState('');
            const [finalReport, setFinalReport] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_sci');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                // 💡 디렉터님 환경에서 검증된 2.5-flash 엔진 적용!
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                const response = await fetch(url, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const generateCase = async () => {
                if (!apiKey) return alert('API 키를 확인해주세요.');
                setIsAnalyzing(true);
                const prompt = `과학 교사로서 과학의 '${scienceUnit}' 원리와 '${emotionKeyword}' 감정을 융합한 짧은 미스테리 사건을 만들어줘. (중학생 수준, 3~4문장)`;
                try {
                    const text = await callGemini(prompt);
                    setCaseStory(text);
                    setStep(2);
                } catch (e) { alert(`사건 생성 실패: ${e.message}`); } 
                finally { setIsAnalyzing(false); }
            };

            const getHint = async () => {
                setIsLoadingHint(true);
                const prompt = `탐정 대장으로서 다음 사건에 숨겨진 '${scienceUnit}' 원리에 대한 힌트를 1문장으로만 줘. 답을 말하지 말고 생각할 거리를 줘: ${caseStory}`;
                try {
                    const text = await callGemini(prompt);
                    setScienceHint(text);
                } catch (e) { setScienceHint('통신 실패!'); }
                finally { setIsLoadingHint(false); }
            };

            const solveCase = async () => {
                setIsAnalyzing(true); setStep(4);
                const prompt = `탐정 대장으로서 다음 단서들을 융합해 최종 보고서를 써줘.
                사건: ${caseStory} / 과학단서: ${scienceClue} / 마음추리: ${emotionClue}
                [과학적 진실], [숨겨진 마음], [화해의 미션] 항목으로 나누어 작성해줘.`;
                try {
                    const text = await callGemini(prompt);
                    setFinalReport(text);
                } catch (e) { setFinalReport('보고서 작성 실패'); } 
                finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="text-center space-y-6">
                            <h2 className="font-bold text-2xl font-hand text-slate-700">EAIM 과학 탐정대 설정</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="eaim-input" placeholder="API 키 입력" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_sci', apiKey.trim()); setStep(1); }} className="eaim-btn-main shadow-lg">시스템 가동 🚀</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div className="space-y-6">
                            <header className="flex justify-between items-center mb-6 print-hidden border-b pb-3">
                                <span className="font-bold text-teal-600 font-hand text-xl">EAIM 과학 탐정대 🕵️‍♂️</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key_sci'); setStep(0); window.location.reload(); }} className="text-xs text-slate-400 underline">키 재설정</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <div className="text-center">
                                        <h2 className="text-2xl font-hand text-slate-800">사건 파일 생성 📂</h2>
                                        <p className="text-sm text-slate-500">배울 원리와 친구의 마음을 골라주세요.</p>
                                    </div>
                                    <input type="text" value={scienceUnit} onChange={e => setScienceUnit(e.target.value)} className="eaim-input" placeholder="과학 원리 (예: 기체의 압력)" />
                                    <input type="text" value={emotionKeyword} onChange={e => setEmotionKeyword(e.target.value)} className="eaim-input" placeholder="감정 키워드 (예: 고마움)" />
                                    <button onClick={generateCase} disabled={isAnalyzing} className="eaim-btn-main">{isAnalyzing ? "사건 구성 중..." : "AI 사건 만들기 ✨"}</button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">1단계: 현장 관찰 🚨</h2>
                                    <div className="bg-white/70 p-6 rounded-3xl border-2 border-teal-200 font-hand text-lg">{caseStory}</div>
                                    <div className="space-y-3">
                                        <div className="flex justify-between">
                                            <h3 className="font-bold text-teal-600 ml-2">2단계: 과학 단서 추리</h3>
                                            {!scienceHint && <button onClick={getHint} disabled={isLoadingHint} className="text-xs bg-yellow-400 px-3 py-1 rounded-full font-bold">💡 힌트</button>}
                                        </div>
                                        {scienceHint && <div className="bg-yellow-50 p-3 rounded-2xl border border-yellow-200 text-sm font-hand text-yellow-800">대장: {scienceHint}</div>}
                                        <textarea value={scienceClue} onChange={e => setScienceClue(e.target.value)} className="eaim-input h-24" placeholder="어떤 과학 원리가 있을까?"></textarea>
                                    </div>
                                    <button onClick={() => setStep(3)} disabled={!scienceClue} className="eaim-btn-main bg-teal-500">다음 수사 👉</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">3단계: 감성 추론 💓</h2>
                                    <textarea value={emotionClue} onChange={e => setEmotionClue(e.target.value)} className="eaim-input h-32" placeholder="범인은 왜 그랬을까? 친구의 마음을 상상해봐."></textarea>
                                    <button onClick={solveCase} disabled={isAnalyzing} className="eaim-btn-main">{isAnalyzing ? "분석 중..." : "보고서 요청 📝"}</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-6 animate-fade-in print-area">
                                    <h2 className="text-3xl font-hand text-center text-teal-600">최종 사건 보고서 ✨</h2>
                                    <div className="bg-white p-8 rounded-3xl border-2 border-teal-200 whitespace-pre-wrap font-hand text-lg shadow-sm">
                                        {isAnalyzing ? "대장이 정리 중..." : finalReport}
                                    </div>
                                    <div className="flex gap-2 print-hidden">
                                        <button onClick={() => window.print()} className="flex-1 eaim-btn-main bg-slate-400">🖨️ 인쇄</button>
                                        <button onClick={() => { setStep(1); setFinalReport(''); setScienceClue(''); setEmotionClue(''); setScienceHint(''); }} className="flex-1 eaim-btn-main">새 사건 🕵️</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScienceEAIMApp />);
    </script>
</body>
</html>
