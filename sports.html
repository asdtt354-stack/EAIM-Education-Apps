<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 비트 & 바스켓 2.5 PRO</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .emotion-btn { transition: 0.2s; border: 2px solid transparent; cursor: pointer; }
        .emotion-active { border-color: #f43f5e; transform: scale(1.05); box-shadow: 0 0 20px rgba(244, 63, 94, 0.3); }
        .youtube-box { width: 100%; aspect-ratio: 16/9; border-radius: 1.5rem; overflow: hidden; background: #000; border: 2px solid #334155; }
        .rhythm-score { background: rgba(0, 0, 0, 0.3); padding: 1rem; border-radius: 1rem; font-family: monospace; letter-spacing: 1px; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const getYouTubeId = (url) => {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        const emotionList = [
            { name: '화남 😡', color: '#ef4444' }, { name: '우울함 🌧️', color: '#3b82f6' },
            { name: '불안함 😰', color: '#eab308' }, { name: '평온함 😌', color: '#22c55e' },
            { name: '신남 😆', color: '#f97316' }, { name: '무기력함 🫠', color: '#64748b' }
        ];

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [selectedEmotion, setSelectedEmotion] = useState(null);
            const [prescription, setPrescription] = useState({ songTitle: '', bpm: '', genre: '', msg: '' });
            
            const [youtubeLink, setYoutubeLink] = useState('');
            const [videoId, setVideoId] = useState('');
            const [sport, setSport] = useState('농구 🏀');
            const [rhythmData, setRhythmData] = useState({ intro: '', teamA: '', teamB: '', teamC: '' });
            
            const [studentJournal, setStudentJournal] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_sel_beat_pro');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const parseRobustJSON = (text) => {
                try {
                    const match = text.match(/\{[\s\S]*\}/);
                    if (match) return JSON.parse(match[0]);
                    return JSON.parse(text);
                } catch (e) {
                    console.error("JSON 파싱 에러:", text);
                    return null;
                }
            };

            const callGemini = async (prompt, isJSON = false) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                const config = { temperature: 0.4, maxOutputTokens: 8192 };
                if (isJSON) config.responseMimeType = "application/json";

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: config })
                });

                if (!response.ok) throw new Error("API 연결 실패");
                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                return isJSON ? parseRobustJSON(rawText) : rawText;
            };

            const handleEmotionSelect = async (emotion) => {
                setSelectedEmotion(emotion);
                setIsAnalyzing(true);
                setStep(2);
                const prompt = `학생 감정: '${emotion.name}'. 이 감정 승화를 위한 실제 음악 한 곡 추천(JSON): {"songTitle":"제목","bpm":"속도","genre":"장르","msg":"따뜻한 위로 2문장"}`;
                try {
                    const res = await callGemini(prompt, true);
                    setPrescription(res);
                } catch (e) { alert('데이터 오류'); setStep(1); } 
                finally { setIsAnalyzing(false); }
            };

            const openYoutubeSearch = () => {
                const query = encodeURIComponent(prescription.songTitle);
                window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank');
            };

            // 💡 리듬 생성 프롬프트 업데이트: 설명 대신 '구음(박자)' 형식 강조
            const handleGenerateRhythm = async () => {
                if (!youtubeLink) return alert("유튜브 링크를 넣어주세요!");
                const extractedId = getYouTubeId(youtubeLink);
                if (!extractedId) return alert("올바른 링크가 아닙니다.");
                
                setVideoId(extractedId);
                setIsAnalyzing(true);

                const prompt = `당신은 리듬 안무가입니다. '${selectedEmotion.name}' 감정 케어를 위한 '${sport}' 4박자 리듬 스코어를 작성하세요.
                [중요] 구구절절 설명하지 말고 오직 리듬 패턴만 출력하세요.
                [형식] 구음(박자) 구음(박자) ...
                [예시] 탁(1) 탁(1) 탁(1) 탁(1)  또는  쿵(2) 탁(1) 탁(1)  또는  슉(3) 팍(1)
                
                다음 JSON 형식을 반드시 지키세요:
                {
                    "intro": "코치의 짧은 격려 (1문장)",
                    "teamA": "Floor Bounce 리듬 패턴 (설명 없이 박자 표기만)",
                    "teamB": "Catch & Pass 리듬 패턴 (설명 없이 박자 표기만)",
                    "teamC": "Skill & Shoot 리듬 패턴 (설명 없이 박자 표기만)"
                }`;

                try {
                    const res = await callGemini(prompt, true);
                    setRhythmData(res);
                    setStep(3);
                } catch (e) { alert('리듬 생성 오류'); } finally { setIsAnalyzing(false); }
            };

            const handleSubmitJournal = async () => {
                if (!studentJournal) return alert("소감을 입력하세요!");
                setIsAnalyzing(true);
                const prompt = `감정 '${selectedEmotion.name}'에서 활동 후 후기: "${studentJournal}". 다정한 선생님의 피드백 3문장.`;
                try {
                    const res = await callGemini(prompt, false);
                    setTeacherFeedback(res);
                    setStep(4);
                } catch (e) { alert('피드백 오류'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col relative shadow-2xl overflow-hidden font-sans">
                    <header className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900/80 sticky top-0 z-50">
                        <h1 className="text-lg font-title text-orange-500 uppercase tracking-tight italic">Beat & Ball 2.5 PRO</h1>
                        {step > 0 && <button onClick={() => window.location.reload()} className="text-[10px] text-slate-500 underline">RESET</button>}
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto pb-24">
                        {step === 0 && (
                            <div className="py-10 text-center animate-fadeIn space-y-6">
                                <div className="text-7xl">🎹🏀</div>
                                <h2 className="text-xl font-bold font-title uppercase">EAIM Rhythm Sync</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center outline-none focus:border-rose-500" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_sel_beat_pro', apiKey.trim()); setStep(1); }} className="w-full bg-rose-600 p-4 rounded-2xl font-bold shadow-xl">시스템 접속</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="text-center">
                                    <h2 className="text-2xl font-title text-slate-200 uppercase">Emotion Check</h2>
                                    <p className="text-xs text-slate-500 mt-2">현재의 감정에 맞는 리듬을 찾아드립니다.</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    {emotionList.map(em => (
                                        <button key={em.name} onClick={() => handleEmotionSelect(em)} className="p-5 rounded-3xl bg-slate-900 border border-slate-800 hover:border-rose-500 transition-all text-center">
                                            <div className="text-sm font-bold text-slate-200">{em.name}</div>
                                            <div className="w-full h-1 mt-3 rounded-full" style={{backgroundColor: em.color}}></div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="glass-panel p-7 rounded-[2.5rem] border-t-4 border-rose-500 shadow-2xl">
                                    <h3 className="text-[10px] font-black text-rose-500 uppercase tracking-widest mb-4">Cosmic Music Chart</h3>
                                    {isAnalyzing ? (
                                        <div className="py-10 text-center animate-pulse text-sm text-slate-400">최적의 리듬 분석 중...</div>
                                    ) : (
                                        <div className="space-y-5">
                                            <div className="bg-white/5 p-4 rounded-2xl border border-white/10 text-center">
                                                <span className="text-xl font-black text-white">{prescription.songTitle}</span>
                                            </div>
                                            <div className="flex justify-between items-center text-sm font-bold">
                                                <span className="text-slate-400 uppercase">Tempo</span>
                                                <span className="text-rose-200">{prescription.bpm} BPM</span>
                                            </div>
                                            <p className="text-sm leading-relaxed italic text-slate-300">"{prescription.msg}"</p>
                                            <button onClick={openYoutubeSearch} className="w-full bg-red-600/20 text-red-500 border border-red-600/30 py-3 rounded-xl text-xs font-bold">유튜브 검색</button>
                                        </div>
                                    )}
                                </div>

                                {!isAnalyzing && (
                                    <div className="space-y-4 pt-4 animate-fadeIn">
                                        <div className="flex gap-2">
                                            {['농구 🏀', '배구 🏐', '축구 ⚽', '짐볼 🔵'].map(s => (
                                                <button key={s} onClick={() => setSport(s)} className={`flex-1 py-2 rounded-lg text-[10px] font-bold ${sport === s ? 'bg-orange-600' : 'bg-slate-800 text-slate-400'}`}>{s}</button>
                                            ))}
                                        </div>
                                        <input type="text" value={youtubeLink} onChange={e => setYoutubeLink(e.target.value)} placeholder="유튜브 주소 붙여넣기" className="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-sm" />
                                        <button onClick={handleGenerateRhythm} className="w-full bg-indigo-600 p-5 rounded-2xl font-black text-lg shadow-xl">리듬 스코어 생성 ✨</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fadeIn pb-10">
                                <div className="youtube-box shadow-2xl">
                                    <iframe src={`https://www.youtube.com/embed/${videoId}?autoplay=0`} frameBorder="0" allowFullScreen className="w-full h-full"></iframe>
                                </div>
                                <div className="bg-orange-500/10 p-4 rounded-2xl border-l-4 border-orange-500 text-sm font-bold text-slate-200">
                                    "{rhythmData.intro}"
                                </div>
                                
                                {/* 💡 리듬 표기 영역 시각화 강화 */}
                                <div className="space-y-4">
                                    <div className="glass-panel p-5 rounded-2xl border-l-4 border-rose-500">
                                        <h4 className="text-[10px] font-black text-rose-400 uppercase mb-2 tracking-tighter">Team A : Floor Score</h4>
                                        <div className="rhythm-score text-2xl font-black text-white text-center">{rhythmData.teamA}</div>
                                    </div>
                                    <div className="glass-panel p-5 rounded-2xl border-l-4 border-blue-500">
                                        <h4 className="text-[10px] font-black text-blue-400 uppercase mb-2 tracking-tighter">Team B : Catch Score</h4>
                                        <div className="rhythm-score text-2xl font-black text-white text-center">{rhythmData.teamB}</div>
                                    </div>
                                    <div className="glass-panel p-5 rounded-2xl border-l-4 border-emerald-500">
                                        <h4 className="text-[10px] font-black text-emerald-400 uppercase mb-2 tracking-tighter">Team C : Skill Score</h4>
                                        <div className="rhythm-score text-2xl font-black text-white text-center">{rhythmData.teamC}</div>
                                    </div>
                                </div>
                                
                                <div className="pt-6 space-y-4">
                                    <h3 className="text-center font-title text-rose-500 text-lg uppercase">Daily Journal</h3>
                                    <textarea value={studentJournal} onChange={e => setStudentJournal(e.target.value)} placeholder="리듬을 맞춰보니 내 마음이 어떻게 변했나요?" className="w-full bg-slate-900 border border-slate-700 p-5 rounded-3xl text-sm h-32 outline-none focus:border-rose-500"></textarea>
                                    <button onClick={handleSubmitJournal} disabled={isAnalyzing} className="w-full bg-rose-600 p-5 rounded-2xl font-bold shadow-xl">기록 제출 📮</button>
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-8 animate-fadeIn text-center">
                                <div className="text-7xl mt-10">💌</div>
                                <h2 className="text-2xl font-title text-rose-400 uppercase tracking-tighter">Coach Feedback</h2>
                                <div className="glass-panel p-8 rounded-[3rem] text-left border-t-8 border-rose-500 shadow-2xl">
                                    <p className="text-base leading-relaxed text-slate-100 italic font-serif">"{teacherFeedback}"</p>
                                </div>
                                <button onClick={() => window.location.reload()} className="w-full bg-slate-800 p-5 rounded-2xl font-bold text-slate-400 border border-slate-700 uppercase">Mission Complete</button>
                            </div>
                        )}
                    </main>
                    <footer className="p-4 bg-slate-950 text-center text-[9px] text-slate-700 tracking-widest uppercase border-t border-white/5 mt-auto">
                        &copy; 2026 EAIM STUDIO | Rhythm & SEL Sync
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
