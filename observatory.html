<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EAIM 태양계 오디세이 - 공전/자전 시뮬레이터</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<style>
:root { --main-color: #00d4ff; --bg-dark: #020205; --accent: #2ecc71; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: row; height: 100vh; overflow: hidden; }

#viewer-section { flex: 7; position: relative; min-height: 300px; }
#canvas-container { width: 100%; height: 100%; cursor: grab; }
#canvas-container:active { cursor: grabbing; }

.header { position: absolute; top: 24px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
.header h1 { color: var(--main-color); margin: 0; font-size: 2em; text-shadow: 0 0 20px rgba(0, 212, 255, 0.5); letter-spacing: 2px; }
.header p { color: #aaa; font-size: 0.95em; margin-top: 6px; font-weight: 300; }

.control-panel {
  position: absolute; bottom: 24px; left: 24px;
  background: rgba(10, 10, 20, 0.85); border: 1px solid #333;
  padding: 18px; border-radius: 12px; width: 260px;
  backdrop-filter: blur(10px); z-index: 10;
}
.slider-group { margin-bottom: 14px; }
.slider-group:last-child { margin-bottom: 0; }
.control-panel label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.85em; }
.label-speed { color: var(--main-color); }
.label-size { color: var(--accent); }
input[type=range] { width: 100%; cursor: pointer; }
.slider-speed { accent-color: var(--main-color); }
.slider-size { accent-color: var(--accent); }
.speed-labels { display: flex; justify-content: space-between; color: #888; font-size: 0.75em; margin-top: 4px; font-weight: bold; }

#mission-section {
  flex: 3; min-width: 300px; max-width: 380px;
  background: rgba(15, 15, 20, 0.97); border-left: 1px solid #333;
  display: flex; flex-direction: column; padding: 20px;
  overflow-y: auto; box-shadow: -5px 0 20px rgba(0,0,0,0.5); z-index: 20;
}
.header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.btn-settings { background: transparent; border: 1px solid #555; color: #aaa; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8em; }
.btn-settings:hover { background: #333; color: white; }
#mission-section h1 { color: var(--accent); margin: 0 0 4px 0; font-size: 1.4em; }
.sub-text { color: #888; font-size: 0.82em; margin-bottom: 16px; }

.mission-box { background: #111; border: 1px solid #222; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.mission-box label { display: block; color: var(--main-color); font-weight: bold; margin-bottom: 6px; font-size: 0.82em; }
select { width: 100%; padding: 9px; background: #222; color: white; border: 1px solid #444; border-radius: 6px; margin-bottom: 8px; font-family: inherit; }

.btn-primary { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: var(--accent); color: #000; font-size: 0.95em; }
.btn-primary:hover { background: #27ae60; }
.btn-primary:disabled { background: #444; color: #888; cursor: not-allowed; }

.question-card { background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.25); border-radius: 8px; padding: 12px; font-size: 0.88em; line-height: 1.6; margin-bottom: 12px; display: none; }

textarea { width: 100%; height: 80px; background: #1a1a24; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 0.88em; box-sizing: border-box; resize: none; font-family: inherit; }

.feedback-box { margin-top: 12px; background: rgba(46, 204, 113, 0.08); padding: 12px; border-radius: 8px; font-size: 0.86em; line-height: 1.6; border: 1px solid rgba(46, 204, 113, 0.3); display: none; }

#log-list { margin-top: 8px; }
.log-item { background: #111; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--main-color); font-size: 0.78em; line-height: 1.5; }
.log-item .log-meta { color: #888; font-size: 0.85em; margin-bottom: 3px; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; }
.modal-box { background: #161625; border: 1px solid var(--accent); border-radius: 15px; padding: 30px; width: 90%; max-width: 400px; }
.modal-box h2 { margin: 0 0 15px 0; color: var(--main-color); }
.modal-box p { font-size: 0.9em; color: #aaa; margin-bottom: 20px; }
.modal-box input { width: 100%; padding: 12px; background: #000; color: white; border: 1px solid #444; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; padding: 12px; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; }
.btn-save { background: var(--accent); color: #000; }
.btn-cancel { background: #333; color: white; }

@media (max-width: 850px) {
  body { flex-direction: column; height: auto; overflow-y: auto; }
  #viewer-section { width: 100%; height: 55vh; flex: none; }
  .header h1 { font-size: 1.4em; }
  .control-panel { width: calc(100% - 48px); left: 24px; right: 24px; }
  #mission-section { width: 100%; max-width: 100%; min-width: 100%; height: auto; flex: none; border-left: none; border-top: 2px solid var(--accent); }
}
</style>
</head>
<body>

<div id="settings-modal" class="modal-overlay">
  <div class="modal-box">
    <h2>⚙️ AI 엔진 설정</h2>
    <p>Google AI Studio에서 발급받은 Gemini API 키를 입력하세요. 키는 이 기기에만 안전하게 저장됩니다.</p>
    <input type="password" id="api-key-input" placeholder="AIzaSy...">
    <div class="modal-btns">
      <button class="btn-save" onclick="saveApiKey()">저장하기</button>
      <button class="btn-cancel" onclick="closeSettings()">취소</button>
    </div>
  </div>
</div>

<div id="viewer-section">
  <div class="header">
    <h1>에임 태양계 오디세이</h1>
    <p>마우스로 화면을 돌려보며 완전한 태양계의 움직임을 관찰하세요</p>
  </div>

  <div class="control-panel">
    <div class="slider-group">
      <label class="label-speed">⏱️ 시간 가속기 (공전/자전 속도)</label>
      <input type="range" id="speed-slider" class="slider-speed" min="0" max="10" step="0.1" value="1">
      <div class="speed-labels"><span>정지(0x)</span><span>초고속(10x)</span></div>
    </div>
    <div class="slider-group">
      <label class="label-size">🔍 행성 돋보기 (크기 확대)</label>
      <input type="range" id="size-slider" class="slider-size" min="1" max="15" step="0.5" value="3">
      <div class="speed-labels"><span>실제 궤도 비율</span><span>최대 확대(15x)</span></div>
    </div>
  </div>

  <div id="canvas-container"></div>
</div>

<div id="mission-section">
  <div class="header-container">
    <h1>🔭 AI 관측 미션</h1>
    <button class="btn-settings" onclick="openSettings()">⚙️ AI 설정</button>
  </div>
  <p class="sub-text">지금 조작 상태를 바탕으로 AI가 질문을 만들어줘요.</p>

  <div class="mission-box">
    <label>비교할 행성 두 개 선택</label>
    <select id="planet-a"></select>
    <select id="planet-b"></select>
    <button class="btn-primary" onclick="generateMission()" id="mission-btn">🤖 관측 미션 받기</button>
    <p style="font-size:0.68em;color:#888;margin-top:6px;text-align:center">※ 오류 발생 시 상단 [⚙️ AI 설정]에서 키를 확인하세요.</p>
  </div>

  <div class="question-card" id="question-card"></div>

  <div id="answer-area" style="display:none">
    <label style="display:block;color:var(--accent);font-weight:bold;margin-bottom:6px;font-size:0.82em">✏️ 내 생각 적기</label>
    <textarea id="student-answer" placeholder="관찰한 내용을 근거로 이유를 적어보세요."></textarea>
    <button class="btn-primary" onclick="submitAnswer()">제출하고 피드백 받기</button>
  </div>

  <div class="feedback-box" id="feedback-box"></div>

  <div style="margin-top:20px;border-top:1px solid #333;padding-top:14px">
    <h3 style="color:#aaa;margin:0 0 8px 0;font-size:0.9em">보관된 관측 기록</h3>
    <div id="log-list"></div>
  </div>
</div>

<script>
let API_KEY = localStorage.getItem('eaim_odyssey_api_key') || "";

function openSettings(){
  document.getElementById('api-key-input').value = API_KEY;
  document.getElementById('settings-modal').style.display = 'flex';
}
function closeSettings(){ document.getElementById('settings-modal').style.display = 'none'; }
function saveApiKey(){
  const v = document.getElementById('api-key-input').value.trim();
  if(!v) return alert('API 키를 입력해주세요.');
  API_KEY = v;
  localStorage.setItem('eaim_odyssey_api_key', API_KEY);
  closeSettings();
  alert('✅ API 키가 저장되었습니다!');
}

THREE.ImageUtils.crossOrigin = '';
const loader = new THREE.TextureLoader();
loader.crossOrigin = "Anonymous";

const textures = {
  mercury: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/mercurymap.jpg",
  venus: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/venusmap.jpg",
  earth: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthmap1k.jpg",
  mars: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/marsmap1k.jpg",
  jupiter: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/jupitermap.jpg",
  saturn: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/saturnmap.jpg",
  saturn_ring: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/saturnringcolor.jpg",
  uranus: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/uranusmap.jpg",
  neptune: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/neptunemap.jpg"
};

const planetsData = {
  mercury: { name: "수성", dist: 120, size: 4, speed: 0.04, color: 0xaaaaaa, texture: textures.mercury },
  venus: { name: "금성", dist: 180, size: 7, speed: 0.015, color: 0xffcc33, texture: textures.venus },
  earth: { name: "지구", dist: 250, size: 8, speed: 0.01, color: 0x2233ff, texture: textures.earth },
  mars: { name: "화성", dist: 320, size: 5, speed: 0.008, color: 0xff3300, texture: textures.mars },
  jupiter: { name: "목성", dist: 480, size: 22, speed: 0.004, color: 0xffaa88, texture: textures.jupiter },
  saturn: { name: "토성", dist: 650, size: 18, speed: 0.002, color: 0xffdd88, texture: textures.saturn },
  uranus: { name: "천왕성", dist: 850, size: 14, speed: 0.001, color: 0x66ccff, texture: textures.uranus },
  neptune: { name: "해왕성", dist: 1050, size: 13, speed: 0.0008, color: 0x3333ff, texture: textures.neptune }
};

const planetSelA = document.getElementById('planet-a');
const planetSelB = document.getElementById('planet-b');
Object.keys(planetsData).forEach(key=>{
  const optA = document.createElement('option'); optA.value=key; optA.textContent=planetsData[key].name;
  const optB = optA.cloneNode(true);
  planetSelA.appendChild(optA); planetSelB.appendChild(optB);
});
planetSelA.value = 'earth';
planetSelB.value = 'jupiter';

const scene = new THREE.Scene();
const container = document.getElementById('canvas-container');
const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 20000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let cameraAngle = 0;
let cameraHeight = 1200;
const cameraRadius = 1500;

const starsGeometry = new THREE.BufferGeometry();
const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.8 });
const starsVertices = [];
for(let i=0; i<4000; i++){
  starsVertices.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
}
starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
const starField = new THREE.Points(starsGeometry, starsMaterial);
scene.add(starField);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const sun = new THREE.Mesh(new THREE.SphereGeometry(50, 64, 64), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
scene.add(sun);

const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(65, 32, 32), glowMat);
scene.add(sunGlow);

const meshes = {};
Object.keys(planetsData).forEach(key => {
  const p = planetsData[key];
  const mat = new THREE.MeshStandardMaterial({
    map: loader.load(p.texture),
    emissive: new THREE.Color(p.color),
    emissiveIntensity: 0.3
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), mat);
  meshes[key] = m;
  scene.add(m);

  if(key === 'saturn'){
    const ringGeom = new THREE.RingGeometry(p.size * 1.2, p.size * 2.2, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      map: loader.load(textures.saturn_ring),
      side: THREE.DoubleSide, transparent: true, opacity: 0.8
    });
    const ring = new THREE.Mesh(ringGeom, ringMat);
    ring.rotation.x = Math.PI / 2.5;
    m.add(ring);
  }

  const orbitGeom = new THREE.RingGeometry(p.dist - 0.5, p.dist + 0.5, 256);
  const orbitMat = new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
  const orbit = new THREE.Mesh(orbitGeom, orbitMat);
  orbit.rotation.x = Math.PI/2;
  scene.add(orbit);
});

camera.position.set(0, cameraHeight, cameraRadius);
camera.lookAt(0, 0, 0);

container.addEventListener('mousedown', ()=>{ isDragging = true; });
container.addEventListener('mouseup', ()=>{ isDragging = false; });
container.addEventListener('mousemove', (e)=>{
  if(isDragging){
    const deltaX = e.offsetX - previousMousePosition.x;
    const deltaY = e.offsetY - previousMousePosition.y;
    cameraAngle -= deltaX * 0.005;
    cameraHeight += deltaY * 2;
    if(cameraHeight > 2000) cameraHeight = 2000;
    if(cameraHeight < 100) cameraHeight = 100;
  }
  previousMousePosition = { x: e.offsetX, y: e.offsetY };
});

container.addEventListener('touchstart', (e)=>{
  isDragging = true;
  previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, {passive:false});
container.addEventListener('touchend', ()=>{ isDragging = false; });
container.addEventListener('touchmove', (e)=>{
  if(isDragging){
    e.preventDefault();
    const deltaX = e.touches[0].clientX - previousMousePosition.x;
    const deltaY = e.touches[0].clientY - previousMousePosition.y;
    cameraAngle -= deltaX * 0.005;
    cameraHeight += deltaY * 2;
    if(cameraHeight > 2000) cameraHeight = 2000;
    if(cameraHeight < 100) cameraHeight = 100;
    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, {passive:false});

let time = 0;
function animate(){
  requestAnimationFrame(animate);
  const speedMultiplier = parseFloat(document.getElementById('speed-slider').value);
  time += 0.005 * speedMultiplier;
  const sizeMultiplier = parseFloat(document.getElementById('size-slider').value);
  starField.rotation.y += 0.0005 * speedMultiplier;

  Object.keys(meshes).forEach(key=>{
    const p = planetsData[key], m = meshes[key];
    m.position.x = Math.cos(time * p.speed * 20) * p.dist;
    m.position.z = Math.sin(time * p.speed * 20) * p.dist;
    m.rotation.y += 0.02 * speedMultiplier;
    m.scale.set(sizeMultiplier, sizeMultiplier, sizeMultiplier);
  });

  const sunScale = 1 + (sizeMultiplier - 1) * 0.2;
  sun.scale.set(sunScale, sunScale, sunScale);
  sunGlow.scale.set(sunScale, sunScale, sunScale);

  camera.position.x = Math.cos(cameraAngle) * cameraRadius;
  camera.position.z = Math.sin(cameraAngle) * cameraRadius;
  camera.position.y = cameraHeight;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ══════════════════════════
// 🔥 AI 관측 미션 (2층: 질문 생성 → 서술 → 피드백 → 기록)
// ══════════════════════════
let currentMission = null;

async function callGemini(prompt, maxTokens=500){
  const key = API_KEY.trim();
  if(!key) throw new Error('NO_KEY');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: maxTokens }
    })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function generateMission(){
  if(!API_KEY){
    alert('상단의 [⚙️ AI 설정] 버튼을 눌러 API 키를 먼저 입력해주세요.');
    openSettings();
    return;
  }
  const aKey = planetSelA.value, bKey = planetSelB.value;
  if(aKey === bKey){ alert('서로 다른 행성 두 개를 골라주세요!'); return; }
  const a = planetsData[aKey], b = planetsData[bKey];
  const speedMultiplier = parseFloat(document.getElementById('speed-slider').value);
  const sizeMultiplier = parseFloat(document.getElementById('size-slider').value);

  const btn = document.getElementById('mission-btn');
  btn.disabled = true; btn.textContent = '🤖 질문 만드는 중...';
  document.getElementById('question-card').style.display = 'none';
  document.getElementById('answer-area').style.display = 'none';
  document.getElementById('feedback-box').style.display = 'none';

  const prompt = `중학교 과학 교사로서, 학생이 태양계 시뮬레이터에서 "${a.name}"과 "${b.name}"을 관찰하고 있어.
현재 시간 가속 배율은 ${speedMultiplier}배, 행성 크기 확대는 ${sizeMultiplier}배야.
${a.name}의 실제 공전 속도 비례값은 ${a.speed}, ${b.name}은 ${b.speed}이야 (숫자가 클수록 빠름).
이 둘의 공전 속도 차이를 관찰하도록 유도하는 질문을 딱 1개, 2문장 이내로 만들어줘.
정답을 알려주지 말고, 학생이 직접 이유를 생각하게 만드는 질문으로 써줘.`;

  try{
    const q = await callGemini(prompt, 200);
    currentMission = { a: a.name, b: b.name, question: q, speedMultiplier, sizeMultiplier };
    const card = document.getElementById('question-card');
    card.textContent = q;
    card.style.display = 'block';
    document.getElementById('answer-area').style.display = 'block';
    document.getElementById('student-answer').value = '';
  }catch(e){
    alert('질문 생성에 실패했어요: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '🤖 관측 미션 받기';
}

async function submitAnswer(){
  const answer = document.getElementById('student-answer').value.trim();
  if(!answer){ alert('생각을 먼저 적어주세요!'); return; }
  if(!currentMission){ return; }

  const fb = document.getElementById('feedback-box');
  fb.style.display = 'block';
  fb.textContent = '📡 AI 선생님이 답변을 읽는 중...';

  const prompt = `중학교 과학 교사로서 학생의 관측 답변을 따뜻하게 첨삭해줘.
질문: ${currentMission.question}
비교 대상: ${currentMission.a} vs ${currentMission.b}
학생 답변: ${answer}

과학적으로 맞는 부분은 칭찬하고, 부족한 부분은 힌트로 보완해줘. 3~4문장, 한국어로.`;

  try{
    const feedback = await callGemini(prompt, 400);
    fb.textContent = feedback;
    saveLog(currentMission, answer, feedback);
  }catch(e){
    fb.textContent = '❌ 피드백 생성 실패: ' + e.message;
  }
}

function saveLog(mission, answer, feedback){
  const logs = JSON.parse(localStorage.getItem('eaim_odyssey_logs') || '[]');
  logs.unshift({
    pair: `${mission.a} vs ${mission.b}`,
    question: mission.question,
    answer, feedback,
    date: new Date().toLocaleString('ko-KR')
  });
  localStorage.setItem('eaim_odyssey_logs', JSON.stringify(logs.slice(0, 20)));
  renderLogs();
}

function renderLogs(){
  const logs = JSON.parse(localStorage.getItem('eaim_odyssey_logs') || '[]');
  const el = document.getElementById('log-list');
  if(!logs.length){ el.innerHTML = '<p style="font-size:0.8em;color:#666">아직 기록이 없어요.</p>'; return; }
  el.innerHTML = logs.map(l => `
    <div class="log-item">
      <div class="log-meta">${l.pair} · ${l.date}</div>
      ${l.answer.substring(0,50)}${l.answer.length>50?'...':''}
    </div>`).join('');
}
renderLogs();
</script>
</body>
</html>
