<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 우주 관찰 일지 V2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0B0F19; color: #E2E8F0; }
        .font-serif { font-family: 'Gowun Dodum', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .iframe-container { position: relative; width: 100%; padding-bottom: 75%; height: 0; overflow: hidden; border-radius: 1rem; border: 2px solid #334155; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        @media print {
            body { background-color: white; color: black; }
            .print-hidden { display: none !important; }
            .print-area { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .print-text { color: black !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SpaceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [obsDate, setObsDate] = useState('');
            const [obsTarget, setObsTarget] = useState('');
            const [skyGuide, setSkyGuide] = useState('');
            
            const [scienceLog, setScienceLog] = useState('');
            const [emotionLog, setEmotionLog] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');
            
            const [imagePreview, setImagePreview] = useState(null);
            const [uploadedImage, setUploadedImage] = useState(null);

            const targets = [
                { id: '달', icon: '🌕', subtitle: '변화와 수용' },
                { id: '화성', icon: '🔴', subtitle: '열정과 용기' },
                { id: '목성', icon: '🌪️', subtitle: '거대한 포용력' },
                { id: '토성', icon: '🪐', subtitle: '나만의 아름다움' },
                { id: '계절별 별자리', icon: '✨', subtitle: '의미와 연결' }
            ];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
                
                const today = new Date().toISOString().split('T')[0];
                setObsDate(today);
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key', apiKey);
                setStep(1);
            };

            const generateSkyGuide = async () => {
                if(!obsDate || !obsTarget) return alert("날짜와 관찰 대상을 모두 선택해주세요.");
                setIsAnalyzing(true);
                
                const prompt = `당신은 중학교 천문학 교사입니다. ${obsDate} 시기에 밤하늘에서 '${obsTarget}'을(를) 관찰하려고 합니다. 
                이 천체의 과학적 특징과 오늘 밤 어떻게 보일지 예상하여 중학생에게 다정하게 3문장으로 설명해주세요.`;

                try {
                    const cleanKey = apiKey.trim();
                    // 💡 구글 최신 2.5 모델 안정화 버전(v1beta)으로 완벽 교체 완료!
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || '오류 발생');
                    setSkyGuide(data.candidates[0].content.parts[0].text);
                    setStep(2);
                } catch (e) { alert('가이드 생성 오류: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64Data = reader.result.split(',')[1];
                        setUploadedImage({ data: base64Data, mimeType: file.type });
                        setImagePreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const generateFeedback = async () => {
                setIsAnalyzing(true);
                setStep(4);
                
                let prompt = `당신은 학생의 마음을 잘 알아주는 따뜻한 과학 교사입니다. 
                학생이 밤하늘의 '${obsTarget}'을(를) 관찰하고 다음과 같이 일지를 썼습니다.
                - 과학적 관찰: ${scienceLog}
                - 우주를 보며 느낀 감정: ${emotionLog}\n\n`;

                if (uploadedImage) {
                    prompt += `학생이 첨부한 밤하늘 캡처 사진도 함께 전송했습니다. 사진에 찍힌 별자리나 행성의 모습이 있다면 이를 구체적으로 언급하며 칭찬해주세요.\n\n`;
                }

                prompt += `이 학생에게 1) 과학적 관찰력(및 사진)에 대한 칭찬, 2) ${obsTarget}의 특징을 학생의 감정과 연결하여 깊이 공감해 주는 따뜻한 편지 형식의 피드백을 작성해주세요.`;

                const parts = [{ text: prompt }];
                if (uploadedImage) {
                    parts.push({ inlineData: { data: uploadedImage.data, mimeType: uploadedImage.mimeType } });
                }

                try {
                    const cleanKey = apiKey.trim();
                    // 💡 구글 최신 2.5 모델 안정화 버전(v1beta)으로 완벽 교체 완료!
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || '오류 발생');
                    setTeacherFeedback(data.candidates[0].content.parts[0].text);
                } catch (e) { setTeacherFeedback('피드백 생성 오류: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            const printContent = () => window.print();
            const virtualSkyUrl = `https://virtualsky.lco.global/embed/index.html?longitude=128.5&latitude=36.0&projection=polar&constellations=true&constellationlabels=true&planets=true&color=dark&keyboard=false&clock=${obsDate}T20:00:00`;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-900 shadow-2xl flex flex-col relative print-area overflow-hidden">
                    <header className="bg-indigo-950 p-4 text-indigo-200 flex justify-between items-center shadow-md border-b border-indigo-900 print-hidden">
                        <h1 className="text-xl font-bold font-serif tracking-widest">✨ 별 헤는 밤</h1>
                        {step > 0 && <button onClick={() => setStep(0)} className="text-xs bg-indigo-800 text-indigo-100 px-2 py-1 rounded">설정</button>}
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto pb-24 text-gray-200 print-area">
                        {step === 0 && (
                            <div className="space-y-4 py-10 print-hidden">
                                <h2 className="text-xl font-bold text-indigo-300">⚙️ AI 천체망원경 연결</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-gray-800 border border-gray-600 p-3 rounded-lg text-white" />
                                <button onClick={saveApiKey} className="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold hover:bg-indigo-500">시스템 가동</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-serif text-indigo-300">1. 망원경 초점 맞추기</h2>
                                <p className="text-sm text-gray-400">관찰할 날짜와 오늘 만나고 싶은 우주의 친구를 선택하세요.</p>
                                
                                <input type="date" value={obsDate} onChange={e => setObsDate(e.target.value)} className="w-full bg-gray-800 border border-indigo-500 p-4 rounded-xl text-white text-xl text-center" />

                                <div className="grid grid-cols-2 gap-3 mt-4">
                                    {targets.map(t => (
                                        <button 
                                            key={t.id} 
                                            onClick={() => setObsTarget(t.id)}
                                            className={`p-4 rounded-xl border-2 flex flex-col items-center gap-2 transition-all ${obsTarget === t.id ? 'bg-indigo-600 border-indigo-400 scale-105' : 'bg-gray-800 border-gray-700 hover:border-indigo-500'}`}
                                        >
                                            <span className="text-3xl">{t.icon}</span>
                                            <span className="font-bold">{t.id}</span>
                                            <span className="text-xs text-indigo-200 text-center">{t.subtitle}</span>
                                        </button>
                                    ))}
                                </div>

                                <button onClick={generateSkyGuide} disabled={!obsTarget} className="w-full bg-yellow-500 text-gray-900 p-4 rounded-xl font-bold shadow-lg hover:bg-yellow-400 flex justify-center items-center gap-2 mt-6 disabled:opacity-50">
                                    {isAnalyzing ? <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-gray-900"></div> : <span>우주로 출발 🚀</span>}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fade-in print-hidden">
                                <div className="bg-indigo-900/50 border border-indigo-500/30 p-4 rounded-xl">
                                    <h3 className="text-sm font-bold text-indigo-300 mb-2">🔭 AI 망원경 가이드 ({obsTarget})</h3>
                                    <p className="text-md leading-relaxed font-serif text-indigo-100">{skyGuide}</p>
                                </div>

                                <h2 className="text-2xl font-serif text-yellow-300 mt-6">2. 3D 밤하늘 탐험하기</h2>
                                <p className="text-sm text-gray-400 bg-gray-800 p-3 rounded-lg border border-gray-700">
                                    👆 아래 밤하늘을 돌려보며 {obsTarget}을(를) 찾아보세요.<br/>
                                    📸 마음에 드는 장면을 찾았다면 화면을 캡처해 주세요!
                                </p>
                                
                                <div className="iframe-container bg-black">
                                    <iframe src={virtualSkyUrl} frameBorder="0" scrolling="no" title="Virtual Sky"></iframe>
                                </div>

                                <button onClick={() => setStep(3)} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-indigo-500 mt-4">캡처 완료! 일지 쓰러 가기 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-serif text-indigo-300">3. 우주 관찰 일지 작성</h2>
                                
                                <div className="space-y-3 p-4 bg-gray-800 rounded-xl border border-gray-700">
                                    <label className="text-sm font-bold text-indigo-300 flex items-center gap-2">
                                        <span>📸 밤하늘 캡처 사진 첨부 (선택)</span>
                                    </label>
                                    <input type="file" accept="image/*" onChange={handleImageUpload} className="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-900 file:text-indigo-300 hover:file:bg-indigo-800 w-full" />
                                    {imagePreview && <img src={imagePreview} alt="관찰 사진" className="mt-2 rounded-lg border border-indigo-500 w-full object-cover max-h-48" />}
                                </div>

                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-gray-400 block">📝 과학적 관찰 (어떤 특징을 발견했나요?)</label>
                                    <textarea value={scienceLog} onChange={e => setScienceLog(e.target.value)} className="w-full bg-gray-800 border border-gray-600 p-3 rounded-xl text-white h-24 font-serif" placeholder={`예: ${obsTarget}의 모습이 어떻게 보였다.`}></textarea>
                                </div>

                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-gray-400 block">💓 우주 감정 기록 (이걸 보며 어떤 기분이 들었나요?)</label>
                                    <textarea value={emotionLog} onChange={e => setEmotionLog(e.target.value)} className="w-full bg-gray-800 border border-gray-600 p-3 rounded-xl text-white h-24 font-serif" placeholder="예: 우주가 너무 넓어서 내가 작게 느껴졌지만, 한편으로는 편안했다."></textarea>
                                </div>

                                <button onClick={generateFeedback} disabled={!scienceLog || !emotionLog} className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-4 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 mt-8 disabled:opacity-50">
                                    <span>선생님께 일지 제출하기</span> <span>💌</span>
                                </button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6 animate-fade-in print-area">
                                <h2 className="text-2xl font-serif text-center text-pink-300 print-title print-text">💌 선생님의 별빛 답장</h2>
                                
                                <div className="bg-gray-800 p-6 rounded-3xl border-2 border-indigo-500/50 min-h-[300px] print-area print-text">
                                    {isAnalyzing ? (
                                        <div className="flex flex-col items-center justify-center h-48 space-y-4 print-hidden">
                                            <div className="animate-spin rounded-full h-10 w-10 border-b-4 border-indigo-500"></div>
                                            <p className="text-sm text-indigo-300 font-bold">선생님이 사진과 일지를 보며 답장을 쓰시는 중...</p>
                                        </div>
                                    ) : (
                                        <div className="whitespace-pre-wrap text-indigo-100 text-lg leading-relaxed font-serif print-text">
                                            {teacherFeedback}
                                        </div>
                                    )}
                                </div>

                                {!isAnalyzing && imagePreview && (
                                    <div className="mt-4 print-area">
                                        <p className="text-sm text-gray-400 mb-2 font-bold print-text">내가 관찰한 밤하늘 📸</p>
                                        <img src={imagePreview} alt="관찰 캡처" className="rounded-xl border border-gray-700 w-full max-h-64 object-cover" />
                                    </div>
                                )}

                                {!isAnalyzing && (
                                    <div className="flex justify-center print-hidden mt-6">
                                        <button onClick={printContent} className="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold hover:bg-emerald-500">🖨️ 일지 인쇄하기</button>
                                    </div>
                                )}

                                <button onClick={() => { setStep(1); setScienceLog(''); setEmotionLog(''); setTeacherFeedback(''); setObsTarget(''); setImagePreview(null); setUploadedImage(null); }} className="w-full bg-gray-700 text-gray-300 p-3 rounded-xl font-bold hover:bg-gray-600 mt-4 print-hidden">다른 천체 관찰하기</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpaceEAIMApp />);
    </script>
</body>
</html>
