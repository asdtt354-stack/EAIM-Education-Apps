<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 국어 감정 시인 & 편지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center; /* 세로 중앙 */
            color: #444;
        }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 3rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            border: 2px solid white;
            width: 100%;
        }
        .eaim-input {
            background: white !important;
            border: 2px solid #e2e8f0 !important;
            border-radius: 1.2rem !important;
            color: #333 !important;
            padding: 1rem !important;
        }
        .eaim-btn-main {
            background: #5f7adb !important;
            color: white !important;
            border-radius: 1.5rem !important;
            font-weight: bold;
            padding: 1rem !important;
            transition: all 0.3s ease;
        }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        @media print {
            body { background: white !important; color: black !important; }
            .print-hidden { display: none !important; }
            .eaim-card { border: 1px solid #ccc !important; box-shadow: none !important; background: white !important; }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full max-w-xl p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('신미나 싱고');
            const [readingPoem, setReadingPoem] = useState('');
            const [finalResult, setFinalResult] = useState('');
            const [emotionWord, setEmotionWord] = useState('');
            const [emotionColor, setEmotionColor] = useState('');
            const [situation, setSituation] = useState('');
            const [bodyPart, setBodyPart] = useState('');
            const [bodySensation, setBodySensation] = useState('');
            const [appearance, setAppearance] = useState('');
            const [relationship, setRelationship] = useState('');
            const [emotionName, setEmotionName] = useState('');
            const [friendName, setFriendName] = useState('');
            const [friendPoem, setFriendPoem] = useState('');
            const [draftLetter, setDraftLetter] = useState('');

            const words = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '억울한', '편안한', '신나는', '부끄러운', '포근한'];
            const colors = [
                { name: '빨강', code: '#EF4444' }, { name: '주황', code: '#F97316' }, { name: '노랑', code: '#FBBF24' },
                { name: '초록', code: '#34D399' }, { name: '파랑', code: '#3B82F6' }, { name: '보라', code: '#8B5CF6' }
            ];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const fetchPoem = async () => {
                if (!apiKey) return;
                setIsAnalyzing(true);
                setReadingPoem('시를 찾는 중입니다... ✨');
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `'${searchQuery}' 시를 한국어로 보여줘.` }] }] })
                    });
                    const data = await res.json();
                    setReadingPoem(data.candidates[0].content.parts[0].text);
                } catch (e) { setReadingPoem('오류 발생. 다시 시도하세요.'); } 
                finally { setIsAnalyzing(false); }
            };

            const generatePoem = async () => {
                setIsAnalyzing(true); setStep(6);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `감정: ${emotionWord}, 색: ${emotionColor}, 상황: ${situation} 바탕으로 시 작성.` }] }] })
                    });
                    const data = await res.json();
                    setFinalResult(data.candidates[0].content.parts[0].text);
                } catch (e) { setFinalResult('생성 실패'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="w-full">
                    <header className="flex justify-between items-center mb-6 px-2 print-hidden">
                        <h1 className="text-xl font-bold text-slate-600">📖 EAIM 국어</h1>
                        {step > 0 && <button onClick={() => { localStorage.removeItem('gemini_api_key'); setStep(0); }} className="text-xs bg-white px-3 py-1 rounded-full shadow-sm">키 재설정</button>}
                    </header>

                    <main className="eaim-card p-8 md:p-12">
                        {step === 0 && (
                            <div className="space-y-6 text-center">
                                <h2 className="font-bold">Gemini API 키 입력</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="w-full eaim-input text-center" placeholder="API Key 입력" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key', apiKey); setStep(1); }} className="w-full eaim-btn-main">시작하기</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-hand">1. 오늘의 시 읽기</h2>
                                <div className="flex gap-2">
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="flex-grow eaim-input" />
                                    <button onClick={fetchPoem} disabled={isAnalyzing} className="eaim-btn-main px-6">검색</button>
                                </div>
                                <div className="bg-white rounded-3xl p-6 min-h-[200px] border border-slate-100">
                                    <textarea readOnly value={readingPoem} className="w-full h-48 bg-transparent outline-none font-hand text-xl" />
                                </div>
                                <button onClick={() => setStep(2)} disabled={readingPoem.length < 5} className="w-full eaim-btn-main">이 시로 수업 시작 👉</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 text-center">
                                <h2 className="text-2xl font-hand">2. 감정 색깔과 단어</h2>
                                <div className="flex justify-center gap-2 mb-4">
                                    {colors.map(c => <button key={c.name} onClick={() => setEmotionColor(c.name)} className={`w-10 h-10 rounded-full ${emotionColor === c.name ? 'ring-4 ring-slate-400' : ''}`} style={{backgroundColor: c.code}} />)}
                                </div>
                                <div className="flex flex-wrap justify-center gap-2">
                                    {words.map(w => <button key={w} onClick={() => setEmotionWord(w)} className={`px-4 py-2 rounded-full font-hand text-lg border-2 ${emotionWord === w ? 'bg-slate-600 text-white' : 'bg-white'}`}>{w}</button>)}
                                </div>
                                <button onClick={() => setStep(3)} disabled={!emotionColor || !emotionWord} className="w-full eaim-btn-main mt-4">다음 단계 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-hand">3. 감정 관찰</h2>
                                <textarea value={situation} onChange={e => setSituation(e.target.value)} className="w-full eaim-input font-hand text-lg" placeholder="① 상황 기록" />
                                <div className="flex gap-2">
                                    <select value={bodyPart} onChange={e => setBodyPart(e.target.value)} className="eaim-input font-hand"><option value="">부위 선택</option><option value="머리">머리</option><option value="가슴">가슴</option></select>
                                    <input value={bodySensation} onChange={e => setBodySensation(e.target.value)} className="flex-grow eaim-input font-hand" placeholder="어떤 느낌?" />
                                </div>
                                <textarea value={appearance} onChange={e => setAppearance(e.target.value)} className="w-full eaim-input font-hand text-lg" placeholder="② 비유 (모양, 소리 등)" />
                                <button onClick={() => setStep(4)} className="w-full eaim-btn-main">다음 단계 👉</button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6 text-center">
                                <h2 className="text-2xl font-hand">4. 이름 짓기</h2>
                                <textarea value={relationship} onChange={e => setRelationship(e.target.value)} className="w-full eaim-input font-hand text-lg" placeholder="나는 감정과 어떤 사이?" />
                                <input type="text" value={emotionName} onChange={e => setEmotionName(e.target.value)} className="w-full eaim-input font-hand text-2xl text-center" placeholder="감정 이름 (예: 싱고)" />
                                <button onClick={generatePoem} disabled={!emotionName} className="w-full eaim-btn-main mt-4">AI 시 생성하기 ✨</button>
                            </div>
                        )}

                        {step === 6 && (
                            <div className="space-y-6 text-center">
                                <h2 className="text-2xl font-hand">📖 완성된 나의 시</h2>
                                <div className="bg-white/60 p-8 rounded-3xl text-left font-hand text-xl leading-relaxed min-h-[250px] border border-white">
                                    {isAnalyzing ? "AI 시인이 쓰는 중..." : finalResult}
                                </div>
                                {!isAnalyzing && (
                                    <div className="space-y-3 print-hidden">
                                        <button onClick={() => window.print()} className="w-full bg-slate-100 p-4 rounded-2xl font-bold">인쇄하기</button>
                                        <button onClick={() => setStep(7)} className="w-full bg-pink-400 text-white p-4 rounded-2xl font-bold shadow-lg">💌 공감 편지 쓰기</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {step === 7 && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-hand">💌 공감 편지</h2>
                                <input value={friendName} onChange={e => setFriendName(e.target.value)} className="w-full eaim-input font-hand" placeholder="친구 이름" />
                                <textarea value={friendPoem} onChange={e => setFriendPoem(e.target.value)} className="w-full eaim-input font-hand h-32" placeholder="친구 시 붙여넣기" />
                                <button onClick={async () => {
                                    setIsAnalyzing(true);
                                    try {
                                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ contents: [{ parts: [{ text: `편지 작성: ${friendName}에게 공감 전하기.` }] }] })
                                        });
                                        const data = await res.json();
                                        setDraftLetter(data.candidates[0].content.parts[0].text);
                                    } catch(e) { setDraftLetter('오류'); } finally { setIsAnalyzing(false); }
                                }} className="w-full eaim-btn-main">AI 공감 도우미</button>
                                {draftLetter && <div className="bg-white p-6 rounded-3xl mt-4 font-hand text-lg">{draftLetter}</div>}
                                <button onClick={() => setStep(6)} className="w-full text-sm opacity-50 mt-4 underline">내 시로 돌아가기</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
