<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 감정 시인 & 아티스트 v8.8</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #fdfcfb; min-height: 100vh; margin: 0; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .font-serif { font-family: 'Gowun Batang', serif; }
        .eaim-card { background: rgba(255, 255, 255, 0.95); border-radius: 2rem; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 500px; padding: 2rem; margin: 1rem auto; border-top: 8px solid #be185d; }
        .eaim-input { width: 100%; border: 1px solid #e5e7eb; border-radius: 1rem; padding: 0.9rem; outline: none; transition: 0.3s; font-size: 0.9rem; background: #fff; }
        .eaim-input:focus { border-color: #be185d; box-shadow: 0 0 0 3px rgba(190, 24, 93, 0.1); }
        .eaim-btn { background: #be185d; color: white; border-radius: 1rem; padding: 1rem; font-weight: bold; width: 100%; border: none; cursor: pointer; transition: 0.3s; }
        .eaim-btn:hover { background: #9d174d; transform: translateY(-2px); }
        .genre-btn { border: 1px solid #be185d; color: #be185d; border-radius: 99px; padding: 6px 14px; font-size: 0.75rem; font-weight: bold; transition: 0.2s; }
        .genre-active { background: #be185d; color: white; }
        .prompt-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 1rem; border-radius: 1rem; font-family: monospace; font-size: 0.65rem; color: #334155; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v8_7') || '');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const emotionWords = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '신나는', '포근한'];
            const colorPalette = [
                {name:'빨강', code:'#EF4444'}, {name:'주황', code:'#F97316'}, {name:'노랑', code:'#FBBF24'}, 
                {name:'초록', code:'#34D399'}, {name:'파랑', code:'#3B82F6'}, {name:'보라', code:'#8B5CF6'},
                {name:'분홍', code:'#F472B6'}, {name:'검정', code:'#1F2937'}, {name:'하양', code:'#F9FAFB'}
            ];

            const [userName, setUserName] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [foundPoem, setFoundPoem] = useState('');
            const [poemImpression, setPoemImpression] = useState('');
            const [dissect, setDissect] = useState({ emotion: '', color: '', newName: '', situation: '', body: '' });
            const [finalPoem, setFinalPoem] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');

            const genres = ['감성 발라드', '어쿠스틱 팝', 'K-Pop', '로파이', '뮤지컬', '재즈'];
            const [selectedGenre, setSelectedGenre] = useState('');
            const [sunoPrompt, setSunoPrompt] = useState('');
            const [imagePrompt, setImagePrompt] = useState('');

            // ⚡ 디렉터님 인증 모델 'gemini-2.5-flash' 적용 및 토큰 무제한 모드
            const callGemini = async (prompt, customTokens = 2000) => {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            temperature: 0.4,
                            topK: 20,
                            // 💡 잘림 방지를 위해 창의적 작업 시에는 최대치(8192)까지 허용
                            maxOutputTokens: customTokens 
                        }
                    })
                });
                const data = await res.json();
                if (!data.candidates || !data.candidates[0].content) throw new Error("응답 오류");
                return data.candidates[0].content.parts[0].text;
            };

            const handleSearchPoem = async () => {
                if(!searchQuery) return alert("제목이나 주제를 입력하세요!");
                setIsAnalyzing(true);
                try {
                    const text = await callGemini(`'${searchQuery}'에 해당하는 시를 찾아줘. 제목+시인이면 그 시의 전문을, 주제어면 그와 어울리는 명시를 추천해줘. [제목 / 시인]을 꼭 포함해줘.`);
                    setFoundPoem(text); setStep(2);
                } catch (e) { alert('시 검색 중 오류가 발생했습니다.'); } finally { setIsAnalyzing(false); }
            };

            const handleCreatePoem = async () => {
                if(!dissect.emotion || !dissect.color || !dissect.newName) return alert('감정과 색깔, 새 이름을 모두 정해주세요!');
                setIsAnalyzing(true); setStep(4);
                try {
                    // 💡 시 창작 단계에서는 토큰을 8192로 대폭 늘려 끊김 방지
                    const pText = await callGemini(`학생 '${userName}'이 읽은 시의 느낌('${poemImpression}')과 학생의 감정(단어:${dissect.emotion}, 색깔:${dissect.color}, 상황:${dissect.situation}, 신체:${dissect.body})을 융합한 한 편의 시를 지어줘. 학생이 감정에게 지어준 새 이름인 '${dissect.newName}'이 시의 중심 주제가 되어야 해. 인사말 없이 시 내용만 출력해.`, 8192);
                    setFinalPoem(pText);
                    
                    const fText = await callGemini(`당신은 사회정서학습(SEL) 전문 교사입니다. '${dissect.emotion}' 감정을 느끼고 이를 '${dissect.newName}'이라고 이름 붙인 학생에게 따뜻한 격려와 응원의 편지를 3문장으로 써주세요.`);
                    setTeacherFeedback(fText);
                } catch (e) { alert('창작 중 오류가 발생했습니다.'); setStep(3); } finally { setIsAnalyzing(false); }
            };

            const generateMultimedia = async (genre) => {
                setSelectedGenre(genre); setIsAnalyzing(true);
                try {
                    const mReq = callGemini(`시 [${finalPoem}]의 분위기를 반영하여 Suno AI(음악생성)에 입력할 영문 스타일 프롬프트를 작성해줘. 장르: ${genre}. 부연설명 없이 프롬프트만 출력.`);
                    const iReq = callGemini(`시 [${finalPoem}]의 이미지를 DALL-E용 영문 앨범 커버 프롬프트로 작성해줘. 시각적 묘사 위주로. 부연설명 없이 프롬프트만 출력.`);
                    const [mRes, iRes] = await Promise.all([mReq, iReq]);
                    setSunoPrompt(mRes); setImagePrompt(iRes);
                } catch (e) { alert('멀티미디어 생성 중 오류가 발생했습니다.'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="p-4 max-w-lg mx-auto">
                    <header className="flex justify-between items-center mb-4 px-2">
                        <h1 className="font-hand text-2xl text-pink-800 font-bold italic underline decoration-pink-300">EAIM 감정 시인 2.5 PRO</h1>
                        {step > 0 && <button onClick={() => window.location.reload()} className="text-[10px] text-gray-400 border border-gray-300 px-2 py-1 rounded hover:bg-gray-100">초기화</button>}
                    </header>

                    <div className="eaim-card animate-fadeIn shadow-2xl border-b-8 border-pink-100">
                        {step === 0 && (
                            <div className="space-y-6 text-center py-10">
                                <div className="text-6xl mb-4">🖋️</div>
                                <h2 className="text-xl font-bold text-gray-700">디렉터님, 작가실에 오신 것을 환영합니다</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="eaim-input text-center" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_v8_7', apiKey.trim()); setStep(1); }} className="eaim-btn shadow-lg">시스템 접속</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6">
                                <div className="text-center space-y-2">
                                    <h3 className="font-bold text-lg text-gray-800">1단계: 영감의 씨앗 찾기</h3>
                                    <p className="text-[11px] text-slate-400">좋아하는 시 제목이나, '눈물', '우정' 같은 단어를 적어보세요.</p>
                                </div>
                                <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="eaim-input border-pink-200" placeholder="시 제목 또는 주제어" />
                                <button onClick={handleSearchPoem} className="eaim-btn">{isAnalyzing ? "영감을 불러오는 중..." : "영감 찾기 ✨"}</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-5 animate-fadeIn">
                                <div className="bg-stone-50 p-6 rounded-2xl text-sm font-serif max-h-60 overflow-y-auto border border-stone-100 shadow-inner leading-relaxed">
                                    <pre className="whitespace-pre-wrap">{foundPoem}</pre>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-pink-800 ml-1">💬 이 시가 마음의 어떤 부분을 건드렸나요?</label>
                                    <textarea value={poemImpression} onChange={e => setPoemImpression(e.target.value)} className="eaim-input h-24 text-sm" placeholder="떠오르는 생각이나 느낌을 적어보세요."></textarea>
                                </div>
                                <button onClick={() => setStep(3)} className="eaim-btn">내 마음 분석하기 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fadeIn">
                                <input type="text" value={userName} onChange={e => setUserName(e.target.value)} className="eaim-input font-bold text-center border-pink-300" placeholder="당신의 필명을 적어주세요" />
                                
                                <div className="space-y-3">
                                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1">지금 내 감정의 이름은?</label>
                                    <div className="flex flex-wrap gap-2">
                                        {emotionWords.map(w => (
                                            <button key={w} onClick={() => setDissect({...dissect, emotion: w})} className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${dissect.emotion === w ? 'bg-pink-600 text-white shadow-md scale-105' : 'bg-white border border-gray-200 text-gray-500'}`}>{w}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest ml-1">이 감정의 색깔은?</label>
                                    <div className="flex flex-wrap gap-3">
                                        {colorPalette.map(c => (
                                            <button key={c.name} onClick={() => setDissect({...dissect, color: c.name})} style={{backgroundColor: c.code}} className={`w-9 h-9 rounded-full border-2 transition-all ${dissect.color === c.name ? 'ring-4 ring-pink-200 border-pink-600 scale-110' : 'border-white shadow-sm'}`} title={c.name}></button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-4 pt-2 border-t border-pink-50">
                                    <input type="text" className="eaim-input text-xs" placeholder="언제 이런 마음이 들었나요? (상황)" onChange={e => setDissect({...dissect, situation: e.target.value})} />
                                    <input type="text" className="eaim-input text-xs" placeholder="그때 몸의 느낌은? (예: 목이 메여요, 발끝이 짜릿해요)" onChange={e => setDissect({...dissect, body: e.target.value})} />
                                    <div className="bg-pink-50 p-4 rounded-2xl border border-pink-100">
                                        <label className="text-[10px] font-bold text-pink-700 block mb-2 uppercase">✨ 이 감정에게 지어줄 새로운 특별한 이름</label>
                                        <input type="text" className="eaim-input font-bold text-pink-600 placeholder-pink-300" placeholder="예: 무지개 눈물, 구름 솜사탕" onChange={e => setDissect({...dissect, newName: e.target.value})} />
                                    </div>
                                </div>
                                <button onClick={handleCreatePoem} className="eaim-btn bg-pink-800 shadow-xl">한 편의 시 완성하기 🪄</button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-8">
                                {isAnalyzing && !sunoPrompt ? (
                                    <div className="py-20 text-center space-y-4 animate-pulse">
                                        <div className="text-4xl">✍️</div>
                                        <div className="text-pink-700 font-bold">작가님의 마음을 아름다운 시로 엮고 있습니다...</div>
                                    </div>
                                ) : (
                                    <div className="animate-fadeIn space-y-8 pb-10">
                                        <div className="bg-white p-8 rounded-[2.5rem] border-2 border-pink-100 text-center shadow-lg relative">
                                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-pink-600 text-white text-[9px] px-4 py-1 rounded-full font-bold shadow-md tracking-widest">ARTIST PIECE</div>
                                            <h4 className="font-hand text-2xl text-pink-800 mb-6">{userName} 시인</h4>
                                            <div className="font-serif text-base leading-loose whitespace-pre-wrap text-gray-800">
                                                {finalPoem}
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-4">
                                            <div className="flex items-center gap-2 mb-2">
                                                <div className="h-px flex-grow bg-gray-200"></div>
                                                <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Multi-Art Presets</span>
                                                <div className="h-px flex-grow bg-gray-200"></div>
                                            </div>
                                            <div className="flex flex-wrap justify-center gap-2">
                                                {genres.map(g => (
                                                    <button key={g} onClick={() => generateMultimedia(g)} className={`genre-btn ${selectedGenre === g ? 'genre-active shadow-md' : 'bg-white hover:bg-pink-50'}`}>{g}</button>
                                                ))}
                                            </div>
                                        </div>

                                        {(sunoPrompt || imagePrompt) && (
                                            <div className="space-y-5 animate-fadeIn">
                                                <div className="space-y-2">
                                                    <p className="text-[10px] font-bold text-blue-600 ml-1 flex items-center gap-1"><i className="fa-solid fa-music"></i> Suno AI Music Style</p>
                                                    <div className="prompt-box bg-blue-50/30 border-blue-100">{sunoPrompt}</div>
