<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 에임우주탐험대 - 3D 입체 관측 v2.7</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #000; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #side-panel { width: 320px; min-width: 320px; background: rgba(10,10,25,0.95); border-right: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 20; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        #canvas-container { flex-grow: 1; background: #000; cursor: pointer; }
        #interaction-area { height: 35%; background: #080810; padding: 20px; border-top: 1px solid #222; display: none; z-index: 20; }
        .btn-home { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white; padding: 10px 20px; border-radius: 20px; border: 1px solid #555; z-index: 100; cursor: pointer; }
        
        /* 행성 이름 라벨 스타일 */
        .planet-label { position: absolute; color: white; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; border: 1px solid var(--main-color); }
    </style>
</head>
<body>

<div id="intro-ui" style="position:absolute; top:30px; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; z-index:10;">
    <h1 style="color:var(--main-color); text-shadow: 0 0 15px #00d4ff; margin:0;">에임 우주 탐험대</h1>
    <p style="color:#aaa;">탐사할 행성을 클릭하여 3D 정밀 관측을 시작하세요!</p>
</div>

<button class="btn-home" onclick="location.reload()">☀️ 전체 태양계</button>

<div id="label-container" style="position:absolute; top:0; left:0; pointer-events:none; width:100%; height:100%;"></div>

<div id="side-panel">
    <h2>🔭 탐사 설정</h2>
    <div id="obs-location" style="color:var(--accent); font-size:0.9em; margin: 15px 0;">📍 관측소 수신 중</div>
    <div id="log-list" style="flex-grow:1; border-top:1px solid #333; padding-top:15px; overflow-y:auto;">
        <h3>📖 탐사 일지</h3>
        <div id="log-container"></div>
    </div>
</div>

<div id="main-view">
    <div id="canvas-container"></div>
    <div id="interaction-area">
        <h3 id="target-title">관측 기록실</h3>
        <p id="question" style="font-size:0.9em; color:#aaa; margin-bottom:10px;"></p>
        <textarea id="student-answer" style="width:100%; height:60px; background:#161625; color:white; border:1px solid #333; padding:10px; border-radius:6px;"></textarea>
        <button onclick="runGemini25()" style="width:100%; padding:12px; background:var(--main-color); border:none; border-radius:6px; font-weight:bold; margin-top:10px; cursor:pointer;">AI 분석 및 저장</button>
        <div id="ai-response" style="margin-top:10px; font-size:0.9em; line-height:1.6;"></div>
    </div>
</div>

<script>
    const planetsData = {
        mercury: { name: "수성", dist: 25, size: 1.2, speed: 0.04, color: 0xaaaaaa, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg", obs: "라 실라 천문대" },
        venus: { name: "금성", dist: 40, size: 1.8, speed: 0.015, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg", obs: "마우나케아 천문대" },
        earth: { name: "지구", dist: 55, size: 2.0, speed: 0.01, color: 0x2233ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg", obs: "보현산 천문대" },
        mars: { name: "화성", dist: 70, size: 1.5, speed: 0.008, color: 0xff4422, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg", obs: "우티 전파 천문대" },
        jupiter: { name: "목성", dist: 95, size: 5.0, speed: 0.004, color: 0xffaa88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg", obs: "팔로마 천문대" },
        saturn: { name: "토성", dist: 125, size: 4.2, speed: 0.002, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png", obs: "사이딩 스프링 천문대" },
        uranus: { name: "천왕성", dist: 150, size: 2.5, speed: 0.0015, color: 0x88ddff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/uranus.jpg", obs: "유럽 남방 천문대" },
        neptune: { name: "해왕성", dist: 175, size: 2.4, speed: 0.001, color: 0x3355ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/neptune.jpg", obs: "파라날 천문대" }
    };

    let isObserving = false;
    let currentTarget = null;
    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sun = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    const planetMeshes = {};
    const labels = {};
    const loader = new THREE.TextureLoader();

    Object.keys(planetsData).forEach(key => {
        const p = planetsData[key];
        const mat = new THREE.MeshStandardMaterial({ 
            map: loader.load(p.texture),
            emissive: new THREE.Color(p.color),
            emissiveIntensity: 0.4 
        });
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), mat);
        mesh.userData = { id: key, name: p.name };
        planetMeshes[key] = mesh;
        scene.add(mesh);

        // 이름 라벨 생성
        const el = document.createElement('div');
        el.className = 'planet-label';
        el.innerText = p.name;
        document.getElementById('label-container').appendChild(el);
        labels[key] = el;
    });

    camera.position.set(0, 180, 250);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;

        Object.keys(planetMeshes).forEach(key => {
            const p = planetsData[key];
            const m = planetMeshes[key];
            const el = labels[key];

            if (!isObserving) {
                m.position.x = Math.cos(time * p.speed * 10) * p.dist;
                m.position.z = Math.sin(time * p.speed * 10) * p.dist;
                m.rotation.y += 0.01;
                el.style.display = 'block';

                // 3D 좌표를 2D 화면 좌표로 변환하여 라벨 위치 조정
                const vector = m.position.clone().project(camera);
                const x = (vector.x * 0.5 + 0.5) * container.clientWidth;
                const y = (vector.y * -0.5 + 0.5) * container.clientHeight;
                el.style.left = `${x}px`;
                el.style.top = `${y - 20}px`;
            } else {
                if (key === currentTarget) {
                    m.rotation.y += 0.005;
                    el.style.display = 'none';
                } else {
                    m.visible = false;
                    el.style.display = 'none';
                }
            }
        });
        renderer.render(scene, camera);
    }
    animate();

    container.onclick = (e) => {
        if(isObserving) return;
        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(((e.clientX - rect.left) / container.clientWidth) * 2 - 1, -((e.clientY - rect.top) / container.clientHeight) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(planetMeshes));
        if(intersects.length > 0) startObservation(intersects[0].object.userData.id);
    };

    function startObservation(id) {
        isObserving = true; currentTarget = id;
        const p = planetsData[id];
        document.getElementById('intro-ui').style.display = 'none';
        document.getElementById('side-panel').style.display = 'flex';
        document.getElementById('interaction-area').style.display = 'block';
        
        // 클릭한 행성을 중앙으로 가져오고 입체적으로 확대
        planetMeshes[id].position.set(0, 0, 0);
        camera.position.set(0, 0, p.size * 3.5);
        camera.lookAt(0, 0, 0);
        
        document.getElementById('obs-location').innerText = `📍 실시간 관측지: ${p.obs}`;
        document.getElementById('target-title').innerText = `${p.name} 3D 정밀 탐사`;
        document.getElementById('question').innerText = `${p.name}의 표면 질감과 색상을 관찰해 보세요. 어떤 특징이 보이나요?`;
    }

    const API_KEY = "여기에_성공하셨던_API키";
    async function runGemini25() {
        const ans = document.getElementById('student-answer').value;
        const resp = document.getElementById('ai-response');
        if(!ans) return alert("내용을 입력해주세요.");
        resp.innerHTML = "📡 AI 가이드 분석 중...";
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생의 3D 관측 답변에 피드백해줘: ${ans}` }] }] })
            });
            const data = await res.json();
            resp.innerHTML = `<b>AI 피드백:</b><br>${data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>')}`;
            saveToLocal();
        } catch(e) { resp.innerHTML = "연결 오류"; }
    }

    function saveToLocal() {
        const log = { target: planetsData[currentTarget].name, ans: document.getElementById('student-answer').value, time: new Date().toLocaleString() };
        let logs = JSON.parse(localStorage.getItem('eaim_v2.7_logs') || "[]");
        logs.unshift(log);
        localStorage.setItem('eaim_v2.7_logs', JSON.stringify(logs));
        displayLogs();
    }

    function displayLogs() {
        const logs = JSON.parse(localStorage.getItem('eaim_v2.7_logs') || "[]");
        document.getElementById('log-container').innerHTML = logs.map(l => `<div style="background:#1a1a2e; padding:8px; border-radius:5px; margin-bottom:8px; border-left:3px solid #00d4ff;"><small>${l.time}</small><br><b>${l.target}</b>: ${l.ans.substring(0,25)}...</div>`).join('');
    }
    window.onload = displayLogs;
</script>
</body>
</html>
