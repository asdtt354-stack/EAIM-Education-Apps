<!DOCTYPE html>
<html lang="ko">
<head>

    <title>EAIM 국어 감정 시인 & 편지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .eaim-input {
            background: rgba(255, 255, 255, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: white !important;
            border-radius: 1.2rem !important;
        }
        .eaim-btn-white {
            background: white !important;
            color: #667eea !important;
            border-radius: 1.5rem !important;
            font-weight: bold;
            transition: all 0.3s;
        }
        .eaim-btn-white:hover { transform: scale(1.02); opacity: 0.9; }
        @media print {
            body { background: white !important; color: black !important; }
            .eaim-card { background: white !important; border: 1px solid #ddd !important; box-shadow: none !important; color: black !important; }
            .print-hidden { display: none !important; }
        }
    </style>
</head>

                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();

                } finally {
                    setIsAnalyzing(false);
                }
            };
