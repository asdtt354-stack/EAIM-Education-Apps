<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 일상 과학 탐험대</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #334155; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 3rem; box-shadow: 0 20px 50px rgba(0,0,0,0.08); border: 2px solid white; width: 100%; max-width: 550px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; transition: 0.3s; }
        .eaim-input:focus { border-color: #818cf8; outline: none; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }
        textarea.eaim-input { text-align: left; resize: none; }
        .eaim-btn-main { background: #6366f1 !important; color: white !important; border-radius: 1.5rem; padding: 1.1rem; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        .eaim-btn-main:hover:not(:disabled) { background: #4f46e5 !important; transform: scale(1.02); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ScienceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [scienceUnit, setScienceUnit] = useState('');
            const [emotionKeyword, setEmotionKeyword] = useState('');
            const [dailyScenario, setDailyScenario] = useState('');
            
            const [quizAnswer, setQuizAnswer] = useState('');
            const [quizReason, setQuizReason] = useState('');
            const [scienceHint, setScienceHint] = useState('');
            const [isLoadingHint, setIsLoadingHint] = useState(false);
            const [feedbackReport, setFeedbackReport] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_sci_v2');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            // ⚡ gemini-2.5-flash 모델 적용 및 출력 제한 해제
            const callGemini = async (prompt, customConfig = {}) => {
                const cleanKey = apiKey.trim();
                // 💡 디렉터님이 검증하신 마법의 2.5 엔진 주소!
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                temperature: customConfig.temperature ?? 0.4, 
                                topK: customConfig.topK ?? 20,
                                // 💡 문장이 잘리지 않도록 8192 토큰까지 넉넉하게 확장
                                maxOutputTokens: customConfig.maxTokens ?? 8192
                            }
                        })
                    });
                    
                    if (!response.ok) throw new Error('API 연결에 실패했습니다. 키를 확인해 주세요.');
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (error) {
                    throw new Error('시스템 점검 중이거나 연결이 불안정합니다.');
                }
            };

            const generateScenario = async () => {
                if (!apiKey) return alert('API 키를 입력해주세요.');
                setIsAnalyzing(true);
                setDailyScenario('탐험 보고서를 작성 중입니다... 💭');
                
                const prompt = `당신은 중학교 과학 선생님입니다. 단원 '${scienceUnit}'과 감정 '${emotionKeyword}'을 연결한 이야기를 다음 4단계 형식으로 잘림 없이 끝까지 써줘:
                
                [일어난 상황] / [왜 그런 상황이 일어났을까?] / [주인공의 마음] / [문제 해결 퀴즈(4지선다)]
                
                중간에 끊기지 말고 반드시 퀴즈 4번 보기까지 다 적고 마무리해줘.`;

                try {
                    const text = await callGemini(prompt, { temperature: 0.6 });
                    setDailyScenario(text);
                    setStep(2);
                } catch (e) { alert(e.message); setStep(1); } 
                finally { setIsAnalyzing(false); }
            };

            const getHint = async () => {
                setIsLoadingHint(true);
                try {
                    const text = await callGemini(`상황: ${dailyScenario} \n위 상황의 힌트를 다정하게 1문장으로만 줘.`, { temperature: 0.2, maxTokens: 150 });
                    setScienceHint(text);
                } catch (e) { setScienceHint('앗, 통신 지연! 다시 눌러봐.'); }
                finally { setIsLoadingHint(false); }
            };

            const solveQuiz = async () => {
                if (!quizAnswer || !quizReason) return alert('정답과 이유를 적어줘!');
                setIsAnalyzing(true); setStep(3);
                try {
                    const text = await callGemini(`정답: ${quizAnswer}, 이유: ${quizReason} \n선생님으로서 [과학의 시선]과 [마음의 시선]을 담은 피드백을 따뜻하게 써줘.`);
                    setFeedbackReport(text);
                } catch (e) { setFeedbackReport('피드백 생성 실패'); } 
                finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="text-center space-y-6 animate-fadeIn">
                            <h2 className="font-bold text-2xl font-hand text-indigo-700">EAIM 과학 탐험대 접속</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="eaim-input" placeholder="Gemini API Key 입력" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_sci_v2', apiKey.trim()); setStep(1); }} className="eaim-btn-main">시스템 가동 🚀</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div className="space-y-6">
                            <header className="flex justify-between items-center mb-6 border-b border-indigo-100 pb-3">
                                <span className="font-bold text-indigo-600 font-hand text-xl">EAIM 2.5 PRO 🔬</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key_sci_v2'); setStep(0); window.location.reload(); }} className="text-xs text-slate-400 underline">RESET</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <input type="text" value={scienceUnit} onChange={e => setScienceUnit(e.target.value)} className="eaim-input" placeholder="과학 단원 입력" />
                                    <input type="text" value={emotionKeyword} onChange={e => setEmotionKeyword(e.target.value)} className="eaim-input" placeholder="감정 키워드 입력" />
                                    <button onClick={generateScenario} disabled={isAnalyzing} className="eaim-btn-main">{isAnalyzing ? "이야기 생성 중..." : "탐험 시작 ✨"}</button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="bg-white p-6 rounded-3xl border-2 border-indigo-200 font-hand text-lg whitespace-pre-wrap shadow-sm">{dailyScenario}</div>
                                    <div className="space-y-5 bg-indigo-50/50 p-6 rounded-3xl border border-indigo-100">
                                        <div className="flex justify-between items-center"><h3 className="font-bold text-indigo-600">나의 생각 기록실</h3>{!scienceHint && <button onClick={getHint} disabled={isLoadingHint} className="text-xs bg-yellow-400 px-3 py-1 rounded-full font-bold">💡 힌트</button>}</div>
                                        {scienceHint && <div className="bg-yellow-50 p-3 rounded-2xl border border-yellow-200 text-sm font-hand">👩‍🏫 {scienceHint}</div>}
                                        <input type="number" value={quizAnswer} onChange={e => setQuizAnswer(e.target.value)} className="eaim-input w-full" placeholder="정답 번호 (1~4)" />
                                        <textarea value={quizReason} onChange={e => setQuizReason(e.target.value)} className="eaim-input w-full h-24" placeholder="이유와 마음 기록"></textarea>
                                    </div>
                                    <button onClick={solveQuiz} disabled={!quizAnswer || !quizReason || isAnalyzing} className="eaim-btn-main">제출하기 📝</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="bg-white p-8 rounded-3xl border-2 border-indigo-200 whitespace-pre-wrap font-hand text-xl leading-relaxed">{feedbackReport}</div>
                                    <button onClick={() => setStep(1)} className="eaim-btn-main bg-indigo-500">다른 탐험 시작하기 🚀</button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScienceEAIMApp />);
    </script>
</body>
</html>
