<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 태양계 오디세이 - 공전/자전 시뮬레이터</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #020205; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* 미니멀한 UI 오버레이 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; box-sizing: border-box; }
        
        .header { text-align: center; }
        .header h1 { color: var(--main-color); margin: 0; font-size: 3em; text-shadow: 0 0 20px rgba(0, 212, 255, 0.5); letter-spacing: 2px; }
        .header p { color: #aaa; font-size: 1.2em; margin-top: 10px; font-weight: 300; }
        
        /* 공전 속도 조절기 (시간 가속) */
        .control-panel { background: rgba(10, 10, 20, 0.8); border: 1px solid #333; padding: 20px 30px; border-radius: 15px; pointer-events: auto; width: 400px; margin: 0 auto; backdrop-filter: blur(10px); }
        .control-panel label { display: block; margin-bottom: 10px; color: var(--main-color); font-weight: bold; font-size: 1.1em; text-align: center; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: var(--main-color); }
        .speed-labels { display: flex; justify-content: space-between; color: #888; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="header">
        <h1>에임 태양계 오디세이</h1>
        <p>거대한 태양계의 공전과 자전을 관찰해보세요</p>
    </div>
    
    <div class="control-panel">
        <label>⏱️ 시간 가속기 (공전 속도 조절)</label>
        <input type="range" id="speed-slider" min="0.1" max="10" step="0.1" value="1">
        <div class="speed-labels">
            <span>느리게</span>
            <span>초고속</span>
        </div>
    </div>
</div>

<div id="canvas-container"></div>

<script>
    // --- [1] 데이터: 시원하고 거대한 궤도 세팅 ---
    const planetsData = {
        mercury: { name: "수성", dist: 120, size: 4, speed: 0.04, color: 0xaaaaaa, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg" },
        venus: { name: "금성", dist: 180, size: 7, speed: 0.015, color: 0xffcc33, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg" },
        earth: { name: "지구", dist: 250, size: 8, speed: 0.01, color: 0x2233ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg" },
        mars: { name: "화성", dist: 320, size: 5, speed: 0.008, color: 0xff3300, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg" },
        jupiter: { name: "목성", dist: 480, size: 22, speed: 0.004, color: 0xffaa88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg" },
        saturn: { name: "토성", dist: 650, size: 18, speed: 0.002, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png" }
    };

    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 20000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // ★ 배경에 미세한 별빛(Starfield) 추가 (우주 느낌 극대화)
    const starsGeometry = new THREE.BufferGeometry();
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.8 });
    const starsVertices = [];
    for(let i=0; i<3000; i++) {
        const x = (Math.random() - 0.5) * 4000;
        const y = (Math.random() - 0.5) * 4000;
        const z = (Math.random() - 0.5) * 4000;
        starsVertices.push(x, y, z);
    }
    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // 조명: 태양계 전체를 은은하게 비춤
    scene.add(new THREE.AmbientLight(0xffffff, 2.0)); 
    const sun = new THREE.Mesh(new THREE.SphereGeometry(50, 64, 64), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
    scene.add(sun);
    
    // 태양의 후광(Glow) 효과
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
    const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(65, 32, 32), glowMat);
    scene.add(sunGlow);

    const meshes = {}, loader = new THREE.TextureLoader();
    Object.keys(planetsData).forEach(key => {
        const p = planetsData[key];
        const mat = new THREE.MeshStandardMaterial({ 
            map: loader.load(p.texture), 
            emissive: new THREE.Color(p.color), 
            emissiveIntensity: 0.5 
        });
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), mat);
        meshes[key] = m;
        scene.add(m);

        // 아주 얇고 세련된 궤도 라인
        const orbitGeom = new THREE.RingGeometry(p.dist - 0.5, p.dist + 0.5, 256);
        const orbitMat = new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
        const orbit = new THREE.Mesh(orbitGeom, orbitMat);
        orbit.rotation.x = Math.PI/2;
        scene.add(orbit);
    });

    // 카메라 시점: 태양계 전체가 한눈에 보이는 웅장한 각도
    camera.position.set(0, 800, 1200);
    camera.lookAt(0, 0, 0);

    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        
        // 슬라이더 값에 따라 전체 공전/자전 속도 조절
        const speedMultiplier = document.getElementById('speed-slider').value;
        time += 0.005 * speedMultiplier;

        // 별빛 천천히 회전
        starField.rotation.y += 0.0005 * speedMultiplier;

        Object.keys(meshes).forEach(key => {
            const p = planetsData[key], m = meshes[key];
            // 공전
            m.position.x = Math.cos(time * p.speed * 20) * p.dist;
            m.position.z = Math.sin(time * p.speed * 20) * p.dist;
            // 자전 (스스로 도는 속도)
            m.rotation.y += 0.02 * speedMultiplier; 
        });
        
        renderer.render(scene, camera);
    }
    animate();

    // 반응형 화면 처리
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
