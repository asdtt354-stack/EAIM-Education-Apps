<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM 우주탐험대 - Ver 2.5 지능형 관측 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #020205; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; display: flex; }
        
        /* 왼쪽 제어판 */
        #control-panel { width: 320px; height: 100vh; background: rgba(15, 15, 25, 0.95); border-right: 1px solid #333; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        
        /* 오른쪽 뷰포트 */
        #main-view { flex: 1; height: 100vh; display: flex; flex-direction: column; }
        #canvas-container { flex: 1.5; background: radial-gradient(circle, #0a0a1a 0%, #000 100%); position: relative; }
        #interaction-area { flex: 1; background: #080810; padding: 30px; border-top: 2px solid #1a1a2e; overflow-y: auto; }

        h2, h3 { color: var(--main-color); margin-top: 0; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9em; color: #aaa; }
        select, input, button { width: 100%; padding: 12px; margin-bottom: 20px; background: #1a1a2e; border: 1px solid #444; color: white; border-radius: 6px; font-size: 1em; }
        button { background: var(--main-color); color: #000; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background: #00b8e6; transform: translateY(-2px); }

        #obs-details { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; font-size: 0.85em; line-height: 1.6; border: 1px solid #222; }
        #ai-response { margin-top: 20px; padding: 20px; border-radius: 10px; background: #111120; border: 1px dashed #444; min-height: 80px; }
        .loading { color: var(--main-color); animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="control-panel">
    <h2>🔭 탐사 설정</h2>
    <p style="font-size:0.8em; color:#666; margin-bottom:25px;">EAIM Intelligent System v2.5</p>
    
    <label>📅 관측 날짜</label>
    <select id="date-select" onchange="updateObservation()">
