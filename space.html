<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 우주 탐험대</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0B0F19; color: #E2E8F0; }
        .font-serif { font-family: 'Gowun Dodum', serif; }
        .iframe-container { position: relative; width: 100%; padding-bottom: 75%; height: 0; overflow: hidden; border-radius: 1rem; border: 2px solid #334155; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        @media print {
            body { background-color: white; color: black; }
            .print-hidden { display: none !important; }
            .print-area { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .print-text { color: black !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SpaceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [obsDate, setObsDate] = useState('');
            const [obsTarget, setObsTarget] = useState('');
            const [skyGuide, setSkyGuide] = useState('');
            const [scienceLog, setScienceLog] = useState('');
            const [emotionLog, setEmotionLog] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');
            const [imagePreview, setImagePreview] = useState(null);
            const [uploadedImage, setUploadedImage] = useState(null);

            const targets = [
                { id: '달', icon: '🌕', subtitle: '변화와 수용' },
                { id: '화성', icon: '🔴', subtitle: '열정과 용기' },
                { id: '목성', icon: '🌪️', subtitle: '거대한 포용력' },
                { id: '토성', icon: '🪐', subtitle: '나만의 아름다움' },
                { id: '계절별 별자리', icon: '✨', subtitle: '의미와 연결' }
            ];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_space');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
                setObsDate(new Date().toISOString().split('T')[0]);
            }, []);

            const callGemini = async (prompt, imageData = null) => {
                const cleanKey = apiKey.trim();
                // 💡 디렉터님 환경 전용 2.5-flash 엔진 적용
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                
                const contents = [{ parts: [{ text: prompt }] }];
                if (imageData) {
                    contents[0].parts.push({ inlineData: { data: imageData.data, mimeType: imageData.mimeType } });
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const generateSkyGuide = async () => {
                setIsAnalyzing(true);
                try {
                    const text = await callGemini(`당신은 천문학 교사입니다. ${obsDate} 밤하늘의 '${obsTarget}'에 대한 과학적 특징과 관찰 팁을 중학생에게 다정하게 3문장으로 설명해주세요.`);
                    setSkyGuide(text);
                    setStep(2);
                } catch (e) { alert('오류: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            const generateFeedback = async () => {
                setIsAnalyzing(true);
                setStep(4);
                try {
                    const text = await callGemini(`학생이 '${obsTarget}' 관찰 후 쓴 일지입니다.\n과학관찰: ${scienceLog}\n감정: ${emotionLog}\n따뜻한 과학 선생님으로서 관찰력 칭찬과 정서적 공감이 담긴 답장을 써주세요.`, uploadedImage);
                    setTeacherFeedback(text);
                } catch (e) { setTeacherFeedback('오류 발생: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            const virtualSkyUrl = `https://virtualsky.lco.global/embed/index.html?longitude=128.5&latitude=36.0&projection=polar&constellations=true&constellationlabels=true&planets=true&color=dark&keyboard=false&clock=${obsDate}T20:00:00`;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-900 shadow-2xl flex flex-col relative print-area">
                    <header className="bg-indigo-950 p-4 text-indigo-200 flex justify-between items-center print-hidden">
                        <h1 className="text-xl font-bold font-serif tracking-widest">✨ EAIM 우주 탐험대</h1>
                        {step > 0 && <button onClick={() => { localStorage.removeItem('gemini_api_key_space'); setStep(0); window.location.reload(); }} className="text-xs underline">키 재설정</button>}
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto pb-24">
                        {step === 0 && (
                            <div className="space-y-4 py-10 text-center">
                                <h2 className="text-xl font-bold text-indigo-300">⚙️ AI 망원경 연결</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-gray-800 border p-3 rounded-lg text-white outline-none text-center" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_space', apiKey.trim()); setStep(1); }} className="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold">시스템 가동</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fade-in">
                                <h2 className="text-2xl font-serif text-indigo-300 text-center">관찰 대상 선택</h2>
                                <input type="date" value={obsDate} onChange={e => setObsDate(e.target.value)} className="w-full bg-gray-800 border-indigo-500 p-4 rounded-xl text-white text-center" />
                                <div className="grid grid-cols-2 gap-3">
                                    {targets.map(t => (
                                        <button key={t.id} onClick={() => setObsTarget(t.id)} className={`p-4 rounded-xl border-2 transition-all ${obsTarget === t.id ? 'bg-indigo-600 border-indigo-400' : 'bg-gray-800 border-gray-700'}`}>
                                            <div className="text-3xl">{t.icon}</div>
                                            <div className="font-bold">{t.id}</div>
                                        </button>
                                    ))}
                                </div>
                                <button onClick={generateSkyGuide} disabled={!obsTarget || isAnalyzing} className="w-full bg-yellow-500 text-gray-900 p-4 rounded-xl font-bold">
                                    {isAnalyzing ? "탐사 준비 중..." : "우주로 출발 🚀"}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-indigo-900/50 p-4 rounded-xl border border-indigo-500/30">
                                    <h3 className="text-sm font-bold text-indigo-300 mb-2">🔭 가이드 ({obsTarget})</h3>
                                    <p className="text-md font-serif text-indigo-100">{skyGuide}</p>
                                </div>
                                <div className="iframe-container bg-black"><iframe src={virtualSkyUrl} frameBorder="0"></iframe></div>
                                <button onClick={() => setStep(3)} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">캡처 완료! 일지 쓰기 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-4 animate-fade-in">
                                <h2 className="text-2xl font-serif text-indigo-300 text-center">우주 관찰 일지</h2>
                                <textarea value={scienceLog} onChange={e => setScienceLog(e.target.value)} className="w-full bg-gray-800 p-3 rounded-xl text-white h-24" placeholder="발견한 과학적 특징"></textarea>
                                <textarea value={emotionLog} onChange={e => setEmotionLog(e.target.value)} className="w-full bg-gray-800 p-3 rounded-xl text-white h-24" placeholder="우주를 보며 느낀 감정"></textarea>
                                <button onClick={generateFeedback} disabled={!scienceLog || isAnalyzing} className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-4 rounded-xl font-bold">
                                    {isAnalyzing ? "제출 중..." : "일지 제출 💌"}
                                </button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6 animate-fade-in print-area">
                                <h2 className="text-2xl font-serif text-center text-pink-300 print-text">💌 선생님의 답장</h2>
                                <div className="bg-gray-800 p-6 rounded-3xl border-2 border-indigo-500/50 min-h-[300px] print-text">
                                    {isAnalyzing ? "작성 중..." : <div className="whitespace-pre-wrap font-serif">{teacherFeedback}</div>}
                                </div>
                                <div className="flex gap-3 print-hidden">
                                    <button onClick={() => window.print()} className="flex-1 bg-emerald-600 text-white p-3 rounded-xl font-bold">인쇄</button>
                                    <button onClick={() => setStep(1)} className="flex-1 bg-gray-700 text-white p-3 rounded-xl font-bold">다른 탐사</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpaceEAIMApp />);
    </script>
</body>
</html>
