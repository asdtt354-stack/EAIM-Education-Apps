<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 에임우주탐험대 v5.0 - Real-time NASA Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #000; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        #canvas-container { flex: 1; background: radial-gradient(circle, #0a0a25 0%, #000 100%); cursor: pointer; }
        
        /* NASA APOD 위젯 (우측 하단) */
        #nasa-apod { position: absolute; bottom: 20px; right: 20px; width: 250px; background: rgba(0,0,0,0.8); border: 1px solid var(--main-color); border-radius: 12px; padding: 10px; z-index: 150; font-size: 0.8em; }
        #apod-img { width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }

        #header-ui { position: absolute; top: 0; left: 0; width: 100%; padding: 25px; box-sizing: border-box; display: flex; justify-content: space-between; pointer-events: none; z-index: 100; }
        .btn-home { background: rgba(0,212,255,0.3); color: white; padding: 10px 25px; border-radius: 20px; border: 1px solid var(--main-color); pointer-events: auto; cursor: pointer; }
        #side-panel { width: 380px; min-width: 380px; background: rgba(10,10,25,0.98); border-left: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 200; overflow-y: auto; }
        .btn-analyze { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: var(--main-color); color: #000; }
    </style>
</head>
<body>

<div id="main-view">
    <div id="header-ui">
        <div style="width: 150px;"></div>
        <div style="text-align: center; pointer-events: none;">
            <h1 style="color:var(--main-color); margin:0; font-size: 2.5em; text-shadow: 0 0 15px #00d4ff;">에임 우주 탐험대</h1>
            <p id="sub-msg" style="color:#aaa; margin-top: 5px;">현재 시각: <span id="real-time"></span> (NASA 데이터 연동 중)</p>
        </div>
        <button class="btn-home" onclick="location.reload()">☀️ 전체 태양계</button>
    </div>
    <div id="canvas-container"></div>

    <div id="nasa-apod">
        <div style="color:var(--main-color); font-weight:bold;">🛰️ NASA 오늘의 사진</div>
        <img id="apod-img" src="" alt="APOD">
        <div id="apod-title" style="margin-top:5px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Loading...</div>
    </div>
</div>

<div id="side-panel">
    <h2 style="color:var(--main-color); margin-top: 0;">🔭 정밀 관측 데이터</h2>
    <div id="obs-meta" style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:20px; border-left:4px solid var(--accent); font-size:0.9em;"></div>
    <textarea id="student-answer" style="width:100%; height:120px; background:#161625; color:white; border:1px solid #333; border-radius:8px; padding:12px; margin-bottom:10px;" placeholder="NASA 데이터를 기반으로 관측한 내용을 적어보세요..."></textarea>
    <button class="btn-analyze" onclick="callGemini25()">AI 튜터 피드백 (Engine 2.5)</button>
    <div id="ai-response" style="margin-top:15px; font-size:0.95em; line-height:1.7; color:#eee;"></div>
</div>

<script>
    const API_KEY = "발급받으신_API_키"; // Gemini API Key
    let isObserving = false, currentTarget = null;

    // --- [1] NASA APOD 연동 (무료 API 사용) ---
    async function loadNASA_APOD() {
        try {
            const res = await fetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY`); // 데모키 사용 가능
            const data = await res.json();
            document.getElementById('apod-img').src = data.url;
            document.getElementById('apod-title').innerText = data.title;
            document.getElementById('apod-img').onclick = () => window.open(data.url, '_blank');
        } catch(e) { document.getElementById('apod-title').innerText = "NASA 데이터 수신 불가"; }
    }
    loadNASA_APOD();

    // --- [2] 실시간 행성 위치(공전 각도) 계산 알고리즘 ---
    // 현재 날짜를 기준으로 행성들의 공전 주기를 계산하여 초기 위치를 잡아줍니다.
    function getPlanetRealAngle(periodInDays) {
        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 0);
        const diff = now - startOfYear;
        const oneDay = 1000 * 60 * 60 * 24;
        const dayOfYear = Math.floor(diff / oneDay);
        // 날짜를 기준으로 각도를 변환 (수학적 시뮬레이션)
        return (dayOfYear / periodInDays) * Math.PI * 2;
    }

    const planetsData = {
        mercury: { name: "수성", dist: 150, size: 10, speed: 0.04, period: 88, color: 0xaaaaaa, obs: "라 실라 천문대" },
        venus: { name: "금성", dist: 220, size: 15, speed: 0.015, period: 225, color: 0xffcc33, obs: "마우나케아 천문대" },
        earth: { name: "지구", dist: 320, size: 18, speed: 0.01, period: 365, color: 0x2233ff, obs: "보현산 천문대" },
        mars: { name: "화성", dist: 420, size: 14, speed: 0.008, period: 687, color: 0xff4400, obs: "우티 전파 천문대" },
        jupiter: { name: "목성", dist: 600, size: 45, speed: 0.004, period: 4333, color: 0xffaa88, obs: "팔로마 천문대" },
        saturn: { name: "토성", dist: 800, size: 38, speed: 0.002, period: 10759, color: 0xffdd88, obs: "사이딩 스프링 천문대" }
    };

    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const mainLight = new THREE.PointLight(0xffffff, 2.5, 5000);
    scene.add(mainLight);

    const sun = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    const meshes = {}, loader = new THREE.TextureLoader();
    const initialAngles = {}; // 오늘 날짜 기준 초기 위치 저장

    Object.keys(planetsData).forEach(key => {
        const p = planetsData[key];
        initialAngles[key] = getPlanetRealAngle(p.period); // NASA 연동 위치 계산
        
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(p.size, 64, 64), 
            new THREE.MeshStandardMaterial({ map: loader.load(`https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/${key}.jpg`), emissive: new THREE.Color(p.color), emissiveIntensity: 0.2 })
        );
        m.userData = { id: key, name: p.name };
        meshes[key] = m;
        scene.add(m);

        // 궤도 라인
        const orbitGeom = new THREE.RingGeometry(p.dist - 1, p.dist + 1, 256);
        const orbitMat = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide });
        const orbit = new THREE.Mesh(orbitGeom, orbitMat);
        orbit.rotation.x = Math.PI/2;
        scene.add(orbit);
    });

    camera.position.set(0, 1500, 2500);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;
        document.getElementById('real-time').innerText = new Date().toLocaleString();

        if (!isObserving) {
            Object.keys(meshes).forEach(key => {
                const p = planetsData[key], m = meshes[key];
                // 초기 각도 + 공전 속도 합산 (현재 시간 위치 동기화)
                const currentAngle = initialAngles[key] + (time * p.speed * 20);
                m.position.x = Math.cos(currentAngle) * p.dist;
                m.position.z = Math.sin(currentAngle) * p.dist;
                m.rotation.y += 0.05;
            });
        } else {
            meshes[currentTarget].rotation.y += 0.005;
        }
        renderer.render(scene, camera);
    }
    animate();

    container.onclick = (e) => {
        if(isObserving) return;
        const mouse = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(meshes));
        if(intersects.length > 0) {
            isObserving = true; currentTarget = intersects[0].object.userData.id;
            const p = planetsData[currentTarget];
            document.getElementById('side-panel').style.display = 'flex';
            document.getElementById('obs-meta').innerHTML = `📍 관측지: ${p.obs}<br>🔭 관측 시점: ${new Date().toLocaleDateString()}<br>📡 NASA Horizons 데이터 동기화 완료`;
            meshes[currentTarget].position.set(0,0,0);
            camera.position.set(0, p.size * 1.5, p.size * 4);
            camera.lookAt(0,0,0);
        }
    };

    async function callGemini25() {
        const ans = document.getElementById('student-answer').value;
        if(!ans) return alert("관측 내용을 적어주세요!");
        document.getElementById('ai-response').innerHTML = "📡 Engine 2.5 Flash가 실시간 데이터를 분석 중...";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생의 실시간 관측 기록 "${ans}"에 대해 NASA의 팩트를 기반으로 피드백해줘.` }] }] }) });
            const data = await res.json();
            document.getElementById('ai-response').innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
        } catch(e) { document.getElementById('ai-response').innerHTML = "❌ 엔진 연동 오류"; }
    }
</script>
</body>
</html>
