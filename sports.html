<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 비트 & 볼 (바디 퍼커션)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #111827; color: #F3F4F6; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(31, 41, 55, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(75, 85, 99, 0.4); }
        .neon-border { box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); border-color: #F97316; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const BeatAndBallApp = () => {
            // 👇 여기에 대표님의 실제 제미나이 API 키를 입력하세요! (따옴표 안에 넣으세요)
            const API_KEY = "여기에_API_키를_넣어주세요"; 
            
            // Step 1부터 바로 시작하도록 수정되었습니다.
            const [step, setStep] = useState(1); 
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [sport, setSport] = useState('농구 🏀');
            const [beatStyle, setBeatStyle] = useState('힙합 (Boom Bap) 🎧');
            const [parsedData, setParsedData] = useState({ intro: '', teamA: '', teamB: '', teamC: '' });
            
            const [journal, setJournal] = useState('');
            const [imagePreview, setImagePreview] = useState(null);
            const [uploadedImage, setUploadedImage] = useState(null);
            const [teacherFeedback, setTeacherFeedback] = useState('');

            const sports = ['농구 🏀', '배구 🏐', '축구 ⚽', '짐볼 🔵'];
            const beats = ['힙합 (Boom Bap) 🎧', '빠른 댄스 (EDM) ⚡', '펑키 리듬 (Funky) 🎸', '응원가 비트 (March) 🥁'];

            const extractSection = (text, sectionName) => {
                const regex = new RegExp(`\\[${sectionName}\\](.*?)(?=\\[|$)`, 's');
                const match = text.match(regex);
                return match ? match[1].trim() : '데이터 로드 실패';
            };

            const generateBeatMatrix = async () => {
                if (API_KEY === "여기에_API_키를_넣어주세요" || !API_KEY) {
                    return alert("코드 상단 21번째 줄에 API 키를 먼저 입력해주세요!");
                }

                setIsAnalyzing(true);
                const prompt = `당신은 체육교사이자 훌륭한 바디 퍼커션 안무가입니다.
                종목: ${sport}, 비트 스타일: ${beatStyle}
                이 두 가지를 결합하여 학생들이 체육관에서 4박자에 맞춰 공을 튕기며 거대한 타악기 합주(앙상블)를 할 수 있도록 리듬을 3개 팀으로 쪼개주세요.

                아래 양식을 지켜 출력하세요.
                [도입부] 이 바디 퍼커션 합주가 주는 신나는 에너지에 대한 1문장 응원
                [A팀 리듬] (예: 정박자 바운스 - 1, 3박자에 맞춰 공을 강하게 바닥에 '쿵!')
                [B팀 리듬] (예: 엇박자 캐치 - 2, 4박자에 맞춰 손뼉을 치고 공을 잡음 '짝!')
                [C팀 리듬] (예: 잔발 드리블 - 비트 사이사이에 빠르게 양손 드리블 '타다닥')`;

                try {
                    // 💡 구글 최신 2.5 모델로 교체 완료
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                    const text = data.candidates[0].content.parts[0].text;
                    
                    setParsedData({
                        intro: extractSection(text, '도입부'),
                        teamA: extractSection(text, 'A팀 리듬'),
                        teamB: extractSection(text, 'B팀 리듬'),
                        teamC: extractSection(text, 'C팀 리듬')
                    });
                    setStep(2);
                } catch (e) { alert('비트 생성 오류가 발생했습니다: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setUploadedImage({ data: reader.result.split(',')[1], mimeType: file.type });
                        setImagePreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const generateFeedback = async () => {
                setIsAnalyzing(true);
                setStep(4);
                
                let prompt = `당신은 학생들의 에너지를 사랑하는 따뜻한 체육 교사입니다. 
                학생이 '${sport}'과 '${beatStyle}'로 바디 퍼커션 합주를 마친 후 다음과 같이 감정 일지를 썼습니다.
                - 학생의 감정/느낌: ${journal}\n\n`;

                if (uploadedImage) prompt += `학생이 활동 장면을 캡처한 사진도 올렸습니다. 역동적인 움직임이나 팀워크가 보인다면 칭찬해주세요.\n\n`;

                prompt += `학생에게 1) 체육 활동의 에너지에 대한 칭찬과 2) 친구들과 비트를 맞추며 느낀 정서(SEL)에 깊이 공감하는 파이팅 넘치는 피드백을 써주세요.`;

                const parts = [{ text: prompt }];
                if (uploadedImage) parts.push({ inlineData: { data: uploadedImage.data, mimeType: uploadedImage.mimeType } });

                try {
                    // 💡 구글 최신 2.5 모델로 교체 완료
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                    setTeacherFeedback(data.candidates[0].content.parts[0].text);
                } catch (e) { setTeacherFeedback('피드백 생성 오류: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-900 shadow-2xl flex flex-col relative overflow-hidden">
                    <header className="bg-gray-950 p-4 flex justify-between items-center border-b border-gray-800">
                        <h1 className="text-2xl font-title tracking-wider text-orange-500 italic">BEAT & BALL</h1>
                        {/* 더 이상 설정(Step 0) 버튼이 필요하지 않아 제거했습니다 */}
                    </header>

                    <main className="flex-grow p-5 overflow-y-auto pb-24">
                        {step === 1 && (
                            <div className="space-y-6 animate-fade-in mt-6">
                                <div className="text-center space-y-2">
                                    <h2 className="text-3xl font-title text-white">바디 퍼커션 세팅</h2>
                                    <p className="text-gray-400 text-sm">종목과 음악을 고르면 AI가 앙상블 비트를 짜줍니다.</p>
                                </div>
                                
                                <div className="space-y-3">
                                    <label className="text-sm font-bold text-gray-300 ml-1">🏀 구기 종목 선택</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        {sports.map(s => <button key={s} onClick={() => setSport(s)} className={`p-3 rounded-xl font-bold transition-all ${sport === s ? 'bg-orange-600 text-white neon-border' : '
