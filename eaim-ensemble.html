<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 앙상블 V2.5 - 실시간 합주</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #09090b; color: #f4f4f5; margin: 0; overflow-x: hidden; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(39, 39, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(82, 82, 91, 0.5); }
        .active-chord { border-color: #22d3ee; background: rgba(34, 211, 238, 0.2); transform: scale(1.02); box-shadow: 0 0 20px rgba(34, 211, 238, 0.2); }
        /* 스크롤바 숨기기 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const EnsembleApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [ytUrl, setYtUrl] = useState('https://www.youtube.com/watch?v=kY3Lp-D_oas'); 
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [chords, setChords] = useState([]); 
            const [currentTime, setCurrentTime] = useState(0);
            const playerRef = useRef(null);
            const timerRef = useRef(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { 
                    setApiKey(savedKey); 
                    setStep(1); 
                }
                
                // YouTube API 로드
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    const firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                }
            }, []);

            const extractVideoId = (url) => {
                const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[7].length === 11) ? match[7] : null;
            };

            const analyzeSong = async () => {
                if (!apiKey) { alert("API 키를 입력해주세요."); return; }
                setIsAnalyzing(true);

                // 프롬프트: JSON 형식을 강제하고 불필요한 설명을 금지함
                const prompt = `당신은 에임기타(EAIM) 전문가입니다. 
                유튜브 곡(${ytUrl})을 분석하여 초보자가 조옮김 없이 합주 가능한 '다이어트 코드' 리스트를 만드세요.
                반드시 아래 JSON 배열 형식으로만 대답하세요. 설명이나 인사는 생략하세요.
                
                형식: [{"time": 초(숫자), "chord": "코드명", "scale": "계이름", "tip": "운지법"}]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    
                    const data = await response.json();
                    const rawText = data.candidates[0].content.parts[0].text;
                    
                    // 정규식으로 JSON 배열 부분만 추출 (오류 방지 핵심)
                    const jsonMatch = rawText.match(/\[[\s\S]*\]/);
                    if (jsonMatch) {
                        setChords(JSON.parse(jsonMatch[0]));
                        setStep(2);
                        setTimeout(() => initYouTube(), 100);
                    } else {
                        throw new Error("데이터 형식이 올바르지 않습니다.");
                    }
                } catch (e) { 
                    console.error(e);
                    alert('분석 실패: AI 응답을 처리할 수 없습니다. 다시 시도해 주세요.'); 
                } finally { 
                    setIsAnalyzing(false); 
                }
            };

            const initYouTube = () => {
                const videoId = extractVideoId(ytUrl);
                if (!window.YT || !videoId) return;

                if (playerRef.current) {
                    playerRef.current.destroy();
                }

                playerRef.current = new window.YT.Player('yt-player', {
                    videoId: videoId,
                    width: '100%',
                    height: '100%',
                    events: {
                        'onStateChange': (event) => {
                            if (event.data === window.YT.PlayerState.PLAYING) {
                                timerRef.current = setInterval(() => {
                                    setCurrentTime(playerRef.current.getCurrentTime());
                                }, 100);
                            } else {
                                clearInterval(timerRef.current);
                            }
                        }
                    }
                });
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-zinc-900 flex flex-col shadow-2xl relative">
                    {/* 헤더 */}
                    <header className="p-4 bg-zinc-950 border-b border-zinc-800 flex justify-between items-center sticky top-0 z-50">
                        <h1 className="font-title text-cyan-400 italic tracking-tighter text-xl">EAIM 2.5 ENSEMBLE</h1>
                        {step > 0 && <button onClick={() => location.reload()} className="text-[10px] bg-zinc-800 px-2 py-1 rounded text-zinc-400 uppercase">Reset</button>}
                    </header>

                    <main className="flex-grow p-4 pb-10">
                        {/* 0단계: API 키 입력 */}
                        {step === 0 && (
                            <div className="py-10 space-y-6">
                                <div className="space-y-2">
                                    <h2 className="text-2xl font-bold">🔑 스튜디오 인증</h2>
                                    <p className="text-zinc-500 text-sm">에임 스튜디오의 AI 기능을 활성화합니다.</p>
                                </div>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full p-4 bg-zinc-800 rounded-2xl border border-zinc-700 focus:border-cyan-500 outline-none transition-all" />
                                <button onClick={() => {localStorage.setItem('gemini_api_key', apiKey); setStep(1);}} className="w-full bg-cyan-600 hover:bg-cyan-500 p-4 rounded-2xl font-bold text-lg shadow-lg shadow-cyan-900/20">인증 및 입장</button>
                            </div>
                        )}

                        {/* 1단계: 분석 대기 */}
                        {step === 1 && (
                            <div className="py-10 space-y-8">
                                <div className="text-center space-y-2">
                                    <h2 className="text-3xl font-title">유튜브 화성 압축</h2>
                                    <p className="text-zinc-400">원곡 키를 유지하며 다이어트 코드로 변환합니다.</p>
                                </div>
                                <div className="space-y-4">
                                    <label className="text-xs font-bold text-zinc-500 ml-1">YOUTUBE LINK</label>
                                    <input type="text" value={ytUrl} onChange={e => setYtUrl(e.target.value)} className="w-full p-4 bg-zinc-800 border-2 border-zinc-700 rounded-2xl text-sm focus:border-cyan-500 outline-none" />
                                </div>
                                <button onClick={analyzeSong} disabled={isAnalyzing} className="w-full bg-cyan-600 hover:bg-cyan-500 p-5 rounded-3xl font-bold text-xl flex justify-center items-center gap-2 transition-all active:scale-95 shadow-xl shadow-cyan-900/30">
                                    {isAnalyzing ? (
                                        <><span className="animate-spin text-2xl">⏳</span> 분석 중...</>
                                    ) : (
                                        <>다이어트 코드 추출 🪄</>
                                    )}
                                </button>
                            </div>
                        )}

                        {/* 2단계: 실시간 연주 가이드 */}
                        {step === 2 && (
                            <div className="space-y-6 animate-in fade-in duration-700">
                                {/* 고정형 유튜브 플레이어 */}
                                <div className="sticky top-16 z-40 py-2 bg-zinc-900">
                                    <div id="yt-player" className="w-full aspect-video rounded-3xl overflow-hidden border-2 border-zinc-800 shadow-2xl bg-black"></div>
                                </div>
                                
                                <div className="flex justify-between items-center px-2">
                                    <span className="text-[10px] text-cyan-400 font-black tracking-widest uppercase">EAIM Diet Chord Logic</span>
                                    <div className="flex gap-2">
                                        <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                                        <span className="text-[10px] text-zinc-400 uppercase">Live Syncing</span>
                                    </div>
                                </div>

                                {/* 코드 리스트 */}
                                <div className="space-y-4">
                                    {chords.length > 0 ? chords.map((item, idx) => {
                                        const isActive = currentTime >= item.time && (chords[idx+1] ? currentTime < chords[idx+1].time : true);
                                        return (
                                            <div key={idx} className={`glass-panel p-5 rounded-2xl transition-all duration-500 flex items-center justify-between ${isActive ? 'active-chord' : 'opacity-30 scale-95'}`}>
                                                <div className="flex flex-col gap-1">
                                                    <span className="text-3xl font-black text-white leading-none">{item.chord}</span>
                                                    <span className="text-cyan-400 font-bold text-sm tracking-tighter">{item.scale} 계이름</span>
                                                </div>
                                                <div className="text-right space-y-1">
                                                    <span className="text-[9px] text-zinc-500 block uppercase font-bold">Finger Tip</span>
                                                    <span className="bg-zinc-800 border border-zinc-700 px-4 py-1.5 rounded-full text-xs text-zinc-200 font-medium inline-block">{item.tip}</span>
                                                </div>
                                            </div>
                                        );
                                    }) : (
                                        <div className="text-center py-10 text-zinc-500">분석된 데이터가 없습니다.</div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                    
                    {/* 푸터 하단 고정 바 */}
                    {step === 2 && (
                        <div className="fixed bottom-0 max-w-md w-full p-3 bg-zinc-950/80 backdrop-blur-md border-t border-zinc-800 text-center">
                            <p className="text-[9px] text-zinc-600 font-medium">© 2026 EAIM STUDIO - DIET CHORD SYSTEM</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnsembleApp />);
    </script>
</body>
</html>
