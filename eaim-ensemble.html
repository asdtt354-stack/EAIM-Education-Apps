<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM INTELLIGENT ENSEMBLE</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow-x: hidden; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .play-screen { background: radial-gradient(circle at top, #1e1b4b 0%, #020617 100%); min-height: 100vh; }
        .note-active { background: #22d3ee !important; color: #000 !important; transform: scale(1.1); box-shadow: 0 0 20px #22d3ee; }
        .diet-box { border: 2px solid #334155; border-radius: 1.5rem; transition: 0.3s; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 900; background: rgba(30, 41, 59, 0.5); }
        .instrument-btn { padding: 0.8rem 1.5rem; border-radius: 1rem; font-weight: bold; transition: 0.3s; border: 1px solid #334155; }
        .instrument-btn.active { background: #f43f5e; color: white; border-color: #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
        .progress-bar { height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: #22d3ee; transition: 0.1s; }
        @keyframes flow { from { transform: translateY(0); } to { transform: translateY(10px); } }
        .animate-flow { animation: flow 0.5s infinite alternate; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const EnsembleApp = () => {
            const [step, setStep] = useState(0); // 0: API, 1: Upload, 2: Analyzing, 3: Play
            const [apiKey, setApiKey] = useState('');
            const [audioFile, setAudioFile] = useState(null);
            const [audioUrl, setAudioUrl] = useState('');
            const [selectedInst, setSelectedInst] = useState('Bass'); // Bass, Piano, Guitar
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            
            // AI가 분석한 타임라인별 화성 데이터
            const [timeline, setTimeline] = useState([]);
            const audioRef = useRef(null);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_ensemble');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            // [로직] 원곡 업로드 및 화성 분석 시뮬레이션
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setAudioFile(file);
                setAudioUrl(URL.createObjectURL(file));
                setStep(2);

                // 💡 디렉터님의 '다이어트 코드' 특허 로직 프롬프트
                const prompt = `당신은 음악 분석 AI입니다. 파일명 '${file.name}'의 화성을 분석하여 합주용 타임라인 JSON을 만드세요.
                1. 원곡 키를 분석하고 C, G, F, D 중 가장 쉬운 조로 조바꿈(Transpose) 하세요.
                2. 0초부터 30초까지 2초 간격으로 진행되는 코드와 [근음, 3음, 5음]의 한글 계이름을 추출하세요.
                3. 반드시 아래 JSON 형식만 출력하세요:
                [{"time": 0, "chord": "C", "root": "도", "third": "미", "fifth": "솔"}, ...]`;

                try {
                    const text = await callGemini(prompt);
                    const jsonStr = text.match(/\[.*\]/s)[0];
                    setTimeline(JSON.parse(jsonStr));
                    setStep(3);
                } catch (e) {
                    alert("분석 중 오류가 발생했습니다. (데모용 데이터를 로드합니다)");
                    // 오류 시 데모 데이터 세팅
                    setTimeline([
                        {time:0, chord:"C", root:"도", third:"미", fifth:"솔"},
                        {time:4, chord:"G", root:"솔", third:"시", fifth:"레"},
                        {time:8, chord:"Am", root:"라", third:"도", fifth:"미"},
                        {time:12, chord:"F", root:"파", third:"라", fifth:"도"}
                    ]);
                    setStep(3);
                }
            };

            // 현재 재생 시간에 맞는 코드 찾기
            const currentData = timeline.find((item, index) => {
                const nextItem = timeline[index + 1];
                return currentTime >= item.time && (!nextItem || currentTime < nextItem.time);
            }) || { chord: '-', root: '-', third: '-', fifth: '-' };

            const updateTime = () => {
                if (audioRef.current) {
                    setCurrentTime(audioRef.current.currentTime);
                    setDuration(audioRef.current.duration);
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen shadow-2xl flex flex-col relative overflow-hidden">
                    {step === 0 && (
                        <div className="flex-grow p-10 flex flex-col justify-center text-center bg-slate-950">
                            <h2 className="text-2xl font-bold text-cyan-400 mb-6">ENSEMBLE SYSTEM READY</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="bg-slate-900 border border-slate-700 p-4 rounded-xl text-white text-center mb-4" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_ensemble', apiKey.trim()); setStep(1); }} className="bg-cyan-600 p-4 rounded-xl font-bold">시스템 가동</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="flex-grow p-10 flex flex-col justify-center text-center bg-slate-950">
                            <div className="text-6xl mb-6">🎵</div>
                            <h2 className="text-2xl font-bold mb-2">원곡 업로드</h2>
                            <p className="text-slate-500 text-sm mb-8">합주하고 싶은 MP3 파일을 선택하세요.<br/>AI가 실시간 악보를 생성합니다.</p>
                            <label className="bg-indigo-600 p-5 rounded-2xl font-bold cursor-pointer hover:bg-indigo-500 transition-all">
                                파일 선택하기 (MP3)
                                <input type="file" accept="audio/*" onChange={handleFileUpload} className="hidden" />
                            </label>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="flex-grow flex flex-col justify-center items-center bg-slate-950">
                            <div className="relative w-24 h-24 mb-6">
                                <div className="absolute inset-0 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                                <div className="absolute inset-4 border-4 border-pink-500 border-b-transparent rounded-full animate-spin-reverse" style={{animationDirection:'reverse'}}></div>
                            </div>
                            <p className="text-cyan-400 font-bold animate-pulse">지능형 화성 분석 로직 가동 중...</p>
                            <p className="text-slate-500 text-xs mt-2">원곡 키 분석 및 조바꿈 수행 중</p>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="play-screen flex-grow flex flex-col p-6">
                            <header className="flex justify-between items-center mb-8">
                                <span className="font-title text-cyan-400 text-xl tracking-tighter">EAIM LIVE</span>
                                <button onClick={() => setStep(1)} className="text-xs text-slate-500 underline">EXIT</button>
                            </header>

                            {/* 악기 선택 섹션 */}
                            <div className="flex justify-between mb-8">
                                <button onClick={() => setSelectedInst('Bass')} className={`instrument-btn ${selectedInst==='Bass'?'active':''}`}>BASS</button>
                                <button onClick={() => setSelectedInst('Guitar')} className={`instrument-btn ${selectedInst==='Guitar'?'active':''}`}>GUITAR</button>
                                <button onClick={() => setSelectedInst('Piano')} className={`instrument-btn ${selectedInst==='Piano'?'active':''}`}>PIANO</button>
                            </div>

                            {/* 실시간 음 표시 섹션 (핵심!) */}
                            <div className="flex-grow flex flex-col justify-center space-y-6">
                                <div className="text-center">
                                    <span className="text-pink-500 font-bold text-sm uppercase tracking-widest">Current Chord</span>
                                    <div className="text-6xl font-black text-white mt-2">{currentData.chord}</div>
                                </div>

                                <div className="grid grid-cols-1 gap-4">
                                    {selectedInst === 'Bass' && (
                                        <div className="space-y-2">
                                            <p className="text-center text-xs text-slate-500">연주할 음 (근음)</p>
                                            <div className="diet-box note-active animate-flow">{currentData.root}</div>
                                        </div>
                                    )}
                                    {selectedInst === 'Guitar' && (
                                        <div className="space-y-2">
                                            <p className="text-center text-xs text-slate-500">파워코드 구성음 (1+5음)</p>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div className="diet-box note-active">{currentData.root}</div>
                                                <div className="diet-box note-active">{currentData.fifth}</div>
                                            </div>
                                        </div>
                                    )}
                                    {selectedInst === 'Piano' && (
                                        <div className="space-y-2">
                                            <p className="text-center text-xs text-slate-500">화성 구성음 (1+3+5음)</p>
                                            <div className="grid grid-cols-3 gap-2">
                                                <div className="diet-box note-active text-xl">{currentData.root}</div>
                                                <div className="diet-box note-active text-xl">{currentData.third}</div>
                                                <div className="diet-box note-active text-xl">{currentData.fifth}</div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 하단 컨트롤러 */}
                            <div className="mt-auto pt-10">
                                <div className="progress-bar mb-4">
                                    <div className="progress-fill" style={{width: `${(currentTime/duration)*100}%`}}></div>
                                </div>
                                <audio 
                                    ref={audioRef} 
                                    src={audioUrl} 
                                    onTimeUpdate={updateTime} 
                                    controls 
                                    className="w-full h-10 opacity-50 hover:opacity-100 transition-all"
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnsembleApp />);
    </script>
</body>
</html>
