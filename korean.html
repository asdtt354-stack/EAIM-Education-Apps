<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 감정 시인 v12.7 (Gemini 2.5 Flash)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #fdfcfb; min-height: 100vh; margin: 0; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .font-serif { font-family: 'Gowun Batang', serif; }
        .eaim-card { background: rgba(255, 255, 255, 0.95); border-radius: 2rem; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 500px; padding: 2rem; margin: 1rem auto; border-top: 8px solid #be185d; }
        .eaim-input { width: 100%; border: 1px solid #e5e7eb; border-radius: 0.8rem; padding: 0.8rem; outline: none; transition: 0.3s; font-size: 0.9rem; line-height: 1.5; }
        .eaim-input:focus { border-color: #be185d; box-shadow: 0 0 0 3px rgba(190, 24, 93, 0.1); }
        .eaim-btn { background: #be185d; color: white; border-radius: 1rem; padding: 1.1rem; font-weight: bold; width: 100%; border: none; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .eaim-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .eaim-btn:active { transform: scale(0.98); }
        .prompt-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 1rem; border-radius: 1rem; font-size: 0.7rem; color: #334155; white-space: pre-wrap; position: relative; }
        .copy-badge { position: absolute; top: 8px; right: 8px; background: #be185d; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        .nav-btn { background: #f1f5f9; color: #64748b; padding: 0.5rem 1rem; border-radius: 0.8rem; font-size: 0.8rem; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v12_7') || '');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [userName, setUserName] = useState('');
            const [seedTopic, setSeedTopic] = useState('');
            const [relatedWords, setRelatedWords] = useState(Array(10).fill(''));
            const [selectedEmotions, setSelectedEmotions] = useState([]);
            const [selectedColor, setSelectedColor] = useState('');
            
            const [details, setDetails] = useState({
                situation: '', bodyMind: '', sensory: '', metaphor: '', relationship: '', newName: '', userImpression: ''
            });

            const [finalPoem, setFinalPoem] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');
            const [sunoPrompt, setSunoPrompt] = useState('');
            const [imagePrompt, setImagePrompt] = useState('');

            const emotionList = [
                '기쁜', '설레는', '뿌듯한', '행복한', '편안한', '활기찬', '자랑스러운', '신나는', '따뜻한', '포근한',
                '슬픈', '서러운', '외로운', '우울한', '허전한', '막막한', '두려운', '무서운', '깜짝 놀란', '불안한',
                '화난', '짜증나는', '답답한', '억울한', '괴로운', '미운', '불편한', '부끄러운', '민망한', '미안한',
                '궁금한', '기대되는', '벅찬', '은은한', '차분한', '싱숭생숭한', '심심한', '지루한', '귀찮은', '피곤한',
                '그리운', '아쉬운', '안타까운', '조마조마한', '당황스러운', '어리둥절한', '든든한', '홀가분한', '상쾌한', '신비로운'
            ];

            const colors = [
                {n:'빨강', c:'#EF4444'}, {n:'주황', c:'#F97316'}, {n:'노랑', c:'#FBBF24'}, {n:'연두', c:'#A3E635'},
                {n:'초록', c:'#22C55E'}, {n:'청록', c:'#14B8A6'}, {n:'파랑', c:'#3B82F6'}, {n:'남색', c:'#1E3A8A'},
                {n:'보라', c:'#A855F7'}, {n:'분홍', c:'#F472B6'}, {n:'하양', c:'#F8FAFC'}, {n:'검정', c:'#18181B'}
            ];

            const callGemini = async (prompt) => {
                // 선생님 요청에 따라 gemini-2.5-flash로 고정
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            };

            const handleCreatePoem = async () => {
                setIsAnalyzing(true);
                setStep(6);
                try {
                    const prompt = `시인: ${userName}, 주제: ${seedTopic}, 연상단어: ${relatedWords.join(', ')}, 감정: ${selectedEmotions.join(', ')}, 색깔: ${selectedColor}, 상황: ${details.situation}, 몸/마음: ${details.bodyMind}, 감각: ${details.sensory}, 비유: ${details.metaphor}, 관계: ${details.relationship}, 감정이름: ${details.newName}. 위 데이터를 바탕으로 감동적인 시를 써줘. 행과 연을 나누고 제목 없이 시 내용만 출력해줘.`;
                    const poem = await callGemini(prompt);
                    setFinalPoem(poem);
                    const feedback = await callGemini(`감정이름 '${details.newName}'을 지은 학생에게 보내는 격려 2문장.`);
                    setTeacherFeedback(feedback);
                } catch (e) { alert("연결 오류: " + e.message); setStep(5); } finally { setIsAnalyzing(false); }
            };

            const handleRefine = async () => {
                setIsAnalyzing(true);
                try {
                    const refined = await callGemini(`다음 시를 더 시적이고 고급스러운 표현으로 다듬어줘. \n\n${finalPoem}`);
                    setFinalPoem(refined);
                } catch (e) { alert("다듬기 오류"); } finally { setIsAnalyzing(false); }
            };

            const generateMedia = async (type) => {
                setIsAnalyzing(true);
                try {
                    const res = await callGemini(`시 [${finalPoem}]을 바탕으로 ${type === 'music' ? 'Suno AI용 음악 스타일 영문 프롬프트' : 'DALL-E용 이미지 생성 영문 프롬프트'}를 작성해줘.`);
                    type === 'music' ? setSunoPrompt(res) : setImagePrompt(res);
                } finally { setIsAnalyzing(false); }
            };

            const downloadTxt = () => {
                const content = `시인: ${userName}\n주제: ${seedTopic}\n새 이름: ${details.newName}\n\n[시]\n${finalPoem}\n\n[격려]\n${teacherFeedback}`;
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `${userName}_시.txt`; a.click();
            };

            return (
                <div className="p-4 max-w-lg mx-auto pb-10">
                    <header className="flex justify-between items-center mb-6 px-2">
                        <h1 className="font-hand text-2xl text-pink-800 font-bold">EAIM 감정 시인 v12.7</h1>
                        <div className="flex gap-2">
                            {step > 1 && step < 6 && <button onClick={() => setStep(step - 1)} className="nav-btn">이전</button>}
                            {step > 0 && <button onClick={() => window.location.reload()} className="text-[10px] text-gray-400 font-bold uppercase">Reset</button>}
                        </div>
                    </header>

                    <div className="eaim-card">
                        {step === 0 && (
                            <div className="space-y-6 text-center py-5">
                                <h2 className="text-lg font-bold text-gray-700 font-serif">작가실 입장</h2>
                                <input type="text" value={userName} onChange={e => setUserName(e.target.value)} placeholder="작가님의 성함" className="eaim-input text-center" />
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini 2.5 API Key" className="eaim-input text-center" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_v12_7', apiKey.trim()); setStep(1); }} className="eaim-btn" disabled={!userName || !apiKey}>입장하기</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 text-center">
                                <h3 className="font-bold text-pink-800 font-serif text-xl">1. 마음의 씨앗</h3>
                                <input type="text" value={seedTopic} onChange={e => setSeedTopic(e.target.value)} className="eaim-input border-pink-300 font-bold text-center text-lg" placeholder="예: 첫눈, 우정" />
                                <button onClick={() => setStep(2)} className="eaim-btn" disabled={!seedTopic}>다음 단계 👉</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-4">
                                <p className="text-sm font-bold text-center text-gray-600">주제와 떠오르는 단어 10개</p>
                                <div className="grid grid-cols-2 gap-3">
                                    {relatedWords.map((w, i) => (
                                        <input key={i} type="text" value={w} onChange={e => {
                                            const nw = [...relatedWords]; nw[i] = e.target.value; setRelatedWords(nw);
                                        }} className="eaim-input text-center py-2" placeholder={`${i+1}번째`} />
                                    ))}
                                </div>
                                <button onClick={() => setStep(3)} className="eaim-btn">감정 기록하기 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6">
                                <div className="flex flex-wrap gap-2 justify-center max-h-48 overflow-y-auto p-3 border rounded-2xl bg-white">
                                    {emotionList.map(e => (
                                        <button key={e} onClick={() => setSelectedEmotions(prev => prev.includes(e) ? prev.filter(x => x !== e) : [...prev, e].slice(-5))} className={`px-4 py-2 rounded-full text-[12px] font-bold border ${selectedEmotions.includes(e) ? 'bg-pink-600 text-white' : 'bg-white text-gray-500'}`}>{e}</button>
                                    ))}
                                </div>
                                <div className="flex flex-wrap gap-3 justify-center pt-2">
                                    {colors.map(c => (
                                        <button key={c.n} onClick={() => setSelectedColor(c.n)} style={{backgroundColor: c.c}} className={`w-9 h-9 rounded-full border-2 ${selectedColor === c.n ? 'ring-4 ring-pink-200 scale-110' : 'border-white shadow-sm'}`} />
                                    ))}
                                </div>
                                <button onClick={() => setStep(4)} className="eaim-btn" disabled={selectedEmotions.length === 0 || !selectedColor}>다음 단계 👉</button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6">
                                <textarea value={details.situation} className="eaim-input h-32" placeholder="어떤 상황인가요?" onChange={e => setDetails({...details, situation: e.target.value})} />
                                <textarea value={details.bodyMind} className="eaim-input h-24" placeholder="내 몸과 마음의 상태는?" onChange={e => setDetails({...details, bodyMind: e.target.value})} />
                                <button onClick={() => setStep(5)} className="eaim-btn">묘사 더하기 👉</button>
                            </div>
                        )}

                        {step === 5 && (
                            <div className="space-y-5">
                                <textarea value={details.sensory} className="eaim-input h-20" placeholder="감정의 모습, 냄새, 소리..." onChange={e => setDetails({...details, sensory: e.target.value})} />
                                <input value={details.newName} type="text" className="eaim-input font-bold text-pink-600 text-center" placeholder="감정의 특별한 이름" onChange={e => setDetails({...details, newName: e.target.value})} />
                                <button onClick={handleCreatePoem} className="eaim-btn bg-pink-800 shadow-xl">시 창작 시작 🪄</button>
                            </div>
                        )}

                        {step === 6 && (
                            <div className="space-y-6">
                                {isAnalyzing ? (
                                    <div className="py-24 text-center animate-pulse">
                                        <div className="text-pink-700 font-bold font-serif text-xl">2.5 Flash가 마음을 빚고 있습니다...</div>
                                    </div>
                                ) : (
                                    <div className="animate-fadeIn space-y-6">
                                        <div className="bg-white p-8 rounded-[2.5rem] border-2 border-pink-100 text-center shadow-inner relative">
                                            <h4 className="font-hand text-3xl text-pink-800 mb-6">{userName} 시인</h4>
                                            <div className="font-serif text-lg leading-loose whitespace-pre-wrap text-gray-800 font-medium mb-4">{finalPoem}</div>
                                            <button onClick={handleRefine} className="text-xs text-pink-400 underline bg-transparent border-none cursor-pointer">AI 다듬기</button>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => generateMedia('music')} className="bg-blue-600 text-white p-4 rounded-2xl text-xs font-bold">음악 스타일 🎵</button>
                                            <button onClick={() => generateMedia('image')} className="bg-emerald-600 text-white p-4 rounded-2xl text-xs font-bold">이미지 가이드 🎨</button>
                                        </div>

                                        {sunoPrompt && <div className="prompt-box">{sunoPrompt}<div className="copy-badge" onClick={() => {navigator.clipboard.writeText(sunoPrompt); alert("복사!");}}>Copy</div></div>}
                                        {imagePrompt && <div className="prompt-box">{imagePrompt}<div className="copy-badge" onClick={() => {navigator.clipboard.writeText(imagePrompt); alert("복사!");}}>Copy</div></div>}

                                        <div className="bg-rose-50 p-6 rounded-[2rem] border-l-8 border-pink-500 shadow-sm relative">
                                            <p className="font-hand text-2xl text-gray-700 italic">"{teacherFeedback}"</p>
                                        </div>

                                        <button onClick={downloadTxt} className="eaim-btn bg-pink-900 shadow-lg">파일 다운로드</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
    </script>
</body>
</html>
