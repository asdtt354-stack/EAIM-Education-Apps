<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 뮤지컬 메이커 v6.8</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a0509; color: #FFF; margin: 0; padding: 0; overflow-x: hidden; }
        .font-drama { font-family: 'Gowun Batang', serif; }
        .font-show { font-family: 'Black Han Sans', sans-serif; }
        .stage-curtain { background: linear-gradient(to bottom, #9F1239, #881337); border-bottom: 4px solid #FCD34D; }
        .ticket-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: white; transition: 0.3s; outline: none; border-radius: 0.5rem; width: 100%; padding: 0.8rem 1rem; }
        .ticket-input:focus { border-color: #FCD34D; background: rgba(255, 255, 255, 0.12); }
        .magic-btn { background: linear-gradient(45deg, #FCD34D, #F59E0B); color: #000; border-radius: 0.75rem; font-weight: 800; padding: 0.8rem 1.5rem; transition: 0.2s; cursor: pointer; border: none; }
        .magic-btn:hover { transform: scale(1.02); opacity: 0.9; }
        .tab-btn { padding: 1rem 0.5rem; flex: 1; font-weight: bold; font-size: 0.9rem; transition: 0.3s; border-bottom: 3px solid transparent; color: #94a3b8; cursor: pointer; text-align: center; }
        .tab-active { color: #FCD34D; border-bottom-color: #FCD34D; background: rgba(252, 211, 77, 0.07); }
        pre { white-space: pre-wrap; line-height: 1.8; color: #FDE68A; font-family: 'Gowun Batang', serif; background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0); // 0: 설정, 1: 결과
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_musical') || '');
            const [loading, setLoading] = useState(false);
            
            const [topic, setTopic] = useState('');
            const [place, setPlace] = useState('');
            const [title, setTitle] = useState('');
            const [cast, setCast] = useState('주인공: 꿈이 많은 학생, 악당: 성격 급한 선생님');

            const [activeTab, setActiveTab] = useState('script');
            const [results, setResults] = useState({ script: '', images: '', music: '' });

            const saveKey = (e) => {
                const key = e.target.value;
                setApiKey(key);
                localStorage.setItem('gemini_api_key_musical', key);
            };

            const callGemini = async (prompt) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (error) {
                    alert('API 호출 중 오류가 발생했습니다.');
                    return '';
                }
            };

            const generateMusical = async () => {
                if (!apiKey) return alert('API 키를 입력해주세요.');
                setLoading(true);
                
                const scriptPrompt = `${topic}를 주제로 ${place}에서 벌어지는 뮤지컬 대본을 써줘. 제목은 ${title}이고 등장인물은 ${cast}야. 기승전결이 뚜렷하게 써줘.`;
                const imagePromptReq = "위 대본의 주요 장면 3가지를 위한 이미지 생성 AI 프롬프트를 영어로 3개 작성해줘.";
                const musicPromptReq = "위 뮤지컬의 분위기에 어울리는 Suno AI용 음악 프롬프트(장르, 스타일, 분위기)를 3개 추천해줘.";

                const scriptRes = await callGemini(scriptPrompt);
                const imageRes = await callGemini(scriptRes + "\n\n" + imagePromptReq);
                const musicRes = await callGemini(scriptRes + "\n\n" + musicPromptReq);

                setResults({ script: scriptRes, images: imageRes, music: musicRes });
                setLoading(false);
                setStep(1);
            };

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <div className="stage-curtain p-6 text-center shadow-xl">
                        <h1 className="font-show text-3xl text-yellow-300">EAIM MUSICAL MAKER</h1>
                        <p className="text-sm opacity-80 mt-1">창작 뮤지컬 교육 솔루션 v6.8</p>
                    </div>

                    <div className="max-w-2xl mx-auto p-4 mt-6">
                        {step === 0 ? (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="bg-white/5 p-4 rounded-xl border border-white/10">
                                    <label className="block text-xs font-bold mb-2 text-yellow-500">GEMINI API KEY</label>
                                    <input type="password" value={apiKey} onChange={saveKey} className="ticket-input" placeholder="AI 인증 키를 입력하세요" />
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold mb-2"><i className="fas fa-star text-yellow-400 mr-2"></i>뮤지컬 제목</label>
                                        <input value={title} onChange={e => setTitle(e.target.value)} className="ticket-input" placeholder="예: 숲속의 요정들" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2"><i className="fas fa-pen text-yellow-400 mr-2"></i>주제 및 내용</label>
                                        <textarea value={topic} onChange={e => setTopic(e.target.value)} className="ticket-input h-24" placeholder="어떤 이야기가 펼쳐지나요?" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2"><i className="fas fa-map-marker-alt text-yellow-400 mr-2"></i>배경 장소</label>
                                        <input value={place} onChange={e => setPlace(e.target.value)} className="ticket-input" placeholder="예: 마법 학교, 미래 도시" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2"><i className="fas fa-users text-yellow-400 mr-2"></i>등장인물 설정</label>
                                        <textarea value={cast} onChange={e => setCast(e.target.value)} className="ticket-input h-20" placeholder="인물명과 특징을 적어주세요." />
                                    </div>
                                </div>

                                <button onClick={generateMusical} disabled={loading} className="magic-btn w-full text-lg mt-4 shadow-lg">
                                    {loading ? <i className="fas fa-spinner fa-spin mr-2"></i> : <i className="fas fa-wand-magic-sparkles mr-2"></i>}
                                    {loading ? "뮤지컬 제작 중..." : "뮤지컬 대본 생성하기"}
                                </button>
                            </div>
                        ) : (
                            <div className="animate-fadeIn">
                                <div className="flex mb-6 bg-white/5 rounded-t-lg overflow-hidden border-b border-yellow-500/30">
                                    <div onClick={() => setActiveTab('script')} className={`tab-btn ${activeTab === 'script' ? 'tab-active' : ''}`}><i className="fas fa-scroll mr-2"></i>대본</div>
                                    <div onClick={() => setActiveTab('images')} className={`tab-btn ${activeTab === 'images' ? 'tab-active' : ''}`}><i className="fas fa-image mr-2"></i>이미지</div>
                                    <div onClick={() => setActiveTab('music')} className={`tab-btn ${activeTab === 'music' ? 'tab-active' : ''}`}><i className="fas fa-music mr-2"></i>음악</div>
                                </div>

                                <div className="p-2">
                                    {activeTab === 'script' && <pre className="text-sm">{results.script}</pre>}
                                    {activeTab === 'images' && <pre className="text-sm">{results.images}</pre>}
                                    {activeTab === 'music' && <pre className="text-sm">{results.music}</pre>}
                                </div>

                                <button onClick={() => setStep(0)} className="mt-8 text-yellow-500 font-bold border border-yellow-500/50 px-6 py-2 rounded-full mx-auto block hover:bg-yellow-500/10">
                                    <i className="fas fa-redo mr-2"></i>다시 만들기
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
