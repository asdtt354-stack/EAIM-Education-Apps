<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 국어 감정 시인 & 편지</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh;
            color: white;
        }
        .font-hand { font-family: 'Gaegu', cursive; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* EAIM 시그니처 카드 스타일 */
        .eaim-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* 입력창 스타일 통일 */
        .eaim-input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .eaim-input:focus { background: rgba(255, 255, 255, 0.3); border-color: white; }
        .eaim-input::placeholder { color: rgba(255, 255, 255, 0.6); }

        @media print {
            body { background: white; color: black; }
            .print-hidden { display: none !important; }
            .print-area { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .eaim-card { background: white; color: black; border: 1px solid #eee; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const KoreanEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [finalResult, setFinalResult] = useState('');
            const [searchQuery, setSearchQuery] = useState('신미나 싱고');
            const [readingPoem, setReadingPoem] = useState('');
            const [emotionWord, setEmotionWord] = useState('');
            const [emotionColor, setEmotionColor] = useState('');
            const [situation, setSituation] = useState('');
            const [bodyPart, setBodyPart] = useState('');
            const [bodySensation, setBodySensation] = useState('');
            const [appearance, setAppearance] = useState('');
            const [relationship, setRelationship] = useState('');
            const [emotionName, setEmotionName] = useState('');
            const [friendName, setFriendName] = useState('');
            const [friendPoem, setFriendPoem] = useState('');
            const [draftLetter, setDraftLetter] = useState('');

            const words = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '억울한', '편안한', '신나는', '부끄러운', '포근한'];
            const colors = [
                { name: '빨강', code: '#EF4444' }, { name: '주황', code: '#F97316' }, { name: '노랑', code: '#FBBF24' },
                { name: '초록', code: '#34D399' }, { name: '파랑', code: '#3B82F6' }, { name: '보라', code: '#8B5CF6' },
                { name: '회색', code: '#9CA3AF' }, { name: '검정', code: '#1F2937' }
            ];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key', apiKey);
                setStep(1);
            };

            const fetchPoem = async () => {
                if (!apiKey) return alert('API 키가 없습니다.');
                setIsAnalyzing(true);
                const prompt = `당신은 국어 교사입니다. '${searchQuery}'에 해당하는 시의 제목, 작가, 본문만 출력해주세요. 정확한 시를 못 찾으면 주제에 맞는 시를 한 편 추천해주세요.`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setReadingPoem(data.candidates[0].content.parts[0].text);
                } catch (e) { setReadingPoem('시를 불러오지 못했습니다.'); } 
                finally { setIsAnalyzing(false); }
            };

            const generatePoem = async () => {
                setIsAnalyzing(true); setStep(6);
                const prompt = `당신은 문학 교사입니다. 학생의 데이터로 시를 작성해주세요.
                감정: ${emotionColor}색의 '${emotionWord}' / 상황: ${situation} / 신체: ${bodyPart}에서 ${bodySensation} 느낌 / 모습: ${appearance} / 관계: ${relationship} / 이름: ${emotionName}
                [가이드라인] 1연: 상황과 이름, 2연: 감정의 특징, 3연: 감정과 나의 관계.
                끝에 영문 1줄씩 추가: 'Suno Prompt: (장르/악기)', 'Image Prompt: (삽화 묘사)'`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setFinalResult(data.candidates[0].content.parts[0].text);
                } catch (e) { setFinalResult('오류 발생'); } finally { setIsAnalyzing(false); }
            };

            const generateLetter = async () => {
                if(!friendPoem) return alert('친구의 시를 입력해주세요.');
                setIsAnalyzing(true);
                const prompt = `친구의 시를 분석하여 다정한 공감 편지를 작성하세요... (생략된 기존 프롬프트 유지)`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setDraftLetter(data.candidates[0].content.parts[0].text);
                } catch (e) { setDraftLetter('오류 발생'); } finally { setIsAnalyzing(false); }
            };

            const copyText = (text) => navigator.clipboard.writeText(text).then(() => alert("복사되었습니다!"));

            return (
                <div className="max-w-xl mx-auto min-h-screen p-4 md:p-8 flex flex-col items-center">
                    <header className="w-full flex justify-between items-center mb-8 print-hidden">
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">📖</span>
                            <h1 className="text-xl font-bold tracking-tight">EAIM 국어 감정 시인</h1>
                        </div>
                        {step > 0 && <button onClick={() => setStep(0)} className="text-xs bg-white/20 px-3 py-1 rounded-full border border-white/30">설정</button>}
                    </header>

                    <main className="w-full eaim-card p-6 md:p-10 mb-20">
                        {step === 0 && (
                            <div className="space-y-6 py-4">
                                <h2 className="text-2xl font-bold text-center">⚙️ API 설정</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key 입력" className="w-full eaim-input text-center" />
                                <button onClick={saveApiKey} className="w-full bg-white text-indigo-700 p-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-50 transition-all">시작하기</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fade-in">
                                <h2 className="text-2xl font-hand">1. 오늘의 시 읽기 📖</h2>
                                <div className="flex gap-2">
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="flex-grow eaim-input" placeholder="시인이나 제목 입력" />
                                    <button onClick={fetchPoem} className="bg-white text-indigo-700 px-6 rounded-xl font-bold shadow-md">검색</button>
                                </div>
                                <div className="bg-white/10 border border-white/20 rounded-2xl p-4 min-h-[200px]">
                                    {isAnalyzing ? <div className="text-center pt-10 font-hand animate-pulse">시를 찾는 중...</div> : 
                                    <textarea value={readingPoem} onChange={e => setReadingPoem(e.target.value)} className="w-full h-64 bg-transparent outline-none font-hand text-xl leading-loose resize-none text-white" placeholder="이곳에 시가 나타납니다."></textarea>}
                                </div>
                                <button onClick={() => setStep(2)} disabled={!readingPoem} className="w-full bg-white text-indigo-700 p-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-50 transition-all">이 시로 수업 시작 👉</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-8 animate-fade-in text-center">
                                <h2 className="text-2xl font-hand">2. 감정 색깔과 단어 선택</h2>
                                <div className="flex justify-center gap-3 overflow-x-auto pb-4">{colors.map(c => <button key={c.name} onClick={() => setEmotionColor(c.name)} className={`w-12 h-12 flex-shrink-0 rounded-full border-4 transition-all ${emotionColor === c.name ? 'border-white scale-125 shadow-xl' : 'border-transparent opacity-60'}`} style={{backgroundColor: c.code}}></button>)}</div>
                                <div className="flex flex-wrap justify-center gap-2">{words.map(w => <button key={w} onClick={() => setEmotionWord(w)} className={`px-5 py-2 rounded-full font-hand text-lg border transition-all ${emotionWord === w ? 'bg-white text-indigo-700' : 'bg-white/10 text-white border-white/30'}`}>{w}</button>)}</div>
                                <button onClick={() => setStep(3)} disabled={!emotionColor || !emotionWord} className="w-full bg-white text-indigo-700 p-4 rounded-2xl font-bold shadow-lg mt-8">다음 단계로 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fade-in">
                                <h2 className="text-2xl font-hand text-center">3. 감정 관찰하기</h2>
                                <div className="space-y-4">
                                    <label className="block text-sm opacity-80 ml-1">① 언제 느낀 감정인가요?</label>
                                    <textarea value={situation} onChange={e => setSituation(e.target.value)} className="w-full eaim-input font-hand text-lg" placeholder="상황을 적어주세요."></textarea>
                                    <label className="block text-sm opacity-80 ml-1">② 몸의 어디에서 어떤 느낌이 나나요?</label>
                                    <div className="flex gap-2">
                                        <select value={bodyPart} onChange={e => setBodyPart(e.target.value)} className="eaim-input bg-indigo-900/50 font-hand text-lg"><option value="">부위</option><option value="머리">머리</option><option value="가슴">가슴</option><option value="배">배</option><option value="손발">손발</option></select>
                                        <input value={bodySensation} onChange={e => setBodySensation(e.target.value)} className="flex-grow eaim-input font-hand text-lg" placeholder="어떤 느낌인가요?" />
                                    </div>
                                    <label className="block text-sm opacity-80 ml-1">③ 이 감정을 물건이나 소리로 비유하면?</label>
                                    <textarea value={appearance} onChange={e => setAppearance(e.target.value)} className="w-full eaim-input font-hand text-lg" placeholder="모양, 소리, 냄새 등"></textarea>
                                </div>
                                <button onClick={() => setStep(4)} className="w-full bg-white text-indigo-700 p-4 rounded-2xl font-bold shadow-lg">다음 단계로 👉</button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6 animate-fade-in text-center">
                                <h2 className="text-2xl font-hand">4. 감정 이름 짓기</h2>
                                <div className="space-y-4 text-left">
                                    <label className="block text-sm opacity-80 ml-1">④ 이 감정과 나는 어떤 사이인가요?</label>
                                    <textarea value={relationship} onChange={e => setRelationship(e.target.value)} className="w-full eaim-input font-hand text-lg" placeholder="친구, 적, 낯선 손님..."></textarea>
                                    <label className="block text-sm opacity-80 ml-1">⑤ 감정에게 줄 새로운 이름은?</label>
                                    <input type="text" value={emotionName} onChange={e => setEmotionName(e.target.value)} className="w-full eaim-input font-hand text-2xl text-center" placeholder="예: 싱고, 뭉클이" />
                                </div>
                                <button onClick={generatePoem} disabled={!emotionName} className="w-full bg-indigo-400 text-white p-4 rounded-2xl font-bold shadow-lg flex justify-center items-center gap-2 hover:bg-indigo-300 transition-all mt-8"><span>AI 시인에게 시 부탁하기</span> ✨</button>
                            </div>
                        )}

                        {step === 6 && (
                            <div className="space-y-6 animate-fade-in text-center">
                                <h2 className="text-2xl font-hand">📖 완성된 나의 감정 시</h2>
                                <div className="bg-white text-indigo-900 p-8 rounded-3xl shadow-inner min-h-[300px]">
                                    {isAnalyzing ? <div className="animate-pulse pt-10 font-hand text-indigo-500">감정을 시로 빚는 중...</div> : <div className="whitespace-pre-wrap font-hand text-xl leading-relaxed">{finalResult}</div>}
                                </div>
                                {!isAnalyzing && (
                                    <div className="flex flex-col gap-3 print-hidden">
                                        <div className="flex gap-2">
                                            <button onClick={() => copyText(finalResult)} className="flex-1 bg-white/20 p-4 rounded-2xl font-bold border border-white/30 hover:bg-white/30">시 복사하기</button>
                                            <button onClick={() => window.print()} className="flex-1 bg-white/20 p-4 rounded-2xl font-bold border border-white/30 hover:bg-white/30">인쇄하기</button>
                                        </div>
                                        <button onClick={() => setStep(7)} className="w-full bg-pink-400 text-white p-4 rounded-2xl font-bold shadow-lg hover:bg-pink-300 transition-all flex justify-center items-center gap-2"><span>💌 친구 시에 공감 편지 쓰기</span></button>
                                    </div>
                                )}
                            </div>
                        )}

                        {step === 7 && (
                            <div className="space-y-6 animate-fade-in">
                                <h2 className="text-2xl font-hand text-center">💌 친구에게 공감 편지</h2>
                                <div className="space-y-3">
                                    <input type="text" value={friendName} onChange={e => setFriendName(e.target.value)} className="w-full eaim-input font-hand text-xl" placeholder="친구 이름" />
                                    <textarea value={friendPoem} onChange={e => setFriendPoem(e.target.value)} className="w-full eaim-input font-hand text-lg h-32" placeholder="친구의 시를 여기에 붙여넣으세요."></textarea>
                                    <button onClick={generateLetter} className="w-full bg-white text-indigo-700 p-4 rounded-2xl font-bold shadow-lg">공감 편지 작성 도우미 ✍️</button>
                                </div>
                                {(isAnalyzing || draftLetter) && (
                                    <div className="bg-white/10 p-6 rounded-3xl border border-white/20 mt-6 min-h-[200px]">
                                        {isAnalyzing ? <div className="text-center animate-pulse pt-10 font-hand">다정한 마음을 고르는 중...</div> : <textarea value={draftLetter} onChange={e => setDraftLetter(e.target.value)} className="w-full h-64 bg-transparent outline-none font-hand text-xl leading-loose resize-none text-white"></textarea>}
                                    </div>
                                )}
                                <button onClick={() => setStep(6)} className="w-full text-sm opacity-60 mt-4">내 시로 돌아가기</button>
                            </div>
                        )}
                    </main>
                    <footer className="text-white/40 text-xs mb-10">© 2026 EAIM Studio - SEL Education Platform</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KoreanEAIMApp />);
    </script>
</body>
</html>
