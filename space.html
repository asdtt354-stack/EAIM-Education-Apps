<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 우주 탐험대: 줌인 관측소</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; overflow: hidden; }
        .font-serif { font-family: 'Gowun Dodum', serif; }
        
        /* 🚀 메인 시뮬레이터 */
        .solar-system { 
            position: relative; width: 100%; height: 400px; 
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1);
        }
        .sun { width: 30px; height: 30px; background: #facc15; border-radius: 50%; box-shadow: 0 0 50px #facc15; z-index: 50; }
        
        .orbit { position: absolute; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; }
        .planet-wrap { position: absolute; width: 100%; height: 100%; animation: rotate linear infinite; }
        
        /* 행성 스타일 */
        .planet { 
            position: absolute; border-radius: 50%; top: 0; left: 50%; transform: translate(-50%, -50%); 
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.6); cursor: pointer; transition: 0.5s;
        }

        /* 💡 줌인 효과 (대형 행성) */
        .zoom-planet {
            width: 180px !important; height: 180px !important;
            margin: 0 auto; border-radius: 50%;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.8), 0 0 50px rgba(255,255,255,0.1);
            animation: big-spin linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes big-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .log-card { background: #1e293b; border-radius: 1.5rem; border: 1px solid #334155; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(1); // 1:Observe, 2:Log, 3:Gallery
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_space_v5') || '');
            const [obsDate, setObsDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedPlanet, setSelectedPlanet] = useState(null);
            const [logs, setLogs] = useState(JSON.parse(localStorage.getItem('eaim_space_logs_v5') || '[]'));
            const [currentLog, setCurrentLog] = useState({ science: '', emotion: '' });
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const planets = [
                { id: 1, name: '수성', size: 8, orbit: 70, period: 8.8, rot: 5.8, color: '#94a3b8', fact: '태양과 가장 가깝지만, 밤에는 영하 180도까지 내려가요.', msg: '작지만 가장 뜨거운 열정을 가졌답니다.' },
                { id: 2, name: '금성', size: 12, orbit: 100, period: 22.5, rot: -24.3, color: '#fb923c', fact: '다른 행성들과 반대 방향으로 자전하는 특별한 별이에요.', msg: '남들과 달라도 괜찮아요. 나만의 방향이 있거든요.' },
                { id: 3, name: '지구', size: 14, orbit: 140, period: 36.5, rot: 1, color: '#3b82f6', fact: '생명체가 살 수 있는 유일한 물의 행성이에요.', msg: '우리가 지켜야 할 소중하고 아름다운 우리 집이에요.' },
                { id: 4, name: '화성', size: 10, orbit: 180, period: 68.7, rot: 1.03, color: '#ef4444', fact: '제2의 지구라 불리며, 거대한 화산과 계곡이 있어요.', msg: '새로운 세상을 향한 도전은 언제나 붉게 타오르죠.' },
                { id: 5, name: '목성', size: 26, orbit: 240, period: 118, rot: 0.41, color: '#d97706', fact: '태양계에서 가장 큰 가스 행성으로, 강한 태풍이 불어요.', msg: '모든 것을 품어주는 넓은 마음을 닮아보세요.' },
                { id: 6, name: '토성', size: 22, orbit: 310, period: 294, rot: 0.45, color: '#fde047', fact: '아름다운 얼음 고리를 가지고 있으며 물에 뜰 정도로 가벼워요.', msg: '나를 빛나게 하는 나만의 고리를 찾아보세요.' },
                { id: 7, name: '명왕성', size: 6, orbit: 380, period: 905, rot: 6.4, color: '#64748b', fact: '2006년에 행성에서 제외되었지만, 여전히 태양계를 돌고 있어요.', msg: '멀리 떨어져 있어도 우리는 여전히 연결된 가족이에요.' }
            ];

            const callGemini = async (prompt) => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const handleSaveLog = async () => {
                setIsAnalyzing(true);
                try {
                    const prompt = `${selectedPlanet.name} 관찰 일지야. [발견:${currentLog.science}, 감정:${currentLog.emotion}]. 다정한 선생님이 되어 행성 특징과 연결된 격려의 답장을 3문장 써줘.`;
                    const feedback = await callGemini(prompt);
                    const newLog = { ...currentLog, feedback, date: obsDate, planet: selectedPlanet.name, id: Date.now() };
                    const updated = [newLog, ...logs];
                    setLogs(updated);
                    localStorage.setItem('eaim_space_logs_v5', JSON.stringify(updated));
                    setSelectedPlanet(null);
                    setStep(3);
                } catch (e) { alert('API 연결 확인이 필요합니다.'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col p-6 relative shadow-2xl">
                    {/* API Key 설정 (최초 1회) */}
                    {!apiKey && (
                        <div className="absolute inset-0 bg-slate-900 z-[200] flex flex-col justify-center p-10 text-center">
                            <h2 className="text-2xl font-bold text-indigo-400 mb-6 font-serif">AI 우주 관측소 연결</h2>
                            <input type="password" onBlur={e => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key_space_v5', e.target.value);}} placeholder="Gemini API Key" className="bg-slate-800 p-4 rounded-xl text-white outline-none" />
                            <p className="text-[10px] text-slate-500 mt-4">키를 입력하고 화면을 터치하면 관측이 시작됩니다.</p>
                        </div>
                    )}

                    <header className="flex justify-between items-center mb-6">
                        <h1 className="text-xl font-black text-indigo-400 font-serif tracking-tighter">EAIM SPACE VOYAGE</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setStep(3)} className="text-[10px] bg-slate-800 px-3 py-1 rounded-full">나의 기록</button>
                            <button onClick={() => { setSelectedPlanet(null); setStep(1); }} className="text-[10px] bg-indigo-900 px-3 py-1 rounded-full text-white">관측실</button>
                        </div>
                    </header>

                    {step === 1 && (
                        <div className="space-y-6 animate-fadeIn">
                            {/* 💡 줌인 모드 vs 전체 모드 조건부 렌더링 */}
                            {!selectedPlanet ? (
                                <>
                                    <div className="text-center">
                                        <h2 className="text-xl font-bold text-indigo-200">태양계 탐사</h2>
                                        <p className="text-[10px] text-slate-500 mt-1 uppercase tracking-widest">탐험하고 싶은 행성을 클릭하세요</p>
                                    </div>
                                    <input type="date" value={obsDate} onChange={e => setObsDate(e.target.value)} className="w-full bg-slate-900 p-3 rounded-xl text-white text-center border border-indigo-500/20 text-sm" />
                                    <div className="solar-system shadow-2xl">
                                        <div className="sun"></div>
                                        {planets.map(p => (
                                            <div key={p.id} className="orbit" style={{ width: p.orbit, height: p.orbit, top: '50%', left: '50%', transform: 'translate(-50%, -50%)' }}>
                                                <div className="planet-wrap" style={{ animationDuration: `${p.period}s` }}>
                                                    <div className="planet" style={{ width: p.size, height: p.size, backgroundColor: p.color }} onClick={() => setSelectedPlanet(p)}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : (
                                <div className="space-y-6 text-center py-4">
                                    <h2 className="text-3xl font-black text-white mb-2">{selectedPlanet.name} 집중 관측</h2>
                                    
                                    {/* 💡 줌인된 행성 시각화 */}
                                    <div className="relative py-10">
                                        <div className="zoom-planet" style={{ 
                                            backgroundColor: selectedPlanet.color,
                                            animationDuration: `${Math.abs(selectedPlanet.rot) * 5}s`,
                                            animationDirection: selectedPlanet.rot < 0 ? 'reverse' : 'normal'
                                        }}></div>
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                            <div className="w-[200px] h-[200px] border border-indigo-500/20 rounded-full animate-ping"></div>
                                        </div>
                                    </div>

                                    <div className="bg-indigo-900/30 p-6 rounded-3xl border border-indigo-500/40 text-left">
                                        <p className="text-xs text-indigo-400 font-bold mb-2">🔭 과학적 사실</p>
                                        <p className="text-sm mb-4 leading-relaxed">{selectedPlanet.fact}</p>
                                        <p className="text-xs text-pink-400 font-bold mb-2">✨ 마음의 메시지</p>
                                        <p className="text-sm font-serif italic">"{selectedPlanet.msg}"</p>
                                    </div>

                                    <div className="flex gap-3">
                                        <button onClick={() => setStep(2)} className="flex-1 bg-indigo-600 p-4 rounded-2xl font-bold text-white shadow-lg">관찰 일지 작성 ✍️</button>
                                        <button onClick={() => setSelectedPlanet(null)} className="bg-slate-800 p-4 rounded-2xl font-bold text-slate-400">전체 보기</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-4 animate-fadeIn">
                            <h2 className="text-xl font-bold text-center text-pink-400">{selectedPlanet.name} 탐사 일지</h2>
                            <textarea value={currentLog.science} onChange={e => setCurrentLog({...currentLog, science: e.target.value})} className="w-full bg-slate-900 p-4 rounded-2xl h-24 text-sm" placeholder="무엇을 발견했나요?"></textarea>
                            <textarea value={currentLog.emotion} onChange={e => setCurrentLog({...currentLog, emotion: e.target.value})} className="w-full bg-slate-900 p-4 rounded-2xl h-24 text-sm" placeholder="어떤 마음이 드나요?"></textarea>
                            <button onClick={handleSaveLog} disabled={isAnalyzing} className="w-full bg-indigo-600 p-5 rounded-2xl font-bold shadow-xl">
                                {isAnalyzing ? "AI 선생님께 전송 중..." : "일지 저장 및 검토 🛸"}
                            </button>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="space-y-6 animate-fadeIn pb-10">
                            <h2 className="text-2xl font-bold text-center text-indigo-300">나만의 우주 기록장</h2>
                            <div className="space-y-4">
                                {logs.length === 0 ? <p className="text-center py-20 text-slate-600">기록이 없습니다.</p> : 
                                 logs.map(log => (
                                    <div key={log.id} className="log-card p-5 space-y-3 shadow-lg">
                                        <div className="flex justify-between text-[10px] font-bold text-indigo-40
