<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM 에임우주탐험대 v2.5</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #000; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        #canvas-container { flex: 1; background: #000; cursor: pointer; position: relative; z-index: 1; }
        #header-ui { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 100; }
        #intro-text { pointer-events: none; text-align: center; flex-grow: 1; }
        .btn-home { background: rgba(0,212,255,0.3); color: white; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--main-color); pointer-events: auto; cursor: pointer; z-index: 110; }
        .planet-label { position: absolute; color: white; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 5px; font-size: 13px; font-weight: bold; pointer-events: none; border: 1px solid var(--main-color); white-space: nowrap; z-index: 90; }
        #side-panel { width: 320px; min-width: 320px; background: rgba(10,10,25,0.98); border-left: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 200; }
        #interaction-area { background: #080810; padding: 20px; border-top: 1px solid #222; overflow-y: auto; }
        textarea { width: 100%; height: 80px; background: #161625; color: white; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="main-view">
    <div id="header-ui">
        <div style="width: 100px;"></div>
        <div id="intro-text">
            <h1 style="color:var(--main-color); margin:0; font-size: 1.8em; text-shadow: 0 0 10px #00d4ff;">에임 우주 탐험대 v2.5</h1>
            <p style="color:#aaa; font-size: 0.9em; margin: 5px 0;">관찰할 행성을 클릭하세요!</p>
        </div>
        <button class="btn-home" onclick="location.reload()">☀️ 전체 태양계</button>
    </div>
    <div id="canvas-container">
        <div id="label-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:80;"></div>
    </div>
</div>

<div id="side-panel">
    <h2>🔭 행성 관측 로그</h2>
    <div id="interaction-area">
        <p id="target-title" style="color:var(--main-color); font-weight:bold;"></p>
        <textarea id="student-answer" placeholder="관측 내용을 적어보세요..."></textarea>
        {/* 제미나이 2.5 플래시 엔진 버튼 */}
        <button onclick="runGeminiV25()" style="background:var(--main-color);">AI 가이드 분석 (2.5 Flash)</button>
        <div id="ai-response" style="margin-top:15px; font-size:0.85em; line-height:1.6; color:#ddd; max-height:200px; overflow-y:auto;"></div>
    </div>
    <div id="log-list" style="flex-grow:1; border-top:1px solid #333; margin-top:20px; overflow-y:auto;">
        <h3>📖 탐사 일지</h3>
        <div id="log-container"></div>
    </div>
</div>

<script>
    // ★ 박성애 대표님의 공식: gemini-2.5-flash 엔진 고정 ★
    const API_KEY = localStorage.getItem('gemini_api_key_v25') || "API_KEY_입력";
    let isObserving = false;
    let currentTarget = null;

    const planetsData = {
        mercury: { name: "수성", dist: 30, size: 1.5, speed: 0.04, color: 0xaaaaaa, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg" },
        venus: { name: "금성", dist: 50, size: 2.2, speed: 0.015, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg" },
        earth: { name: "지구", dist: 75, size: 2.5, speed: 0.01, color: 0x2233ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg" },
        mars: { name: "화성", dist: 100, size: 1.8, speed: 0.008, color: 0xff3300, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg" },
        jupiter: { name: "목성", dist: 140, size: 6.0, speed: 0.004, color: 0xffaa88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg" },
        saturn: { name: "토성", dist: 190, size: 5.0, speed: 0.002, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png" }
    };

    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const sun = new THREE.Mesh(new THREE.SphereGeometry(12, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    const meshes = {}, labels = {}, loader = new THREE.TextureLoader();
    Object.keys(planetsData).forEach(key => {
        const p = planetsData[key];
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), new THREE.MeshStandardMaterial({ map: loader.load(p.texture) }));
        m.userData = { id: key, name: p.name };
        meshes[key] = m;
        scene.add(m);

        const lbl = document.createElement('div');
        lbl.className = 'planet-label';
        lbl.innerText = p.name;
        document.getElementById('label-layer').appendChild(lbl);
        labels[key] = lbl;
    });

    camera.position.set(0, 150, 400);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;
        Object.keys(meshes).forEach(key => {
            const p = planetsData[key], m = meshes[key], lbl = labels[key];
            if (!isObserving) {
                m.position.x = Math.cos(time * p.speed * 10) * p.dist;
                m.position.z = Math.sin(time * p.speed * 10) * p.dist;
                m.rotation.y += 0.01;
                m.visible = true;
                const vector = new THREE.Vector3().setFromObjectPosition(m).project(camera);
                const x = (vector.x * 0.5 + 0.5) * container.clientWidth;
                const y = (vector.y * -0.5 + 0.5) * container.clientHeight;
                lbl.style.display = 'block';
                lbl.style.left = `${x}px`; lbl.style.top = `${y-30}px`;
            } else {
                lbl.style.display = 'none';
                if (key !== currentTarget) m.visible = false;
                else { m.position.set(0,0,0); m.rotation.y += 0.005; }
            }
        });
        renderer.render(scene, camera);
    }
    animate();

    container.onclick = (e) => {
        if(isObserving) return;
        const rect = container.getBoundingClientRect();
        const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(meshes));
        if(intersects.length > 0) {
            isObserving = true;
            currentTarget = intersects[0].object.userData.id;
            document.getElementById('side-panel').style.display = 'flex';
            document.getElementById('target-title').innerText = `[${intersects[0].object.userData.name} 관측 중]`;
            camera.position.set(0, 0, 15);
            camera.lookAt(0,0,0);
        }
    };

    // ★ v2.5 고정: 제미나이 2.5 플래시 엔진 호출 ★
    async function runGeminiV25() {
        const ans = document.getElementById('student-answer').value;
        if(!ans) return alert("관측 내용을 먼저 적어주세요!");
        const respArea = document.getElementById('ai-response');
        respArea.innerHTML = "📡 제미나이 2.5 플래시가 분석 중...";

        // 엔진 명칭을 gemini-2.5-flash로 변경
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
        
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생의 행성 관측 기록에 대해 따뜻한 칭찬과 보완할 점을 말해줘: ${ans}` }] }] })
            });
            const data = await res.json();
            respArea.innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            saveToLocal(ans);
        } catch(e) {
            respArea.innerHTML = "❌ 2.5 Flash 엔진 연동 오류. 키를 확인해주세요.";
        }
    }

    function saveToLocal(ans) {
        const log = { target: planetsData[currentTarget].name, ans: ans, time: new Date().toLocaleString() };
        let logs = JSON.parse(localStorage.getItem('eaim_space_logs_v25') || "[]");
        logs.unshift(log);
        localStorage.setItem('eaim_space_logs_v25', JSON.stringify(logs));
        displayLogs();
    }

    function displayLogs() {
        const logs = JSON.parse(localStorage.getItem('eaim_space_logs_v25') || "[]");
        document.getElementById('log-container').innerHTML = logs.map(l => 
            `<div style="background:#1a1a2e; padding:10px; border-radius:8px; margin-bottom:10px; border-left:4px solid var(--main-color);">
                <small style="color:#888;">${l.time}</small><br>
                <b style="color:var(--main-color);">${l.target}</b>: ${l.ans}
            </div>`).join('');
    }
    window.onload = displayLogs;
</script>
</body>
</html>
