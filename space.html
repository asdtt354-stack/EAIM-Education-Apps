<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 우주 탐험 기록관 Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; }
        .font-serif { font-family: 'Gowun Dodum', serif; }
        
        /* 🚀 메인 시뮬레이터 */
        .solar-system { 
            position: relative; width: 100%; height: 420px; 
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%); 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1);
        }
        .sun { width: 30px; height: 30px; background: #facc15; border-radius: 50%; box-shadow: 0 0 40px #facc15; z-index: 50; }
        
        /* 궤도 및 행성 공전 */
        .orbit { position: absolute; border: 1px solid rgba(255,255,255,0.08); border-radius: 50%; transition: 0.5s; }
        .planet-wrap { position: absolute; width: 100%; height: 100%; animation: rotate linear infinite; }
        .planet { 
            position: absolute; border-radius: 50%; top: 0; left: 50%; transform: translate(-50%, -50%); 
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.6), 0 0 10px rgba(255,255,255,0.2);
            cursor: pointer; transition: 0.3s;
            animation: self-spin linear infinite; /* 자전 애니메이션 */
        }
        .planet:hover { transform: translate(-50%, -50%) scale(1.3); filter: brightness(1.2); }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes self-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* 집중 관측 모드(Focus Mode) 효과 */
        .focus-ring { position: absolute; width: 100%; height: 100%; border: 2px solid #6366f1; border-radius: 50%; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        
        .log-card { background: #1e293b; border-radius: 1.5rem; overflow: hidden; border: 1px solid #334155; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SpaceApp = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [obsDate, setObsDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedPlanet, setSelectedPlanet] = useState(null);
            const [logs, setLogs] = useState([]);
            const [currentLog, setCurrentLog] = useState({ science: '', emotion: '', feedback: '' });
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const planets = [
                { id: 1, name: '수성', size: 8, orbit: 70, period: 8.8, rot: 5.8, color: '#94a3b8', msg: '작지만 가장 빠른 열정' },
                { id: 2, name: '금성', size: 14, orbit: 105, period: 22.5, rot: -24.3, color: '#fb923c', msg: '거꾸로 돌아도 괜찮아, 나만의 방향' },
                { id: 3, name: '지구', size: 16, orbit: 150, period: 36.5, rot: 1, color: '#3b82f6', msg: '생명을 품은 소중한 우리 집' },
                { id: 4, name: '화성', size: 12, orbit: 195, period: 68.7, rot: 1.03, color: '#ef4444', msg: '도전과 모험의 붉은 별' },
                { id: 5, name: '목성', size: 30, orbit: 260, period: 118, rot: 0.41, color: '#d97706', msg: '모두를 품어주는 거대한 포용력' },
                { id: 6, name: '토성', size: 26, orbit: 330, period: 294, rot: 0.45, color: '#fde047', msg: '고리처럼 빛나는 나만의 개성' },
                { id: 7, name: '명왕성', size: 6, orbit: 390, period: 905, rot: 6.4, color: '#64748b', msg: '멀리 있어도 우리는 연결된 가족' }
            ];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_space_v4');
                const savedLogs = JSON.parse(localStorage.getItem('eaim_space_logs_v4') || '[]');
                setLogs(savedLogs);
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const handleAnalyze = async () => {
                setIsAnalyzing(true);
                try {
                    const prompt = `${selectedPlanet.name}을 관찰하고 쓴 일지야. [날짜:${obsDate}, 발견:${currentLog.science}, 감정:${currentLog.emotion}]. 35년 경력 교육전문가로서 행성의 특징과 아이의 마음을 연결해 다정한 답장을 3문장 써줘.`;
                    const feedback = await callGemini(prompt);
                    const newLog = { ...currentLog, feedback, date: obsDate, planet: selectedPlanet.name, id: Date.now() };
                    const updated = [newLog, ...logs];
                    setLogs(updated);
                    localStorage.setItem('eaim_space_logs_v4', JSON.stringify(updated));
                    setSelectedPlanet(null);
                    setStep(3);
                } catch (e) { alert('분석 실패'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 flex flex-col p-6 shadow-2xl relative">
                    <header className="flex justify-between items-center mb-4">
                        <h1 className="text-xl font-black text-indigo-400 font-serif tracking-tighter">EAIM SPACE CENTER</h1>
                        <div className="flex gap-2">
                            <button onClick={() => setStep(3)} className="text-[10px] bg-slate-800 px-3 py-1 rounded-full font-bold">기록실</button>
                            {step > 0 && <button onClick={() => { setSelectedPlanet(null); setStep(1); }} className="text-[10px] bg-indigo-900 px-3 py-1 rounded-full font-bold">관측실</button>}
                        </div>
                    </header>

                    {step === 0 && (
                        <div className="flex-grow flex flex-col justify-center gap-6 text-center animate-fadeIn">
                            <div className="text-7xl">🔭</div>
                            <h2 className="text-2xl font-bold">AI 망원경 전원 연결</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="bg-slate-900 border p-4 rounded-xl text-center outline-none focus:border-indigo-500" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_space_v4', apiKey.trim()); setStep(1); }} className="w-full bg-indigo-600 p-4 rounded-xl font-bold shadow-lg">관측 시작</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="text-center">
                                <h2 className="text-xl font-bold text-indigo-300">
                                    {selectedPlanet ? `${selectedPlanet.name} 집중 관측 중` : '태양계 전체 관측'}
                                </h2>
                                <p className="text-[10px] text-slate-500 mt-1 uppercase tracking-widest">날짜를 바꾸거나 행성을 클릭해보세요</p>
                            </div>

                            <input type="date" value={obsDate} onChange={e => setObsDate(e.target.value)} className="w-full bg-slate-900 p-3 rounded-xl text-white text-center border border-indigo-500/20 text-sm" />

                            {/* 💡 메인 시뮬레이터 영역 */}
                            <div className="solar-system">
                                <div className="sun"></div>
                                {planets.map(p => (
                                    <div key={p.id} className="orbit" style={{ 
                                        width: p.orbit, height: p.orbit, 
                                        borderColor: selectedPlanet?.id === p.id ? '#6366f1' : 'rgba(255,255,255,0.08)',
                                        borderWidth: selectedPlanet?.id === p.id ? '2px' : '1px'
                                    }}>
                                        <div className="planet-wrap" style={{ animationDuration: `${p.period}s` }}>
                                            <div 
                                                className="planet" 
                                                style={{ 
                                                    width: p.size, height: p.size, backgroundColor: p.color,
                                                    animationDuration: `${Math.abs(p.rot) * 5}s`,
                                                    animationDirection: p.rot < 0 ? 'reverse' : 'normal'
                                                }}
                                                onClick={() => setSelectedPlanet(p)}
                                            >
                                                <span className="planet-label">{p.name}</span>
                                                {selectedPlanet?.id === p.id && <div className="focus-ring"></div>}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {selectedPlanet ? (
                                <div className="bg-indigo-900/30 p-5 rounded-3xl border border-indigo-500/40 animate-fadeIn">
                                    <h3 className="text-indigo-400 font-bold text-sm mb-1">{selectedPlanet.name}의 메시지</h3>
                                    <p className="text-sm font-serif italic">"{selectedPlanet.msg}"</p>
                                    <div className="mt-4 flex gap-2">
                                        <button onClick={() => setStep(2)} className="flex-1 bg-indigo-600 p-3 rounded-xl text-xs font-bold">관찰 일지 쓰기</button>
                                        <button onClick={() => setSelectedPlanet(null)} className="flex-1 bg-slate-800 p-3 rounded-xl text-xs font-bold">전체 보기</button>
                                    </div>
                                </div>
                            ) : (
                                <p className="text-center text-[10px] text-slate-600 font-bold italic">행성을 클릭하면 해당 천체의 자전과 공전을 정밀 분석합니다.</p>
                            )}
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-4 animate-fadeIn">
                            <div className="text-center">
                                <h2 className="text-xl font-bold text-pink-400">{selectedPlanet.name} 탐사 일지</h2>
                                <p className="text-[10px] text-slate-500">{obsDate} 관측 기록</p>
                            </div>
                            <textarea value={currentLog.science} onChange={e => setCurrentLog({...currentLog, science: e.target.value})} className="w-full bg-slate-900 p-4 rounded-2xl h-24 text-sm" placeholder={`${selectedPlanet.name}에서 발견한 과학적 사실은?`}></textarea>
                            <textarea value={currentLog.emotion} onChange={e => setCurrentLog({...currentLog, emotion: e.target.value})} className="w-full bg-slate-900 p-4 rounded-2xl h-24 text-sm" placeholder={`${selectedPlanet.name}을 보며 나에게 해주고 싶은 말은?`}></textarea>
                            <button onClick={handleAnalyze} disabled={isAnalyzing} className="w-full bg-indigo-600 p-5 rounded-2xl font-bold shadow-xl">
                                {isAnalyzing ? "AI 선생님이 읽고 계십니다..." : "일지 저장 및 전송 🛸"}
                            </button>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="space-y-6 animate-fadeIn pb-10">
                            <h2 className="text-2xl font-bold text-center text-indigo-300">나의 우주 기록장</h2>
                            <div className="space-y-4">
                                {logs.length === 0 ? <p className="text-center py-20 text-slate-600 italic">아직 기록이 없습니다.</p> : 
                                 logs.map(log => (
                                    <div key={log.id} className="log-card p-5 space-y-3">
                                        <div className="flex justify-between items-center border-b border-white/5 pb-2">
                                            <span className="text-[10px] font-bold text-indigo-400">{log.date} | {log.planet} 탐사</span>
                                            <button onClick={() => {
                                                const f = logs.filter(l => l.id !== log.id); setLogs(f);
                                                localStorage.setItem('eaim_space_logs_v4', JSON.stringify(f));
                                            }} className="text-[8px] text-red-500 uppercase">Delete</button>
                                        </div>
                                        <p className="text-xs text-slate-200 leading-relaxed font-bold">🔍 관찰: {log.science}</p>
                                        <p className="text-xs text-slate-400 italic font-serif">✨ 마음: {log.emotion}</p>
                                        <div className="bg-indigo-950/40 p-4 rounded-xl text-[11px] text-indigo-200 border-l-4 border-indigo-500 font-serif">
                                            {log.feedback}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => setStep(1)} className="w-full bg-slate-800 p-4 rounded-xl font-bold mt-4 shadow-lg border border-slate-700">다시 관측하러 가기 🚀</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpaceApp />);
    </script>
</body>
</html>
