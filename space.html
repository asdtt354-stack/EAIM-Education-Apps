<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 에임우주탐험대 v3.8 - 대형 궤도 모드</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #010103; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        #canvas-container { flex: 1; background: radial-gradient(circle, #08081a 0%, #000 100%); cursor: pointer; position: relative; }
        #header-ui { position: absolute; top: 0; left: 0; width: 100%; padding: 25px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 100; }
        #intro-text { text-align: center; flex-grow: 1; }
        .btn-home { background: rgba(0,212,255,0.2); color: white; padding: 10px 25px; border-radius: 20px; border: 1px solid var(--main-color); pointer-events: auto; cursor: pointer; z-index: 110; transition: 0.3s; }
        .btn-home:hover { background: var(--main-color); color: black; }
        #side-panel { width: 350px; min-width: 350px; background: rgba(10,10,25,0.98); border-left: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 200; overflow-y: auto; }
        textarea { width: 100%; height: 120px; background: #161625; color: white; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 1em; line-height: 1.5; }
        button.btn-analyze { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: var(--main-color); color: #000; font-size: 1em; }
        #ai-response { margin-top: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; font-size: 0.95em; line-height: 1.6; color: #eee; border: 1px dashed #444; }
    </style>
</head>
<body>

<div id="main-view">
    <div id="header-ui">
        <div style="width: 100px;"></div>
        <div id="intro-text">
            <h1 style="color:var(--main-color); margin:0; font-size: 2.5em; text-shadow: 0 0 15px #00d4ff;">에임 우주 탐험대</h1>
            <p style="color:#aaa; font-size: 1.2em; margin: 5px 0;">탐사할 행성을 터치하여 3D 관측을 시작하세요!</p>
        </div>
        <button class="btn-home" onclick="location.reload()">☀️ 태양계 전체보기</button>
    </div>
    <div id="canvas-container"></div>
</div>

<div id="side-panel">
    <h2 style="color:var(--main-color); margin-top: 0;">🔭 관측 데이터 분석</h2>
    <p id="target-info" style="color:var(--accent); font-weight:bold; font-size: 1.3em; margin-bottom: 15px;"></p>
    <textarea id="student-answer" placeholder="행성을 관찰하고 배운 내용을 적어보세요..."></textarea>
    <button class="btn-analyze" onclick="callGemini25Flash()">AI 가이드 분석 (2.5 Flash)</button>
    <div id="ai-response">에임 AI 가이드가 여러분의 답변을 기다리고 있습니다.</div>
    <div id="log-list" style="margin-top:25px; border-top:1px solid #333; padding-top:15px; overflow-y:auto;">
        <h3 style="font-size: 1em; color: #888;">📖 탐사 일지</h3>
        <div id="log-container"></div>
    </div>
</div>

<script>
    // ★ 박성애 대표님 필수 설정: API Key ★
    const API_KEY = "발급받으신_API_키를_넣으세요"; 
    let isObserving = false, currentTarget = null;

    // --- [1] 데이터: 궤도 거리를 2.5배 확대하여 스케일 키움 ---
    const planetsData = {
        mercury: { name: "수성", dist: 60, size: 2.5, speed: 0.04, color: 0xaaaaaa, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg" },
        venus: { name: "금성", dist: 100, size: 4.0, speed: 0.015, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg" },
        earth: { name: "지구", dist: 150, size: 4.5, speed: 0.01, color: 0x2233ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg" },
        mars: { name: "화성", dist: 200, size: 3.5, speed: 0.008, color: 0xff3300, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg" },
        jupiter: { name: "목성", dist: 300, size: 12.0, speed: 0.004, color: 0xffaa88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg" },
        saturn: { name: "토성", dist: 400, size: 10.0, speed: 0.002, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png" }
    };

    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 20000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // 조명 강화: 광활한 우주에서도 선명하게
    scene.add(new THREE.AmbientLight(0xffffff, 3.5)); 
    const sun = new THREE.Mesh(new THREE.SphereGeometry(25, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    const meshes = {}, loader = new THREE.TextureLoader();
    Object.keys(planetsData).forEach(key => {
        const p = planetsData[key];
        const mat = new THREE.MeshStandardMaterial({ 
            map: loader.load(p.texture), 
            emissive: new THREE.Color(p.color), 
            emissiveIntensity: 0.6 
        });
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), mat);
        m.userData = { id: key, name: p.name };
        meshes[key] = m;
        scene.add(m);

        // --- [2] 궤도 라인 추가: 광활함을 직관적으로 보여줌 ---
        const orbitCurve = new THREE.EllipseCurve(0, 0, p.dist, p.dist);
        const points = orbitCurve.getPoints(128);
        const orbitGeom = new THREE.BufferGeometry().setFromPoints(points);
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.4 });
        const orbit = new THREE.Line(orbitGeom, orbitMat);
        orbit.rotation.x = Math.PI / 2; // 궤도를 수평으로 눕힘
        scene.add(orbit);
    });

    // --- [3] 카메라 시점 강제 조정: 멀리서 내려다보도록 ---
    camera.position.set(0, 500, 1000); // 아주 높은 곳에서 비스듬히 조망
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;
        Object.keys(meshes).forEach(key => {
            const p = planetsData[key], m = meshes[key];
            if (!isObserving) {
                // 공전 로직 (타원 궤도)
                m.position.x = Math.cos(time * p.speed * 10) * p.dist;
                m.position.z = Math.sin(time * p.speed * 10) * p.dist;
                // 자전 로직 (제자리 회전)
                m.rotation.y += 0.02; 
                m.visible = true;
            } else {
                if (key !== currentTarget) m.visible = false;
                else { m.position.set(0,0,0); m.rotation.y += 0.005; } // 탐사 모드 자전
            }
        });
        renderer.render(scene, camera);
    }
    animate();
