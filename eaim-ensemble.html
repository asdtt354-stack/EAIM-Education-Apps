<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 앙상블 v2.5 - 실시간 화성압축코드</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #050505; color: white; margin: 0; }
        .harmonic-chord-card { background: linear-gradient(145deg, #1a1a2e, #0a0a15); border: 1px solid #333; }
        .active-chord { border-color: #00d4ff; background: rgba(0, 212, 255, 0.1); transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); }
        .gradient-text { background: linear-gradient(90deg, #00d4ff, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .color-dot { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .color-dot.active { border-color: white; transform: scale(1.2); box-shadow: 0 0 15px currentColor; }
        .emotion-chip { padding: 8px 16px; border-radius: 20px; background: #1a1a1a; border: 1px solid #333; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .emotion-chip.active { background: #00d4ff; color: black; font-weight: bold; border-color: #00d4ff; }
        .yt-input { background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; border-radius: 12px; width: 100%; padding: 12px; outline: none; transition: 0.3s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v25') || '');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [recommendations, setRecommendations] = useState([]);
            
            // 실시간 합주 데이터
            const [selectedSong, setSelectedSong] = useState(null);
            const [chords, setChords] = useState([]);
            const [currentTime, setCurrentTime] = useState(0);
            const playerRef = useRef(null);
            const timerRef = useRef(null);

            const [selectedEmotion, setSelectedEmotion] = useState('');
            const [selectedColor, setSelectedColor] = useState({ name: '', code: '' });
            const [youtubeUrl, setYoutubeUrl] = useState('');

            const emotionWords = ['신나는', '평온한', '설레는', '우울한', '웅장한', '몽환적인', '차분한', '파워풀한', '따뜻한'];
            const colorPalette = [
                { name: '열정의 빨강', code: '#ef4444' }, { name: '활기찬 주황', code: '#f97316' },
                { name: '행복한 노랑', code: '#eab308' }, { name: '편안한 초록', code: '#22c55e' },
                { name: '신비로운 파랑', code: '#3b82f6' }, { name: '깊은 보라', code: '#a855f7' },
                { name: '순수한 하양', code: '#ffffff' }, { name: '고독한 검정', code: '#18181b' }
            ];

            const saveApiKey = () => {
                if (!apiKey) return alert("API 키를 입력하세요!");
                localStorage.setItem('gemini_api_key_v25', apiKey);
                setStep(1);
            };

            const callGemini25 = async (prompt) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt + "\n설명 없이 순수한 JSON 배열 형식으로만 답하세요." }] }]
                        })
                    });
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (e) {
                    alert("2.5 Flash 엔진 연결 실패!");
                    return null;
                }
            };

            // 추천 리스트 가져오기
            const processAnalysis = async () => {
                setIsAnalyzing(true);
                let prompt = youtubeUrl.trim() 
                    ? `유튜브 링크 "${youtubeUrl}"의 곡을 분석하여 합주 가이드를 작성해줘.`
                    : `상태 "${selectedEmotion}", 색상 "${selectedColor.name}"에 어울리는 K-POP 3곡 추천.`;
                
                prompt += ` JSON 형식: [{"title": "곡명-가수", "reason": "추천이유"}]`;

                const result = await callGemini25(prompt);
                if (result) {
                    try {
                        const json = JSON.parse(result.match(/\[.*\]/s)[0]);
                        setRecommendations(json);
                        setStep(2);
                    } catch (e) { alert("데이터 해석 오류"); }
                }
                setIsAnalyzing(false);
            };

            // ★ 화성압축코드 실시간 분석 함수 ★
            const analyzeChords = async (song) => {
                setSelectedSong(song);
                setIsAnalyzing(true);
                
                const prompt = `곡명: ${song.title}. 이 곡을 초보자가 합주하기 쉽도록 4마디 단위 '화성압축코드'로 분석하세요.
                반드시 JSON 배열로만 답하세요: [{"time": 초, "chord": "코드", "scale": "계이름", "tip": "운지법"}]
                (time은 노래 시작 후 해당 코드가 나오는 시점)`;

                const result = await callGemini25(prompt);
                if (result) {
                    try {
                        const json = JSON.parse(result.match(/\[.*\]/s)[0]);
                        setChords(json);
                        setStep(3); // 합주실로 이동
                        setTimeout(() => initYouTube(song.title), 500);
                    } catch (e) { alert("코드 분석 실패"); }
                }
                setIsAnalyzing(false);
            };

            const initYouTube = (query) => {
                if (!window.YT) {
                    const tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    document.body.appendChild(tag);
                    window.onYouTubeIframeAPIReady = () => createPlayer(query);
                } else { createPlayer(query); }
            };

            const createPlayer = (query) => {
                // 실제 서비스 시 유튜브 검색 API 연동 필요, 여기서는 샘플 비디오 ID 사용
                playerRef.current = new window.YT.Player('yt-player', {
                    height: '360', width: '100%',
                    videoId: 'kY3Lp-D_oas', // 샘플 영상
                    events: {
                        'onStateChange': (e) => {
                            if (e.data === 1) {
                                timerRef.current = setInterval(() => {
                                    setCurrentTime(playerRef.current.getCurrentTime());
                                }, 500);
                            } else { clearInterval(timerRef.current); }
                        }
                    }
                });
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6">
                    {/* Step 0 & 1 코드는 이전과 동일하므로 생략하지 않고 전체 포함 */}
                    {step === 0 && (
                        <div className="max-w-md w-full bg-zinc-900 p-8 rounded-3xl border border-zinc-800 text-center">
                            <h1 className="text-2xl font-bold mb-2 gradient-text italic">EAIM ENSEMBLE v2.5</h1>
                            <input type="password" className="w-full p-4 bg-black border border-zinc-700 rounded-xl mb-4 text-white text-center" placeholder="인증 키를 입력하세요" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
                            <button onClick={saveApiKey} className="w-full py-4 bg-sky-500 rounded-xl font-bold hover:bg-sky-400 transition">입장하기</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="max-w-xl w-full animate-fadeIn space-y-12">
                            <div className="text-center">
                                <h2 className="text-3xl font-bold mb-2 italic">마음 <span className="gradient-text">컬러링 & 합주</span></h2>
                                <p className="text-zinc-500 font-light">감정을 선택하거나 유튜브 링크를 넣으세요.</p>
                            </div>
                            <div className="space-y-8 bg-zinc-900/50 p-6 rounded-3xl border border-zinc-800 text-center">
                                <div className="flex flex-wrap justify-center gap-2">
                                    {emotionWords.map(word => (
                                        <button key={word} onClick={() => setSelectedEmotion(word)} className={`emotion-chip ${selectedEmotion === word ? 'active' : ''}`}>{word}</button>
                                    ))}
                                </div>
                                <div className="flex justify-center gap-3">
                                    {colorPalette.map(color => (
                                        <div key={color.name} onClick={() => setSelectedColor(color)} className={`color-dot ${selectedColor.name === color.name ? 'active' : ''}`} style={{ backgroundColor: color.code }} />
                                    ))}
                                </div>
                                <input type="text" className="yt-input mt-4" placeholder="유튜브 링크를 직접 넣으셔도 됩니다." value={youtubeUrl} onChange={(e) => setYoutubeUrl(e.target.value)} />
                                <button onClick={processAnalysis} disabled={isAnalyzing} className="w-full py-5 bg-white text-black rounded-2xl font-bold text-xl mt-4">
                                    {isAnalyzing ? '분석 중...' : '합주 추천 리스트 보기'}
                                </button>
                            </div>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="w-full max-w-5xl animate-fadeIn">
                            <div className="text-center mb-10">
                                <h2 className="text-3xl font-bold mb-2">에임 <span className="gradient-text">합주 가이드</span></h2>
                                <p className="text-zinc-400">제미나이 2.5 플래시가 분석한 합주 정보입니다.</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {recommendations.map((song, i) => (
                                    <div key={i} className="harmonic-chord-card p-8 rounded-3xl text-left border-zinc-800 group hover:border-sky-500 transition-all">
                                        <div className="text-sky-400 font-bold mb-2 tracking-tighter">Analysis 0{i+1}</div>
                                        <div className="text-xl font-bold mb-4 group-hover:text-sky-300 transition-colors">{song.title}</div>
                                        <p className="text-zinc-400 text-sm leading-relaxed mb-8 min-h-[80px]">{song.reason}</p>
                                        {/* ★ 함수 연결: analyzeChords(song) ★ */}
                                        <button onClick={() => analyzeChords(song)} className="w-full py-3 bg-zinc-800 text-white rounded-xl font-bold text-sm hover:bg-sky-500 hover:text-black transition-all">
                                            화성압축코드 악보보기
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ★ Step 3: 실시간 화성압축코드 합주실 ★ */}
                    {step === 3 && (
                        <div className="w-full max-w-4xl animate-fadeIn space-y-6">
                            <div className="flex justify-between items-center">
                                <h2 className="text-2xl font-bold gradient-text italic">{selectedSong?.title}</h2>
                                <button onClick={() => setStep(2)} className="text-zinc-500 hover:text-white">닫기</button>
                            </div>
                            <div id="yt-player" className="rounded-2xl overflow-hidden shadow-2xl bg-black aspect-video"></div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                                {chords.map((item, idx) => {
                                    const isActive = currentTime >= item.time && (chords[idx+1] ? currentTime < chords[idx+1].time : true);
                                    return (
                                        <div key={idx} className={`p-4 rounded-xl harmonic-chord-card transition-all duration-300 ${isActive ? 'active-chord' : 'opacity-30'}`}>
                                            <div className="text-3xl font-black mb-1">{item.chord}</div>
                                            <div className="text-xs text-sky-400 font-bold uppercase mb-2">{item.scale}</div>
                                            <div className="text-[10px] text-zinc-500 leading-tight">{item.tip}</div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
