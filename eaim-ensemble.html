<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const EnsembleApp = () => {
        const [step, setStep] = useState(0);
        const [apiKey, setApiKey] = useState('');
        const [emotion, setEmotion] = useState('');
        const [recommendations, setRecommendations] = useState([]);
        const [selectedSong, setSelectedSong] = useState(null);
        const [isAnalyzing, setIsAnalyzing] = useState(false);
        const [chords, setChords] = useState([]);
        const [currentTime, setCurrentTime] = useState(0);
        const playerRef = useRef(null);
        const timerRef = useRef(null);

        useEffect(() => {
            const savedKey = localStorage.getItem('gemini_api_key_v25');
            if (savedKey) { setApiKey(savedKey); setStep(1); }
        }, []);

        // ★ 박성애 대표님의 공식: 제미나이 2.5 플래시 엔진 고정 ★
        const callGeminiV25 = async (prompt) => {
            if (!apiKey) { alert("인증 키를 확인해주세요."); return null; }
            
            // 엔진 명칭을 gemini-2.5-flash로 강제 고정
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                console.error("2.5 Flash 연동 오류:", e);
                return null;
            }
        };

        const getRecommendations = async () => {
            if (!emotion) return alert("현재 기분을 입력해주세요!");
            setIsAnalyzing(true);
            const prompt = `[2.5 Flash 감정 분석] 사용자의 기분: "${emotion}"
            이 감정에 어울리는 합주하기 좋은 K-POP 또는 팝송 3곡을 추천하세요.
            반드시 다음 JSON 형식으로만 답하세요: [{"title": "곡제목 - 아티스트", "reason": "추천이유", "url": "유튜브검색키워드"}]`;

            const result = await callGeminiV25(prompt);
            if (result) {
                try {
                    const jsonMatch = result.match(/\[[\s\S]*\]/);
                    setRecommendations(JSON.parse(jsonMatch[0]));
                    setStep(1.5);
                } catch (e) { alert("결과 분석 실패"); }
            } else { alert("추천 실패. 제미나이 2.5 플래시 엔진을 확인해주세요."); }
            setIsAnalyzing(false);
        };

        const analyzeSelectedSong = async (song) => {
            setSelectedSong(song);
            setIsAnalyzing(true);
            const prompt = `[2.5 Flash 코드 분석] 곡명: ${song.title}
            이 곡을 4마디 단위로 분석하여 초보자용 '다이어트 코드' 리스트를 만드세요.
            반드시 JSON 배열 형식으로만 답하세요: [{"time": 초, "chord": "코드", "scale": "계이름", "tip": "운지법"}]`;

            const result = await callGeminiV25(prompt);
            if (result) {
                try {
                    const jsonMatch = result.match(/\[[\s\S]*\]/);
                    setChords(JSON.parse(jsonMatch[0]));
                    setStep(2);
                    setTimeout(() => initYouTube("kY3Lp-D_oas"), 100); 
                } catch (e) { alert("코드 분석 실패"); }
            } else { alert("분석 실패. 제미나이 2.5 플래시 엔진을 확인해주세요."); }
            setIsAnalyzing(false);
        };

        // ... 이하 유튜브 및 UI 로직 ...
</script>
