<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 뮤지컬 메이커 v2.5</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a0509; color: #FFF; margin: 0; padding: 0; }
        .stage-curtain { background: linear-gradient(to bottom, #9F1239, #881337); border-bottom: 4px solid #FCD34D; position: sticky; top: 0; z-index: 50; }
        .ticket-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: white; outline: none; border-radius: 0.5rem; width: 100%; padding: 0.8rem 1rem; font-size: 0.9rem; }
        .ticket-input:focus { border-color: #FCD34D; background: rgba(255, 255, 255, 0.12); }
        .magic-btn { background: linear-gradient(45deg, #FCD34D, #F59E0B); color: #000; border-radius: 0.75rem; font-weight: 800; padding: 1rem; border: none; width: 100%; cursor: pointer; }
        .ai-help-btn { background: rgba(252, 211, 77, 0.15); color: #FCD34D; border: 1px solid #FCD34D; border-radius: 0.5rem; font-size: 0.75rem; padding: 0.4rem 0.8rem; cursor: pointer; }
        .edit-area { background: rgba(0,0,0,0.4); color: #FDE68A; font-family: 'Gowun Batang', serif; line-height: 1.8; width: 100%; min-height: 500px; padding: 1.5rem; border: 1px dashed rgba(252, 211, 77, 0.3); border-radius: 0.5rem; outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v25') || '');
            const [loading, setLoading] = useState(false);
            
            const [place, setPlace] = useState('');
            const [plots, setPlots] = useState({ ki: '', seung: '', jeon: '', gyeol: '' });
            const [title, setTitle] = useState('');
            const [cast, setCast] = useState('');
            const [results, setResults] = useState('');

            // ★ v2.5 핵심: 모델명을 gemini-pro로 변경하여 호환성 확보 ★
            const callGeminiV25 = async (prompt) => {
                if (!apiKey) { alert("API 키를 입력해주세요."); return null; }
                
                // v2.5 안정화 버전의 핵심 모델명인 gemini-pro를 사용합니다.
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.error) {
                        // v2.5 전용 에러 핸들링
                        alert("v2.5 엔진 연결 실패: " + data.error.message);
                        return null;
                    }
                    
                    return data.candidates[0].content.parts[0].text;
                } catch (e) {
                    alert("연결 환경을 확인해주세요.");
                    return null;
                }
            };

            const getAIHelp = async () => {
                if (!plots.ki) return alert("줄거리를 먼저 입력해주세요.");
                setLoading(true);
                const prompt = `배경:${place}, 기:${plots.ki}, 승:${plots.seung}, 전:${plots.jeon}, 결:${plots.gyeol}. 이 내용에 어울리는 뮤지컬 제목과 등장인물을 추천해줘.`;
                const res = await callGeminiV25(prompt);
                if (res) {
                    setCast(res);
                    alert("AI가 추천 내용을 구성했습니다.");
                }
                setLoading(false);
            };

            const generateFinal = async () => {
                if (!title) return alert("제목을 입력해주세요.");
                setLoading(true);
                const prompt = `제목:${title}, 배경:${place}, 인물:${cast}, 스토리:${plots.ki}-${plots.seung}-${plots.jeon}-${plots.gyeol}. 위 내용을 바탕으로 아이들이 공연할 수 있는 풍성한 뮤지컬 대본을 써줘.`;
                const res = await callGeminiV25(prompt);
                if (res) {
                    setResults(res);
                    setStep(1);
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen pb-10">
                    <div className="stage-curtain p-4 text-center shadow-2xl">
                        <h1 className="font-show text-2xl text-yellow-300">EAIM MUSICAL MAKER v2.5</h1>
                        <p className="text-[10px] opacity-60">STABLE ENGINE RECOVERED</p>
                    </div>

                    <div className="max-w-2xl mx-auto p-4">
                        {step === 0 ? (
                            <div className="space-y-6">
                                <div className="p-4 bg-white/5 rounded-xl border border-white/10">
                                    <label className="text-xs text-yellow-500 block mb-2 font-bold tracking-tighter">EAIM-V2.5 API AUTHENTICATION</label>
                                    <input type="password" value={apiKey} onChange={(e) => {setApiKey(e.target.value); localStorage.setItem('gemini_api_key_v25', e.target.value);}} className="ticket-input text-center" placeholder="API KEY를 입력하세요" />
                                </div>

                                <div className="space-y-3 bg-white/5 p-4 rounded-xl border border-white/5">
                                    <h2 className="text-yellow-400 font-bold">1. 장소 및 스토리 라인</h2>
                                    <input value={place} onChange={e => setPlace(e.target.value)} className="ticket-input mb-1" placeholder="배경 장소 (예: 학교 복도)" />
                                    <textarea value={plots.ki} onChange={e => setPlots({...plots, ki: e.target.value})} className="ticket-input h-14" placeholder="기: 이야기의 발단" />
                                    <textarea value={plots.seung} onChange={e => setPlots({...plots, seung: e.target.value})} className="ticket-input h-14" placeholder="승: 전개" />
                                    <textarea value={plots.jeon} onChange={e => setPlots({...plots, jeon: e.target.value})} className="ticket-input h-14" placeholder="전: 위기와 절정" />
                                    <textarea value={plots.gyeol} onChange={e => setPlots({...plots, gyeol: e.target.value})} className="ticket-input h-14" placeholder="결: 결말" />
                                </div>

                                <div className="space-y-3 bg-white/5 p-4 rounded-xl border border-yellow-500/20">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-yellow-400 font-bold">2. 제목 및 캐릭터</h2>
                                        <button onClick={getAIHelp} className="ai-help-btn">AI 추천받기</button>
                                    </div>
                                    <input value={title} onChange={e => setTitle(e.target.value)} className="ticket-input" placeholder="뮤지컬 제목" />
                                    <textarea value={cast} onChange={e => setCast(e.target.value)} className="ticket-input h-20" placeholder="등장인물 설정 (AI 추천을 누르면 자동 입력)" />
                                </div>

                                <button onClick={generateFinal} disabled={loading} className="magic-btn text-lg shadow-xl">
                                    {loading ? <i className="fas fa-theater-masks fa-spin mr-2"></i> : <i className="fas fa-magic mr-2"></i>}
                                    {loading ? "v2.5 엔진 작동 중..." : "최종 대본 생성하기"}
                                </button>
                            </div>
                        ) : (
                            <div className="animate-fadeIn">
                                <h2 className="text-yellow-400 font-bold mb-4">v2.5 완성 대본 (편집 가능)</h2>
                                <textarea className="edit-area" value={results} onChange={e => setResults(e.target.value)} />
                                <button onClick={() => setStep(0)} className="mt-6 w-full py-3 border border-yellow-500/30 text-yellow-500 rounded-lg">처음으로 돌아가기</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
