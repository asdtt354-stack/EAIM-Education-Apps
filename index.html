<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM AI Education Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        header { margin-top: 20px; }
        header h1 { font-size: 2rem; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        header p { font-size: 1rem; opacity: 0.9; margin-bottom: 25px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 95%;
            max-width: 900px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }

        .icon { font-size: 2.2rem; margin-bottom: 8px; }
        .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
        .subtitle { font-size: 0.8rem; opacity: 0.8; white-space: nowrap; }

        footer { padding-bottom: 20px; font-size: 0.8rem; opacity: 0.7; }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            header h1 { font-size: 1.6rem; }
        }

        @media (max-width: 480px) {
            .grid-container { grid-template-columns: repeat(1, 1fr); width: 80%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌟 EAIM AI Education Platform</h1>
        <p>예술 융합 사회정서학습(SEL)을 위한 교과별 AI 도구 모음</p>
    </header>

    <div class="grid-container">
        <a href="korean.html" class="card">
            <span class="icon">📖</span>
            <span class="title">EAIM 감정 시인</span>
            <span class="subtitle">내 마음을 읊는 시간</span>
        </a>

        <a href="science.html" class="card">
            <span class="icon">🕵️‍♂️</span>
            <span class="title">EAIM 과학 탐정대</span>
            <span class="subtitle">이성과 감성의 추리</span>
        </a>

        <a href="space.html" class="card">
            <span class="icon">🚀</span>
            <span class="title">EAIM 우주 탐험대</span>
            <span class="subtitle">3D 우주 관찰 일지</span>
        </a>

        <a href="musicalmaker.html" class="card">
            <span class="icon">🎭</span>
            <span class="title">EAIM 뮤지컬 메이커</span>
            <span class="subtitle">창작 뮤지컬 시나리오</span>
        </a>

        <a href="eaim-ensemble.html" class="card">
            <span class="icon">🎸</span>
            <span class="title">EAIM 앙상블</span>
            <span class="subtitle">화성압축 연주</span>
        </a>

        <a href="sports.html" class="card">
            <span class="icon">🏀</span>
            <span class="title">EAIM 비트 & 볼</span>
            <span class="subtitle">다 함께 바디 퍼커션</span>
        </a>
    </div>

    <footer>
        © 2026 EAIM Studio. Designed by Director Park Seong-ae.
    </footer>

</body>
</html>
