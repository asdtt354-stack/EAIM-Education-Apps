<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 뮤지컬 메이커 v5.5</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a0509; color: #FFF; margin: 0; padding: 0; overflow-x: hidden; }
        .font-drama { font-family: 'Gowun Batang', serif; }
        .font-show { font-family: 'Black Han Sans', sans-serif; }
        .stage-curtain { background: linear-gradient(to bottom, #9F1239, #881337); border-bottom: 4px solid #FCD34D; }
        .ticket-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: white; transition: 0.3s; outline: none; }
        .ticket-input:focus { border-color: #FCD34D; background: rgba(255, 255, 255, 0.12); }
        .magic-btn { background: linear-gradient(45deg, #FCD34D, #F59E0B); color: #000; border-radius: 0.5rem; font-weight: bold; font-size: 0.75rem; padding: 0.5rem 0.8rem; }
        .cast-suggest-btn { background: rgba(252, 211, 77, 0.1); border: 1px solid #FCD34D; color: #FCD34D; font-size: 0.7rem; padding: 4px 10px; border-radius: 99px; }
        
        .tab-btn { padding: 0.8rem 0.5rem; flex: 1; font-weight: bold; font-size: 0.75rem; transition: 0.3s; border-bottom: 3px solid transparent; color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
        .tab-active { color: #FCD34D; border-bottom-color: #FCD34D; background: rgba(252, 211, 77, 0.07); }
        
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        pre { white-space: pre-wrap; line-height: 1.8; color: #FDE68A; }
        .prompt-box { background: #0f172a; border-radius: 1rem; border: 1px solid #1e293b; padding: 1rem; margin-bottom: 1rem; font-family: monospace; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);

            const [topic, setTopic] = useState('');
            const [place, setPlace] = useState('');
            const [title, setTitle] = useState('');
            const [castList, setCastList] = useState([{ role: '주인공', desc: '특징을 입력하세요' }]);
            
            const [activeTab, setActiveTab] = useState('script'); 
            const [finalScript, setFinalScript] = useState('');
            const [imagePrompts, setImagePrompts] = useState('');
            const [sunoPrompts, setSunoPrompts] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_musical_v5_5');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            // ⚡ 속도 최적화 및 에러 핸들링 함수
            const callGemini = async (prompt, customConfig = {}) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                
                const generationConfig = {
                    temperature: customConfig.temperature ?? 0.3,
                    topK: customConfig.topK ?? 20,
                };
                
                // 💡 글자 수 제한(maxTokens)이 넘어왔을 때만 적용하고, 없으면 무제한(AI가 알아서 끝낼 때까지) 허용합니다.
                if (customConfig.maxTokens) {
                    generationConfig.maxOutputTokens = customConfig.maxTokens;
                }

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: generationConfig
                        })
                    });
                    
                    if (!response.ok) throw new Error("API 호출 실패");
                    const data = await response.json();
                    
                    if (!data.candidates || !data.candidates[0].content) {
                        throw new Error("응답이 중간에 차단되었습니다.");
                    }
                    
                    return data.candidates[0].content.parts[0].text;
                } catch (error) {
                    console.error(error);
                    throw error;
                }
            };

            const generateAutoTitle = async () => {
                if (!topic || !place) return alert("주제와 배경을 먼저 입력해주세요!");
                setIsGenerating(true);
                try {
                    const result = await callGemini(`주제 '${topic}'과 배경 '${place}'에 어울리는 창의적인 뮤지컬 제목을 딱 하나만 추천해줘. 부연설명 절대 금지.`, { temperature: 0.7, maxTokens: 40 });
                    setTitle(result.trim().replace(/["']/g, ""));
                } catch (e) { alert("제목 생성 오류"); }
                finally { setIsGenerating(false); }
            };

            const suggestCharacters = async () => {
                if (!title) return alert("제목이 확정되어야 합니다!");
                setIsGenerating(true);
                try {
                    const result = await callGemini(`뮤지컬 '${title}'(주제:${topic})에 어울리는 조연 캐릭터 3명을 [역할명: 특징] 형식으로 추천해줘. 부연설명 금지.`, { temperature: 0.6, maxTokens: 200 });
                    const lines = result.split('\n').filter(l => l.includes(':'));
                    const newCasts = lines.map(line => {
                        const [role, desc] = line.replace(/[\[\]\d.]/g, "").split(':');
                        return { role: role.trim(), desc: desc.trim() };
                    });
                    setCastList([...castList, ...newCasts]);
                } catch (e) { alert("캐릭터 추천 오류"); }
                finally { setIsGenerating(false); }
            };

            const generateAIScript = async () => {
                setIsAnalyzing(true);
                setStep(3);
                
                const prompt = `베테랑 뮤지컬 연출가로서 다음 조건의 뮤지컬 극본을 집필해. 인사말이나 부연설명은 절대 금지하고 즉시 극본만 출력해.
                제목: ${title} / 주제: ${topic} / 배경: ${place}
                배역: ${castList.map(c=>c.role + '('+c.desc+')').join(', ')}

                [집필 및 기획 규칙]
                1. 구조: 오프닝 코러스 -> 1막~4막 -> 커튼콜 완결된 구조.
                2. 다이어트 가사: 넘버 가사는 핵심 위주로 아주 짧고 강렬하게 작성할 것.
                3. 형식 분리 (매우 중요): 극본 집필 후, 반드시 아래 구분자를 사용하여 정보를 따로 정리할 것.

                ---IMAGE_PROMPTS---
                (각 막 및 중요한 장면 전환에 필요한 미드저니용 영문 이미지 프롬프트 리스트)
                ---SUNO_PROMPTS---
                (각 넘버별 Suno AI용 영문 프롬프트 리스트. 가사 없이 Style, Mood, Tempo 정보만 포함)

                극본 내에는 대사와 가사만 나오도록 SEL 관점에서 감동적으로 집필해.`;

                try {
                    // 💡 뮤지컬 대본은 매우 길기 때문에 maxTokens 설정을 아예 없애서 끝까지 다 쓰도록 허용합니다.
                    const text = await callGemini(prompt, { temperature: 0.4 });
                    
                    // 💡 안전장치: AI가 혹시나 '---SUNO_PROMPTS---' 같은 구분자를 빼먹더라도 에러 나지 않게 처리
                    let scriptPart = text;
                    let imagePart = "AI가 이미지 프롬프트를 생성하지 못했습니다.";
                    let sunoPart = "AI가 Suno 프롬프트를 생성하지 못했습니다.";

                    if (text.includes('---IMAGE_PROMPTS---')) {
                        const split1 = text.split('---IMAGE_PROMPTS---');
                        scriptPart = split1[0].trim();
                        
                        if (split1[1].includes('---SUNO_PROMPTS---')) {
                            const split2 = split1[1].split('---SUNO_PROMPTS---');
                            imagePart = split2[0].trim();
                            sunoPart = split2[1].trim();
                        } else {
                            imagePart = split1[1].trim();
                        }
                    }

                    setFinalScript(scriptPart);
                    setImagePrompts(imagePart);
                    setSunoPrompts(sunoPart);
                } catch (e) { 
                    alert('집필 중 오류가 발생했습니다. 조금 더 간단한 주제로 다시 시도해 주세요.'); 
                    setStep(1); 
                }
                finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#1a0509] flex flex-col relative border-x-2 border-[#4a0410] shadow-2xl">
                    <header className="stage-curtain p-6 flex justify-between items-center no-print shadow-xl relative">
                        <div onClick={() => window.location.reload()} className="text-[#FCD34D] cursor-pointer"><i className="fa-solid fa-masks-theater text-2xl"></i></div>
                        <h1 className="text-xl text-[#FCD34D] font-show uppercase tracking-tighter">EAIM MUSICAL v5.5</h1>
                        <div onClick={() => { localStorage.removeItem('gemini_api_key_musical_v5_5'); window.location.reload(); }} className="text-[#FCD34D] cursor-pointer text-[10px] border border-[#FCD34D] px-2 py-1 rounded">RESET</div>
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto">
                        {step === 0 && (
                            <div className="space-y-6 py-10 text-center animate-fadeIn">
                                <div className="text-7xl mb-4">✍️🎨🎶</div>
                                <h2 className="text-xl font-bold text-[#FCD34D]">종합 예술 작가실 전원 켜기</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full p-4 rounded-xl ticket-input text-center" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_musical_v5_5', apiKey.trim()); setStep(1); }} className="w-full bg-[#9F1239] py-4 rounded-xl font-bold btn-glow">시스템 가동</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="space-y-5 bg-white/5 p-6 rounded-3xl border border-white/10">
                                    <div className="space-y-2"><label className="text-xs text-rose-300 font-bold uppercase ml-1">우리가 정한 주제</label><input className="w-full p-4 rounded-2xl ticket-input text-sm" value={topic} onChange={e=>setTopic(e.target.value)} placeholder="예:마음의 용기" /></div>
                                    <div className="space-y-2"><label className="text-xs text-rose-300 font-bold uppercase ml-1">우리가 정한 배경</label><input className="w-full p-4 rounded-2xl ticket-input text-sm" value={place} onChange={e=>setPlace(e.target.value)} placeholder="예:조선시대 달나라" /></div>
                                    <div className="space-y-2 relative">
                                        <div className="flex justify-between items-center mb-1"><label className="text-xs text-amber-300 font-bold uppercase ml-1">📜 최종 제목</label><button onClick={generateAutoTitle} disabled={isGenerating} className="magic-btn text-[10px] py-1 px-3 shadow-lg">{isGenerating ? "추천 중..." : "추천받기 ✨"}</button></div>
                                        <input className="w-full p-4 rounded-2xl ticket-input text-sm border-yellow-500/20 font-bold" value={title} onChange={e=>setTitle(e.target.value)} placeholder="제목을 입력하거나 버튼을 터치하세요" />
                                    </div>
                                </div>
                                <button onClick={()=>setStep(2)} className="w-full bg-gradient-to-r from-rose-800 to-rose-950 py-5 rounded-2xl font-bold shadow-xl">캐스팅 보드로 이동 👉</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-5 animate-fadeIn">
                                <div className="flex justify-between items-center mb-2">
                                    <h2 className="font-bold text-[#FCD34D] text-sm uppercase">Casting Board</h2>
                                    <button onClick={suggestCharacters} disabled={isGenerating} className="cast-suggest-btn text-yellow-500 text-[10px] px-3 py-1.5 rounded-full border border-yellow-500 animate-pulse">{isGenerating ? "모집 중..." : "친구들 추천 ✨"}</button>
                                </div>
                                {castList.map((c, i) => (
                                    <div key={i} className="bg-white/5 p-4 rounded-2xl flex gap-3 border border-white/5 animate-fadeIn">
                                        <input className="w-1/3 bg-transparent border-b border-rose-900 text-yellow-300 font-bold text-sm outline-none" value={c.role} placeholder="배역" onChange={e=>{const n=[...castList]; n[i].role=e.target.value; setCastList(n);}} />
                                        <input className="flex-1 bg-transparent border-b border-rose-900 text-xs text-white outline-none" value={c.desc} placeholder="특징" onChange={e=>{const n=[...castList]; n[i].desc=e.target.value; setCastList(n);}} />
                                        <button onClick={()=>setCastList(castList.filter((_,idx)=>idx!==i))} className="text-rose-900"><i className="fa-solid fa-minus-circle"></i></button>
                                    </div>
                                ))}
                                <button onClick={()=>setCastList([...castList, {role:'', desc:''}])} className="w-full py-3 border-2 border-dashed border-rose-900/50 text-rose-700 text-xs rounded-2xl">+ 배역 추가</button>
                                <div className="flex gap-3 pt-6">
                                    <button onClick={()=>setStep(1)} className="flex-1 bg-gray-800 py-4 rounded-2xl text-xs">이전</button>
                                    <button onClick={generateAIScript} className="flex-[2] bg-[#9F1239] py-4 rounded-2xl font-bold shadow-xl">종합 집필 시작 ✨</button>
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fadeIn pb-10">
                                {isAnalyzing ? (
                                    <div className="text-center py-24">
                                        <div className="animate-spin rounded-full h-14 w-14 border-t-2 border-b-2 border-[#FCD34D] mx-auto mb-6"></div>
                                        <p className="text-[#FCD34D] font-drama animate-pulse italic">디렉터님을 위한 종합 예술 기획안을<br/>정성껏 집필하고 있습니다...</p>
                                    </div>
                                ) : (
                                    <div className="print-area pb-10">
                                        <div className="flex border-b border-white/10 mb-6 no-print sticky top-0 bg-[#1a0509] z-10 shadow-lg">
                                            <button onClick={() => setActiveTab('script')} className={`tab-btn ${activeTab === 'script' ? 'tab-active' : ''}`}><i className="fa-solid fa-scroll"></i>📜 극본</button>
                                            <button onClick={() => setActiveTab('image')} className={`tab-btn ${activeTab === 'image' ? 'tab-active' : ''}`}><i className="fa-solid fa-palette"></i>🎨 장면 배경</button>
                                            <button onClick={() => setActiveTab('suno')} className={`tab-btn ${activeTab === 'suno' ? 'tab-active' : ''}`}><i className="fa-solid
