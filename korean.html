<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 감정 시인</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 3rem; box-shadow: 0 25px 50px rgba(0,0,0,0.1); border: 2px solid white; width: 100%; max-width: 550px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; }
        .eaim-btn-main { background: #5f7adb !important; color: white !important; border-radius: 1.5rem; padding: 1rem; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        .eaim-btn-main:hover:not(:disabled) { background: #4a63c5 !important; transform: scale(1.02); }
        @media print {
            body { background: white; color: black; display: block; }
            .print-hidden { display: none !important; }
            .eaim-card { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; max-width: none; }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-4"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [searchQuery, setSearchQuery] = useState('신미나 싱고');
            const [readingPoem, setReadingPoem] = useState('');
            const [finalResult, setFinalResult] = useState('');
            
            const [emotionWord, setEmotionWord] = useState('');
            const [emotionColor, setEmotionColor] = useState('');
            const [situation, setSituation] = useState('');
            const [bodyPart, setBodyPart] = useState('');
            const [bodySensation, setBodySensation] = useState('');
            const [appearance, setAppearance] = useState('');
            const [relationship, setRelationship] = useState('');
            const [emotionName, setEmotionName] = useState('');
            
            const [friendName, setFriendName] = useState('');
            const [friendPoem, setFriendPoem] = useState('');
            const [draftLetter, setDraftLetter] = useState('');

            const words = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '신나는', '포근한'];
            const colors = [{name:'빨강',code:'#EF4444'},{name:'주황',code:'#F97316'},{name:'노랑',code:'#FBBF24'},{name:'초록',code:'#34D399'},{name:'파랑',code:'#3B82F6'},{name:'보라',code:'#8B5CF6'}];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_kor');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key_kor', apiKey.trim());
                setStep(1);
            };

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                // 💡 최신 2.0 엔진과 v1beta 통신망으로 완벽 교체 완료! (에러 차단)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cleanKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            // 💡 끊어졌던 시 검색 함수 복구
            const handleFetchPoem = async () => {
                if (!searchQuery) return alert("시인이나 시 제목을 입력해주세요.");
                setIsAnalyzing(true);
                setReadingPoem('시를 찾는 중입니다... ✨');
                try {
                    const prompt = `'${searchQuery}'에 해당하는 현대시 1편을 찾아 전문을 그대로 보여주세요. 너무 길지 않은 시로 부탁하며, 제목과 작가를 명시해주세요.`;
                    const text = await callGemini(prompt);
                    setReadingPoem(text);
                    setStep(2);
                } catch (e) { alert('시를 불러오는 중 오류가 발생했습니다: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            // 💡 끊어졌던 내 감정 시 창작 함수 복구
            const generateMyPoem = async () => {
                if(!emotionWord || !emotionColor || !emotionName) return alert("감정의 색깔과 이름을 모두 정해주세요!");
                setIsAnalyzing(true);
                setStep(4);
                try {
                    const prompt = `당신은 따뜻한 국어 교사이자 시인입니다. 학생이 자신의 감정을 탐색하고 작성한 아래 내용을 바탕으로, 한 편의 아름답고 공감 가는 자유시를 작성해주세요.
                    - 감정 단어: ${emotionWord}
                    - 감정 색깔: ${emotionColor}
                    - 느끼는 상황: ${situation}
                    - 신체 반응: ${bodyPart}이/가 ${bodySensation}
                    - 감정의 모양: ${appearance}
                    - 감정과의 관계: ${relationship}
                    - 내가 지어준 감정의 새 이름: ${emotionName}
                    
                    이 요소들이 자연스럽게 비유와 상징으로 녹아든 시를 써주세요. 학생의 감정을 있는 그대로 수용하고 위로하는 따뜻한 톤(SEL)을 유지해주세요.`;
                    
                    const text = await callGemini(prompt);
                    setFinalResult(text);
                } catch (e) { setFinalResult('시 창작 중 오류가 발생했습니다: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            // 💡 끊어졌던 짝꿍에게 공감 편지 쓰기 함수 복구
            const generateLetter = async () => {
                if(!friendName || !friendPoem) return alert("친구 이름과 친구의 시를 입력해주세요!");
                setIsAnalyzing(true);
                setStep(6);
                try {
                    const prompt = `당신은 공감 능력이 뛰어난 따뜻한 멘토입니다. 짝꿍 '${friendName}'(이)가 쓴 아래의 감정 시를 읽고, 친구의 마음에 깊이 공감하고 위로와 응원을 건네는 다정한 편지를 3~4문장으로 작성해주세요. (중학생 말투로 따뜻하게 작성)
                    친구의 시: ${friendPoem}`;
                    
                    const text = await callGemini(prompt);
                    setDraftLetter(text);
                } catch (e) { setDraftLetter('편지 작성 중 오류가 발생했습니다: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="text-center space-y-6 print-hidden">
                            <h2 className="font-bold text-2xl font-hand text-indigo-600">EAIM 감정 시인 연결</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="eaim-input" placeholder="발급받은 API 키를 입력하세요" />
                            <button onClick={saveApiKey} className="eaim-btn-main shadow-lg">마음의 문 열기 📖</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div>
                            <header className="flex justify-between items-center mb-6 print-hidden border-b pb-3">
                                <span className="font-bold text-indigo-600 font-hand text-xl">EAIM 감정 시인 📖</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key_kor'); setStep(0); window.location.reload(); }} className="text-xs text-slate-400 underline">키 재설정</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-6 animate-fade-in text-center print-hidden">
                                    <h2 className="text-2xl font-hand text-slate-800">1. 시와 만나기</h2>
                                    <p className="text-sm text-slate-500">읽고 싶은 시인이나 시 제목을 검색해보세요.</p>
                                    <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="eaim-input" placeholder="예: 윤동주 별 헤는 밤" />
                                    <button onClick={handleFetchPoem} disabled={isAnalyzing} className="eaim-btn-main mt-4">
                                        {isAnalyzing ? "시를 찾는 중..." : "시 불러오기 ✨"}
                                    </button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <h2 className="text-2xl font-hand text-center text-indigo-600">오늘의 시</h2>
                                    <div className="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 whitespace-pre-wrap font-serif text-slate-700 leading-loose">
                                        {readingPoem}
                                    </div>
                                    <button onClick={() => setStep(3)} className="eaim-btn-main bg-pink-500 hover:bg-pink-400">내 감정 시 쓰러 가기 ✍️</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">2. 내 마음 해부하기</h2>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-sm font-bold text-slate-500">1. 지금 내 감정은?</label>
                                            <div className="flex flex-wrap gap-2 mt-2">
                                                {words.map(w => <button key={w} onClick={() => setEmotionWord(w)} className={`px-3 py-1.5 rounded-full text-sm transition-all ${emotionWord === w ? 'bg-indigo-500 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-indigo-100'}`}>{w}</button>)}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-sm font-bold text-slate-500">2. 이 감정의 색깔은?</label>
                                            <div className="flex gap-2 mt-2">
                                                {colors.map(c => <button key={c.name} onClick={() => setEmotionColor(c.name)} style={{backgroundColor: c.code}} className={`w-10 h-10 rounded-full shadow-sm transition-all ${emotionColor === c.name ? 'ring-4 ring-offset-2 ring-indigo-400 scale-110' : 'hover:scale-105'}`} title={c.name}></button>)}
                                            </div>
                                        </div>

                                        <input type="text" value={situation} onChange={e => setSituation(e.target.value)} className="eaim-input text-sm" placeholder="언제 이 감정을 느끼나요? (예: 혼자 남겨졌을 때)" />
                                        <div className="flex gap-2">
                                            <input type="text" value={bodyPart} onChange={e => setBodyPart(e.target.value)} className="eaim-input text-sm w-1/2" placeholder="신체 부위 (예: 가슴이)" />
                                            <input type="text" value={bodySensation} onChange={e => setBodySensation(e.target.value)} className="eaim-input text-sm w-1/2" placeholder="감각 (예: 쿵쾅거린다)" />
                                        </div>
                                        <input type="text" value={appearance} onChange={e => setAppearance(e.target.value)} className="eaim-input text-sm" placeholder="감정의 모양은? (예: 뾰족한 가시 모양)" />
                                        <input type="text" value={relationship} onChange={e => setRelationship(e.target.value)} className="eaim-input text-sm" placeholder="이 감정에게 해주고 싶은 말은? (예: 안아주고 싶다)" />
                                        <input type="text" value={emotionName} onChange={e => setEmotionName(e.target.value)} className="eaim-input border-indigo-400 font-bold" placeholder="✨ 이 감정의 새로운 이름 지어주기" />
                                    </div>

                                    <button onClick={generateMyPoem} className="eaim-btn-main">AI와 함께 시 완성하기 🪄</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-6 animate-fade-in print-area">
                                    <h2 className="text-3xl font-hand text-center text-indigo-600">나의 감정 시</h2>
                                    <div className="bg-white p-8 rounded-3xl border-2 border-indigo-100 min-h-[300px] shadow-sm">
                                        {isAnalyzing ? (
                                            <div className="text-center text-indigo-400 font-bold mt-20">시인이 당신의 마음을 시로 엮고 있습니다...</div>
                                        ) : (
                                            <div className="whitespace-pre-wrap text-slate-700 text-lg leading-loose font-serif text-center">
                                                {finalResult}
                                            </div>
                                        )}
                                    </div>
                                    {!isAnalyzing && (
                                        <div className="flex gap-2 print-hidden">
                                            <button onClick={() => window.print()} className="flex-1 eaim-btn-main bg-slate-400">🖨️ 인쇄</button>
                                            <button onClick={() => setStep(5)} className="flex-1 eaim-btn-main bg-emerald-500">💌 짝꿍에게 편지 쓰기</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {step === 5 && (
                                <div className="space-y-6 animate-fade-in print-hidden">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">3. 공감과 위로의 편지</h2>
                                    <p className="text-sm text-slate-500 text-center">짝꿍이 쓴 시를 읽고 따뜻한 답장을 보내주세요.</p>
                                    
                                    <input type="text" value={friendName} onChange={e => setFriendName(e.target.value)} className="eaim-input" placeholder="짝꿍의 이름은?" />
                                    <textarea value={friendPoem} onChange={e => setFriendPoem(e.target.value)} className="eaim-input h-32 text-left" placeholder="짝꿍이 쓴 시를 여기에 붙여넣어 주세요."></textarea>
                                    
                                    <button onClick={generateLetter} disabled={isAnalyzing} className="eaim-btn-main bg-emerald-500">
                                        {isAnalyzing ? "편지 작성 중..." : "AI와 함께 공감 편지 쓰기 💌"}
                                    </button>
                                </div>
                            )}

                            {step === 6 && (
                                <div className="space-y-6 animate-fade-in print-area">
                                    <h2 className="text-3xl font-hand text-center text-emerald-600">💌 {friendName}에게 보내는 편지</h2>
                                    <div className="bg-emerald-50 p-8 rounded-3xl border-2 border-emerald-100 min-h-[250px] shadow-sm">
                                        {isAnalyzing ? (
                                            <div className="text-center text-emerald-400 font-bold mt-20">따뜻한 마음을 담아 편지를 쓰는 중...</div>
                                        ) : (
                                            <div className="whitespace-pre-wrap text-slate-700 text-lg leading-loose font-hand">
                                                {draftLetter}
                                            </div>
                                        )}
                                    </div>
                                    {!isAnalyzing && (
                                        <div className="flex gap-2 print-hidden">
                                            <button onClick={() => window.print()} className="flex-1 eaim-btn-main bg-slate-400">🖨️ 편지 인쇄</button>
                                            <button onClick={() => { setStep(1); setFinalResult(''); setDraftLetter(''); setEmotionWord(''); setEmotionColor(''); }} className="flex-1 eaim-btn-main">처음으로 돌아가기</button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
