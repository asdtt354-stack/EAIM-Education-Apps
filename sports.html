<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 비트 & 볼</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #111827; color: #F3F4F6; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(31, 41, 55, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(75, 85, 99, 0.4); }
        .neon-border { box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); border-color: #F97316; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            body { background: white; color: black; display: block; }
            .print-hidden { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const BeatAndBallApp = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [sport, setSport] = useState('농구 🏀');
            const [beatStyle, setBeatStyle] = useState('힙합 (Boom Bap) 🎧');
            const [parsedData, setParsedData] = useState({ intro: '', teamA: '', teamB: '', teamC: '' });
            
            const [journal, setJournal] = useState('');
            const [imagePreview, setImagePreview] = useState(null);
            const [uploadedImage, setUploadedImage] = useState(null);
            const [teacherFeedback, setTeacherFeedback] = useState('');

            const sports = ['농구 🏀', '배구 🏐', '축구 ⚽', '짐볼 🔵'];
            const beats = ['힙합 (Boom Bap) 🎧', '빠른 댄스 (EDM) ⚡', '펑키 리듬 (Funky) 🎸', '응원가 비트 (March) 🥁'];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_beat');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key_beat', apiKey.trim());
                setStep(1);
            };

            const callGemini = async (prompt, imageData = null) => {
                const cleanKey = apiKey.trim();
                // 💡 디렉터님 환경에서 검증된 2.5-flash 엔진 적용!
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                
                const contents = [{ parts: [{ text: prompt }] }];
                if (imageData) {
                    contents[0].parts.push({ inlineData: { data: imageData.data, mimeType: imageData.mimeType } });
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const extractSection = (text, sectionName) => {
                const regex = new RegExp(`\\[${sectionName}\\](.*?)(?=\\[|$)`, 's');
                const match = text.match(regex);
                return match ? match[1].trim() : '데이터 로드 실패';
            };

            const generateBeatMatrix = async () => {
                setIsAnalyzing(true);
                const prompt = `체육교사이자 안무가로서 '${sport}' 종목과 '${beatStyle}' 스타일을 결합한 4박자 바디 퍼커션 리듬을 짜주세요. 
                [도입부], [A팀 리듬], [B팀 리듬], [C팀 리듬] 태그를 꼭 포함해서 작성해줘.`;

                try {
                    const text = await callGemini(prompt);
                    setParsedData({
                        intro: extractSection(text, '도입부'),
                        teamA: extractSection(text, 'A팀 리듬'),
                        teamB: extractSection(text, 'B팀 리듬'),
                        teamC: extractSection(text, 'C팀 리듬')
                    });
                    setStep(2);
                } catch (e) { alert('비트 생성 오류: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setUploadedImage({ data: reader.result.split(',')[1], mimeType: file.type });
                        setImagePreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const generateFeedback = async () => {
                setIsAnalyzing(true);
                setStep(4);
                const prompt = `체육 선생님으로서 '${sport}' 바디 퍼커션을 마친 학생의 일지에 따뜻한 피드백을 써주세요.\n학생의 글: ${journal}\n에너지 넘치는 칭찬과 SEL 공감을 담아 3문장으로 작성해줘.`;
                try {
                    const text = await callGemini(prompt, uploadedImage);
                    setTeacherFeedback(text);
                } catch (e) { setTeacherFeedback('피드백 생성 오류: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-900 shadow-2xl flex flex-col relative overflow-hidden">
                    <header className="bg-gray-950 p-4 flex justify-between items-center border-b border-gray-800 print-hidden">
                        <h1 className="text-2xl font-title tracking-wider text-orange-500 italic">EAIM 비트 & 볼</h1>
                        {step > 0 && <button onClick={() => { localStorage.removeItem('gemini_api_key_beat'); setStep(0); window.location.reload(); }} className="text-xs text-gray-500 underline">키 재설정</button>}
                    </header>

                    <main className="flex-grow p-5 overflow-y-auto pb-24">
                        {step === 0 && (
                            <div className="space-y-4 py-10 text-center animate-fadeIn">
                                <h2 className="text-2xl font-bold text-orange-500 font-title">🔌 시스템 전원 연결</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-gray-800 border p-4 rounded-xl text-white text-center" />
                                <button onClick={saveApiKey} className="w-full bg-orange-600 text-white p-4 rounded-xl font-bold">체육관 입장</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="text-center">
                                    <h2 className="text-3xl font-title text-white">비트 세팅</h2>
                                    <p className="text-gray-400 text-sm mt-2">종목과 음악을 고르면 AI가 앙상블을 짜줍니다.</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    {sports.map(s => <button key={s} onClick={() => setSport(s)} className={`p-3 rounded-xl border font-bold ${sport === s ? 'bg-orange-600 border-orange-400' : 'bg-gray-800 border-gray-700'}`}>{s}</button>)}
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    {beats.map(b => <button key={b} onClick={() => setBeatStyle(b)} className={`p-3 rounded-xl border font-bold ${beatStyle === b ? 'bg-blue-600 border-blue-400' : 'bg-gray-800 border-gray-700'}`}>{b}</button>)}
                                </div>
                                <button onClick={generateBeatMatrix} disabled={isAnalyzing} className="w-full bg-gradient-to-r from-orange-500 to-red-500 p-5 rounded-2xl font-bold text-lg mt-4">
                                    {isAnalyzing ? "AI 비트 제작 중..." : "AI 비트 생성하기 ⚡"}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-5 animate-fadeIn">
                                <div className="text-center bg-gray-800 p-6 rounded-3xl border border-gray-700">
                                    <h2 className="text-xl font-bold text-white">{sport} X {beatStyle}</h2>
                                    <p className="text-sm text-orange-400 mt-2 font-hand">"{parsedData.intro}"</p>
                                </div>
                                <div className="space-y-3">
                                    <div className="glass-panel p-4 rounded-2xl border-l-4 border-l-orange-500"><h3 className="font-bold text-orange-400">A팀 (베이스)</h3><p>{parsedData.teamA}</p></div>
                                    <div className="glass-panel p-4 rounded-2xl border-l-4 border-l-blue-500"><h3 className="font-bold text-blue-400">B팀 (스네어)</h3><p>{parsedData.teamB}</p></div>
                                    <div className="glass-panel p-4 rounded-2xl border-l-4 border-l-emerald-500"><h3 className="font-bold text-emerald-400">C팀 (기교)</h3><p>{parsedData.teamC}</p></div>
                                </div>
                                <button onClick={() => setStep(3)} className="w-full bg-indigo-600 p-4 rounded-xl font-bold">활동 일지 쓰기 ✍️</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="p-4 bg-gray-800 rounded-xl">
                                    <label className="text-sm font-bold text-gray-300 block mb-2">📸 활동 사진 (선택)</label>
                                    <input type="file" accept="image/*" onChange={handleImageUpload} className="text-xs text-gray-400 w-full" />
                                    {imagePreview && <img src={imagePreview} className="mt-2 rounded-lg max-h-40 w-full object-cover" />}
                                </div>
                                <textarea value={journal} onChange={e => setJournal(e.target.value)} className="w-full bg-gray-800 p-4 rounded-xl h-32" placeholder="오늘 활동하며 느낀 감정을 적어주세요."></textarea>
                                <button onClick={generateFeedback} disabled={!journal || isAnalyzing} className="w-full bg-gradient-to-r from-orange-500 to-red-500 p-4 rounded-xl font-bold">
                                    {isAnalyzing ? "코치님이 읽는 중..." : "AI 코치님께 제출 📝"}
                                </button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-2xl font-title text-center text-orange-400">🔥 코치님의 피드백</h2>
                                <div className="bg-gray-800 p-6 rounded-3xl border-2 border-orange-500/50 min-h-[200px]">
                                    {isAnalyzing ? "작성 중..." : <div className="whitespace-pre-wrap">{teacherFeedback}</div>}
                                </div>
                                <div className="flex gap-2 print-hidden">
                                    <button onClick={() => window.print()} className="flex-1 bg-gray-600 p-3 rounded-xl font-bold">인쇄</button>
                                    <button onClick={() => setStep(1)} className="flex-1 bg-orange-600 p-3 rounded-xl font-bold">새 비트</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BeatAndBallApp />);
    </script>
</body>
</html>
