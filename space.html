<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 우주 탐험대: 태양계 대가족</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #020617; color: #E2E8F0; margin: 0; }
        
        /* 🚀 태양계 전체 시뮬레이터 디자인 */
        .solar-system { 
            position: relative; width: 100%; height: 450px; 
            background: radial-gradient(circle, #1e1b4b 0%, #020617 100%); 
            border-radius: 2rem; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }
        .sun { width: 35px; height: 35px; background: #fbbf24; border-radius: 50%; box-shadow: 0 0 40px #fbbf24; z-index: 100; }
        
        .orbit { position: absolute; border: 1px solid rgba(255,255,255,0.08); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .planet-wrap { position: absolute; width: 100%; height: 100%; animation: rotate linear infinite; }
        .planet { border-radius: 50%; position: absolute; top: 0; left: 50%; transform: translateX(-50%); }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 행성별 개별 설정 (실제 공전 속도 비율 반영) */
        .mercury-o { width: 60px; height: 60px; animation-duration: 3s; }   .mercury { width: 6px; background: #94a3b8; }
        .venus-o { width: 90px; height: 90px; animation-duration: 6s; }     .venus { width: 9px; background: #fb923c; }
        .earth-o { width: 130px; height: 130px; animation-duration: 10s; }   .earth { width: 10px; background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
        .mars-o { width: 170px; height: 170px; animation-duration: 15s; }    .mars { width: 8px; background: #ef4444; }
        .jupiter-o { width: 230px; height: 230px; animation-duration: 25s; } .jupiter { width: 18px; background: #d97706; }
        .saturn-o { width: 290px; height: 290px; animation-duration: 35s; }  .saturn { width: 15px; background: #fde047; border: 2px solid #a1a1aa; }
        .uranus-o { width: 340px; height: 340px; animation-duration: 50s; }  .uranus { width: 12px; background: #7dd3fc; }
        .neptune-o { width: 390px; height: 390px; animation-duration: 70s; } .neptune { width: 11px; background: #6366f1; }
        .pluto-o { width: 430px; height: 430px; animation-duration: 90s; }   .pluto { width: 5px; background: #94a3b8; opacity: 0.7; } /* 명왕성 */

        .planet-label { position: absolute; top: -15px; font-size: 7px; color: #94a3b8; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SpaceAppGrand = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [skyGuide, setSkyGuide] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_space');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const startExploration = async () => {
                setIsAnalyzing(true);
                const prompt = `태양계 8개 행성과 명왕성을 포함한 우주의 질서를 중학생에게 설명해줘. 
                특히 '가장 멀리 있는 명왕성도 우리 가족'이라는 따뜻한 SEL 관점을 담아 4문장으로 써줘.`;
                try {
                    const text = await callGemini(prompt);
                    setSkyGuide(text);
                    setStep(2);
                } catch (e) { alert('분석 실패'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-950 text-slate-100 p-6 flex flex-col gap-6">
                    <header className="flex justify-between items-center">
                        <h1 className="text-xl font-bold text-indigo-400">EAIM 우주 탐험대</h1>
                        {step > 0 && <button onClick={() => { localStorage.removeItem('gemini_api_key_space'); window.location.reload(); }} className="text-[10px] underline text-slate-500">RESET</button>}
                    </header>

                    {step === 0 && (
                        <div className="flex-grow flex flex-col justify-center items-center gap-6">
                            <div className="text-6xl animate-pulse">🪐</div>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-center" />
                            <button onClick={() => { localStorage.setItem('gemini_api_key_space', apiKey.trim()); setStep(1); }} className="w-full bg-indigo-600 p-4 rounded-xl font-bold">우주선 탑승</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="flex-grow flex flex-col justify-center gap-10 text-center animate-fadeIn">
                            <div className="space-y-2">
                                <h2 className="text-3xl font-bold">태양계 그랜드 탐사</h2>
                                <p className="text-slate-400">9개의 천체가 그리는 하모니를 만나보세요.</p>
                            </div>
                            <button onClick={startExploration} disabled={isAnalyzing} className="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 rounded-3xl font-black text-xl shadow-2xl">
                                {isAnalyzing ? "우주 지도 분석 중..." : "태양계 가동하기 🚀"}
                            </button>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-6 animate-fadeIn">
                            {/* 💡 9개 행성 실시간 시뮬레이터 */}
                            <div className="solar-system shadow-2xl border-2 border-white/5">
                                <div className="sun"></div>
                                {/* 오비트 라인들 */}
                                <div className="orbit mercury-o"><div className="planet-wrap"><div className="planet mercury aspect-square"><span className="planet-label">수성</span></div></div></div>
                                <div className="orbit venus-o"><div className="planet-wrap"><div className="planet venus aspect-square"><span className="planet-label">금성</span></div></div></div>
                                <div className="orbit earth-o"><div className="planet-wrap"><div className="planet earth aspect-square"><span className="planet-label">지구</span></div></div></div>
                                <div className="orbit mars-o"><div className="planet-wrap"><div className="planet mars aspect-square"><span className="planet-label">화성</span></div></div></div>
                                <div className="orbit jupiter-o"><div className="planet-wrap"><div className="planet jupiter aspect-square"><span className="planet-label">목성</span></div></div></div>
                                <div className="orbit saturn-o"><div className="planet-wrap"><div className="planet saturn aspect-square"><span className="planet-label">토성</span></div></div></div>
                                <div className="orbit uranus-o"><div className="planet-wrap"><div className="planet uranus aspect-square"><span className="planet-label">천왕성</span></div></div></div>
                                <div className="orbit neptune-o"><div className="planet-wrap"><div className="planet neptune aspect-square"><span className="planet-label">해왕성</span></div></div></div>
                                <div className="orbit pluto-o"><div className="planet-wrap"><div className="planet pluto aspect-square"><span className="planet-label">명왕성</span></div></div></div>
                            </div>

                            <div className="bg-indigo-900/30 p-5 rounded-2xl border border-indigo-500/30">
                                <h3 className="text-xs font-bold text-indigo-400 mb-2 uppercase">ASTRONOMY GUIDE</h3>
                                <p className="text-sm leading-relaxed">{skyGuide}</p>
                            </div>
                            
                            <button onClick={() => setStep(1)} className="w-full bg-slate-800 p-4 rounded-xl font-bold">다른 관찰 시점 찾기</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SpaceAppGrand />);
    </script>
</body>
</html>
