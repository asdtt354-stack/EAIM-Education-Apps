<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM 뮤지컬 메이커</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0f4f8; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        @media print { .print-hidden { display: none !important; } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MusicalMaker = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const [theme, setTheme] = useState('');
            const [charCount, setCharCount] = useState('5');
            const [mood, setMood] = useState('밝고 쾌활하고 코믹한');
            const [genre, setGenre] = useState('auto');

            const [result, setResult] = useState({ script: '', lyrics: '', imagePrompt: '' });

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_musical');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 정확히 입력해주세요.');
                localStorage.setItem('gemini_api_key_musical', apiKey.trim());
                setStep(1);
            };

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                // 💡 디렉터님 환경에서 검증된 2.5-flash 엔진 적용!
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const generateMusical = async () => {
                if (!theme || !charCount) return alert("주제와 인원수를 입력해주세요!");
                setIsAnalyzing(true);
                setStep(2);

                const prompt = `당신은 천재 뮤지컬 감독입니다. 다음 조건을 바탕으로 창작 뮤지컬 기획안을 작성하세요.
                주제: ${theme} / 인원: ${charCount}명 / 분위기: ${mood} / 장르: ${genre}
                [STORY], [LYRICS], [IMAGE] 태그를 사용하여 대본, 가사, 이미지 프롬프트 순으로 작성해줘.`;

                try {
                    const text = await callGemini(prompt);
                    const extract = (tag) => {
                        const regex = new RegExp(`\\[${tag}\\](.*?)(?=\\[|$)`, 's');
                        const match = text.match(regex);
                        return match ? match[1].trim() : '생성 실패';
                    };
                    setResult({
                        script: extract('STORY'),
                        lyrics: extract('LYRICS'),
                        imagePrompt: extract('IMAGE')
                    });
                } catch (e) {
                    alert('기능 생성 중 오류: ' + e.message);
                    setStep(1);
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                alert('복사되었습니다!');
            };

            return (
                <div className="max-w-2xl mx-auto">
                    <header className="text-center mb-8 print-hidden">
                        <h1 className="text-3xl font-bold text-slate-800">🎭 EAIM 뮤지컬 메이커</h1>
                        {step > 0 && <button onClick={() => { localStorage.removeItem('gemini_api_key_musical'); setStep(0); window.location.reload(); }} className="text-xs text-slate-400 underline mt-2">API 키 재설정</button>}
                    </header>

                    {step === 0 && (
                        <div className="glass-panel p-8 rounded-3xl shadow-xl space-y-6 animate-fadeIn">
                            <h2 className="text-xl font-bold text-center text-blue-600">🔌 전원 연결</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="w-full p-4 border rounded-2xl text-center" placeholder="API 키 입력" />
                            <button onClick={saveApiKey} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold hover:bg-blue-700">기획실 입장</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="glass-panel p-8 rounded-3xl shadow-xl space-y-6 animate-fadeIn">
                            <input type="text" value={theme} onChange={e => setTheme(e.target.value)} className="w-full p-4 border rounded-xl" placeholder="뮤지컬 주제 입력" />
                            <div className="grid grid-cols-2 gap-4">
                                <input type="number" value={charCount} onChange={e => setCharCount(e.target.value)} className="p-4 border rounded-xl" placeholder="인원" />
                                <select value={genre} onChange={e => setGenre(e.target.value)} className="p-4 border rounded-xl">
                                    <option value="auto">AI 추천 장르</option>
                                    <option>정통 뮤지컬</option>
                                    <option>K-Pop Dance</option>
                                    <option>Disney Style</option>
                                </select>
                            </div>
                            <button onClick={generateMusical} disabled={isAnalyzing} className="w-full bg-blue-600 text-white p-5 rounded-2xl font-bold text-lg">
                                {isAnalyzing ? "기획안 작성 중..." : "뮤지컬 기획 시작 🪄"}
                            </button>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-6 animate-fadeIn pb-20">
                            {isAnalyzing ? (
                                <div className="text-center p-20 glass-panel rounded-3xl">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mx-auto"></div>
                                    <p className="mt-4 font-bold text-slate-600 italic">"감독님이 집필 중입니다..."</p>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="glass-panel p-6 rounded-3xl border-l-8 border-blue-500">
                                        <h3 className="font-bold mb-3 flex justify-between">📖 스토리 & 대본 <button onClick={() => copyToClipboard(result.script)} className="text-xs text-blue-500 uppercase">Copy</button></h3>
                                        <pre className="text-sm bg-white p-4 rounded-xl">{result.script}</pre>
                                    </div>
                                    <div className="glass-panel p-6 rounded-3xl border-l-8 border-purple-500">
                                        <h3 className="font-bold mb-3 flex justify-between">🎵 Suno 가사 <button onClick={() => copyToClipboard(result.lyrics)} className="text-xs text-purple-500 uppercase">Copy</button></h3>
                                        <pre className="text-sm bg-white p-4 rounded-xl">{result.lyrics}</pre>
                                    </div>
                                    <div className="glass-panel p-6 rounded-3xl border-l-8 border-orange-500">
                                        <h3 className="font-bold mb-3 flex justify-between">🎨 배경 프롬프트 <button onClick={() => copyToClipboard(result.imagePrompt)} className="text-xs text-orange-500 uppercase">Copy</button></h3>
                                        <pre className="text-sm bg-white p-4 rounded-xl font-mono">{result.imagePrompt}</pre>
                                    </div>
                                    <div className="flex gap-4 print-hidden">
                                        <button onClick={() => window.print()} className="flex-1 bg-slate-700 text-white p-4 rounded-2xl font-bold">🖨️ 인쇄</button>
                                        <button onClick={() => setStep(1)} className="flex-1 bg-blue-600 text-white p-4 rounded-2xl font-bold">🔄 새로 만들기</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MusicalMaker />);
    </script>
</body>
</html>
