<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM AI Education Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 5vh;
            color: white;
            text-align: center;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 25px;
            padding: 0 20px;
        }
        
        header h1 {
            font-size: 1.8rem; 
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 900;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.85;
            margin: 0;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 🛠️ 핵심 수정: Grid에서 Flexbox로 변경하여 자동 중앙 정렬 */
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* 마지막 남은 카드도 무조건 가운데 정렬 */
            gap: 15px;
            width: 92%;
            max-width: 850px;
            padding-bottom: 30px;
        }

        .card {
            /* PC 화면에서는 3개씩 배치되도록 넓이 계산 */
            flex: 0 0 calc(33.333% - 10px);
            max-width: calc(33.333% - 10px);
            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; 
            padding: 20px 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        .card:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        .icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .title { 
            font-size: 0.95rem; 
            font-weight: 800; 
            margin-bottom: 5px; 
            letter-spacing: -0.5px;
            word-break: keep-all;
        }
        .subtitle { 
            font-size: 0.75rem; 
            opacity: 0.8; 
            line-height: 1.2;
            font-weight: 400;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.5px;
        }

        /* 📱 모바일 화면 (768px 이하): 2개씩 배치되도록 계산 */
        @media (max-width: 768px) {
            .card {
                flex: 0 0 calc(50% - 8px);
                max-width: calc(50% - 8px);
                padding: 15px 5px;
            }
            header h1 { font-size: 1.6rem; }
            header p { font-size: 0.85rem; }
        }

        /* 📱 초소형 모바일 화면: 그래도 2열 유지! */
        @media (max-width: 380px) {
            .title { font-size: 0.85rem; }
            .icon { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌟 EAIM AI Platform</h1>
        <p>예술 융합 사회정서학습(SEL)을 위한<br>교과별 AI 도구 모음</p>
    </header>

    <div class="flex-container">
        <a href="korean.html" class="card">
            <span class="icon">📖</span>
            <span class="title">EAIM 감정 시인</span>
            <span class="subtitle">마음을 읊는 시간</span>
        </a>

        <a href="science.html" class="card">
            <span class="icon">🕵️‍♂️</span>
            <span class="title">EAIM 생활 과학 톡</span>
            <span class="subtitle">이성과 감성의 추리</span>
        </a>

        <a href="space.html" class="card">
            <span class="icon">🌌</span>
            <span class="title">EAIM 태양계 오디세이</span>
            <span class="subtitle">3D 공전·자전 뷰</span>
        </a>

        <a href="observatory.html" class="card">
            <span class="icon">🔭</span>
            <span class="title">EAIM 천문대 관측소</span>
            <span class="subtitle">NASA 정밀 관측 일지</span>
        </a>

        <a href="musicalmaker.html" class="card">
            <span class="icon">🎭</span>
            <span class="title">EAIM 뮤지컬 메이커</span>
            <span class="subtitle">창작 시나리오</span>
        </a>

        <a href="sports.html" class="card">
            <span class="icon">🏀</span>
            <span class="title">EAIM 비트 & 바스켓</span>
            <span class="subtitle">리듬 농구 과제</span>
        </a>
    </div>

    <footer>
        © 2026 EAIM Studio. Designed by Director Park Seong-ae.
    </footer>

</body>
</html>
