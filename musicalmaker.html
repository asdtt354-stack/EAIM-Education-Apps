<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM 뮤지컬 메이커</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0f4f8; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .card { transition: all 0.3s ease; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        @media print { .print-hidden { display: none !important; } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MusicalMaker = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const [theme, setTheme] = useState('');
            const [charCount, setCharCount] = useState('5');
            const [mood, setMood] = useState('밝고 쾌활하고 코믹한');
            const [genre, setGenre] = useState('auto');

            const [result, setResult] = useState({ script: '', lyrics: '', imagePrompt: '' });

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_musical');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key_musical', apiKey.trim());
                setStep(1);
            };

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cleanKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const generateMusical = async () => {
                if (!theme || !charCount) return alert("주제와 인원수를 입력해주세요!");
                setIsAnalyzing(true);
                setStep(2);

                const prompt = `당신은 천재 뮤지컬 감독입니다. 다음 조건을 바탕으로 창작 뮤지컬 기획안을 작성하세요.
                주제: ${theme} / 인원: ${charCount}명 / 분위기: ${mood} / 장르: ${genre}

                출력 형식은 반드시 아래 태그를 포함하세요:
                [STORY] (인물 소개와 기승전결이 포함된 전체 줄거리 및 하이라이트 대본)
                [LYRICS] (Suno AI용 가사 - 음악 스타일 영문 태그 5개 포함 및 1절 분량 가사)
                [IMAGE] (무대 배경용 Midjourney 영문 프롬프트 --ar 16:9 포함)`;

                try {
                    const text = await callGemini(prompt);
                    
                    const extract = (tag) => {
                        const regex = new RegExp(`\\[${tag}\\](.*?)(?=\\[|$)`, 's');
                        const match = text.match(regex);
                        return match ? match[1].trim() : '생성 실패';
                    };

                    setResult({
                        script: extract('STORY'),
                        lyrics: extract('LYRICS'),
                        imagePrompt: extract('IMAGE')
                    });
                } catch (e) {
                    alert('기획안 생성 중 오류: ' + e.message);
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                alert('클립보드에 복사되었습니다!');
            };

            return (
                <div className="max-w-2xl mx-auto">
                    <header className="text-center mb-8 print-hidden">
                        <h1 className="text-3xl font-bold text-slate-800">🎭 EAIM 뮤지컬 메이커</h1>
                        <p className="text-slate-500 mt-2">AI와 함께 창작 뮤지컬의 첫 장을 열어보세요</p>
                    </header>

                    {step === 0 && (
                        <div className="glass-panel p-8 rounded-3xl shadow-xl space-y-4">
                            <h2 className="text-xl font-bold text-center">전원 연결 (API Key)</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="w-full p-4 border rounded-2xl outline-none focus:ring-2 ring-blue-400" placeholder="API 키를 입력하세요" />
                            <button onClick={saveApiKey} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold">기획실 입장</button>
                        </div>
                    )}

                    {step === 1 && (
                        <div className="glass-panel p-8 rounded-3xl shadow-xl space-y-6 animate-fadeIn">
                            <div className="space-y-2">
                                <label className="font-bold text-slate-700">💡 뮤지컬 주제</label>
                                <input type="text" value={theme} onChange={e => setTheme(e.target.value)} className="w-full p-4 border rounded-xl" placeholder="예: 무인도에 갇힌 친구들" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="font-bold text-slate-700">👥 등장인물 수</label>
                                    <input type="number" value={charCount} onChange={e => setCharCount(e.target.value)} className="w-full p-4 border rounded-xl" />
                                </div>
                                <div className="space-y-2">
                                    <label className="font-bold text-slate-700">🎵 음악 장르</label>
                                    <select value={genre} onChange={e => setGenre(e.target.value)} className="w-full p-4 border rounded-xl">
                                        <option value="auto">AI 추천</option>
                                        <option value="Broadway">정통 뮤지컬</option>
                                        <option value="K-Pop">K-Pop/댄스</option>
                                        <option value="Disney">디즈니 스타일</option>
                                    </select>
                                </div>
                            </div>
                            <div className="space-y-2">
                                <label className="font-bold text-slate-700">✨ 전체 분위기</label>
                                <select value={mood} onChange={e => setMood(e.target.value)} className="w-full p-4 border rounded-xl">
                                    <option>밝고 쾌활하고 코믹한</option>
                                    <option>웅장하고 감동적인</option>
                                    <option>신비롭고 환상적인</option>
                                    <option>역동적이고 에너지 넘치는</option>
                                </select>
                            </div>
                            <button onClick={generateMusical} disabled={isAnalyzing} className="w-full bg-blue-600 text-white p-5 rounded-2xl font-bold text-lg hover:bg-blue-700 transition-colors">
                                {isAnalyzing ? "기획안 구상 중..." : "뮤지컬 기획 시작하기 🪄"}
                            </button>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="space-y-6 animate-fadeIn pb-20">
                            {isAnalyzing ? (
                                <div className="text-center p-20 glass-panel rounded-3xl">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mx-auto"></div>
                                    <p className="mt-4 font-bold text-slate-600">AI 감독님이 시나리오를 집필 중입니다...</p>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="glass-panel p-6 rounded-3xl border-l-8 border-blue-500 shadow-md">
                                        <h3 className="text-lg font-bold mb-3 flex justify-between items-center">
                                            <span>📖 1단계: 스토리 및 대본</span>
                                            <button onClick={() => copyToClipboard(result.script)} className="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">복사</button>
                                        </h3>
                                        <pre className="text-sm leading-relaxed text-slate-700">{result.script}</pre>
                                    </div>

                                    <div className="glass-panel p-6 rounded-3xl border-l-8 border-purple-500 shadow-md">
                                        <h3 className="text-lg font-bold mb-3 flex justify-between items-center">
                                            <span>🎵 2단계: Suno 가사 & 장르</span>
                                            <button onClick={() => copyToClipboard(result.lyrics)} className="text-xs bg-purple-100 text-purple-600 px-2 py-1 rounded">복사</button>
                                        </h3>
                                        <pre className="text-sm leading-relaxed text-slate-700">{result.lyrics}</pre>
                                    </div>

                                    <div className="glass-panel p-6 rounded-3xl border-l-8 border-orange-500 shadow-md">
                                        <h3 className="text-lg font-bold mb-3 flex justify-between items-center">
                                            <span>🎨 3단계: 무대 배경 프롬프트</span>
                                            <button onClick={() => copyToClipboard(result.imagePrompt)} className="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded">복사</button>
                                        </h3>
                                        <pre className="text-sm leading-relaxed font-mono text-slate-600">{result.imagePrompt}</pre>
                                    </div>

                                    <div className="flex gap-4 print-hidden">
                                        <button onClick={() => window.print()} className="flex-1 bg-slate-700 text-white p-4 rounded-2xl font-bold">🖨️ 기획안 인쇄</button>
                                        <button onClick={() => setStep(1)} className="flex-1 bg-blue-600 text-white p-4 rounded-2xl font-bold">🔄 새로 만들기</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MusicalMaker />);
    </script>
</body>
</html>
