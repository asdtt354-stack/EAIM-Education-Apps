<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 감정 시인 v13.2 (Gemini 2.5 Flash)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #fdfcfb; min-height: 100vh; margin: 0; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .font-serif { font-family: 'Gowun Batang', serif; }
        .eaim-card { background: rgba(255, 255, 255, 0.95); border-radius: 2rem; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 500px; padding: 2rem; margin: 1rem auto; border-top: 8px solid #be185d; }
        .eaim-input { width: 100%; border: 1px solid #e5e7eb; border-radius: 0.8rem; padding: 0.8rem; outline: none; transition: 0.3s; font-size: 0.9rem; line-height: 1.5; }
        .eaim-input:focus { border-color: #be185d; box-shadow: 0 0 0 3px rgba(190, 24, 93, 0.1); }
        .eaim-btn { background: #be185d; color: white; border-radius: 1rem; padding: 1.1rem; font-weight: bold; width: 100%; border: none; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .eaim-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .bgm-player { background: #1e293b; border-radius: 1.5rem; padding: 1.2rem; margin-top: 1rem; border: 2px solid #334155; }
        .nav-link { color: #94a3b8; font-size: 0.75rem; cursor: pointer; text-decoration: underline; }
        .nav-link:hover { color: #be185d; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v13_2') || '');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [userName, setUserName] = useState('');
            const [seedTopic, setSeedTopic] = useState('');
            const [relatedWords, setRelatedWords] = useState(Array(10).fill(''));
            const [selectedEmotions, setSelectedEmotions] = useState([]);
            const [details, setDetails] = useState({ situation: '', bodyMind: '', sensory: '', metaphor: '', relationship: '', newName: '', userImpression: '' });

            const [finalPoem, setFinalPoem] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');
            const [bgmVideoId, setBgmVideoId] = useState('uI5_G-6f4O0'); 

            // 퍼가기가 절대적으로 허용된 유튜브 오디오 보관함 영상들
            const bgmLibrary = {
                joy: "H96_87H5R1w",      
                sad: "f02mre_Hq_o",      
                calm: "uI5_G-6f4O0",     
                wonder: "5fN_CsmO9_A",   
                angry: "Z8X57KyT6f4"     
            };

            const callGemini = async (prompt) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const handleCreatePoem = async () => {
                setIsAnalyzing(true);
                setStep(6);
                try {
                    const prompt = `시인: ${userName}, 주제: ${seedTopic}, 연상단어: ${relatedWords.join(', ')}, 감정: ${selectedEmotions.join(', ')}, 상황: ${details.situation}, 감정이름: ${details.newName}. 위 데이터를 바탕으로 감동적인 시를 써줘. 행과 연 구분 필수. 마크다운 기호(**, ##) 절대 쓰지 말고 텍스트로만 출력. 제목 생략.`;
                    const poem = await callGemini(prompt);
                    setFinalPoem(poem);

                    const feedback = await callGemini(`감정이름 '${details.newName}'을 지은 학생에게 보내는 다정한 격려 2문장.`);
                    setTeacherFeedback(feedback);

                    const bgmChoice = await callGemini(`이 시의 분위기에 맞는 음악 카테고리를 하나만 골라줘: [joy, sad, calm, wonder, angry]. 단어 하나만 대답.`);
                    const selectedKey = bgmChoice.toLowerCase().trim().replace(/[\[\]\.*#]/g, "");
                    setBgmVideoId(bgmLibrary[selectedKey] || bgmLibrary.calm);

                } catch (e) { alert("연결 오류: API 키를 확인해주세요."); setStep(5); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="p-4 max-w-lg mx-auto pb-10">
                    <header className="flex justify-between items-center mb-6 px-2">
                        <h1 className="font-hand text-2xl text-pink-800 font-bold">EAIM 감정 시인 v13.2</h1>
                        <button onClick={() => window.location.reload()} className="text-[10px] text-gray-400 font-bold">전체 초기화</button>
                    </header>

                    <div className="eaim-card">
                        {step === 0 && (
                            <div className="space-y-6 text-center py-5">
                                <h2 className="text-lg font-bold text-gray-700 font-serif">작가실 입장</h2>
                                <input type="text" value={userName} onChange={e => setUserName(e.target.value)} placeholder="작가님 이름" className="eaim-input text-center" />
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini 2.5 Flash API Key" className="eaim-input text-center" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_v13_2', apiKey.trim()); setStep(1); }} className="eaim-btn" disabled={!userName || !apiKey}>시작하기</button>
                            </div>
                        )}

                        {step >= 1 && step <= 5 && (
                            <div className="animate-fadeIn space-y-4">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-[10px] font-bold text-pink-300 uppercase">Step {step} of 5</span>
                                    {step > 1 && <span className="nav-link" onClick={() => setStep(step - 1)}>이전 단계로</span>}
                                </div>

                                {step === 1 && <div className="text-center py-4"><h3 className="font-bold text-pink-800 font-serif text-xl mb-4">마음의 씨앗(주제)</h3><input type="text" value={seedTopic} onChange={e => setSeedTopic(e.target.value)} className="eaim-input text-center text-lg font-bold" placeholder="예: 우정, 떡볶이, 교정" /></div>}
                                {step === 2 && <div className="grid grid-cols-2 gap-2">{relatedWords.map((w, i) => (<input key={i} type="text" value={w} onChange={e => {const nw = [...relatedWords]; nw[i] = e.target.value; setRelatedWords(nw);}} className="eaim-input text-center" placeholder={`${i+1}번째 단어`} />))}</div>}
                                {step === 3 && <div className="flex flex-wrap gap-2 justify-center">{['기쁜','슬픈','화난','편안한','설레는','벅찬','외로운','차분한','신비로운'].map(e => (<button key={e} onClick={() => setSelectedEmotions([e])} className={`px-4 py-2 rounded-full text-xs font-bold border ${selectedEmotions.includes(e) ? 'bg-pink-600 text-white' : 'bg-white text-gray-500'}`}>{e}</button>))}</div>}
                                {step === 4 && <div className="space-y-4"><textarea value={details.situation} className="eaim-input h-32" placeholder="어떤 상황인가요?" onChange={e => setDetails({...details, situation: e.target.value})} /><textarea value={details.bodyMind} className="eaim-input h-24" placeholder="내 몸과 마음은 어떤가요?" onChange={e => setDetails({...details, bodyMind: e.target.value})} /></div>}
                                {step === 5 && <div className="space-y-4 text-center"><input value={details.newName} type="text" className="eaim-input font-bold text-pink-600 text-center text-lg" placeholder="감정의 특별한 이름" onChange={e => setDetails({...details, newName: e.target.value})} /><button onClick={handleCreatePoem} className="eaim-btn bg-pink-800 mt-4">시 창작 시작 🪄</button></div>}
                                
                                {step < 5 && <button onClick={() => setStep(step + 1)} className="eaim-btn">계속하기 👉</button>}
                            </div>
                        )}

                        {step === 6 && (
                            <div className="space-y-6">
                                {isAnalyzing ? (
                                    <div className="py-24 text-center animate-pulse"><div className="text-pink-700 font-bold font-serif text-xl">2.5 Flash 엔진이<br/>시를 빚고 음악을 고르는 중...</div></div>
                                ) : (
                                    <div className="animate-fadeIn space-y-4">
                                        <div className="bgm-player shadow-2xl">
                                            <div className="flex justify-between items-center mb-3">
                                                <p className="text-[10px] text-yellow-400 font-bold flex items-center gap-2"><i className="fa-solid fa-compact-disc fa-spin"></i> 맞춤형 배경음악</p>
                                                <a href={`https://www.youtube.com/watch?v=${bgmVideoId}`} target="_blank" className="text-[9px] bg-pink-600 text-white px-2 py-1 rounded font-bold">음악 안나오면 클릭!</a>
                                            </div>
                                            <iframe width="100%" height="60" src={`https://www.youtube.com/embed/${bgmVideoId}?rel=0&autoplay=0`} frameBorder="0" allow="autoplay; encrypted-media"></iframe>
                                        </div>

                                        <div className="bg-white p-8 rounded-[2.5rem] border-2 border-pink-100 text-center shadow-inner relative mt-4">
                                            <h4 className="font-hand text-3xl text-pink-800 mb-6">{userName} 시인</h4>
                                            <div className="font-serif text-lg leading-loose whitespace-pre-wrap text-gray-800 font-medium">{finalPoem}</div>
                                        </div>

                                        <div className="bg-rose-50 p-6 rounded-[2rem] border-l-8 border-pink-500 shadow-sm relative"><p className="font-hand text-2xl text-gray-700 italic">"{teacherFeedback}"</p></div>

                                        <div className="grid grid-cols-2 gap-3 mt-4">
                                            <button onClick={() => setStep(5)} className="bg-gray-100 text-gray-600 p-4 rounded-2xl text-xs font-bold hover:bg-gray-200">내용 수정하기</button>
                                            <button onClick={() => {const blob = new Blob([finalPoem], {type: 'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${userName}_시.txt`; a.click();}} className="bg-pink-900 text-white p-4 rounded-2xl text-xs font-bold shadow-lg">결과 저장하기</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
