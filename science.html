<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 일상 과학 탐험대 v3.0</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #334155; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-radius: 3rem; box-shadow: 0 20px 50px rgba(0,0,0,0.08); border: 2px solid white; width: 100%; max-width: 550px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; transition: 0.3s; }
        .eaim-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        textarea.eaim-input { text-align: left; resize: none; font-size: 0.95rem; line-height: 1.6; }
        .eaim-btn-main { background: #6366f1 !important; color: white !important; border-radius: 1.5rem; padding: 1.1rem; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; transform: none; box-shadow: none; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-4"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ScienceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            const [scienceUnit, setScienceUnit] = useState('');
            const [dailyScenario, setDailyScenario] = useState('');
            const [quizAnswer, setQuizAnswer] = useState('');
            const [scienceReason, setScienceReason] = useState('');
            const [characterEmotion, setCharacterEmotion] = useState('');
            const [feedbackReport, setFeedbackReport] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_sci_v3');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                const response = await fetch(url, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.6, maxOutputTokens: 8192 }
                    })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            //
