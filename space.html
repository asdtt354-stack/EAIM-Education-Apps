<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EAIM 에임우주탐험대 v3.6 - 2.5 Flash</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #000; --accent: #2ecc71; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #main-view { flex-grow: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        #canvas-container { flex: 1; background: #000; cursor: pointer; position: relative; }
        #header-ui { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 100; }
        .btn-home { background: rgba(0,212,255,0.3); color: white; padding: 10px 20px; border-radius: 20px; border: 1px solid var(--main-color); pointer-events: auto; cursor: pointer; z-index: 110; }
        .planet-label { position: absolute; color: white; background: rgba(0,0,0,0.8); padding: 5px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; pointer-events: none; border: 1px solid var(--main-color); white-space: nowrap; z-index: 90; transform: translate(-50%, -50%); }
        #side-panel { width: 350px; min-width: 350px; background: rgba(10,10,25,0.98); border-left: 1px solid #333; display: none; flex-direction: column; padding: 25px; box-sizing: border-box; z-index: 200; overflow-y: auto; }
        textarea { width: 100%; height: 120px; background: #161625; color: white; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 1em; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 1em; }
    </style>
</head>
<body>

<div id="main-view">
    <div id="header-ui">
        <div style="width: 100px;"></div>
        <div id="intro-text" style="text-align: center;">
            <h1 style="color:var(--main-color); margin:0; font-size: 2.2em; text-shadow: 0 0 15px #00d4ff;">에임 우주 탐험대</h1>
            <p style="color:#aaa;">탐사할 행성을 클릭하여 3D 관찰을 시작하세요!</p>
        </div>
        <button class="btn-home" onclick="location.reload()">☀️ 태양계 복귀</button>
    </div>
    <div id="canvas-container">
        <div id="label-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:80;"></div>
    </div>
</div>

<div id="side-panel">
    <h2 style="color:var(--main-color);">🔭 관측 데이터 수신</h2>
    <p id="target-info" style="color:var(--accent); font-weight:bold; font-size: 1.2em;"></p>
    <textarea id="student-answer" placeholder="관찰한 특징을 기록하세요..."></textarea>
    <button onclick="callGemini25Flash()" style="background:var(--main-color); color:#000;">AI 가이드 분석 (2.5 Flash)</button>
    <div id="ai-response" style="background:rgba(255,255,255,0.05); padding:15px; border-radius:8px; font-size:0.9em; line-height:1.6;"></div>
</div>

<script>
    const API_KEY = "발급받으신_API_키"; 
    let isObserving = false, currentTarget = null;

    const planetsData = {
        mercury: { name: "수성", dist: 50, size: 2.5, speed: 0.04, color: 0xaaaaaa, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg" },
        venus: { name: "금성", dist: 80, size: 3.5, speed: 0.015, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_atmosphere.jpg" },
        earth: { name: "지구", dist: 110, size: 4.0, speed: 0.01, color: 0x2233ff, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg" },
        mars: { name: "화성", dist: 140, size: 3.0, speed: 0.008, color: 0xff3300, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg" },
        jupiter: { name: "목성", dist: 200, size: 10.0, speed: 0.004, color: 0xffaa88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg" },
        saturn: { name: "토성", dist: 260, size: 8.5, speed: 0.002, color: 0xffdd88, texture: "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.png" }
    };

    const scene = new THREE.Scene();
    const container = document.getElementById('canvas-container');
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // ★ 조명 강화 ★
    scene.add(new THREE.AmbientLight(0xffffff, 2.5));
    const sun = new THREE.Mesh(new THREE.SphereGeometry(20, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    scene.add(sun);

    const meshes = {}, labels = {}, loader = new THREE.TextureLoader();
    Object.keys(planetsData).forEach(key => {
        const p = planetsData[key];
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.size, 64, 64), new THREE.MeshStandardMaterial({ 
            map: loader.load(p.texture), emissive: new THREE.Color(p.color), emissiveIntensity: 0.8 
        }));
        m.userData = { id: key, name: p.name };
        meshes[key] = m;
        scene.add(m);

        const lbl = document.createElement('div');
        lbl.className = 'planet-label';
        lbl.innerText = p.name;
        document.getElementById('label-layer').appendChild(lbl);
        labels[key] = lbl;
    });

    // ★ 카메라 시점 강제 교정 ★
    camera.position.set(0, 300, 600);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.0005;
        Object.keys(meshes).forEach(key => {
            const p = planetsData[key], m = meshes[key], lbl = labels[key];
            if (!isObserving) {
                m.position.x = Math.cos(time * p.speed * 10) * p.dist;
                m.position.z = Math.sin(time * p.speed * 10) * p.dist;
                m.rotation.y += 0.01;
                m.visible = true;
                
                const vector = m.position.clone().project(camera);
                lbl.style.display = 'block';
                lbl.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                lbl.style.top = `${(vector.y * -0.5 + 0.5) * window.innerHeight - 40}px`;
            } else {
                lbl.style.display = 'none';
                if (key !== currentTarget) m.visible = false;
                else { m.position.set(0,0,0); m.rotation.y += 0.005; }
            }
        });
        renderer.render(scene, camera);
    }
    animate();

    container.onclick = (e) => {
        if(isObserving) return;
        const mouse = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(Object.values(meshes));
        if(intersects.length > 0) {
            isObserving = true; currentTarget = intersects[0].object.userData.id;
            document.getElementById('side-panel').style.display = 'flex';
            document.getElementById('target-info').innerText = `[${planetsData[currentTarget].name} 탐사]`;
            camera.position.set(0, 0, 20); camera.lookAt(0,0,0);
        }
    };

    async function callGemini25Flash() {
        const ans = document.getElementById('student-answer').value;
        if(!ans) return alert("내용을 입력하세요!");
        document.getElementById('ai-response').innerHTML = "📡 제미나이 2.5 플래시 분석 중...";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `과학 선생님으로서 학생 답변 피드백해줘: ${ans}` }] }] }) });
            const data = await res.json();
            document.getElementById('ai-response').innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
        } catch(e) { document.getElementById('ai-response').innerHTML = "❌ 엔진 연동 오류"; }
    }
</script>
</body>
</html>
