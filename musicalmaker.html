<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 뮤지컬 메이커 v6.0</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #1a0509; color: #FFF; margin: 0; padding: 0; overflow-x: hidden; }
        .font-drama { font-family: 'Gowun Batang', serif; }
        .font-show { font-family: 'Black Han Sans', sans-serif; }
        .stage-curtain { background: linear-gradient(to bottom, #9F1239, #881337); border-bottom: 4px solid #FCD34D; }
        .ticket-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: white; transition: 0.3s; outline: none; line-height: 1.6; min-height: 3.5rem; width: 100%; padding: 1rem 1.2rem; }
        .ticket-input:focus { border-color: #FCD34D; background: rgba(255, 255, 255, 0.12); }
        .magic-btn { background: linear-gradient(45deg, #FCD34D, #F59E0B); color: #000; border-radius: 0.75rem; font-weight: 800; font-size: 0.75rem; padding: 0.6rem 1rem; }
        .tab-btn { padding: 1rem 0.5rem; flex: 1; font-weight: bold; font-size: 0.8rem; transition: 0.3s; border-bottom: 3px solid transparent; color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
        .tab-active { color: #FCD34D; border-bottom-color: #FCD34D; background: rgba(252, 211, 77, 0.07); }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        pre { white-space: pre-wrap; line-height: 1.8; color: #FDE68A; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState('');

            const [topic, setTopic] = useState('');
            const [place, setPlace] = useState('');
            const [title, setTitle] = useState('');
            const [castList, setCastList] = useState([{ role: '주인공', desc: '특징을 입력하세요' }]);
            
            const [activeTab, setActiveTab] = useState('script'); 
            const [finalScript, setFinalScript] = useState('');
            const [imagePrompts, setImagePrompts] = useState('');
            const [sunoPrompts, setSunoPrompts] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_musical_v5_5');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt, customConfig = {}) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`;
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                temperature: customConfig.temperature ?? 0.4,
                                topK: 20,
                                maxOutputTokens: customConfig.maxTokens ?? 8192
                            }
                        })
                    });
                    const data = await response.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (error) { throw error; }
            };

            const generateAutoTitle = async () => {
                if (!topic || !place) return alert("주제와 배경을 먼저 입력해주세요!");
                setIsGenerating(true);
                try {
                    const result = await callGemini(`주제 '${topic}'과 배경 '${place}'에 어울리는 창의적인 뮤지컬 제목을 딱 하나만 추천해줘. 부연설명 절대 금지.`, { temperature: 0.8, maxTokens: 200 });
                    setTitle(result.trim().replace(/["']/g, ""));
                } catch (e) { alert("제목 생성 실패"); }
                finally { setIsGenerating(false); }
            };

            const suggestCharacters = async () => {
                if (!title) return alert("제목이 확정되어야 합니다!");
                setIsGenerating(true);
                try {
                    const result = await callGemini(`뮤지컬 '${title}'(주제:${topic})에 어울리는 조연 캐릭터 3명을 [역할명: 특징] 형식으로 추천해줘.`, { temperature: 0.6, maxTokens: 500 });
                    const lines = result.split('\n').filter(l => l.includes(':'));
                    const newCasts = lines.map(line => {
                        const [role, desc] = line.replace(/[\[\]\d.]/g, "").split(':');
                        return { role: role.trim(), desc: desc.trim() };
                    });
                    setCastList([...castList, ...newCasts]);
                } catch (e) { alert("캐릭터 추천 실패"); }
                finally { setIsGenerating(false); }
            };

            // 💡 프롬프트가 누락되지 않도록 분리해서 요청하는 핵심 로직
            const generateAIScript = async () => {
                setIsAnalyzing(true);
                setStep(3);
                
                try {
                    // 1단계: 대본 집필
                    setLoadingMsg('1단계: 대본(가사)을 집필하고 있습니다...');
                    const scriptPrompt = `베테랑 뮤지컬 연출가로서 다음 조건의 뮤지컬 대본(1막~4막, 오프닝~커튼콜)을 집필해줘. 
                    제목: ${title} / 주제: ${topic} / 배경: ${place}
                    배역: ${castList.map(c=>c.role + '('+c.desc+')').join(', ')}
                    인사말 없이 본문 대본만 출력해줘.`;
                    const scriptResult = await callGemini(scriptPrompt);
                    setFinalScript(scriptResult);

                    // 2단계: 이미지 프롬프트 생성 (자동)
                    setLoadingMsg('2단계: 장면별 시각 가이드를 생성 중입니다...');
                    const imagePromptReq = `방금 작성된 뮤지컬 대본 [${scriptResult}]을 읽고, 각 막의 분위기를 상징하는 미드저니/DALL-E용 영문 이미지 생성 프롬프트 리스트를 작성해줘. 설명 없이 프롬프트만.`;
                    const imageResult = await callGemini(imagePromptReq);
                    setImagePrompts(imageResult);

                    // 3단계: 수노 프롬프트 생성 (자동)
                    setLoadingMsg('3단계: 음악 스타일 가이드를 생성 중입니다...');
                    const sunoPromptReq = `방금 작성된 뮤지컬 대본 [${scriptResult}]의 넘버들을 위해 Suno AI용 영문 음악 스타일(Style, Mood) 프롬프트 리스트를 작성해줘. 가사는 제외하고 스타일 정보만.`;
                    const sunoResult = await callGemini(sunoPromptReq);
                    setSunoPrompts(sunoResult);

                } catch (e) { 
                    alert('집필 중 오류가 발생했습니다. 다시 시도해 주세요.'); 
                    setStep(1); 
                } finally { 
                    setIsAnalyzing(false); 
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#1a0509] flex flex-col relative border-x-2 border-[#4a0410] shadow-2xl">
                    <header className="stage-curtain p-6 flex justify-between items-center shadow-xl">
                        <div onClick={() => window.location.reload()} className="text-[#FCD34D] cursor-pointer hover:scale-110"><i className="fa-solid fa-masks-theater text-2xl"></i></div>
                        <h1 className="text-xl text-[#FCD34D] font-show uppercase tracking-tighter">EAIM 2.5 MUSICAL v6.0</h1>
                        <div onClick={() => { localStorage.removeItem('gemini_api_key_musical_v5_5'); window.location.reload(); }} className="text-[#FCD34D] cursor-pointer text-[10px] border border-[#FCD34D] px-2 py-1 rounded">RESET</div>
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto pb-10">
                        {step === 0 && (
                            <div className="space-y-6 py-10 text-center animate-fadeIn">
                                <h2 className="text-xl font-bold text-[#FCD34D]">AI 창작 시스템 접속</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="ticket-input text-center rounded-2xl" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_musical_v5_5', apiKey.trim()); setStep(1); }} className="w-full bg-[#9F1239] py-5 rounded-2xl font-bold">시스템 동기화</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="space-y-6 bg-white/5 p-6 rounded-[2.5rem] border border-white/10 shadow-inner">
                                    <div className="space-y-2"><label className="text-xs text-rose-300 font-bold uppercase ml-1">뮤지컬 주제</label><input className="ticket-input rounded-2xl text-base" value={topic} onChange={e=>setTopic(e.target.value)} placeholder="예: 성장통" /></div>
                                    <div className="space-y-2"><label className="text-xs text-rose-300 font-bold uppercase ml-1">공연 배경</label><input className="ticket-input rounded-2xl text-base" value={place} onChange={e=>setPlace(e.target.value)} placeholder="예: 중학교 강당" /></div>
                                    <div className="space-y-2">
                                        <div className="flex justify-between items-center mb-1"><label className="text-xs text-amber-300 font-bold uppercase ml-1">뮤지컬 제목</label><button onClick={generateAutoTitle} disabled={isGenerating} className="magic-btn">{isGenerating ? "생성 중..." : "추천받기 ✨"}</button></div>
                                        <input className="ticket-input rounded-2xl text-lg font-black border-yellow-500/30 text-yellow-100" value={title} onChange={e=>setTitle(e.target.value)} placeholder="제목을 입력하세요" />
                                    </div>
                                </div>
                                <button onClick={()=>setStep(2)} className="w-full bg-gradient-to-r from-rose-800 to-rose-950 py-5 rounded-2xl font-bold shadow-2xl">배역 설정 👉</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-5 animate-fadeIn">
                                <div className="flex justify-between items-center mb-2">
                                    <h2 className="font-bold text-[#FCD34D] text-sm uppercase">Casting Center</h2>
                                    <button onClick={suggestCharacters} disabled={isGenerating} className="magic-btn text-[10px] py-1.5 px-3">캐릭터 추천 ✨</button>
                                </div>
                                {castList.map((c, i) => (
                                    <div key={i} className="bg-white/5 p-4 rounded-2xl flex gap-3 border border-white/5 animate-fadeIn">
                                        <input className="w-1/3 bg-transparent border-b border-rose-900 text-yellow-300 font-bold text-sm outline-none" value={c.role} placeholder="배역" onChange={e=>{const n=[...castList]; n[i].role=e.target.value; setCastList(n);}} />
                                        <input className="flex-1 bg-transparent border-b border-rose-900 text-xs text-white outline-none" value={c.desc} placeholder="특징" onChange={e=>{const n=[...castList]; n[i].desc=e.target.value; setCastList(n);}} />
                                        <button onClick={()=>setCastList(castList.filter((_,idx)=>idx!==i))} className="text-rose-900"><i className="fa-solid fa-minus-circle"></i></button>
                                    </div>
                                ))}
                                <button onClick={()=>setCastList([...castList, {role:'', desc:''}])} className="w-full py-4 border-2 border-dashed border-rose-900/30 text-rose-700 text-xs rounded-2xl font-bold">+ 배역 추가</button>
                                <div className="flex gap-3 pt-6">
                                    <button onClick={()=>setStep(1)} className="flex-1 bg-gray-800 py-5 rounded-2xl text-xs font-bold">이전</button>
                                    <button onClick={generateAIScript} className="flex-[2] bg-[#9F1239] py-5 rounded-2xl font-bold shadow-xl">전막 집필 시작 🎬</button>
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fadeIn pb-10">
                                {isAnalyzing ? (
                                    <div className="text-center py-24">
                                        <div className="animate-spin rounded-full h-14 w-14 border-t-2 border-b-2 border-[#FCD34D] mx-auto mb-6"></div>
                                        <p className="text-[#FCD34D] font-drama animate-pulse italic">{loadingMsg}</p>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="flex border-b border-white/10 mb-6 sticky top-0 bg-[#1a0509] z-20">
                                            <button onClick={() => setActiveTab('script')} className={`tab-btn ${activeTab === 'script' ? 'tab-active' : ''}`}>극본</button>
                                            <button onClick={() => setActiveTab('image')} className={`tab-btn ${activeTab === 'image' ? 'tab-active' : ''}`}>이미지</button>
                                            <button onClick={() => setActiveTab('suno')} className={`tab-btn ${activeTab === 'suno' ? 'tab-active' : ''}`}>음악</button>
                                        </div>
                                        <div className="bg-white p-7 rounded-3xl text-black shadow-2xl min-h-[500px] mb-10">
                                            <div className="animate-fadeIn">
                                                {activeTab === 'script' && (
                                                    <div>
                                                        <h2 className="text-2xl font-show mb-6 text-center border-b-2 border-black pb-4">{title}</h2>
                                                        <pre className="font-drama text-sm leading-relaxed text-gray-800">{finalScript}</pre>
                                                    </div>
                                                )}
                                                {activeTab === 'image' && (
                                                    <div className="space-y-4">
                                                        <h3 className="text-lg font-bold text-rose-800 mb-4 border-l-4 border-rose-800 pl-3">AI 비주얼 가이드</h3>
                                                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 text-xs font-mono text-slate-700 leading-loose">{imagePrompts || '이미지 프롬프트를 생성할 수 없습니다.'}</div>
                                                    </div>
                                                )}
                                                {activeTab === 'suno' && (
                                                    <div className="space-y-4">
                                                        <h3 className="text-lg font-bold text-rose-800 mb-4 border-l-4 border-rose-800 pl-3">Suno 스타일 가이드</h3>
                                                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 text-xs font-mono text-slate-700 leading-loose">{sunoPrompts || '수노 프롬프트를 생성할 수 없습니다.'}</div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <div className="mt-8 flex gap-3 no-print">
                                            <button onClick={()=>setStep(1)} className="flex-1 bg-gray-800 py-5 rounded-2xl text-xs font-bold">새 창작</button>
                                            <button onClick={()=>{ 
                                                const copyText = activeTab === 'script' ? finalScript : activeTab === 'image' ? imagePrompts : sunoPrompts;
                                                navigator.clipboard.writeText(copyText); 
                                                alert("복사되었습니다!"); 
                                            }} className="flex-1 bg-green-700 py-5 rounded-2xl text-xs font-bold">전체 복사 📋</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                    <footer className="p-4 bg-black/40 text-center text-[10px] text-gray-600 opacity-40 no-print border-t border-white/5 mt-auto">
                        &copy; 2026 EAIM Studio | Gemini 2.5 Flash PRO (v6.0)
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
