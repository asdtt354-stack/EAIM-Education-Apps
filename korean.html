<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 국어 감정 시인</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .eaim-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border-radius: 3rem; box-shadow: 0 25px 50px rgba(0,0,0,0.1); border: 2px solid white; width: 100%; max-width: 550px; padding: 2.5rem; margin: 2rem 0; }
        .eaim-input { width: 100%; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 1rem; text-align: center; background: white !important; font-size: 1.1rem; }
        .eaim-btn-main { background: #5f7adb !important; color: white !important; border-radius: 1.5rem; padding: 1rem; font-weight: bold; width: 100%; transition: 0.3s; font-size: 1.1rem; border: none; cursor: pointer; }
        .eaim-btn-main:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
        .eaim-btn-main:hover:not(:disabled) { background: #4a63c5 !important; transform: scale(1.02); }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center p-4"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('신미나 싱고');
            const [readingPoem, setReadingPoem] = useState('');
            const [finalResult, setFinalResult] = useState('');
            const [emotionWord, setEmotionWord] = useState('');
            const [emotionColor, setEmotionColor] = useState('');
            const [situation, setSituation] = useState('');
            const [bodyPart, setBodyPart] = useState('');
            const [bodySensation, setBodySensation] = useState('');
            const [appearance, setAppearance] = useState('');
            const [relationship, setRelationship] = useState('');
            const [emotionName, setEmotionName] = useState('');
            const [friendName, setFriendName] = useState('');
            const [friendPoem, setFriendPoem] = useState('');
            const [draftLetter, setDraftLetter] = useState('');

            const words = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '신나는', '포근한'];
            const colors = [{name:'빨강',code:'#EF4444'},{name:'주황',code:'#F97316'},{name:'노랑',code:'#FBBF24'},{name:'초록',code:'#34D399'},{name:'파랑',code:'#3B82F6'},{name:'보라',code:'#8B5CF6'}];

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                // 💡 핵심 수정: 구글의 최신 2.5 모델과 안정적인 정식 버전(v1) 통신망으로 전면 교체했습니다!
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const handleFetchPoem = async () => {
                setIsAnalyzing(true);
                setReadingPoem('시를 찾는 중입니다... ✨');
                try {
                    const text = await callGemini(`'${searchQuery}' 시인의 시 제목과 본문을 한국어로 보여줘. 없으면 따뜻한 현대시 추천해줘.`);
                    setReadingPoem(text);
                } catch (e) {
                    setReadingPoem(`⚠️ 오류: ${e.message}`);
                } finally { setIsAnalyzing(false); }
            };

            const handleGeneratePoem = async () => {
                setIsAnalyzing(true); setStep(6);
                try {
                    const prompt = `감정 시 작성: 색깔(${emotionColor}), 감정(${emotionWord}), 상황(${situation}), 부위(${bodyPart}-${bodySensation}), 비유(${appearance}), 이름(${emotionName}). 3연 구성 한국어 시.`;
                    const text = await callGemini(prompt);
                    setFinalResult(text);
                } catch (e) { setFinalResult('시 생성 실패'); } finally { setIsAnalyzing(false); }
            };

            const handleGenerateLetter = async () => {
                setIsAnalyzing(true);
                try {
                    const text = await callGemini(`친구 ${friendName}의 시(${friendPoem})를 읽고 따뜻한 공감 편지를 써줘.`);
                    setDraftLetter(text);
                } catch(e) { setDraftLetter('오류 발생'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="eaim-card">
                    {step === 0 && (
                        <div className="text-center space-y-6">
                            <h2 className="font-bold text-2xl font-hand text-slate-700">EAIM API 설정</h2>
                            <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} className="eaim-input" placeholder="새 API 키를 입력하세요" />
                            <button onClick={() => { 
                                localStorage.setItem('gemini_api_key', apiKey.trim()); 
                                setStep(1); 
                            }} className="eaim-btn-main shadow-lg">저장하고 시작하기</button>
                        </div>
                    )}

                    {step > 0 && (
                        <div className="space-y-6">
                            <header className="flex justify-between items-center mb-4">
                                <span className="font-bold text-slate-400 font-hand text-lg">EAIM 국어</span>
                                <button onClick={() => { localStorage.removeItem('gemini_api_key'); setStep(0); window.location.reload(); }} className="text-xs text-slate-400 underline">키 재설정</button>
                            </header>

                            {step === 1 && (
                                <div className="space-y-4">
                                    <h2 className="text-2xl font-hand text-slate-800">1. 오늘의 시 읽기 📖</h2>
                                    <div className="flex gap-2">
                                        <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="flex-grow eaim-input" />
                                        <button onClick={handleFetchPoem} disabled={isAnalyzing} className="eaim-btn-main w-24">검색</button>
                                    </div>
                                    <div className="bg-white/60 p-6 rounded-3xl min-h-[250px] font-hand text-xl leading-relaxed border-2 border-white whitespace-pre-wrap">{readingPoem || "검색 버튼을 눌러주세요."}</div>
                                    <button onClick={() => setStep(2)} disabled={readingPoem.length < 10 || readingPoem.includes('⚠️')} className="eaim-btn-main mt-4">이 시로 수업 시작 👉</button>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 text-center">
                                    <h2 className="text-2xl font-hand text-slate-800">2. 감정 색깔과 단어 고르기</h2>
                                    <div className="flex justify-center gap-3 py-4">
                                        {colors.map(c => <button key={c.name} onClick={() => setEmotionColor(c.name)} className={`w-12 h-12 rounded-full border-4 ${emotionColor === c.name ? 'border-slate-500 scale-110 shadow-md' : 'border-transparent opacity-60'}`} style={{backgroundColor: c.code}}></button>)}
                                    </div>
                                    <div className="flex flex-wrap justify-center gap-2">
                                        {words.map(w => <button key={w} onClick={() => setEmotionWord(w)} className={`px-4 py-2 rounded-full font-hand text-lg border-2 ${emotionWord === w ? 'bg-slate-600 text-white' : 'bg-white text-slate-600'}`}>{w}</button>)}
                                    </div>
                                    <button onClick={() => setStep(3)} disabled={!emotionColor || !emotionWord} className="eaim-btn-main mt-6">다음 단계 👉</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">3. 나의 감정 관찰하기</h2>
                                    <textarea value={situation} onChange={e => setSituation(e.target.value)} className="eaim-input font-hand text-lg" placeholder="① 언제 느낀 감정인가요?"></textarea>
                                    <div className="flex gap-2">
                                        <select value={bodyPart} onChange={e => setBodyPart(e.target.value)} className="eaim-input font-hand text-lg w-1/3"><option value="">부위</option><option value="머리">머리</option><option value="가슴">가슴</option><option value="배">배</option><option value="손발">손발</option></select>
                                        <input value={bodySensation} onChange={e => setBodySensation(e.target.value)} className="eaim-input font-hand text-lg w-2/3" placeholder="② 느낌은?" />
                                    </div>
                                    <textarea value={appearance} onChange={e => setAppearance(e.target.value)} className="eaim-input font-hand text-lg" placeholder="③ 모양이나 소리 비유"></textarea>
                                    <button onClick={() => setStep(4)} className="eaim-btn-main">다음 단계 👉</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-6 text-center">
                                    <h2 className="text-2xl font-hand text-slate-800">4. 감정 이름 지어주기</h2>
                                    <textarea value={relationship} onChange={e => setRelationship(e.target.value)} className="eaim-input font-hand text-lg" placeholder="나와 감정은 어떤 사이인가요?"></textarea>
                                    <input type="text" value={emotionName} onChange={e => setEmotionName(e.target.value)} className="eaim-input font-hand text-2xl" placeholder="새 이름 (예: 싱고)" />
                                    <button onClick={handleGeneratePoem} disabled={!emotionName} className="eaim-btn-main mt-4">AI 시인에게 요청 ✨</button>
                                </div>
                            )}

                            {step === 6 && (
                                <div className="space-y-6 text-center">
                                    <h2 className="text-2xl font-hand text-slate-800">📖 완성된 나의 감정 시</h2>
                                    <div className="bg-white/60 p-8 rounded-3xl text-left font-hand text-xl leading-relaxed min-h-[300px] border-2 border-white whitespace-pre-wrap">{isAnalyzing ? "AI 시인이 쓰는 중..." : finalResult}</div>
                                    {!isAnalyzing && (
                                        <div className="flex flex-col gap-3">
                                            <button onClick={() => window.print()} className="eaim-btn-main bg-slate-400">인쇄하기 🖨️</button>
                                            <button onClick={() => setStep(7)} className="eaim-btn-main bg-pink-400">💌 공감 편지 쓰기</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {step === 7 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-hand text-center text-slate-800">💌 공감 편지</h2>
                                    <input value={friendName} onChange={e => setFriendName(e.target.value)} className="eaim-input font-hand text-lg" placeholder="친구 이름" />
                                    <textarea value={friendPoem} onChange={e => setFriendPoem(e.target.value)} className="eaim-input font-hand text-lg h-32" placeholder="친구 시 붙여넣기" />
                                    <button onClick={handleGenerateLetter} disabled={isAnalyzing} className="eaim-btn-main">AI 편지 도우미 ✍️</button>
                                    {draftLetter && <div className="bg-white/60 p-6 rounded-3xl mt-4 font-hand text-lg whitespace-pre-wrap border border-white">{draftLetter}</div>}
                                    <button onClick={() => setStep(6)} className="w-full text-sm underline mt-4 text-slate-500">돌아가기</button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
