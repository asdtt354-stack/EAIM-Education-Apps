<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 앙상블 Pro v3.5</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .glass-panel { background: rgba(39, 39, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(82, 82, 91, 0.5); }
        /* 💡 연주 박스 디자인 강화 */
        .score-card { background: #18181b; border: 2px solid #3f3f46; border-radius: 1.5rem; padding: 1.2rem; }
        .chord-main { font-size: 1.5rem; font-weight: 900; color: #fb7185; margin-bottom: 0.5rem; display: block; }
        .note-flow { display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
        .note-bubble { background: #27272a; border: 1px solid #52525b; padding: 0.4rem 0.8rem; border-radius: 0.8rem; font-size: 1.1rem; font-weight: 800; color: #22d3ee; }
        .plus-sign { color: #71717a; font-weight: bold; }
        .hint-text { font-size: 0.75rem; color: #a1a1aa; margin-top: 0.8rem; border-top: 1px dashed #3f3f46; pt-2; }
        @media print { .no-print { display: none !important; } body { background: white; color: black; } .score-card { border: 1px solid #000; } .note-bubble { border: 1px solid #000; color: black; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const EnsembleApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [songTitle, setSongTitle] = useState('선물 - 멜로망스');
            const [parsedData, setParsedData] = useState({ intro: '', originalChord: '', drum: '', bass: '', guitar: '', harmKey: '', hint: '' });

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key_ensemble');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const callGemini = async (prompt) => {
                const cleanKey = apiKey.trim();
                // 💡 디렉터님 환경 전용 2.5-flash 엔진 적용
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || '연결 오류');
                return data.candidates[0].content.parts[0].text;
            };

            const extractSection = (text, sectionName) => {
                const regex = new RegExp(`\\[${sectionName}\\](.*?)(?=\\[|$)`, 's');
                const match = text.match(regex);
                return match ? match[1].trim() : '데이터 분석 실패';
            };

            const analyzeSong = async () => {
                if(!songTitle) return alert("곡 제목을 입력해주세요.");
                setIsAnalyzing(true);
                
                // 💡 아이들 눈높이에 맞춘 '구성음 분리' 명령 고도화
                const prompt = `음악 편곡가로서 곡 '${songTitle}'의 핵심 화성을 분석해. 
                중학생 초보자가 즉시 연주할 수 있게 아래 형식으로만 출력해:

                [곡소개] 합주 추천 이유 1줄
                [드럼] 비트 명칭과 특징
                [베이스] "근음" 이름만 나열 (예: 라b ▶ 파 ▶ 레b ▶ 미b)
                [기타] 파워코드의 "구성음"을 모두 나열 (예: 라b+미b ▶ 파+도 ▶ 레b+라b ▶ 미b+시b)
                [건반] 핵심 "2음 화성" 나열 (예: 라b+도 ▶ 파+라b ▶ 레b+파 ▶ 미b+솔)
                [한마디] 선생님의 연주 꿀팁 1줄`;

                try {
                    const text = await callGemini(prompt);
                    setParsedData({
                        intro: extractSection(text, '곡소개'),
                        drum: extractSection(text, '드럼'),
                        bass: extractSection(text, '베이스'),
                        guitar: extractSection(text, '기타'),
                        harmKey: extractSection(text, '건반'),
                        hint: extractSection(text, '한마디')
                    });
                    setStep(2);
                } catch (e) { alert('분석 오류: ' + e.message); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-zinc-950 shadow-2xl flex flex-col relative overflow-hidden">
                    <header className="bg-zinc-950 p-4 flex justify-between items-center border-b border-zinc-800 no-print">
                        <h1 className="text-xl font-title tracking-wider text-zinc-100 italic">EAIM ENSEMBLE</h1>
                        {step > 0 && <button onClick={() => { localStorage.removeItem('gemini_api_key_ensemble'); setStep(0); window.location.reload(); }} className="text-[10px] text-zinc-500 border border-zinc-700 px-2 py-1 rounded font-bold">KEY RESET</button>}
                    </header>

                    <main className="flex-grow p-5 overflow-y-auto pb-24">
                        {step === 0 && (
                            <div className="space-y-6 py-10 text-center animate-fadeIn">
                                <h2 className="text-2xl font-bold text-cyan-400 font-title italic">🔌 POWER ON</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-zinc-900 border border-zinc-700 p-4 rounded-xl text-white text-center outline-none focus:border-cyan-500" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_ensemble', apiKey.trim()); setStep(1); }} className="w-full bg-cyan-600 text-white p-4 rounded-xl font-bold shadow-lg">스튜디오 입장</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fadeIn mt-10">
                                <div className="text-center">
                                    <h2 className="text-3xl font-title text-cyan-400">화성 압축 악보</h2>
                                    <p className="text-zinc-400 text-sm mt-2 font-bold">원곡과 즉시 합주하는 마법</p>
                                </div>
                                <input type="text" value={songTitle} onChange={e => setSongTitle(e.target.value)} className="w-full bg-zinc-800 border-2 border-zinc-700 p-4 rounded-2xl text-white text-xl text-center outline-none focus:border-cyan-500 transition-all" />
                                <button onClick={analyzeSong} disabled={isAnalyzing} className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white p-5 rounded-2xl font-bold text-lg shadow-lg">
                                    {isAnalyzing ? "AI 분석 엔진 가동 중..." : "AI 압축 악보 만들기 🪄"}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fadeIn pb-10">
                                <div className="text-center bg-zinc-900/50 p-6 rounded-3xl border border-zinc-800">
                                    <h2 className="text-xl font-bold text-white mb-2">{songTitle}</h2>
                                    <p className="text-xs text-cyan-300 font-medium italic">"{parsedData.intro}"</p>
                                </div>

                                <div className="space-y-5">
                                    <VisualPart icon="🥁" title="드럼 리듬" content={parsedData.drum} />
                                    <VisualPart icon="🎸" title="베이스 (근음)" content={parsedData.bass} color="blue" />
                                    <VisualPart icon="🎸" title="기타 (파워코드 구성음)" content={parsedData.guitar} color="orange" isChord />
                                    <VisualPart icon="🎹" title="건반 (핵심 화성)" content={parsedData.harmKey} color="pink" isChord />
                                    
                                    <div className="bg-zinc-800 p-4 rounded-xl border border-dashed border-zinc-600 text-center">
                                        <p className="text-[10px] text-zinc-500 mb-1">💡 연주 선생님의 팁</p>
                                        <p className="text-xs text-zinc-200">{parsedData.hint}</p>
                                    </div>
                                </div>

                                <div className="flex gap-2 no-print mt-6">
                                    <button onClick={() => window.print()} className="flex-1 bg-zinc-700 text-white p-4 rounded-xl font-bold">🖨️ 악보 인쇄</button>
                                    <button onClick={() => setStep(1)} className="flex-1 bg-zinc-800 text-zinc-400 p-4 rounded-xl font-bold">다른 곡</button>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="p-4 text-center text-[10px] text-zinc-700 border-t border-zinc-900 bg-zinc-950 no-print">
                        &copy; 2026 EAIM Studio | Powered by Gemini 2.5
                    </footer>
                </div>
            );
        };

        const VisualPart = ({ icon, title, content, color, isChord }) => {
            const colorClass = color === 'blue' ? 'text-blue-400 border-blue-900' : color === 'orange' ? 'text-orange-400 border-orange-900' : 'text-pink-400 border-pink-900';
            
            // 💡 텍스트를 분석해서 화살표와 버블로 변환하는 시각화 로직
            const elements = content.split('▶').map((el, i) => {
                const notes = el.trim().split('+');
                return (
                    <div key={i} className="flex items-center gap-2">
                        <div className="flex gap-1">
                            {notes.map((n, ni) => (
                                <span key={ni} className="note-bubble">
                                    {n.trim()}
                                </span>
                            ))}
                        </div>
                        {i < content.split('▶').length - 1 && <span className="text-zinc-600">▶</span>}
                    </div>
                );
            });

            return (
                <div className="score-card shadow-lg animate-fadeIn">
                    <div className="flex items-center gap-2 mb-3">
                        <span className="text-lg">{icon}</span>
                        <span className="text-xs font-bold uppercase tracking-widest text-zinc-400">{title}</span>
                    </div>
                    <div className="note-flow">
                        {isChord || color === 'blue' ? elements : <span className="text-sm text-zinc-200">{content}</span>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnsembleApp />);
    </script>
</body>
</html>
