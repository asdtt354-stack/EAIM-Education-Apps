<script type="text/babel">
    const { useState } = React;

    const App = () => {
        const [step, setStep] = useState(0); 
        const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v25') || '');
        const [loading, setLoading] = useState(false);
        
        const [place, setPlace] = useState('');
        const [plots, setPlots] = useState({ ki: '', seung: '', jeon: '', gyeol: '' });
        const [title, setTitle] = useState('');
        const [cast, setCast] = useState('');
        const [results, setResults] = useState('');

        // ★ 대표님이 찾아내신 유일한 성공 공식: Gemini 2.5 Flash 적용 ★
        const callGeminiV25 = async (prompt) => {
            if (!apiKey) { alert("API 키를 입력해주세요."); return null; }
            
            // 엔진 명칭을 대표님의 성공값인 gemini-2.5-flash로 고정합니다.
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert("엔진 응답 오류: " + data.error.message);
                    return null;
                }
                
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                alert("네트워크 연동 실패. v2.5 환경을 확인해주세요.");
                return null;
            }
        };

        const getAIHelp = async () => {
            if (!plots.ki) return alert("줄거리를 먼저 입력해주세요.");
            setLoading(true);
            const prompt = `[v2.5 모드] 배경:${place}, 기:${plots.ki}, 승:${plots.seung}, 전:${plots.jeon}, 결:${plots.gyeol} 내용을 바탕으로 뮤지컬 제목과 등장인물을 추천해줘.`;
            const res = await callGeminiV25(prompt);
            if (res) {
                setCast(res);
                alert("Gemini 2.5 Flash가 추천을 완료했습니다.");
            }
            setLoading(false);
        };

        const generateFinal = async () => {
            if (!title) return alert("제목을 입력해주세요.");
            setLoading(true);
            const prompt = `[v2.5 모드] 제목:${title}, 배경:${place}, 인물:${cast}, 스토리:${plots.ki}-${plots.seung}-${plots.jeon}-${plots.gyeol} 기반으로 전문 뮤지컬 대본을 써줘.`;
            const res = await callGeminiV25(prompt);
            if (res) {
                setResults(res);
                setStep(1);
            }
            setLoading(false);
        };

        // ... 이하 렌더링 로직은 동일 ...
</script>
