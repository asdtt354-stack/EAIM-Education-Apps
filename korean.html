<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM 감정 시인 & 아티스트 v8.7</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #fdfcfb; min-height: 100vh; margin: 0; }
        .font-hand { font-family: 'Gaegu', cursive; }
        .font-serif { font-family: 'Gowun Batang', serif; }
        .eaim-card { background: rgba(255, 255, 255, 0.95); border-radius: 2rem; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 500px; padding: 2rem; margin: 1rem auto; border-top: 8px solid #be185d; }
        .eaim-input { width: 100%; border: 1px solid #e5e7eb; border-radius: 1rem; padding: 0.9rem; outline: none; transition: 0.3s; font-size: 0.9rem; background: #fff; }
        .eaim-btn { background: #be185d; color: white; border-radius: 1rem; padding: 1rem; font-weight: bold; width: 100%; border: none; cursor: pointer; transition: 0.3s; }
        .genre-btn { border: 1px solid #be185d; color: #be185d; border-radius: 99px; padding: 6px 14px; font-size: 0.75rem; font-weight: bold; transition: 0.2s; }
        .genre-active { background: #be185d; color: white; }
        .prompt-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 1rem; border-radius: 1rem; font-family: monospace; font-size: 0.65rem; color: #334155; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [step, setStep] = useState(0); 
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key_v8_7') || '');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            // 데이터 설정
            const emotionWords = ['기쁜', '슬픈', '화난', '불안한', '외로운', '설레는', '답답한', '신나는', '포근한'];
            const colorPalette = [
                {name:'빨강', code:'#EF4444'}, {name:'주황', code:'#F97316'}, {name:'노랑', code:'#FBBF24'}, 
                {name:'초록', code:'#34D399'}, {name:'파랑', code:'#3B82F6'}, {name:'보라', code:'#8B5CF6'},
                {name:'분홍', code:'#F472B6'}, {name:'검정', code:'#1F2937'}, {name:'하양', code:'#F9FAFB'}
            ];

            const [userName, setUserName] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [foundPoem, setFoundPoem] = useState('');
            const [poemImpression, setPoemImpression] = useState('');
            const [dissect, setDissect] = useState({ emotion: '', color: '', newName: '', situation: '', body: '' });
            const [finalPoem, setFinalPoem] = useState('');
            const [teacherFeedback, setTeacherFeedback] = useState('');

            const genres = ['감성 발라드', '어쿠스틱 팝', 'K-Pop', '로파이', '뮤지컬', '재즈'];
            const [selectedGenre, setSelectedGenre] = useState('');
            const [sunoPrompt, setSunoPrompt] = useState('');
            const [imagePrompt, setImagePrompt] = useState('');

            const callGemini = async (prompt) => {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates[0].content.parts[0].text;
            };

            const handleSearchPoem = async () => {
                if(!searchQuery) return alert("제목이나 주제를 입력하세요!");
                setIsAnalyzing(true);
                try {
                    const text = await callGemini(`'${searchQuery}'에 해당하는 시를 찾아줘. 제목+시인이면 그 시의 전문을, 주제어면 그와 어울리는 명시를 추천해줘. [제목 / 시인]을 꼭 포함해줘.`);
                    setFoundPoem(text); setStep(2);
                } catch (e) { alert('시 검색 오류'); } finally { setIsAnalyzing(false); }
            };

            const handleCreatePoem = async () => {
                if(!dissect.emotion || !dissect.color || !dissect.newName) return alert('감정과 색깔, 새 이름을 모두 정해주세요!');
                setIsAnalyzing(true); setStep(4);
                try {
                    const pText = await callGemini(`학생 '${userName}'이 읽은 시의 느낌('${poemImpression}')과 학생의 감정(단어:${dissect.emotion}, 색깔:${dissect.color}, 상황:${dissect.situation}, 신체:${dissect.body})을 융합한 시를 지어줘. '${dissect.newName}'을 강조해줘.`);
                    setFinalPoem(pText);
                    const fText = await callGemini(`SEL 교사로서 '${dissect.emotion}'을 느낀 학생에게 따뜻한 응원 3문장 써줘.`);
                    setTeacherFeedback(fText);
                } catch (e) { alert('창작 오류'); } finally { setIsAnalyzing(false); }
            };

            const generateMultimedia = async (genre) => {
                setSelectedGenre(genre); setIsAnalyzing(true);
                try {
                    const mReq = callGemini(`시 [${finalPoem}]를 Suno AI용 영문 프롬프트로. 장르: ${genre}`);
                    const iReq = callGemini(`시 [${finalPoem}]를 DALL-E용 앨범 커버 영문 프롬프트로.`);
                    const [mRes, iRes] = await Promise.all([mReq, iReq]);
                    setSunoPrompt(mRes); setImagePrompt(iRes);
                } catch (e) { alert('오류'); } finally { setIsAnalyzing(false); }
            };

            return (
                <div className="p-4 max-w-lg mx-auto">
                    <header className="flex justify-between items-center mb-4 px-2">
                        <h1 className="font-hand text-2xl text-pink-800 font-bold">EAIM 감정 시인 v8.7</h1>
                        {step > 0 && <button onClick={() => window.location.reload()} className="text-[10px] text-gray-400 underline">RESET</button>}
                    </header>

                    <div className="eaim-card animate-fadeIn shadow-2xl">
                        {step === 0 && (
                            <div className="space-y-6 text-center py-10">
                                <h2 className="text-xl font-bold">감정 작가실 입장</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="eaim-input text-center" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key_v8_7', apiKey.trim()); setStep(1); }} className="eaim-btn">입장하기</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6">
                                <div className="text-center space-y-1">
                                    <h3 className="font-bold text-lg">1. 영감 얻기</h3>
                                    <p className="text-[11px] text-slate-400">제목+시인 혹은 '우정', '꿈' 같은 주제를 적으세요.</p>
                                </div>
                                <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="eaim-input" placeholder="어떤 시를 찾을까요?" />
                                <button onClick={handleSearchPoem} className="eaim-btn">{isAnalyzing ? "AI 검색 중..." : "영감 불러오기 ✨"}</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-5 animate-fadeIn">
                                <div className="bg-stone-50 p-6 rounded-2xl text-sm font-serif max-h-60 overflow-y-auto border border-stone-100 shadow-inner">
                                    <pre className="whitespace-pre-wrap">{foundPoem}</pre>
                                </div>
                                <label className="text-xs font-bold text-pink-800 ml-1 italic">💬 이 시를 읽고 어떤 느낌이 들었나요?</label>
                                <textarea value={poemImpression} onChange={e => setPoemImpression(e.target.value)} className="eaim-input h-20 text-xs" placeholder="느낌을 자유롭게 적어보세요."></textarea>
                                <button onClick={() => setStep(3)} className="eaim-btn">마음 분석하기 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fadeIn">
                                <input type="text" value={userName} onChange={e => setUserName(e.target.value)} className="eaim-input font-bold" placeholder="작가님의 이름" />
                                
                                {/* 💡 복구된 감정 단어 선택 버튼 */}
                                <div className="space-y-2">
                                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest">지금 내 감정은?</label>
                                    <div className="flex flex-wrap gap-2">
                                        {emotionWords.map(w => (
                                            <button key={w} onClick={() => setDissect({...dissect, emotion: w})} className={`px-3 py-1.5 rounded-full text-xs transition-all ${dissect.emotion === w ? 'bg-pink-600 text-white shadow-md scale-105' : 'bg-white border border-gray-200 text-gray-500'}`}>{w}</button>
                                        ))}
                                    </div>
                                </div>

                                {/* 💡 복구된 감정 색깔 팔레트 */}
                                <div className="space-y-2">
                                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest">이 감정의 색깔은?</label>
                                    <div className="flex flex-wrap gap-3">
                                        {colorPalette.map(c => (
                                            <button key={c.name} onClick={() => setDissect({...dissect, color: c.name})} style={{backgroundColor: c.code}} className={`w-8 h-8 rounded-full border-2 transition-all ${dissect.color === c.name ? 'ring-4 ring-pink-200 border-pink-600 scale-110' : 'border-white shadow-sm'}`} title={c.name}></button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-3 pt-2">
                                    <input type="text" className="eaim-input text-xs" placeholder="언제 이런 마음이 드나요? (상황)" onChange={e => setDissect({...dissect, situation: e.target.value})} />
                                    <input type="text" className="eaim-input text-xs" placeholder="그때 내 몸의 느낌은? (예: 가슴이 콩닥)" onChange={e => setDissect({...dissect, body: e.target.value})} />
                                    <input type="text" className="eaim-input font-bold text-pink-600 border-pink-200" placeholder="✨ 이 감정에게 지어줄 새로운 이름" onChange={e => setDissect({...dissect, newName: e.target.value})} />
                                </div>
                                <button onClick={handleCreatePoem} className="eaim-btn bg-pink-800 shadow-xl">시 완성하기 🪄</button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6">
                                {isAnalyzing && !sunoPrompt ? <div className="py-20 text-center animate-pulse text-pink-700">마음을 시로 엮고 있습니다...</div> : (
                                    <>
                                        <div className="bg-white p-7 rounded-[2rem] border-2 border-pink-50 text-center shadow-sm relative">
                                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-pink-600 text-white text-[9px] px-3 py-1 rounded-full font-bold">MY POEM</div>
                                            <h4 className="font-hand text-xl text-pink-800 mb-4">{userName} 작가</h4>
                                            <pre className="font-serif text-sm leading-relaxed whitespace-pre-wrap">{finalPoem}</pre>
                                        </div>
                                        
                                        <div className="space-y-3 pt-4 border-t border-dashed">
                                            <p className="text-[10px] font-black text-center text-slate-400 uppercase tracking-widest">음악 및 이미지 가이드</p>
                                            <div className="flex flex-wrap justify-center gap-2">
                                                {genres.map(g => (
                                                    <button key={g} onClick={() => generateMultimedia(g)} className={`genre-btn ${selectedGenre === g ? 'genre-active' : ''}`}>{g}</button>
                                                ))}
                                            </div>
                                        </div>

                                        {(sunoPrompt || imagePrompt) && (
                                            <div className="space-y-4 animate-fadeIn">
                                                <div className="space-y-1"><p className="text-[10px] font-bold text-blue-600">Suno AI Style</p><div className="prompt-box">{sunoPrompt}</div></div>
                                                <div className="space-y-1"><p className="text-[10px] font-bold text-emerald-600">DALL-E Style</p><div className="prompt-box text-emerald-900 border-emerald-100 bg-emerald-50/20">{imagePrompt}</div></div>
                                            </div>
                                        )}

                                        <div className="bg-pink-50 p-5 rounded-2xl text-xs text-pink-900 border-l-4 border-pink-400 italic font-hand text-lg">
                                            <span className="font-bold font-sans text-xs not-italic">👩‍🏫 선생님의 편지:</span><br/>{teacherFeedback}
                                        </div>
                                    </>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
