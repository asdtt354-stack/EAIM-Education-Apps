<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAIM CSI 과학 탐정대</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0F172A; color: #E2E8F0; }
        .font-title { font-family: 'Black Han Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 인쇄 전용 스타일 */
        @media print {
            body { background-color: white; color: black; }
            .print-hidden { display: none !important; }
            .print-area { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .print-text { color: black !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ScienceEAIMApp = () => {
            const [step, setStep] = useState(0);
            const [apiKey, setApiKey] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            
            // 1단계: 사건 생성 (교사/학생 설정)
            const [scienceUnit, setScienceUnit] = useState('상태 변화');
            const [emotionKeyword, setEmotionKeyword] = useState('미안함');
            const [caseStory, setCaseStory] = useState('');

            // 2~3단계: 학생 수사 입력
            const [scienceClue, setScienceClue] = useState('');
            const [emotionClue, setEmotionClue] = useState('');
            
            // 4단계: 최종 보고서
            const [finalReport, setFinalReport] = useState('');

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) { setApiKey(savedKey); setStep(1); }
            }, []);

            const saveApiKey = () => {
                if (apiKey.length < 10) return alert('API 키를 입력해주세요.');
                localStorage.setItem('gemini_api_key', apiKey);
                setStep(1);
            };

            // AI 사건 자동 생성 로직
            const generateCase = async () => {
                if (!apiKey) return alert('API 키가 없습니다.');
                setIsAnalyzing(true);
                
                // 중학생 눈높이에 맞춘 아주 쉽고 흥미로운 프롬프트
                const prompt = `당신은 중학교 과학 교사이자 추리소설 작가입니다. 
                중학교 과학의 '${scienceUnit}' 단원과 사람의 '${emotionKeyword}'이라는 감정을 융합하여, 중학생들이 학교에서 겪을 법한 미스터리 사건을 만들어주세요.
                조건 1: 아주 쉽고, 흥미진진하게 3~4문장으로 짧게 작성할 것. (중학교 1~3학년 남학생 타겟)
                조건 2: 범인이 나쁜 짓을 한 것이 아니라, 오해나 서툰 감정 표현 때문이라는 여지를 남길 것.
                조건 3: 절대 너무 어려운 과학 용어를 남발하지 말 것.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setCaseStory(data.candidates[0].content.parts[0].text);
                    setStep(2);
                } catch (e) {
                    alert('사건을 생성하지 못했습니다. 키를 확인해주세요.');
                } finally { setIsAnalyzing(false); }
            };

            // 최종 사건 해결 보고서 생성 로직
            const solveCase = async () => {
                setIsAnalyzing(true);
                setStep(4);
                
                const prompt = `당신은 CSI 과학 탐정대의 대장(수석 프로파일러)입니다. 
                학생 탐정이 사건('${caseStory}')에 대해 다음과 같이 추리했습니다.
                1. 과학적 추론: ${scienceClue}
                2. 정서적 추론(마음): ${emotionClue}

                이 단서들을 바탕으로 다음 3가지를 포함하여 '최종 사건 해결 보고서'를 아주 훈훈하고 따뜻한 중학생 말투로 작성해주세요.
                - 🔍 과학적 진실: (과학 단원의 원리를 쉽게 설명)
                - 💓 숨겨진 마음: (범인의 행동 뒤에 숨겨진 감정 공감)
                - 🤝 화해의 미션: (친구와 어떻게 다시 잘 지낼 수 있을지 구체적인 행동 제안)`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    setFinalReport(data.candidates[0].content.parts[0].text);
                } catch (e) { setFinalReport('보고서 작성 중 오류 발생'); } finally { setIsAnalyzing(false); }
            };

            const copyText = (text) => navigator.clipboard.writeText(text).then(() => alert("복사되었습니다!"));
            const printContent = () => window.print();

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-900 shadow-2xl flex flex-col relative print-area overflow-hidden">
                    <header className="bg-slate-800 p-4 text-emerald-400 flex justify-between items-center shadow-md border-b border-slate-700 print-hidden">
                        <h1 className="text-xl font-title tracking-wider">EAIM CSI 탐정대 🕵️‍♂️</h1>
                        {step > 0 && <button onClick={() => setStep(0)} className="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">설정</button>}
                    </header>

                    <main className="flex-grow p-6 overflow-y-auto pb-24 print-area text-slate-200">
                        {step === 0 && (
                            <div className="space-y-4 py-10 print-hidden">
                                <h2 className="text-xl font-bold text-emerald-400">⚙️ CSI 본부 시스템 연결</h2>
                                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key 입력" className="w-full bg-slate-800 border border-slate-600 p-3 rounded-lg text-white" />
                                <button onClick={saveApiKey} className="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold hover:bg-emerald-500">시스템 가동</button>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-title text-emerald-400">📂 사건 파일 생성</h2>
                                <p className="text-sm text-slate-400">오늘 배울 과학 단원과 친구의 마음을 골라 새로운 사건을 만드세요.</p>
                                
                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-slate-300 block">🔬 과학 단원 (원리)</label>
                                    <input type="text" value={scienceUnit} onChange={e => setScienceUnit(e.target.value)} className="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white" placeholder="예: 보일의 법칙, 산과 염기" />
                                </div>

                                <div className="space-y-2">
                                    <label className="text-sm font-bold text-slate-300 block">💓 숨겨진 마음 (정서)</label>
                                    <input type="text" value={emotionKeyword} onChange={e => setEmotionKeyword(e.target.value)} className="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white" placeholder="예: 부끄러움, 서운함, 돕고싶음" />
                                </div>

                                <button onClick={generateCase} className="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-emerald-500 flex justify-center items-center gap-2 mt-6">
                                    {isAnalyzing ? <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div> : <span>AI 사건 파일 만들기</span>}
                                </button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fade-in print-hidden">
                                <h2 className="text-2xl font-title text-emerald-400">🚨 현장 출동</h2>
                                <div className="bg-slate-800 border-l-4 border-emerald-500 p-4 rounded-r-xl">
                                    <p className="text-lg leading-relaxed">{caseStory}</p>
                                </div>

                                <div className="space-y-4 mt-8">
                                    <h3 className="text-lg font-bold text-teal-300 border-b border-teal-800 pb-2">1차 수사: 과학적 단서 찾기</h3>
                                    <p className="text-sm text-slate-400">어떤 과학 원리가 숨어있을까? 아주 간단하게 적어봐!</p>
                                    <textarea value={scienceClue} onChange={e => setScienceClue(e.target.value)} className="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white h-24" placeholder="예: 날이 더워서 얼음이 녹아 물이 된 것 같다."></textarea>
                                </div>

                                <button onClick={() => setStep(3)} disabled={!scienceClue} className="w-full bg-teal-600 text-white p-4 rounded-xl font-bold shadow-lg mt-4 disabled:opacity-50">다음 수사로 이동 👉</button>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fade-in print-hidden">
                                <div className="bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-slate-400 mb-6">
                                    <span className="font-bold text-emerald-500">사건 요약: </span>{caseStory.substring(0, 30)}...
                                </div>

                                <div className="space-y-4">
                                    <h3 className="text-lg font-bold text-pink-400 border-b border-pink-900 pb-2">2차 수사: 마음 프로파일링</h3>
                                    <p className="text-sm text-slate-400">범인은 왜 이런 행동을 했을까? 친구의 마음을 상상해서 적어봐!</p>
                                    <textarea value={emotionClue} onChange={e => setEmotionClue(e.target.value)} className="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white h-24" placeholder="예: 나쁜 뜻이 아니라 도와주려다가 실수한 것 같다."></textarea>
                                </div>

                                <button onClick={solveCase} disabled={!emotionClue} className="w-full bg-gradient-to-r from-teal-500 to-emerald-600 text-white p-4 rounded-xl font-bold shadow-lg hover:from-teal-400 hover:to-emerald-500 flex justify-center items-center gap-2 mt-8">
                                    <span>최종 보고서 요청하기</span> <span>📝</span>
                                </button>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-6 animate-fade-in print-area">
                                <h2 className="text-2xl font-title text-center text-emerald-400 print-title print-text">✨ CSI 최종 사건 보고서</h2>
                                
                                <div className="bg-slate-800 p-6 rounded-3xl border-2 border-emerald-500/30 min-h-[350px] print-area print-text">
                                    {isAnalyzing ? (
                                        <div className="flex flex-col items-center justify-center h-48 space-y-4 print-hidden">
                                            <div className="animate-spin rounded-full h-10 w-10 border-b-4 border-emerald-500"></div>
                                            <p className="text-sm text-emerald-400 font-bold">대장이 과학과 마음을 종합하여 결론을 내는 중...</p>
                                        </div>
                                    ) : (
                                        <div className="whitespace-pre-wrap text-slate-200 text-lg leading-relaxed print-text">
                                            {finalReport}
                                        </div>
                                    )}
                                </div>

                                {!isAnalyzing && (
                                    <div className="flex gap-2 print-hidden">
                                        <button onClick={() => copyText(finalReport)} className="flex-1 bg-slate-700 text-white p-3 rounded-xl font-bold hover:bg-slate-600">📋 복사하기</button>
                                        <button onClick={printContent} className="flex-1 bg-emerald-600 text-white p-3 rounded-xl font-bold hover:bg-emerald-500">🖨️ 인쇄하기</button>
                                    </div>
                                )}
                                
                                <button onClick={() => { setStep(1); setFinalReport(''); setScienceClue(''); setEmotionClue(''); }} className="w-full bg-slate-800 text-slate-400 p-3 rounded-xl font-bold hover:bg-slate-700 print-hidden mt-4">새로운 사건 맡기</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScienceEAIMApp />);
    </script>
</body>
</html>
