<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAIM 우주탐험대 - Ver 2.5 API System</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <style>
        :root { --main-color: #00d4ff; --bg-dark: #020205; }
        body { margin: 0; background: var(--bg-dark); color: white; font-family: 'Pretendard', sans-serif; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* 천문대 관측 화면 */
        #observation-viewport { flex: 1.5; position: relative; border-bottom: 2px solid #1a1a2e; }
        .obs-overlay { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-left: 4px solid var(--main-color); }
        
        /* 상호작용 및 AI 피드백 구역 */
        #interaction-panel { flex: 1; padding: 25px; background: #0a0a12; overflow-y: auto; }
        .input-group { display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; padding: 12px; background: #161625; border: 1px solid #333; color: white; border-radius: 4px; }
        button { padding: 12px 25px; background: var(--main-color); color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; }
        
        #ai-response { margin-top: 20px; padding: 15px; border-radius: 8px; background: #111120; border: 1px dashed #444; min-height: 100px; line-height: 1.7; }
        .loading { color: var(--main-color); font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div id="observation-viewport">
        <div class="obs-overlay">
            <small>📡 Real-time Observatory Data</small>
            <h2 id="target-name">목성 (Jupiter) 관측 모드</h2>
            <p id="obs-meta">날짜: 2026-04-14 | 망원경: 에임-2.5 지능형 시스템</p>
        </div>
        <div id="canvas-container" style="width:100%; height:100%;"></div>
    </div>

    <div id="interaction-panel">
        <h3 style="color:var(--main-color)">👨‍🚀 오늘의 탐사 미션</h3>
        <p id="question">"망원경으로 본 목성의 표면에는 가로 줄무늬와 대적점이 보입니다. 이 현상이 목성의 '자전 속도'와 어떤 관계가 있는지 교과서에서 배운 대로 설명해 볼까요?"</p>
        
        <div class="input-group">
            <input type="text" id="student-answer" placeholder="관측한 내용을 바탕으로 답변을 입력하세요...">
            <button onclick="runGemini25()">탐사 결과 전송</button>
        </div>

        <div id="ai-response">에임 AI 가이드의 피드백을 기다리고 있습니다...</div>
    </div>
</div>

<script>
    // --- [PART 1] Three.js 행성 엔진 ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight*0.5), 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight * 0.5);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(3, 64, 64);
    const textureLoader = new THREE.TextureLoader();
    // 목성 텍스처 로드 (실제 관측 사진 기반 텍스처)
    const material = new THREE.MeshPhongMaterial({ 
        map: textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg') 
    });
    const planet = new THREE.Mesh(geometry, material);
    scene.add(planet);

    const light = new THREE.PointLight(0xffffff, 1.5);
    light.position.set(10, 10, 10);
    scene.add(light);
    camera.position.z = 7;

    function animate() {
        requestAnimationFrame(animate);
        planet.rotation.y += 0.005; // 실제 행성 자전 느낌 연출
        renderer.render(scene, camera);
    }
    animate();

    // --- [PART 2] 대표님 최적화 Ver 2.5 API 로직 ---
    const API_KEY = "여기에_성공하셨던_API_키를_넣으세요"; 
    
    async function runGemini25() {
        const answer = document.getElementById('student-answer').value;
        const responseDiv = document.getElementById('ai-response');
        
        if(!answer) return alert("답변을 입력해 주세요!");
        
        responseDiv.innerHTML = "<span class='loading'>🛰️ 에임 위성을 통해 분석 데이터를 수신 중입니다...</span>";

        try {
            // 대표님께서 성공하신 2.5 버전 기반의 호출 규격 적용
            // (v1beta 기반이나 특정 커스텀 엔드포인트를 사용하시는 경우 주소를 수정해 사용하세요)
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `[에임우주탐험대 전문 가이드] 
                            학생이 실제 천문대 사진을 보고 답변했습니다. 
                            교과 과정(행성의 특징)에 맞춰 따뜻하게 피드백해 주세요.
                            질문: 목성의 줄무늬와 자전의 관계
                            학생 답변: ${answer}`
                        }]
                    }],
                    generationConfig: {
                        temperature: 0.7,
                        topP: 0.95,
                    }
                })
            });

            const data = await response.json();
            const feedback = data.candidates[0].content.parts[0].text;
            responseDiv.innerHTML = `<strong>✨ 에임 AI 피드백:</strong><br><br>${feedback.replace(/\n/g, '<br>')}`;

        } catch (error) {
            responseDiv.innerHTML = "❌ 연결 오류: API 키 혹은 2.5 버전 설정 세팅을 다시 확인해 주세요.";
            console.error(error);
        }
    }
</script>

</body>
</html>
